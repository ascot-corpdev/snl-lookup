# PROTOTYPE ONLY. Not deployed and not used by the live app. See docs/hosting-and-logins-options.md (option A3).
# Every value below is a placeholder. Nothing secret belongs in this file: the signing key goes in with
#   wrangler secret put SIGNING_JWK
# and the KV namespace id comes from
#   wrangler kv namespace create PROFILES

name = "snl-lookup-proto"
main = "worker.js"
compatibility_date = "2026-10-01"

# workers.dev and per-branch preview URLs (<alias>-snl-lookup-proto.<subdomain>.workers.dev), uploaded with
#   wrangler versions upload --preview-alias <branch>
# Turn on Access for this Worker in the dashboard (Workers & Pages > the Worker > Access) so production and previews
# need a sign-in. Add an Access bypass rule for /.well-known/* so Supabase can read the signing keys.
workers_dev = true
preview_urls = true

# The site itself, served as static assets. Access protects these at the edge; the Worker only runs for /sb/* and
# /.well-known/*. web/config.js would point supabaseUrl at "<this origin>/sb".
[assets]
directory = "../../web"
binding = "ASSETS"
run_worker_first = ["/sb/*", "/.well-known/*"]

[vars]
TEAM_DOMAIN = "https://YOUR_TEAM.cloudflareaccess.com"
POLICY_AUD = "YOUR_ACCESS_APPLICATION_AUD_TAG"
SUPABASE_URL = "https://YOUR_PROJECT_REF.supabase.co"
SUPABASE_PUBLISHABLE_KEY = "sb_publishable_..."
# The issuer Supabase is told to trust (Authentication > Third-party auth > custom OIDC). Must be HTTPS.
ISSUER = "https://snl-lookup-proto.YOUR_SUBDOMAIN.workers.dev"

# email:<lower-case email> -> {"id": "<auth.users uuid>", "role": "corpdev" | "reader"}, written by the login script.
[[kv_namespaces]]
binding = "PROFILES"
id = "YOUR_KV_NAMESPACE_ID"
