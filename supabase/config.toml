# Each function checks the caller's login itself (supabase.auth.getUser with the caller's own token),
# so the gateway's legacy JWT check is off. This is needed with the new publishable/secret API keys.

# Filing search and documents. The S&P API credentials stay in its secrets.
[functions.snl-filings]
verify_jwt = false

# Statutory financials from Snowflake. Answers "not set up yet" until the Snowflake secrets are set.
[functions.snl-statutory]
verify_jwt = false

# Claude with the two functions above as tools. Runs answers as background tasks (see README, Supabase limits).
[functions.snl-chat]
verify_jwt = false

# The daily watchlist check. Called by Supabase Cron with a shared secret header (no login), or by a Corp Dev login.
[functions.snl-watch]
verify_jwt = false

# Company profiles: the figures and text for a profile deck. Uses the Snowflake, S&P and Anthropic secrets above.
[functions.snl-profile]
verify_jwt = false

# Filing summaries: a filing's facts read once by Claude and saved, and search over them. Uses the S&P and Anthropic secrets above.
[functions.snl-digest]
verify_jwt = false

# The market index: sweeps chosen states for every company in the list, and answers questions from what it kept.
# Called by logins, or by Supabase Cron with its own shared secret header (no login).
[functions.snl-index]
verify_jwt = false

# Cloudflare sign-on: turns a Cloudflare Access sign-in into a short Supabase session. Called only by the site's
# Cloudflare Worker, and checks the Access token itself (secrets CF_ACCESS_TEAM_DOMAIN, CF_ACCESS_AUD, SNL_ADMIN_EMAILS).
[functions.snl-signin]
verify_jwt = false

# Earnings: a watchlist company's quarterly results documents from SEC EDGAR and its investor pages. Needs the secret
# SEC_CONTACT (the organisation and a contact email the SEC asks automated tools to send). No S&P, no Claude.
[functions.snl-earnings]
verify_jwt = false

# Lets background tasks run under `supabase functions serve` on your own machine.
[edge_runtime]
policy = "per_worker"
