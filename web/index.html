/* ---------- documents: fetched once with the login, then opened from memory ---------- */
function docName(disposition, key, type){
  const m=/filename\*=(?:UTF-8'')?([^;]+)/i.exec(disposition||"") || /filename="?([^";]+)"?/i.exec(disposition||"");
  let n=""; if(m){ try{ n=decodeURIComponent(m[1].trim().replace(/^"|"$/g,"")); }catch{ n=m[1]; } }
  n=n.replace(/[^\w .()-]+/g,"_").replace(/^[. ]+/,"").slice(0,120);
  const ext={"application/pdf":"pdf","application/zip":"zip","text/plain":"txt","text/html":"html","application/msword":"doc","application/vnd.openxmlformats-officedocument.wordprocessingml.document":"docx","application/vnd.ms-excel":"xls","application/vnd.openxmlformats-officedocument.spreadsheetml.sheet":"xlsx"}[type]||"bin";
  return n || `snl-document-${key.slice(2).replace(/[^\w-]+/g,"_")}.${ext}`;
}
function showDoc(d, page, w){
  if(d.type==="application/pdf"){
    const url=d.url+(page?`#page=${page}`:"");
    if(w && !w.closed){ w.location.href=url; return; }
    const nw=window.open(url,"_blank");
    if(!nw) toast("Your browser blocked the new tab. Allow pop-ups for this site, then click again.");
  } else {
    if(w){ try{ w.close(); }catch{} }
    download(d.url, d.name);
    toast(`This document isn't a PDF, so it was saved to your downloads as ${d.name}.`);
  }
}
async function openDoc(key, page){
  if(!key) return;
  page = /^\d{1,5}$/.test(String(page||"")) && +page>0 ? +page : 0;
  const d=S.docs[key]||(S.docs[key]={});
  if(d.busy) return;
  if(d.url){ showDoc(d, page, null); return; }   // already fetched this session: no second S&P request
  // Open the tab now, while the click still counts, so the pop-up blocker lets it through; point it at the document later.
  let w=null;
  try{ w=window.open("","_blank"); if(w){ try{ w.opener=null; }catch{} try{ w.document.title="Opening the document…"; w.document.body.textContent="Opening the document from S&P…"; }catch{} } }catch{}
  d.busy=true; d.err=""; render();
  const r=await callFn("snl-filings", key.startsWith("d:") ? {action:"document", documentId:Number(key.slice(2))} : {action:"document", filingVersionId:key.slice(2)}, {raw:true});
  let blob=null;
  if(r.res){ try{ blob=await r.res.blob(); }catch{} }
  d.busy=false;
  if(!blob){
    if(w){ try{ w.close(); }catch{} }
    if(r.err!=="signin") d.err = r.res ? "The document didn't download fully. Try again." : errText(r);
    if(S.session) render(); return;
  }
  d.type=(r.res.headers.get("Content-Type")||"application/octet-stream").split(";")[0].trim().toLowerCase();
  d.name=docName(r.res.headers.get("Content-Disposition"), key, d.type);
  d.url=URL.createObjectURL(d.type==="application/pdf" ? blob.slice(0, blob.size, "application/pdf") : blob);
  showDoc(d, page, w); render(); loadStatus();
}

/* ---------- filing summaries: a Summary control on each filings row, its drawer, and Search saved summaries ----------
   The snl-digest function keeps what Claude found when it read a filing (Contract B in the build notes), so the filing
   needn't be read again. "get" and "search" cost nothing; "make" reads the front of the document (1 S&P request and one
   request to Claude) and counts as one of the login's questions. Everything in a summary came from a filing or from
   Claude: it all goes through esc(). */
FN["snl-digest"]="the summaries function";
const DG_PAGES=150;                       // pages one summary rests on: the first 150 of a longer filing
const DG_TOKENS_PER_PAGE=4000;            // Anthropic counts about 3,100 to 4,600 tokens a page, text and image
const DG_USD_PER_MTOK_IN=4, DG_OUT_USD=0.12;   // Claude Opus 5.5 list price for reading, and about 6,000 tokens written
const DG_WHERE={"form number":"Form number","form title":"Form title","program":"Program","summary":"Summary","notable":"Notable point"};
function freshDigests(){ return {known:{}, asked:{}, off:"", dr:null, find:{open:false, q:"", state:"", busy:false, res:null, err:null, asked:null}, last:""}; }
const dgOf = () => S.dg || (S.dg=freshDigests());
const dgKeyOfDigest = d => d ? docKeyOf({documentId:d.documentId, filingVersionId:d.filingVersionId}) : "";
const dgName = d => !blank(d&&d.filingNo) ? String(d.filingNo) : d&&!blank(d.documentId) ? `document ${d.documentId}` : "this filing";
function dgReadText(read, of){
  const r=(Array.isArray(read)?read:[]).filter(x=>x&&isNum(x.from)&&isNum(x.to));
  if(!r.length) return "pages n/d";
  const parts=r.map(x=>+x.from===+x.to?count(x.from):`${count(x.from)} to ${count(x.to)}`);
  const list=parts.length===1?parts[0]:`${parts.slice(0,-1).join(", ")} and ${parts[parts.length-1]}`;
  return `${r.length===1&&+r[0].from===+r[0].to?"page":"pages"} ${list}${isNum(of)?` of ${count(of)}`:""}`;
}
const dgReadAll = d => { const r=Array.isArray(d.read)?d.read:[]; return isNum(d.pages) && r.length===1 && +r[0].from===1 && +r[0].to>=+d.pages; };
/* What making a summary of this row costs, from its page count: the pages Claude reads, at list price. */
function dgCost(r){
  const known=isNum(r&&r.pages) && +r.pages>0, pages=known ? Math.min(+r.pages, DG_PAGES) : DG_PAGES;
  const usd=pages*DG_TOKENS_PER_PAGE*DG_USD_PER_MTOK_IN/1e6 + DG_OUT_USD;
  const what = !known ? `up to its first ${DG_PAGES} pages (its page count is n/d)` : +r.pages>DG_PAGES ? `its first ${DG_PAGES} of ${count(r.pages)} pages` : `all ${plural(pages,"page")}`;
  return `Summarising reads ${what} with Claude. It uses 1 S&amp;P request and ${known?"":"up to "}${costText(usd)} of Claude's time (about ${count(pages*DG_TOKENS_PER_PAGE)} tokens at list price), and counts as one of your questions today. The summary is then saved for everyone, so nobody pays to read these pages again.`;
}
/* Saved summaries of the rows on screen, asked for once each: the button shows which have one. Free. */
async function dgPrefetch(){
  const g=dgOf(); if(g.off || !S.session || S.view!=="filings" || !S.f.res) return;
  const keys=visibleRows().slice(0,S.f.shown).map(x=>docKeyOf(x.r)).filter(k=>k && !(k in g.asked)).slice(0,50);
  if(!keys.length) return;
  for(const k of keys) g.asked[k]=true;
  const r=await callFn("snl-digest", {action:"get", filings:keys.map(k=>k.startsWith("d:")?{documentId:Number(k.slice(2))}:{filingVersionId:k.slice(2)})});
  if(!S.session) return;
  if(r.err){ if(r.err==="not_deployed"||r.err==="no_tables") g.off=r.err; return; }   // the Summary button still opens and says what is missing
  for(const k of keys) if(!(k in g.known)) g.known[k]=null;
  for(const d of Array.isArray(r.data.digests)?r.data.digests:[]){ const k=dgKeyOfDigest(d); if(k) g.known[k]=d; if(!blank(d.documentId)) g.known["d:"+d.documentId]=d; if(!blank(d.filingVersionId)) g.known["v:"+d.filingVersionId]=d; }
  render();
}
/* The Summary control under a row's document button. */
function dgRowHTML(r, key){
  if(!key) return "";
  const d=dgOf().known[key];
  return `<div class="dg-cell"><button type="button" class="btn sm" data-act="dg-open" data-doc="${esc(key)}" aria-haspopup="dialog">Summary</button>${d?`<span class="t2">Saved ${esc(fmtAt(d.madeAt))}</span>`:""}</div>`;
}
function dgRowOf(key){ return ((S.f.res&&Array.isArray(S.f.res.rows))?S.f.res.rows:[]).find(r=>docKeyOf(r)===key) || null; }
/* A search row from a saved summary, for making it again from the search results. */
function dgRowFromDigest(d){
  const no=String(d.filingNo||""), sp=no.startsWith(SP_NO+" ");
  return {documentId:d.documentId, filingVersionId:d.filingVersionId, trackingNumber:sp?"":no, sfcNumber:sp?no.slice(SP_NO.length+1):null, companyName:d.company, serffFilingStateId:d.state, typeOfInsurance:d.typeOfInsurance, serffFilingType:d.filingType, filingStatus:d.status, publishDate:d.published, pages:d.pages};
}
/* What "make" is sent about a filing: the search row's fields, the filing named by filingNo and sfcNumber, never by a bare
   tracking number. */
function dgMakeBody(r){
  const sp=filingNo(r);
  return {documentId:r.documentId??null, filingVersionId:r.filingVersionId??null, filingNo:filingNoText(r)||null, sfcNumber:sp&&sp.kind==="sp"?sp.value:(blank(r.sfcNumber)?null:r.sfcNumber),
    companies:companiesOf(r).map(c=>({companyId:c.companyId??null, companyName:c.companyName??null, institutionId:c.institutionId??null})),
    serffFilingStateId:r.serffFilingStateId??null, typeOfInsurance:r.typeOfInsurance??null, serffFilingType:r.serffFilingType??null, filingStatus:r.filingStatus??null, publishDate:r.publishDate??null, pages:r.pages??null};
}
async function dgOpen(key, opener, digest){
  const g=dgOf(), row=dgRowOf(key) || (digest?dgRowFromDigest(digest):null);
  g.dr={key, row, digest:digest||g.known[key]||null, loading:false, err:null, making:false, confirm:false, made:null, opener};
  if(!g.dr.digest){
    g.dr.loading=true; renderDigest();
    const r=await callFn("snl-digest", {action:"get", filings:[key.startsWith("d:")?{documentId:Number(key.slice(2))}:{filingVersionId:key.slice(2)}]});
    if(!g.dr || g.dr.key!==key) return;
    g.dr.loading=false;
    if(r.err){ if(r.err!=="signin") g.dr.err=r; }
    else { const d=(r.data.digests||[])[0]||null; g.dr.digest=d; g.known[key]=d; }
  }
  render(); document.getElementById("dgClose")?.focus();
}
/* Closes the drawer and puts the cursor back on the Summary button that opened it (rebuilt meanwhile, so found again). */
function dgClose(){
  const g=dgOf(), back=g.dr&&g.dr.opener, key=g.dr&&g.dr.key; g.dr=null; renderDigest();
  if(back && document.contains(back)) back.focus();
  else if(key) document.querySelector(`[data-act="dg-open"][data-doc="${CSS.escape(key)}"]`)?.focus();
}
async function dgMake(){
  const g=dgOf(), dr=g.dr; if(!dr || dr.making || !dr.row) return;
  dr.making=true; dr.err=null; dr.confirm=false; pbStart("dg-make"); render();
  const r=await callFn("snl-digest", {action:"make", filing:dgMakeBody(dr.row), refresh:!!dr.digest});
  if(g.dr!==dr) return;
  dr.making=false;
  if(r.err){ if(r.err!=="signin") dr.err=r; }
  else if(r.data.digest){ dr.digest=r.data.digest; dr.made={usage:r.data.usage||null, fromStore:!!r.data.fromStore, note:r.data.note||""}; g.known[dr.key]=r.data.digest; S.chatUseAt=0; loadStatus(); }
  render(); document.getElementById("dgClose")?.focus({preventScroll:true});
}

const DG_RATE_MORE = [["indicatedPct","Indicated rate change","pct"],["maxPct","Largest change for one policyholder","pct"],["minPct","Smallest change for one policyholder","pct"],["lossCostChangePct","Change in advisory loss costs adopted","pct"],

/* ---------- export: CSV built here, XLSX with SheetJS loaded on the first click ---------- */
function download(url, name){ const a=document.createElement("a"); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove(); }
function saveBlob(blob, name){ const url=URL.createObjectURL(blob); download(url, name); setTimeout(()=>URL.revokeObjectURL(url), 4000); }
/* Every cell quoted; text that a spreadsheet would run as a formula gets a leading apostrophe. */
function csvCell(v){
  if(blank(v)) return '""';
  let s=String(v);
  if(typeof v!=="number" && /^[=+\-@\t\r]/.test(s) && !/^[+-]?[\d.,]+%?$/.test(s)) s="'"+s;
  return `"${s.replace(/"/g,'""')}"`;
}
function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement("script"); s.src=src; s.onload=()=>res(); s.onerror=()=>{ s.remove(); rej(new Error("The script didn't load")); }; document.head.appendChild(s); }); }
async function exportTable(t, fmt){
  if(!t || !t.rows.length){ toast("There is nothing to export yet."); return; }
  if(fmt==="csv"){
    const lines=[t.cols].concat(t.rows).map(r=>r.map(csvCell).join(","));
    saveBlob(new Blob(["﻿"+lines.join("\r\n")],{type:"text/csv;charset=utf-8"}), t.name+".csv"); return;
  }
  try{
    if(!window.XLSX){ toast("Getting the Excel export ready…"); await loadScript(XLSX_SRC); document.getElementById("toastRoot").innerHTML=""; }
    const X=window.XLSX, ws=X.utils.aoa_to_sheet([t.cols].concat(t.rows.map(r=>r.map(v=>blank(v)?"":v)))), wb=X.utils.book_new();
    X.utils.book_append_sheet(wb, ws, String(t.sheet||"Sheet1").replace(/[\[\]:*?\/\\]/g," ").slice(0,31));
    saveBlob(new Blob([X.write(wb,{bookType:"xlsx",type:"array"})],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}), t.name+".xlsx");
  }catch{ toast("Couldn't load the Excel export. Check your connection, or use Export CSV."); }
}

/* ---------- Ask Claude: Claude answers in the background; the page follows the job ---------- */
const activeTurn = () => S.ask.turns.find(t=>!["done","error"].includes(t.status));
const answerText = res => (Array.isArray(res&&res.answer)?res.answer:[]).map(s=>String(s&&s.text||"")).filter(Boolean).join("\n");
/* What Claude is told about the result on screen in the view the reader is on: the search or question that
   produced it and the companies in it, never the rows themselves. Null when no result is on screen. */
function askScreen(){
  const ints=a=>(Array.isArray(a)?a:[]).map(Number).filter(Number.isInteger);
  const names=a=>[...new Set((Array.isArray(a)?a:[]).map(x=>x&&x.name).filter(n=>!blank(n)).map(String))].slice(0,20);
  if(S.view==="filings" && S.f.res){
    const r=S.f.res, p=r.params||S.f.last||{};   // what the function ran, not the form, which may have been edited since
    return {view:"filings",
      search:{companyIds:ints(p.companyIds), institutionIds:ints(p.institutionIds), states:(Array.isArray(p.states)?p.states:[]).map(String), from:String(p.from||""), to:String(p.to||""),
        typeOfInsuranceIds:ints(p.typeOfInsuranceIds), filingTypeIds:ints(p.filingTypeIds), filingStatusIds:p.allStatuses?[]:ints(p.filingStatusIds)},
      total:isNum(r.total)?+r.total:(Array.isArray(r.rows)?r.rows.length:0), companies:names(r.byCompany)};
  }
  if(S.view==="statutory" && S.st.res && S.st.status && S.st.status.configured && S.st.status.mapped){
    const r=S.st.res;
    return {view:"statutory", query:{kind:r.kind==="group"?"group":"company", codes:(Array.isArray(r.codes)?r.codes:[]).map(String), fromYear:+r.fromYear, toYear:+r.toYear}, companies:names(r.entities)};
  }
  if(S.view==="profile") return pfScreen();
  if(S.view==="snapshot") return snapScreen();
  if(S.view==="forms") return fcScreen();
  if(S.view==="compare") return cmpScreen();
  return null;
}
/* The same thing in one plain line, so what Claude is told is never a surprise. */
function askToldText(sc, past){
  if(!sc) return past ? "" : "Nothing is on screen yet, so Claude starts from your question alone.";
  const list=a=>a.length<2 ? a.join("") : a.slice(0,-1).join(", ")+" and "+a[a.length-1];
  if(sc.view==="filings" && sc.snapshot) return snapToldText(sc, past);
  const lead=past ? "Claude was told what was on screen: " : "Claude will be told what is on screen: ";
  if(sc.view==="filings"){
    const s=sc.search, who=[s.companyIds.length?plural(s.companyIds.length,"company","companies"):"", s.institutionIds.length?plural(s.institutionIds.length,"institution"):""].filter(Boolean);
    return `${lead}${plural(sc.total,"filing")} for ${list(who)||"no companies"} in ${s.states.length>6?plural(s.states.length,"state"):s.states.join(", ")}, ${fmtDay(s.from)} to ${fmtDay(s.to)}.`;
  }
  const q=sc.query;
  return `${lead}statutory figures for NAIC ${q.kind==="group"?(q.codes.length>1?"groups ":"group "):""}${list(q.codes)}, ${q.fromYear===q.toYear?q.fromYear:`${q.fromYear} to ${q.toYear}`}.`;
}
async function askQuestion(){
  const a=S.ask, q=a.draft.trim();
  if(activeTurn()) return;
  if(chatAtLimit(S.chatUse)) return;
  if(!q){ toast("Type a question first."); return; }
  if(q.length>MAX_QUESTION){ toast(`Keep the question under ${count(MAX_QUESTION)} characters.`); return; }
  // earlier finished answers go along as plain text, so a follow-up question makes sense
  const history=a.turns.filter(t=>t.status==="done"&&t.result).slice(-MAX_HISTORY).map(t=>({question:t.lib?libHistoryQuestion(t.question):t.question, answer:answerText(t.result).slice(0, MAX_HISTORY_ANSWER).trim()})).filter(h=>h.answer);
  const screen=askScreen();
  const t={question:q, told:askToldText(screen, true), status:"starting", progress:[], partial:"", result:null, error:"", calm:false, jobId:null, lastContinue:0, note:"", contNote:""};
  t.asked=new Date().toISOString();   // shown in the exported or copied answer
  t.t0=performance.now();   // the progress bar's time so far: only for a question asked on this page
  a.turns.push(t); a.draft=""; a.scroll="bottom"; renderAsk();
  const r=await callFn("snl-chat",{action:"ask", question:q, ...(history.length?{history}:{}), ...(screen?{screen}:{})});
  if(!S.session || !S.ask.turns.includes(t)) return;
  if(r.data && r.data.jobId){ t.jobId=r.data.jobId; t.status="queued"; schedulePoll(); }
  else if(r.err!=="signin"){

}
function askPanelHTML(){

/* Draws the button and, when open, the panel. Left alone when nothing in them has changed, so the page under the
   panel can redraw as often as it likes without disturbing the conversation. */
let askDrawn="";
function renderAsk(){
  const root=document.getElementById("askRoot"), a=S.ask, on=!!S.session;
  document.body.classList.toggle("ask-docked", on && a.open && !a.wide);
  const html = on ? askFabHTML()+(a.open?askPanelHTML():"") : "";
  if(html===askDrawn){ a.scroll=null; return; }
  const was=document.getElementById("askBody"), atFoot=!!was && was.scrollHeight-was.scrollTop-was.clientHeight<48, keep=keepUi("askRoot");
  root.innerHTML=html; askDrawn=html; keep();
  const body=document.getElementById("askBody");
  if(body){
    const turn=typeof a.scroll==="number" ? document.getElementById("turn-"+a.scroll) : null;
    if(turn) body.scrollTop=Math.max(0, turn.offsetTop-10);
    else if(a.scroll==="bottom" || (atFoot && activeTurn())) body.scrollTop=body.scrollHeight;   // follow a running answer while the reader is at its foot
  }
  a.scroll=null;
}

/* ---------- Ask Claude: past answers, and an answer that outlives a reload ----------
   The database is the only record: the page reads the login's own snl_jobs rows (row-level security limits them to
   the login, and the page asks for its own owner too). The list reads a few small columns; one answer's full row is
   read only when it is opened. The only thing kept in the browser is the id of the last answer the reader has seen. */
const PAST_COLS = "id,status,question,error,created_at,updated_at,heartbeat_at";
const PAST_PAGE = 10, PAST_DAYS = 30, SEEN_KEY = "snl.seenAnswer";
// rows: the list (null until it first loads); failedMore: whether the load that failed was "Show more";
// resumed: the latest answer has been checked once since sign-in; opening: the id being fetched
function freshPast(){ return {rows:null, loading:false, err:"", failedMore:false, more:false, resumed:false, opening:"", openErr:""}; }
S.past = freshPast();
function seenId(){ try{ return localStorage.getItem(SEEN_KEY)||""; }catch{ return ""; } }
function markSeen(id){ if(!id) return; try{ localStorage.setItem(SEEN_KEY, String(id)); }catch{} }
const shortText = (s, n) => { s=String(s??"").replace(/\s+/g," ").trim(); return s.length>n ? s.slice(0,n-1).trimEnd()+"…" : s; };
const askedText = s => { const d=fmtAt(s), h=fmtTime(s); return `Asked ${d}${h?` at ${h}`:""}`; };
function pastState(r){
  if(r.status==="done") return {text:"Answered", cls:""};
  if(r.status==="error") return {text:"Stopped: "+shortText(r.error||"Claude couldn't finish this answer.", 160), cls:"stopped"};
  return {text:"Still running", cls:""};
}
/* A row of snl_jobs as a turn of the conversation, the same shape askQuestion makes. saved: opened from the list.
   asked is when the question was asked, which the exported answer shows. */
function jobTurn(row, saved){
  const st=["queued","running","paused","done","error"].includes(row.status) ? row.status : "running";
  return {question:String(row.question??""), told:"", status:st, progress:Array.isArray(row.progress)?row.progress:[], partial:typeof row.partial==="string"?row.partial:"",
    result: st==="done" ? (row.result&&typeof row.result==="object"?row.result:{}) : null, error: st==="error" ? (row.error||"Claude couldn't finish this answer. Ask again.") : "",
    calm:false, jobId:row.id, lastContinue:0, note:"", contNote:"", asked:String(row.created_at||""), saved:!!saved};
}
function pastQuery(cols){
  return S.sb.from("snl_jobs").select(cols).eq("owner", S.session.uid).gte("created_at", new Date(Date.now()-PAST_DAYS*DAY).toISOString()).order("created_at",{ascending:false});
}
/* The first page of the list (again), or the next page with "Show more". */
async function loadPast(more){
  const p=S.past; if(!S.session || p.loading) return;
  const from = more && p.rows ? p.rows.length : 0;
  p.loading=true; p.err=""; renderAsk();
  let data=null, error=null;
  try{ ({data, error}=await pastQuery(PAST_COLS).range(from, from+PAST_PAGE)); }catch(e){ error=e; }
  if(S.past!==p || !S.session) return;   // signed out meanwhile: this list belonged to that login
  p.loading=false;
  if(error || !Array.isArray(data)){ p.err="Couldn't load your past answers. Check your connection and try again."; p.failedMore=!!from; renderAsk(); return; }
  const base=from ? p.rows : [], ids=new Set(base.map(r=>r.id));
  p.rows=base.concat(data.slice(0, PAST_PAGE).filter(r=>r && !ids.has(r.id))); p.more=data.length>PAST_PAGE;
  if(!p.resumed){ p.resumed=true; await resumeLatest(p.rows[0]); }
  renderAsk();
}
/* After a reload or a sign-in: follow the latest answer again if it is still going, or hold it ready if it ended
   while the page was closed and hasn't been seen. */
async function resumeLatest(row){
  const a=S.ask, p=S.past;
  if(!row || a.turns.length) return;
  const going=["queued","running","paused"].includes(row.status);
  if(!going && (!["done","error"].includes(row.status) || row.id===seenId())) return;
  let full=row;
  if(row.status==="done"){
    let data=null; try{ ({data}=await S.sb.from("snl_jobs").select(JOB_COLS).eq("id", row.id).eq("owner", S.session.uid).maybeSingle()); }catch{}
    if(S.past!==p || S.ask!==a || a.turns.length || !data) return;
    full=data;
  }
  const t=jobTurn(full, false); a.turns=[t];
  if(going){ pollJob().then(()=>{ if(S.session && activeTurn() && !S.ask.timer) schedulePoll(); }); }
  else if(a.open){ a.scroll=0; markSeen(t.jobId); }
  else a.unseen=t.status;
}
/* Opens one past answer: its full row, shown as a fresh answer is. A running one is followed again. */
async function openPast(id){
  const p=S.past, a=S.ask;
  if(!id || p.opening || a.turns.length) return;
  p.opening=id; p.openErr=""; renderAsk();
  let data=null, error=null;
  try{ ({data, error}=await S.sb.from("snl_jobs").select(JOB_COLS).eq("id", id).eq("owner", S.session.uid).maybeSingle()); }catch(e){ error=e; }
  if(S.past!==p || !S.session) return;
  p.opening="";
  if(error || !data){ p.openErr = error ? "Couldn't open that answer. Check your connection and try again." : "That answer is no longer kept. Answers are kept for 30 days."; renderAsk(); return; }
  if(S.ask!==a || a.turns.length){ renderAsk(); return; }
  const t=jobTurn(data, true); a.turns=[t]; a.scroll=0;
  if(activeTurn()){ a.scroll="bottom"; pollJob().then(()=>{ if(S.session && activeTurn() && !S.ask.timer) schedulePoll(); }); }
  else if(p.rows && p.rows[0] && p.rows[0].id===data.id) markSeen(data.id);   // only the latest counts as seen
  renderAsk();
}
/* The panel opened: count what it shows as seen, and freshen the list when the list is what it shows. */
function pastOnOpen(){
  const last=S.ask.turns[S.ask.turns.length-1];
  if(last && last.jobId && !last.saved && ["done","error"].includes(last.status)) markSeen(last.jobId);
  if(!S.ask.turns.length) loadPast(false);
}
function pastLabelHTML(t){
  const back = S.ask.turns.length===1 && !activeTurn() ? ` <button type="button" class="lnk" data-act="ask-new">Back to past answers</button>` : "";
  return `<p class="t2 asked">${esc(askedText(t.asked))}. A saved answer.${back}</p>`;
}
function pastHTML(){
  const p=S.past, retry=`<button class="btn sm" data-act="past-retry">Try again</button>`;
  const problem = p.err ? `<div class="banner" id="pastErr" role="alert"><span>${esc(p.err)}</span>${retry}</div>` : "";
  let body;
  if(p.rows===null) body = problem || `<p class="t2" id="pastLoading">Loading your past answers…</p>`;
  else if(!p.rows.length) body = (problem || `<p class="t2" id="pastEmpty">No questions in the last 30 days. Your questions and Claude's answers are kept here for 30 days.</p>`);
  else body = `<ul class="pastlist" id="pastList">${p.rows.map(r=>{ const s=pastState(r), busy=p.opening===r.id;
      return `<li><button type="button" class="pastq" data-act="past-open" data-id="${esc(r.id)}"${p.opening?` aria-disabled="true"`:""}><span class="pq">${esc(shortText(r.question, 140))}</span>
        <span class="t2">${esc(askedText(r.created_at))} · <span class="${s.cls}">${esc(busy?"Opening…":s.text)}</span></span></button></li>`; }).join("")}</ul>`
      + problem + (p.more && !p.err ? `<div><button type="button" class="btn sm" id="pastMore" data-act="past-more" ${p.loading?"disabled":""}>${p.loading?"Loading…":"Show more"}</button></div>` : "");
  return `<section class="past" id="askPast" aria-labelledby="pastH"><h3 id="pastH">Past answers</h3>
    ${p.openErr?`<p class="err" id="pastOpenErr" role="alert">${esc(p.openErr)}</p>`:""}${body}</section>`;
}

/* ---------- Ask Claude: the team library ----------
   Answers a login chose to share with everyone who has a login on this site (migration 0007). The list and an opened
   entry are read straight from snl_library, as Past answers are read from snl_jobs: row-level security lets every
   login read it, so the list needs no function call and works even before snl-chat is redeployed. Saving, renaming
   and removing go through the snl-chat function, which copies the answer and checks who is asking.
   An entry was written by someone else: every part of it is shown through esc(), and when a reader follows it up it
   goes back to Claude only as one labelled turn of history, as bounded as any other. */
const LIB_COLS = "id,job_id,title,tags,companies,saved_by,saved_by_name,saved_at,answered_at";
const LIB_PAGE = 10, LIB_TITLE = 120, LIB_TAGS = 5, LIB_TAG = 30;
const LIB_NOTICE = "Everyone with a login on this site will be able to read this question and its answer, including which companies it is about. It stays until you or Corp Dev remove it.";
const LIB_GONE = "That entry is no longer in the team library. Someone may have removed it.";
// tab: which list an empty conversation starts with; rows: the list (null until loaded); seq: the latest load, so an
// older answer is dropped; q: the search box; applied: the search the rows are for; missing: the table isn't there
// (migration not run); form: the save or edit form {turn, mode, title, tags, busy, err}; confirm: a removal being
// confirmed {turn, busy, err}
function freshLib(){ return {tab:"past", rows:null, loading:false, seq:0, err:"", failedMore:false, more:false, q:"", applied:"", missing:false, opening:"", openErr:"", form:null, confirm:null}; }
S.lib = freshLib();
const libMissingErr = e => !!e && (e.code==="PGRST205" || e.code==="42P01" || (/snl_library/.test(String(e.message||"")) && /does not exist|schema cache/.test(String(e.message||""))));
const libMissingText = () => "The team library isn't set up yet, so answers can't be shared. " + (isCorpDev() ? "To set it up, run supabase/migrations/0007_answer_library.sql in the Supabase SQL editor (see the README)." : "Ask Corp Dev to set it up.") + " Everything else here works as before.";
const libMayChange = savedBy => !!S.session && (isCorpDev() || savedBy===S.session.uid);
const libTagsHTML = tags => { const a=(Array.isArray(tags)?tags:[]).filter(x=>!blank(x)).map(String); return a.length ? `<span class="libtags">${a.map(x=>`<span class="libtag">${esc(x)}</span>`).join("")}</span>` : ""; };
/* What a library entry's question is sent to Claude as when a reader follows it up: labelled as a colleague's, and
   no longer than any question. */
const libHistoryQuestion = q => ("(A colleague's question, saved in the team library) "+String(q??"")).slice(0, MAX_QUESTION);
/* The words in the search box, each made safe to use inside a pattern: no wildcards, commas, brackets or quotes. */
function libWords(q){ return String(q||"").toLowerCase().replace(/[%_\\*,()"'.:;]/g," ").split(/\s+/).filter(Boolean).slice(0,6); }
function libQuery(){
  let q=S.sb.from("snl_library").select(LIB_COLS);
  for(const w of libWords(S.lib.applied)) q=q.ilike("search_text", `%${w}%`);
  return q.order("saved_at",{ascending:false});
}
/* The first page of the list (again), or the next one with "Show more". */
async function loadLib(more){
  const l=S.lib; if(!S.session || (more && l.loading)) return;
  const from = more && l.rows ? l.rows.length : 0, seq=++l.seq;
  l.loading=true; l.err=""; renderAsk();
  let data=null, error=null;
  try{ ({data, error}=await libQuery().range(from, from+LIB_PAGE)); }catch(e){ error=e; }
  if(S.lib!==l || !S.session || seq!==l.seq) return;   // signed out, or a newer search meanwhile
  l.loading=false;
  if(libMissingErr(error)){ l.missing=true; l.rows=[]; l.more=false; renderAsk(); return; }
  if(error || !Array.isArray(data)){ l.err="Couldn't load the team library. Check your connection and try again."; l.failedMore=!!from; renderAsk(); return; }
  l.missing=false;
  const base=from ? l.rows : [], ids=new Set(base.map(r=>r.id));
  l.rows=base.concat(data.slice(0, LIB_PAGE).filter(r=>r && !ids.has(r.id))); l.more=data.length>LIB_PAGE;
  renderAsk();
}
function libSearch(){ const l=S.lib; l.applied=String(l.q||"").replace(/\s+/g," ").trim(); l.rows=null; l.openErr=""; loadLib(false); }
function libClear(){ const l=S.lib; l.q=""; l.applied=""; l.rows=null; l.openErr=""; loadLib(false); }
function libTab(tab){ const l=S.lib; l.tab=tab==="lib"?"lib":"past"; if(l.tab==="lib" && l.rows===null && !l.loading) loadLib(false); renderAsk(); }
/* Back to an empty conversation, showing the library. */
function libShowList(){ S.lib.form=null; S.lib.confirm=null; S.lib.tab="lib"; S.lib.openErr=""; newConversation(); loadLib(false); }
/* A library entry as a turn of the conversation, the same shape jobTurn makes; lib says where it came from. */
function libTurn(row){
  const a=row.answer&&typeof row.answer==="object"&&!Array.isArray(row.answer)?row.answer:{};
  return {question:String(row.question??""), told:"", status:"done", progress:[], partial:"", result:{...a, model:blank(row.model)?"":String(row.model)}, error:"", calm:false, jobId:null, lastContinue:0, note:"", contNote:"",
    asked:String(row.asked_at||""), saved:false, lib:{id:row.id, title:String(row.title??""), tags:Array.isArray(row.tags)?row.tags.map(String):[], savedBy:row.saved_by, savedByName:String(row.saved_by_name??""), savedAt:row.saved_at, answeredAt:row.answered_at, removed:false, note:""}};
}
async function openLib(id){
  const l=S.lib, a=S.ask;
  if(!id || l.opening || a.turns.length) return;
  l.opening=id; l.openErr=""; renderAsk();
  let data=null, error=null;
  try{ ({data, error}=await S.sb.from("snl_library").select("*").eq("id", id).maybeSingle()); }catch(e){ error=e; }
  if(S.lib!==l || !S.session) return;
  l.opening="";
  if(error || !data){ l.openErr = error ? "Couldn't open that entry. Check your connection and try again." : LIB_GONE; if(!error) libDropRow(id); renderAsk(); return; }
  if(S.ask!==a || a.turns.length){ renderAsk(); return; }
  a.turns=[libTurn(data)]; a.scroll=0; renderAsk();
}
function libDropRow(id){ if(S.lib.rows) S.lib.rows=S.lib.rows.filter(r=>r.id!==id); }
function libPatchRow(e){ if(S.lib.rows) S.lib.rows=S.lib.rows.map(r=>r.id===e.id?{...r, title:e.title, tags:e.tags}:r); }
/* Whether one of the login's own answers is already in the library, asked once when the answer is first shown. */
async function libCheck(t){
  let data=null, error=null;
  try{ ({data, error}=await S.sb.from("snl_library").select(LIB_COLS).eq("job_id", t.jobId).maybeSingle()); }catch(e){ error=e; }
  if(!S.session) return;
  if(libMissingErr(error)) S.lib.missing=true;
  t.libChk = error ? "failed" : "done";
  if(!error) t.libEntry=data||null;
  renderAsk();
}
function libSuggestTitle(q){ const s=String(q??"").replace(/\s+/g," ").trim(); return s.length>LIB_TITLE ? s.slice(0,LIB_TITLE-1).trimEnd()+"…" : s; }
function libParseTags(s){ const out=[], seen=new Set(); for(const x of String(s||"").split(",")){ const v=x.replace(/\s+/g," ").trim(); if(v && !seen.has(v.toLowerCase())){ seen.add(v.toLowerCase()); out.push(v); } } return out; }
function libOpenForm(t){
  if(!t) return;
  S.lib.confirm=null; t.libJust="";
  S.lib.form = t.lib ? {turn:t, mode:"edit", title:t.lib.title, tags:t.lib.tags.join(", "), busy:false, err:""}
    : {turn:t, mode:"save", title:libSuggestTitle(t.question), tags:"", busy:false, err:""};
  renderAsk(); const el=document.getElementById("lib_title"); if(el){ el.focus({preventScroll:true}); el.select(); }
  document.getElementById("libForm")?.scrollIntoView({block:"nearest"});
}
/* An older snl-chat (before the library) answers "Unknown action": say what to do about it. */
const libOld = r => r.err==="bad" && /^Unknown action/.test(String(r.msg||""));
const libNotDeployed = () => isCorpDev() ? "Saving to the team library needs the latest questions function. Run: supabase functions deploy snl-chat --no-verify-jwt (see the README), then try again." : "Saving to the team library isn't switched on yet. Ask Corp Dev to update the site.";
async function libSubmit(){
  const f=S.lib.form; if(!f || f.busy) return;
  const t=f.turn, title=f.title.replace(/\s+/g," ").trim(), tags=libParseTags(f.tags);
  f.err = !title ? "Give the entry a title." : title.length>LIB_TITLE ? `Keep the title to ${LIB_TITLE} characters.` : tags.length>LIB_TAGS ? `Use up to ${LIB_TAGS} tags.` : tags.some(x=>x.length>LIB_TAG) ? `Keep each tag to ${LIB_TAG} characters.` : "";
  if(f.err){ renderAsk(); return; }
  f.busy=true; renderAsk();
  const r=await callFn("snl-chat", f.mode==="edit" ? {action:"library_update", id:t.lib.id, title, tags} : {action:"library_save", jobId:t.jobId, title, tags});
  if(!S.session || S.lib.form!==f) return;   // signed out, or the form was closed meanwhile
  f.busy=false;
  if(r.data && r.data.entry){
    const e=r.data.entry; S.lib.form=null;
    if(f.mode==="edit"){ t.lib.title=String(e.title??""); t.lib.tags=Array.isArray(e.tags)?e.tags.map(String):[]; libPatchRow(e); }
    else { t.libEntry=e; t.libChk="done"; t.libJust=r.data.existing?"existing":"saved"; S.lib.rows=null; }   // the list is read again when it is next shown
    renderAsk(); return;
  }
  if(r.err==="signin") return;
  if(r.err==="library_missing"){ S.lib.missing=true; S.lib.form=null; renderAsk(); return; }
  if(r.err==="not_found" && f.mode==="edit"){ S.lib.form=null; libGone(t, false); renderAsk(); return; }
  f.err = libOld(r) ? libNotDeployed() : errText(r);
  renderAsk();
}
function libGone(t, already){
  if(!t.lib) return;
  t.lib.removed=true; libDropRow(t.lib.id);
  t.lib.note = already===true ? "Removed from the team library. It is gone for everyone." : "This entry is no longer in the team library: someone removed it. You can still read it here and follow it up.";
}
async function libRemove(){
  const c=S.lib.confirm; if(!c || c.busy) return;
  const t=c.turn, id=t.lib ? t.lib.id : t.libEntry && t.libEntry.id; if(!id) return;
  c.busy=true; c.err=""; renderAsk();
  const r=await callFn("snl-chat",{action:"library_remove", id});
  if(!S.session || S.lib.confirm!==c) return;
  c.busy=false;
  if(r.err==="signin") return;
  if((r.data && r.data.removed) || r.err==="not_found"){
    S.lib.confirm=null;
    if(t.lib) libGone(t, !r.err);
    else { libDropRow(id); t.libEntry=null; t.libJust="removed"; }
    renderAsk(); return;
  }
  if(r.err==="library_missing"){ S.lib.missing=true; S.lib.confirm=null; renderAsk(); return; }
  c.err = libOld(r) ? libNotDeployed() : errText(r); renderAsk();
}
function libFormHTML(f){

/* ---------- Statutory ---------- */
async function loadStatStatus(){
  const st=S.st; if(st.loading) return;
  st.loading=true; st.statusErr=null; render();
  const r=await callFn("snl-statutory",{action:"status"});
  st.loading=false;

}
function statCodes(){ return [...new Set(S.st.codes.split(/[\s,;]+/).map(s=>s.trim()).filter(Boolean))]; }
function statProblem(){
  const st=S.st, codes=statCodes(), y=new Date().getFullYear();
  if(!codes.length) return `Type at least one NAIC ${st.kind==="group"?"group":"company"} code.`;
  if(codes.length>MAX_CODES) return `Compare at most ${MAX_CODES} codes at a time: one subject and ${MAX_CODES-1} peers.`;
  if(codes.some(c=>!/^[0-9]{1,6}$/.test(c))) return "NAIC codes are numbers of up to 6 digits, like 90001. Separate them with commas.";
  const a=/^\d{4}$/.test(st.fromYear)?+st.fromYear:0, b=/^\d{4}$/.test(st.toYear)?+st.toYear:0;
  if(!a || !b || a<1990 || b>y) return `Choose years between 1990 and ${y}.`;
  if(a>b) return "The first year is after the last year.";
  if(b-a>MAX_STAT_YEARS-1) return `Choose at most ${MAX_STAT_YEARS} years at a time.`;
  return "";
}
/* ---------- Statutory figures that come in over several calls (stat-speed) ----------
   One call to the statutory or profile function has about two minutes. Figures that don't fit come back "Not run" and
   the answer says how many are still to come (pending); the function keeps every figure that did come back, so the
   same question asked again carries on from where it stopped. statCarry asks again by itself with the same body (only
   the first call may ask afresh) while each call brings at least one more figure, up to STAT_CARRY_CALLS calls, so it
   never loops without progress. ask(first): one call; figs(data): {done, of, pending}; o.ctl (bsControl) stops it,
   keeping what arrived; o.onPart(figs, data) after each call that left figures to come. The answer is the last call's;
   with figures still to come it carries stalled: {why: "stopped" | "stuck" | "failed", err, figs}. */
const STAT_CARRY_CALLS = 6;
async function statCarry(ask, figs, o={}){
  const ctl=o.ctl||{}; let last=null, before=Infinity;
  const stop=()=>last ? {...last, stalled:{why:"stopped", figs:figs(last.data)}} : {err:"stopped", status:0};
  for(let n=1;;n++){
    if(ctl.stopped) return stop();
    const r=await Promise.race([ask(n===1), ctl.wait||new Promise(()=>{})]);
    if(ctl.stopped) return stop();
    if(!r.data) return last && r.err!=="signin" ? {...last, stalled:{why:"failed", err:r, figs:figs(last.data)}} : r;
    const f=figs(r.data);
    if(!(f.pending>0)) return r;
    if(f.pending>=before || n>=STAT_CARRY_CALLS) return {...r, stalled:{why:"stuck", figs:f}};
    before=f.pending; last=r;
    if(o.onPart) o.onPart(f, r.data);
  }
}
/* How far a statutory answer got: figures that can be run (mapped), how many are still to come. */
function statFigs(d){
  const fields=d&&Array.isArray(d.fields)?d.fields:[], of=fields.filter(f=>f&&f.mapped!==false).length, pending=d&&isNum(d.pending)?+d.pending:0;
  return {done:Math.max(0, of-pending), of, pending};
}
const statFigsText = f => `${count(f.done)} of ${count(f.of)} figures`;
/* The banner of figures still to come once the page has stopped asking: why, and Carry on (the figures in are kept). */
function statPendingHTML(s, id, act, what, busy){
  const f=s.figs, why=s.why;
  const text=`${count(f.pending)} of ${count(f.of)} figures ${why==="stopped"?"weren't fetched":"didn't come back in time"}, so ${what}. ${why==="failed"?errText(s.err)+" ":""}Carry on to ask for them again: the figures that arrived are kept, so it carries on from where it stopped.`;
  return `<div class="banner" id="${id}" role="alert"><span><b>${why==="stopped"?"You stopped getting the figures.":"Some figures didn't arrive."}</b> ${esc(text)}</span><button type="button" class="btn sm" id="${id}Carry" data-act="${act}" ${busy?"disabled":""}>Carry on</button>${pbHTML(id+"-bar", {name:"Figures", now:true, done:f.done, of:f.of, state:why==="failed"?"failed":"stopped", say:text})}</div>`;
}
async function runStat(refresh, carryOn){
  const st=S.st; if(st.busy) return;
  let payload;
  if(carryOn){ if(!st.last || !st.res) return; payload={...st.last}; delete payload.refresh; }   // the figures still to come
  else if(refresh){ if(!st.last) return; payload={...st.last, refresh:true}; }
  else{
    const problem=statProblem(); if(problem){ st.formErr=problem; render(); return; }
    payload={action:"query", kind:st.kind, codes:statCodes(), fromYear:+st.fromYear, toYear:+st.toYear}; st.last=payload; st.res=null; st.ent={}; st.resNames={...statFind().names[st.kind]};
  }
  const ctl=bsControl();
  st.formErr=""; st.busy=true; st.err=null; st.ctl=ctl; st.figs=carryOn?statFigs(st.res):null; pbStart("stat"); render();
  const r=await statCarry(first=>{ const b={...payload}; if(!first) delete b.refresh; return callFn("snl-statutory", b); }, statFigs,
    {ctl, onPart:(f, data)=>{ if(st.ctl!==ctl || !S.session) return; st.figs=f; st.res=data; takeUsage(data); render(); }});
  if(st.ctl!==ctl) return;
  st.busy=false; st.ctl=null; st.figs=null;
  if(!S.session) return;
  if(r.data){ st.res=r.stalled?{...r.data, stalled:r.stalled}:r.data; takeUsage(r.data); loadStatus(); }
  else if(carryOn && st.res && r.err!=="signin") st.res={...st.res, stalled:{why:r.err==="stopped"?"stopped":"failed", err:r, figs:statFigs(st.res)}};   // what had arrived stays
  else if(r.err==="stopped") toast("Stopped. No figures had come back yet.");
  else if(r.err!=="signin"){ st.err=r; if(r.err==="not_configured"||r.err==="not_mapped") loadStatStatus(); }
  render();
}
function stopStat(){ const st=S.st; if(st.busy && st.ctl) st.ctl.stop(); }
const statVal = (unit, v) => unit==="pct" ? pct(v) : usdM(v);
const statYears = res => { const a=+res.fromYear, b=+res.toYear, out=[]; if(isFinite(a)&&isFinite(b)) for(let y=a; y<=b && out.length<40; y++) out.push(y); return out; };
function statEntities(res, field){
  const list=(Array.isArray(res.entities)?res.entities:[]).map(e=>({code:String(e.code), name:e.name}));
  for(const c of (Array.isArray(res.codes)?res.codes:[])) if(!list.some(e=>e.code===String(c))) list.push({code:String(c), name:null});
  for(const r of (field&&Array.isArray(field.rows)?field.rows:[])) if(!blank(r.code) && !list.some(e=>e.code===String(r.code))) list.push({code:String(r.code), name:null});
  const known=S.st.resNames||{};   // the names found by name when the figures were asked for fill the gaps
  return list.map(e=>blank(e.name) && !blank(known[e.code]) ? {...e, name:known[e.code]} : e);
}
const entLabel = e => blank(e.name) ? `NAIC ${e.code}` : `${e.name} (NAIC ${e.code})`;
/* One block's table: for a "by year" field one row per company (the subject first, then peers); for a "by line"
   or "by state" field one row per line or state for the company chosen in the block. */
function statBlock(res, field){
  const years=statYears(res), ents=statEntities(res, field), rows=Array.isArray(field.rows)?field.rows:[], dim=field.by==="line"?"line":field.by==="state"?"state":null;
  const find=(code, y, d)=>{ const r=rows.find(x=>String(x.code)===code && +x.year===y && (!dim || String(x[dim]??"")===d)); return r ? r.value : null; };
  if(!dim) return {years, ents, dim, lines:ents.map((e,i)=>({label:entLabel(e), tag:ents.length>1?(i?"Peer":"Subject"):"", vals:years.map(y=>find(e.code,y))}))};
  const chosen=ents.some(e=>e.code===S.st.ent[field.id]) ? S.st.ent[field.id] : (ents[0]?ents[0].code:"");
  const keys=[...new Set(rows.filter(r=>String(r.code)===chosen && !blank(r[dim])).map(r=>String(r[dim])))];
  const last=years[years.length-1];
  const lines=sortRows(keys.map(k=>({label:k, tag:"", vals:years.map(y=>find(chosen,y,k))})), l=>{ const v=l.vals[l.vals.length-1]; return isNum(v)?+v:null; }, -1);   // largest in the latest year first
  return {years, ents, dim, chosen, lines, last};
}
function statExport(fieldId){
  const res=S.st.res, field=res&&(res.fields||[]).find(f=>f.id===fieldId); if(!field) return null;
  const years=statYears(res), ents=statEntities(res, field), rows=Array.isArray(field.rows)?field.rows:[], dim=field.by==="line"?"line":field.by==="state"?"state":null, unit=field.unit==="pct"?"%":"US dollars";
  const val=(code,y,d)=>{ const r=rows.find(x=>String(x.code)===code && +x.year===y && (!dim || String(x[dim]??"")===d)); return r&&isNum(r.value) ? +r.value : null; };
  const out=[];
  for(const e of ents){
    if(!dim){ out.push([e.code, e.name, unit, ...years.map(y=>val(e.code,y))]); continue; }
    for(const k of [...new Set(rows.filter(r=>String(r.code)===e.code && !blank(r[dim])).map(r=>String(r[dim])))]) out.push([e.code, e.name, k, unit, ...years.map(y=>val(e.code,y,k))]);
  }
  return {name:`snl-statutory-${String(field.id).replace(/[^\w-]+/g,"-")}-${TODAY()}`, sheet:field.label||field.id, cols:["NAIC code","Name", ...(dim?[dim==="line"?"Line of business":"State"]:[]), "Unit", ...years.map(String)], rows:out};
}
function statBlockHTML(res, field){
  const unit=field.unit==="pct"?"%":"$M";
  const head=(extra)=>`<div class="blk-h"><div><h3>${esc(field.label||field.id)} <span class="t2">${unit}</span></h3></div><span class="inline">${extra||""}</span></div>`;

    <tbody>${b.lines.map(l=>`<tr><td>${esc(l.label)}${l.tag?` <span class="t2">${l.tag}</span>`:""}</td>${l.vals.map(v=>`<td class="num">${statVal(field.unit, v)}</td>`).join("")}</tr>`).join("")}</tbody></table></div></section>`;
}
function statResultsHTML(){
  const st=S.st, res=st.res;
  if(st.busy && !res) return `<div class="banner" role="status"><span>Fetching statutory data from Snowflake… This can take a minute. After that the figures are saved for everyone until someone clicks Refresh.</span>${pbHTML("stat", {name:"Statutory query"})}</div>`;

  if(!st.busy && isNum(res.pending) && +res.pending>0) h+=statPendingHTML(res.stalled||{why:"stuck", figs:statFigs(res)}, "statPending", "stat-carry", "they show as not fetched below");

function mappingProblem(text){
  let doc; try{ doc=JSON.parse(text); }catch(e){ return {problem:"This isn't valid JSON yet: "+String(e&&e.message||e).replace(/^JSON\.parse: /,"")+"."}; }
  const obj=v=>v!==null && typeof v==="object" && !Array.isArray(v);
  if(!obj(doc)) return {problem:'The mapping must be an object, like {"fields": {...}}.'};
  if(!obj(doc.fields)) return {problem:'The mapping needs a "fields" object, with one entry for each figure.'};
  const bad=Object.keys(doc.fields).find(k=>!obj(doc.fields[k]));
  if(bad!==undefined) return {problem:`The entry for "${bad}" must be an object with view, entity, year and value.`};
  for(const [k,f] of Object.entries(doc.fields)){
    if(f.joins!==undefined && !Array.isArray(f.joins)) return {problem:`The entry for "${k}" has "joins" that isn't a list. Write it as [{"view": ..., "as": ..., "on": [...]}].`};
    if(f.joins!==undefined && f.joins.length>8) return {problem:`The entry for "${k}" has ${f.joins.length} joins. A figure can join at most 8 views.`};
    if(f.where!==undefined && !Array.isArray(f.where)) return {problem:`The entry for "${k}" has "where" that isn't a list. Write it as [{"column": ..., "equals": ...}].`};
  }
  if(doc.loaded!==undefined && !obj(doc.loaded)) return {problem:'The "loaded" entry must be an object, like {"view": "...", "at": "..."}.'};
  if(doc.companies!==undefined && !obj(doc.companies)) return {problem:'The "companies" entry (the company look-up) must be an object, like {"view": "...", "institution": "...", "company": "...", "name": "..."}.'};
  if(text.length>200000) return {problem:"The mapping is too large to save."};
  return {doc};
}
async function saveMapping(){
  const su=S.st.setup, {doc, problem}=mappingProblem(su.text||"");
  if(problem){ su.mapErr=problem; render(); return; }
  su.saving=true; su.mapErr=""; render();
  let error=null;
  try{ ({error}=await S.sb.from("snl_settings").upsert({id:"statutory_mapping", doc})); }catch(e){ error=e; }
  su.saving=false;
  if(error){ su.mapErr = /42501|row-level security|permission/i.test(`${error.code||""} ${error.message||""}`) ? "Only Corp Dev logins can save the mapping." : "Couldn't save the mapping: "+(error.message||"unknown error")+"."; render(); return; }
  su.text=JSON.stringify(doc, null, 2); toast("Mapping saved"); S.st.status=null; S.st.res=null; render(); loadStatStatus();
}

/* ---------- Statutory: find companies and groups by name ---------- */
/* The same company list as the Filings view (the resolve action). Looking up by company, a match adds its NAIC
   company code; looking up by group, the matches are gathered into their groups and a group adds its NAIC group
   code. Codes typed by hand work as before; the names found here are shown beside the codes and in the results. */
function statFind(){ const st=S.st; if(!st.nf) st.nf={q:"", asked:"", matches:null, note:"", busy:false, err:"", names:{company:{}, group:{}}}; return st.nf; }
const naicOk = c => /^[0-9]{1,6}$/.test(String(c??"").trim());
async function statLookup(){
  const nf=statFind(), q=nf.q.trim();
  if(!q){ nf.matches=null; nf.err="Type part of a company or group name, or a NAIC code."; render(); return; }
  nf.busy=true; nf.err=""; nf.note=""; nf.matches=null; nf.asked=q; nf.nl=null; render();
  const r=await callFn("snl-filings",{action:"resolve", q});
  if(!S.session || S.st.nf!==nf) return;
  nf.busy=false;
  if(r.data){ nf.matches=Array.isArray(r.data.matches)?r.data.matches.filter(m=>m&&typeof m==="object"):[]; nf.note=r.data.note||""; }
  else if(r.err!=="signin") nf.err="Couldn't look that up. "+errText(r);
  render();
  if(r.data && statCodesOn()) naicFill(nf, ()=>S.st.nf===nf && nf.asked===q);
}
/* ---------- missing NAIC codes, looked up on S&P's statutory data (the statutory function's "codes" action) ----------
   When Find by name (Statutory and Profile) brings back companies the company list has with an S&P institution id but
   no NAIC company code, and the statutory mapping has its optional company look-up, the page asks for their codes in
   one call: about ten seconds the first time, saved to the company list after that. The matches show at once and
   stay as they are if the look-up fails. Without the look-up nothing here runs. */
const statCodesOn = () => { const s=S.st.status; return !!(s&&s.configured&&s.mapped&&s.companies&&s.companies.mapped); };
const pfCodesOn = () => { const s=S.pf.status&&S.pf.status.statutory; return !!(s&&s.configured&&s.codes); };
const naicInst = m => { const v=String(m&&m.institutionId!=null?m.institutionId:"").trim(); return /^[0-9]{1,12}$/.test(v)?v:""; };
const naicMissing = matches => [...new Set((matches||[]).filter(m=>!naicOk(m.naicCompanyCode)).map(naicInst).filter(Boolean))].slice(0,50);
async function naicFill(fd, still){
  const ids=naicMissing(fd.matches);
  if(!ids.length) return;
  const nl=fd.nl={busy:true, err:"", by:{}, n:ids.length}; render();
  const r=await callFn("snl-statutory",{action:"codes", institutionIds:ids});
  if(!S.session || !still() || fd.nl!==nl) return;
  nl.busy=false;
  if(r.data && Array.isArray(r.data.results)){
    for(const x of r.data.results){
      if(!x || typeof x!=="object") continue;
      const id=String(x.institutionId??""); nl.by[id]=x;
      if((x.status!=="found" && x.status!=="known") || !naicOk(x.naicCompanyCode)) continue;
      for(const m of fd.matches||[]) if(naicInst(m)===id && !naicOk(m.naicCompanyCode)){
        m.naicCompanyCode=String(x.naicCompanyCode).trim();
        if(blank(m.naicGroupCode) && naicOk(x.naicGroupCode)) m.naicGroupCode=String(x.naicGroupCode).trim();
        if(blank(m.naicGroupName) && !blank(x.naicGroupName)) m.naicGroupName=String(x.naicGroupName);
      }
    }
  }
  else if(r.err!=="signin" && r.err!=="not_mapped") nl.err=errText(r);
  render();
}
/* The line under the matches: looking the codes up, or why it couldn't. */
function naicNoteHTML(fd, idp){
  const nl=fd.nl; if(!nl) return "";
  if(nl.busy) return `<p class="t2" id="${idp}_codesBusy" role="status">Looking up ${plural(nl.n,"missing NAIC code","missing NAIC codes")} on S&amp;P's statutory data. The first time takes about ten seconds.${pbHTML(idp+"-codes", {name:"Looking up NAIC codes", small:true})}</p>`;
  if(nl.err) return `<div class="info" id="${idp}_codesErr" role="status"><span>Couldn't look up the missing NAIC codes on S&amp;P's statutory data. ${esc(nl.err)} The matches are shown as the company list has them; if you know a code, type it in the box above.</span></div>`;
  return "";
}
/* What a match that still has no NAIC company code says, after (or while) its code is looked up. */
function naicRowNote(fd, m, otherwise){
  const nl=fd.nl, id=naicInst(m), x=nl&&id?nl.by[id]:null;
  if(nl && nl.busy && id) return `<span class="t2 noadd">Looking up its NAIC code…</span>`;
  if(x && x.status==="none") return `<span class="t2 noadd">Can't be added: S&amp;P's statutory data has no NAIC company code for this company either. If you know the code, type it in the box above.</span>`;
  if(x && x.status==="several"){ const cs=Array.isArray(x.codes)?x.codes.map(String):[];
    return `<span class="t2 noadd">Can't be added: S&amp;P's statutory data has more than one NAIC company code for this company${cs.length?` (${esc(cs.join(", "))})`:""}, so the app didn't choose. Type the right one in the box above.</span>`; }

/* Adds one code to the end of the list: the first code is the subject, the rest are peers. */
function statAddCode(code, name){
  const st=S.st, codes=statCodes(); code=String(code??"").trim();
  if(!naicOk(code)) return "bad";
  if(codes.includes(code)) return "dup";
  if(codes.length>=MAX_CODES) return "full";
  st.codes=codes.concat(code).join(", "); st.formErr="";
  if(!blank(name)) statFind().names[st.kind][code]=String(name);
  return "added";
}
const STAT_FULL = () => `The list is full: one subject and ${MAX_CODES-1} peers. Remove a code to add another.`;
function statAdd(code, name){
  const r=statAddCode(code, name);
  if(r==="dup") toast("That code is already in the list.");
  else if(r==="full") toast(STAT_FULL());
  else if(r==="bad") toast("NAIC codes are numbers of up to 6 digits.");
  render();
}
/* Company matches with a NAIC company code, once each. */
const statAddable = matches => matches.filter((m,i)=>naicOk(m.naicCompanyCode) && matches.findIndex(x=>String(x.naicCompanyCode).trim()===String(m.naicCompanyCode).trim())===i);
function statAddAll(){
  const nf=statFind(); let added=0, left=0;
  for(const m of statAddable(nf.matches||[])){ const r=statAddCode(m.naicCompanyCode, m.companyName); if(r==="added") added++; else if(r==="full") left++; }
  render();
  toast(left && !added ? STAT_FULL() : left ? `Added ${added}. A comparison takes at most ${MAX_CODES} codes, so ${left} ${left===1?"was":"were"} left out.` : added ? `Added ${plural(added,"company","companies")}.` : "Those companies are already in the list.");
}
/* The distinct groups among the matches, with how many matching companies each has. */
function statGroups(matches){
  const out=[];
  for(const m of matches){
    const code=blank(m.naicGroupCode)?"":String(m.naicGroupCode).trim(), name=blank(m.naicGroupName)?"":String(m.naicGroupName);
    if(!code && !name) continue;
    const key=code||"name:"+name.toLowerCase(); let g=out.find(x=>x.key===key);
    if(!g){ g={key, code, name, n:0}; out.push(g); }
    if(!g.name && name) g.name=name;
    g.n++;
  }

  let bytes; try{ bytes=await file.arrayBuffer(); }catch{ return "Couldn't read that file. Choose it again."; }
  try{ await loadProfileLibs(); }catch{ return "Couldn't load the template check. Check your connection and try again."; }
  let r; try{ r=await window.SNLDeck.inspect(bytes); }catch{ r=null; }

/* The scripts that build the slides, loaded once, in order; a failed load can be tried again. */
function loadProfileLibs(){
  if(window.JSZip && window.SNLDeck && window.SNLProfile) return Promise.resolve();
  return loadProfileLibs.p || (loadProfileLibs.p=(async()=>{
    if(!window.JSZip) await loadScript(JSZIP_SRC);
    if(!window.SNLDeck) await loadScript(DECK_SRC);
    if(!window.SNLProfile) await loadScript(SLIDES_SRC);
    if(!window.JSZip || !window.SNLDeck || !window.SNLProfile) throw new Error("The slide builder didn't load");
  })().finally(()=>{ loadProfileLibs.p=null; }));
}

/* ----- the template in storage ----- */
function tplErrKind(e){
  const m=`${e&&e.statusCode||""} ${e&&e.status||""} ${e&&e.error||""} ${e&&e.message||""}`;
  return /bucket not found/i.test(m) ? "nobucket" : /row-level security|unauthori[sz]ed|forbidden|permission|denied|\b403\b|policy/i.test(m) ? "refused"
    : /not found|\b404\b/i.test(m) ? "nofile" : /fetch|network|load failed|timed? ?out/i.test(m) ? "network" : "other";
}
function tplErrText(kind, e, upload){
  const what=upload?"upload":"get";
  if(kind==="nobucket") return isCorpDev() ? "The place the template is kept isn't set up yet. Run migration 0004_profile_template.sql in Supabase (see the README), then try again." : "The place the template is kept isn't set up yet. Ask Corp Dev to finish the set-up.";
  if(kind==="refused") return upload ? "Only Corp Dev logins can upload the template. If this is a Corp Dev login, check that migration 0004_profile_template.sql has been run (see the README)." : "This login isn't allowed to read the template. Ask Corp Dev.";
  if(kind==="network") return `Couldn't reach storage to ${what} the template. Check your connection and try again.`;
  if(kind==="nofile") return isCorpDev() ? "There is no template yet. Upload your PowerPoint template first." : "There is no template yet. Ask Corp Dev to upload the template.";
  return `Couldn't ${what} the template: ${(e&&e.message)||"unknown error"}. Try again.`;
}
/* Which templates exist for this login: the standard one (a listing of the bucket), whether templates of your own are
   switched on (migration 0008 lets logins see the bucket's settings; before it they can't), and this login's own (a
   listing of its own folder, which only it can read). The three are asked at once. Returns a promise. */
function checkTemplate(){
  const pf=S.pf, tp=pf.tpl; if(tp.loading && tp.checking) return tp.checking;
  tp.loading=true; tp.err=""; tp.errKind=""; render();
  const ask=f=>Promise.resolve().then(f).then(r=>r||{}, e=>({error:e}));
  const st=S.sb.storage, uid=tplUid();
  return tp.checking=(async()=>{
    const [b, root, mine]=await Promise.all([ask(()=>typeof st.getBucket==="function" ? st.getBucket(TPL_BUCKET) : {error:{message:"Bucket not found"}}),
      ask(()=>st.from(TPL_BUCKET).list("", {limit:100, search:TPL_PATH})), uid ? ask(()=>st.from(TPL_BUCKET).list(uid, {limit:100, search:TPL_PATH})) : {data:[]}]);
    if(!S.session || S.pf!==pf) return;
    tp.loading=false; tp.checked=true; tp.checking=null;
    const {data, error}=root, find=d=>{ const o=(Array.isArray(d)?d:[]).find(x=>x && x.name===TPL_PATH), m=o&&o.metadata||{}; return o ? {at:o.updated_at||o.created_at||m.lastModified||null, size:isNum(m.size)?+m.size:null} : null; };
    if(error){ tp.errKind=tplErrKind(error); if(tp.errKind==="nofile"||tp.errKind==="nobucket") tp.info=null; if(tp.errKind!=="nofile") tp.err=tplErrText(tp.errKind, error, false); }
    else tp.info=find(data);
    tp.ownOn = b.error ? (tplErrKind(b.error)==="network" ? null : false) : !!b.data;
    tp.own = tp.ownOn && !mine.error ? find(mine.data) : null;
    tplDropBytes(tp);   // a change of template drops the bytes kept
    render();
    if((!tp.err || tp.errKind==="nobucket") && tplLevel(tp)==="builtin" && !tp.bytes) builtinBytes(pf).catch(()=>{});   // early, so a failure shows in the block
  })();
}
/* The bytes of the template the next deck is built on: from memory when they are the same template as last time.
   Records which template it was (tp.used) for the "ready" message. Throws an Error with a message for the page. */
async function templateBytes(pf){
  const tp=pf.tpl;
  if(tp.once){ tp.used={level:"once", name:tp.once.name, ref:tp.once}; return tp.once.bytes; }
  if(!tp.checked || tp.loading || (tp.err && tp.errKind!=="nobucket")){
    await checkTemplate();
    if(!S.session || S.pf!==pf) throw new Error("Your session has ended. Sign in again.");
    if(tp.err && tp.errKind!=="nobucket") throw new Error(tp.err);
    if(tp.once) return templateBytes(pf);
  }
  const lv=tplLevel(tp), key=tplKeyOf(tp);
  if(tp.bytes && tp.bytesKey===key){ tp.used={level:lv}; return tp.bytes; }
  let buf;
  if(lv==="builtin") buf=await builtinBytes(pf);
  else {
    let data=null, error=null;
    try{ ({data, error}=await S.sb.storage.from(TPL_BUCKET).download(lv==="own"?tplOwnPath():TPL_PATH)); }catch(e){ error=e; }
    if(error || !data){ const k=error?tplErrKind(error):"other";
      if(k==="nofile" && S.pf===pf){
        if(lv==="own") tp.own=null; else tp.info=null;
        tplDropBytes(tp);
        throw new Error(`${lv==="own"?"Your own template":"The standard template"} has been removed since this page checked. Choose Try again to build on ${tplNext(tp)}.`); }
      throw new Error(tplErrText(k, error, false)); }
    try{ buf=await data.arrayBuffer(); }catch{ throw new Error(tplErrText("network", null, false)); }
  }
  if(S.pf===pf && tplKeyOf(tp)===key){ tp.bytes=buf; tp.bytesKey=key; }
  tp.used={level:lv};
  return buf;
}
async function uploadTemplate(file){
  const pf=S.pf, tp=pf.tpl; if(!file || tp.uploading || !isCorpDev()) return;
  const stop=msg=>{ if(S.pf!==pf) return; tp.uploading=""; tp.upErr=msg; render(); };
  tp.upErr=""; tp.upNote=""; tp.askRemove=false;
  if(!/\.pptx$/i.test(String(file.name||""))){ stop("Choose a PowerPoint file whose name ends in .pptx."); return; }
  if(+file.size>TPL_MAX){ stop(`That file is ${(+file.size/1048576).toFixed(1)} MB. The standard template can be at most 50 MB.`); return; }
  tp.uploading="checking"; render();
  const c=await tplCheckFile(file, TPL_MAX, "The standard template");
  if(!S.session || S.pf!==pf) return;
  if(typeof c==="string"){ stop(c); return; }
  const {bytes, r}=c;
  tp.uploading="uploading"; render();
  const replaced=!!tp.info;
  let error=null;
  try{ ({error}=await S.sb.storage.from(TPL_BUCKET).upload(TPL_PATH, file, {upsert:true, contentType:PPTX_TYPE, cacheControl:"60"})); }catch(e){ error=e; }
  if(!S.session || S.pf!==pf) return;
  if(error){ stop(tplErrText(tplErrKind(error), error, true)); return; }
  tp.uploading=""; tp.info={at:new Date().toISOString(), size:+file.size||null}; tp.checked=true; tp.err=""; tp.errKind=""; tplDropBytes(tp);
  if(tplLevel(tp)==="std"){ tp.bytes=bytes; tp.bytesKey=tplKeyOf(tp); }
  tp.upNote=`Standard template ${replaced?"replaced":"uploaded"}: ${tplFound(r)}. Everyone without a template of their own builds on it from now on.${tp.own?" Your own decks still use your own template.":""}`;
  render();
}
document.addEventListener("change", e=>{

/* ----- the figures, Claude's draft, and the file ----- */
function pfReset(pf){ pf.res=null; pf.err=null; pf.plan=null; pf.libsErr=""; pf.drafted=null; pf.draftErr=null; pf.built=null; pf.buildErr=""; pf.part=null; }
/* The figures, asked for again by themselves while some are still to come (statCarry): carryOn asks for the rest of
   the figures of the profile on screen. */
async function pfFacts(carryOn){
  const pf=S.pf; if(pf.busy) return;
  let code=pf.code.trim(), kind=pf.kind;
  const keep=carryOn && pf.asked && pf.res ? pf.res : null;
  if(carryOn){ if(!keep) return; ({kind, code}=pf.asked); }
  else if(!naicOk(code)){ pf.formErr = code ? "NAIC codes are numbers of up to 6 digits, like 90001." : `Choose a ${kind}: find it by name, or type its NAIC ${kind} code.`; render(); return; }
  const ctl=bsControl();
  pf.formErr=""; pfReset(pf); pf.busy="facts"; pf.ctl=ctl; pf.figs=keep&&keep.stalled?keep.stalled.figs:null; pbStart("pf-facts"); if(!carryOn) pf.asked={kind, code, name:pf.name}; render();
  // each call that leaves figures to come also shows what has arrived so far (pfSoFarHTML), section by section
  const r=await statCarry(()=>callFn("snl-profile",{action:"facts", kind, code}), pfFigs, {ctl, onPart:(f,data)=>{ if(S.pf===pf && pf.ctl===ctl){ pf.figs=f; if(data && data.facts && typeof data.facts==="object") pf.part=data.facts; render(); } }});
  if(!S.session || S.pf!==pf || pf.ctl!==ctl) return;
  pf.busy=""; pf.ctl=null; pf.figs=null; pf.part=null;
  if(r.err==="stopped"){ if(keep){ pfTake(pf, keep); pf.res.stalled={...keep.stalled, why:"stopped"}; } else toast("Stopped. No figures had come back yet."); render(); return; }
  if(!r.data && keep && r.err!=="signin"){ pfTake(pf, keep); pf.res.stalled={...keep.stalled, why:"failed", err:r}; render(); return; }   // what had arrived stays
  if(r.data && r.data.facts && typeof r.data.facts==="object" && r.data.text){ pfTake(pf, r.data); if(r.stalled) pf.res.stalled=r.stalled; loadStatus(); }
  else if(r.err!=="signin"){ pf.err = r.data ? {err:"bad_answer", msg:"The profile function sent back something the page can't read. Try again."} : r; if(r.err==="not_configured"||r.err==="not_mapped"){ pf.status=null; loadProfileStatus(); } }
  render();
}
/* How far a profile's figures got: the function says figures {done, of} and pending only while some are still to come. */
function pfFigs(d){
  const p=d&&isNum(d.pending)?+d.pending:0, g=d&&d.figures&&typeof d.figures==="object"?d.figures:{};
  const of=isNum(g.of)?+g.of:p, done=isNum(g.done)?+g.done:Math.max(0, of-p);
  return {done, of, pending:p};
}
function stopPf(){ const pf=S.pf; if(pf.busy==="facts" && pf.ctl) pf.ctl.stop(); }
function pfTake(pf, data){ pf.res={facts:data.facts, text:data.text}; pf.plan=null; pf.libsErr=""; if(pfHasData(data.facts)) pfPlan(pf); }
async function pfPlan(pf){
  try{ await loadProfileLibs(); }catch{ if(S.pf===pf){ pf.libsErr=PF_LIBS_ERR; render(); } return; }
  if(S.pf!==pf || !pf.res) return;
  let plan=null; try{ plan=window.SNLProfile.plan(pf.res.facts); }catch{}
  if(!Array.isArray(plan)){ pf.libsErr="Couldn't work out which slides these figures fill. Try again."; render(); return; }
  pf.plan=plan.filter(s=>s&&typeof s==="object"); pf.libsErr=""; render();
}
async function pfSample(){
  const pf=S.pf; if(pf.busy || pf.fp.busy) return;
  pf.mode="full";   // the full profile's sample shows in the full profile
  pfReset(pf); pf.busy="sample"; pbStart("pf-sample"); pf.asked=null; render();
  const r=await callFn("snl-profile",{action:"sample"});
  if(!S.session || S.pf!==pf) return;
  pf.busy="";
  if(r.data && r.data.facts && typeof r.data.facts==="object" && r.data.text){ pfTake(pf, r.data); if(pfHasTemplate()){ await pfMake(pf); return; } }
  else if(r.err!=="signin") pf.err = r.data ? {err:"bad_answer", msg:"The profile function sent back something the page can't read. Try again."} : r;
  render();
}
/* Build: Claude drafts the text first when that is chosen (once per set of figures), then the file is made. plain:
   build with the plain text, after a draft couldn't be had. */
async function pfBuild(plain){
  const pf=S.pf; if(pf.busy || !pf.res || !pfHasData(pf.res.facts)) return;
  if(!pfHasTemplate()){ pf.buildErr=tplErrText("nofile"); render(); return; }
  if(plain){ pf.draft=false; pf.draftErr=null; }
  if(!plain && pfDraftWanted() && !pf.drafted){
    pf.busy="draft"; pbStart("pf-draft"); pf.draftErr=null; pf.built=null; pf.buildErr=""; render();
    const e=pf.res.facts.entity||{};
    const r=await callFn("snl-profile",{action:"draft", kind:e.kind==="group"?"group":"company", code:String(e.code??"")});
    if(!S.session || S.pf!==pf) return;
    pfChatUse();   // the day's count and cost, now with this draft
    if(r.data && r.data.facts && typeof r.data.facts==="object" && r.data.text){
      pf.drafted={facts:r.data.facts, text:r.data.text, usage:r.data.usage||null};
      markSeen(r.data.jobId);   // the draft is saved as a past answer; it is already in front of the reader, so no "Answer ready"
    } else if(r.err!=="signin"){ pf.busy=""; pf.draftErr = r.data ? {err:"bad_answer", msg:"Claude's draft came back in a form the page can't read."} : r; render(); return; }
    else return;
  }
  await pfMake(pf);
}
function pfFileName(spec){
  const n=String(spec&&spec.fileName||"").replace(/[\\/:*?"<>|\u0000-\u001f]+/g,"-").trim();
  return n ? (/\.pptx$/i.test(n) ? n : n+".pptx") : `profile-${TODAY()}.pptx`;
}
async function pfMake(pf){
  pf.busy="build"; pbStart("pf-build"); pf.buildErr=""; pf.built=null; render();
  const use = pf.drafted && pfDraftWanted() ? pf.drafted : pf.res;
  const fail=msg=>{ if(!S.session || S.pf!==pf) return; pf.busy=""; pf.buildErr=msg; render(); };
  let bytes; try{ bytes=await templateBytes(pf); }catch(e){ fail(e.message); return; }
  if(!S.session || S.pf!==pf) return;
  try{ await loadProfileLibs(); }catch{ fail(PF_LIBS_ERR); return; }
  if(!S.session || S.pf!==pf) return;
  let spec; try{ spec=window.SNLProfile.spec(use.facts, use.text, {skip:pfSkip().slice()}); }catch(e){ fail("Couldn't lay out the slides from these figures. "+((e&&e.message)||"")); return; }
  let out; try{ out=await window.SNLDeck.build(bytes.slice(0), spec); }catch(e){ fail("Couldn't build the PowerPoint file. "+((e&&e.message)||"Try again.")); return; }
  if(!S.session || S.pf!==pf) return;
  pf.busy=""; pf.built={blob:new Blob([out],{type:PPTX_TYPE}), name:pfFileName(spec), by:use.text&&use.text.by==="claude"?"claude":"plain"};
  render(); saveBlob(pf.built.blob, pf.built.name);
}
function pfDownloadAgain(){ const b=S.pf.built; if(b) saveBlob(b.blob, b.name); }

/* What Claude is told when asked from this view: the figures behind the profile, as the Statutory view describes its
   own (the questions function knows that shape). Nothing for the sample, whose figures are made up. */
function pfScreen(){
  if(pfMode()==="filings") return fpScreen();
  const pf=S.pf, f=pf.drafted ? pf.drafted.facts : pf.res&&pf.res.facts;
  if(!f || f.sample || !pfHasData(f) || !pfLive()) return null;
  const e=f.entity||{}, ys=f.years.filter(isNum).map(Number);
  if(!naicOk(e.code) || !ys.length) return null;
  return {view:"statutory", query:{kind:e.kind==="group"?"group":"company", codes:[String(e.code)], fromYear:Math.min(...ys), toYear:Math.max(...ys)}, companies:blank(e.name)?[]:[String(e.name)]};
}

/* ----- drawing the view ----- */
function pfLatest(f, key){
  const ys=f.years||[], a=f.series&&f.series[key]; if(!Array.isArray(a)) return null;
  for(let i=Math.min(a.length, ys.length)-1; i>=0; i--) if(isNum(a[i])) return {year:ys[i], v:+a[i]};
  return null;
}
function pfHeadlineHTML(f){
  const tile=(label, key, fmt)=>{ const l=pfLatest(f, key);
    return `<div class="pftile" data-k="${key}"><span class="t2">${label}${l?` ${esc(l.year)}`:""}</span><b>${l?fmt(l.v):"n/d"}</b></div>`; };
  return `<div class="pftiles" id="pfHead">${tile("Direct premiums written","dpw",usdM)}${tile("Combined ratio","combined_ratio",pct)}${tile("Policyholder surplus","surplus",usdM)}</div>`;
}
function pfPlanHTML(pf){
  if(pf.libsErr) return `<div class="banner" id="pfLibsErr" role="alert"><span>${esc(pf.libsErr)}</span><button type="button" class="btn sm" data-act="pf-libs-retry">Try again</button></div>`;
  if(!pf.plan) return `<p class="t2" role="status">Working out which slides these figures fill…</p>`;
  const n=pf.plan.filter(s=>s.included).length, skip=pfSkip();

function fpChooseCompany(i){

function fpChooseGroup(i){

// the period as the function works it out: the last N x 365 days up to today, exactly N windows of dates for S&P
function fpRange(years){ const to=TODAY(); return {from:daysBefore(to, FP_WINDOW_DAYS*years-1), to}; }

/* Why this profile can't be built, with what to choose instead; "" when it can. The function checks the same before

function fpTooBig(pick, years){
  if(!pick) return "";
  if(!pick.ids.length) return pick.kind==="group" ? "No company in this group has an S&P id in the company list, so the group's filings can't be searched." : "This company has no S&P id in the company list, so its filings can't be searched.";
  if(pick.over || pick.ids.length>MAX_COMPANIES) return `${pick.name} has more than ${MAX_COMPANIES} companies with S&P ids in the company list, and one filings profile covers at most ${MAX_COMPANIES}. Profile one of its companies instead.`;
  const need=fpPlanned(pick.ids, years);
  if(need<=FP_MAX_PLANNED) return "";
  const fit=FP_YEARS.filter(y=>fpPlanned(pick.ids, y)<=FP_MAX_PLANNED);
  return `A filings profile of ${pick.name} over ${fpYearsText(years)} needs at least ${need} S&P requests (one for each 10 companies and each year of dates), more than the ${FP_MAX_PLANNED} one filings profile may plan. ${fit.length?`Choose ${fpYearsText(Math.max(...fit))} instead.`:"Profile one of its companies instead."}`;
}
function fpBody(action, pick, years, scope){
  const b={action, kind:pick.kind, years};
  if(pick.kind==="group") b.group=pick.name; else b[pick.ids[0].kind]=String(pick.ids[0].id);
  // Narrow it down: only when something is chosen, so a profile nobody narrowed asks exactly what it always has
  if(scope && scope.states && scope.states.length) b.states=scope.states.slice();
  const ids=(scope&&scope.tois||[]).map(t=>Number(t.id)).filter(Number.isInteger); if(ids.length) b.typeOfInsuranceIds=ids;
  return {...b, ...nwIdsOf(scope)};   // filing types and statuses, only when chosen
}
// what a filings profile was narrowed to: the facts' own scope (the function's words), else not narrowed
function fpScopeOf(f){ const s=f&&f.scope; return s&&typeof s==="object"&&s.narrowed===true&&typeof s.words==="string"&&typeof s.short==="string" ? s : null; }

function fpReset(fp){ fp.res=null; fp.err=null; fp.plan=null; fp.libsErr=""; fp.drafted=null; fp.draftErr=null; fp.built=null; fp.buildErr=""; }

function fpTake(fp, data){ fp.res={facts:data.facts, text:data.text, search:data.search&&typeof data.search==="object"?data.search:null, spRequests:isNum(data.spRequests)?+data.spRequests:null}; fp.plan=null; fp.libsErr=""; fpPlan(fp);

async function fpBuild(plain){
  const pf=S.pf, fp=pf.fp; if(fp.busy || !fp.res) return;

  if(plain){ fp.draft=false; fp.draftErr=null; }
  if(!plain && fpDraftWanted() && !fp.drafted && fp.asked){
    fp.busy="draft"; pbStart("fp-draft"); fp.draftErr=null; fp.built=null; fp.buildErr=""; render();
    const r=await callFn("snl-profile", fpBody("filings_draft", fp.asked.pick, fp.asked.years, fp.asked.scope));

      fp.drafted={facts:r.data.facts, text:r.data.text, usage:r.data.usage||null};

    } else if(r.err!=="signin"){ fp.busy=""; fp.draftErr = r.data ? {err:"bad_answer", msg:"Claude's draft came back in a form the page can't read."} : r; render(); return; }

async function fpMake(fp){

  const fail=msg=>{ if(!S.session || S.pf.fp!==fp) return; fp.busy=""; fp.buildErr=msg; render(); };
  let bytes; try{ bytes=await templateBytes(pf); }catch(e){ fail(e.message); return; }
  if(!S.session || S.pf.fp!==fp) return;

  if(!S.session || S.pf.fp!==fp) return;
  let spec; try{ spec=window.SNLProfile.filingsSpec(use.facts, use.text, {usMap:US_MAP}); }catch(e){ fail("Couldn't lay out the slides from these filings. "+((e&&e.message)||"")); return; }
  let out; try{ out=await window.SNLDeck.build(bytes.slice(0), spec); }catch(e){ fail("Couldn't build the PowerPoint file. "+((e&&e.message)||"Try again.")); return; }

async function fpSumMake(){

    const x=mk.items[i];

    mk.i=i+1; mk.cur=x; x.state="running"; render();

    if(!S.session || S.pf.fp!==fp) return;   // the session ended: everything here was forgotten with it

      x.state="made"; mk.made++;

/* ---------- Narrow it down: states and types of insurance on Snapshot, Compare, Market and the filings profile ----------
   One small set of helpers for four views. Each view keeps its own choice in its own state object (S.snap.nw, S.cmp.nw,
   S.pf.fp.nw, S.mk.nw), made when first drawn and forgotten with the view's state on sign-out. Nothing chosen means
   every state and every type of insurance, as before. Before a search, the choice goes into the search the view
   already makes (states and typeOfInsuranceIds, as the Filings form sends them; the Market sends states and type
   names to the market index). After a search, where the view holds the rows, the same choice narrows what is shown
   at once when it is inside what was searched, and offers a new search when it is wider.
   The picker: a "Choose states" panel with the Filings view's map and a list (each row a toggle button, the list being
   the control for keyboards and screen readers), the US Census regions as shortcuts, and a "Choose types" panel with
   S&P's list and a filter box. The chosen ones show as chips that can be removed. */
function nwFresh(){ return {states:[], tois:[], ftypes:[], fstats:[], open:"", stQ:"", toiQ:"", ftQ:"", fsQ:""}; }

function nwOf(k){ const o=NW_OF[k]&&NW_OF[k](); if(!o) return null; if(!o.nw || typeof o.nw!=="object") o.nw=nwFresh(); for(const a of ["ftypes","fstats"]) if(!Array.isArray(o.nw[a])) o.nw[a]=[]; return o.nw; }
/* Filing type and status (added to Narrow it down): S&P's own lists (serffFilingType, filingStatus) by id, as the
   Filings form sends them (filingTypeIds, filingStatusIds); for the Market, the names its index holds. No status chosen
   means every status, as always: the search sends none and the filings function asks S&P for every status in its list. */
const NW_KINDS = {
  ft:{key:"ftypes", q:"ftQ", ref:"serffFilingType", label:"Filing type", all:"All filing types", none:"All filing types", choose:"Choose filing types", change:"Change filing types", list:"filing types", one:"filing type", many:"filing types"},
  fs:{key:"fstats", q:"fsQ", ref:"filingStatus", label:"Status", all:"All statuses", none:"All statuses", choose:"Choose statuses", change:"Change statuses", list:"statuses", one:"status", many:"statuses"}};
function nwKindOpts(k, w){

}

function nwKind(k, w){
  const nw=nwOf(k); if(!nw) return [];

const nwIdText = v => { if(v===null || v===undefined || typeof v==="object" || typeof v==="boolean") return null; const s=String(v).trim(); return !s ? null : /^[+-]?\d{1,15}(\.0+)?$/.test(s) ? String(Number(s)) : s.toUpperCase(); };
const nwSameId = (a, b) => { const x=nwIdText(a), y=nwIdText(b); return x!==null && x===y; };
// US Census regions, as shortcuts that add their states (DC with the South)
const NW_REGIONS = [["Northeast","CT ME MA NH RI VT NJ NY PA"],["Midwest","IL IN MI OH WI IA KS MN MO NE ND SD"],["South","DE DC FL GA MD NC SC VA WV AL KY MS TN AR LA OK TX"],["West","AZ CO ID MT NV NM UT WY AK CA HI OR WA"]];
const nwStateName = s => US_MAP[s] ? US_MAP[s][1] : s;
// the states a view can search: S&P's list (or the app's), or for the Market the states its index holds
function nwStateOpts(k){ return k==="mk" ? mkStates().map(s=>({id:String(s.state), name:nwStateName(String(s.state))})) : stateOptions(); }
// the types of insurance a view can choose: S&P's list by id, or for the Market the index's own names in the states chosen
function nwToiOpts(k){

  const mk=S.mk, sts=nwStates("mk").length ? nwStates("mk") : mkStates().map(s=>String(s.state)), seen=new Map();
  for(const s of sts) for(const n of (mk.types&&mk.types[s])||[]) if(!seen.has(n.toLowerCase())) seen.set(n.toLowerCase(), {id:n, name:n});
