/* ---------- Carrier sets: named lists of companies and groups the team keeps, saved once and used anywhere ----------
   Kept as the shared setting "carrier_sets" (snl_settings): every login reads it, Corp Dev logins edit it in the
   "Carrier sets" panel, opened from a button beside the company pickers. A set holds single companies and whole
   groups by name; a group is expanded to its member companies (the snl-filings "resolve" action) when the set is
   used, so a set stays right when the company list is reloaded. Shape: {sets:[{id, name, note, companies:
   [{companyName, companyId, institutionId}], groups:["group name"], updatedAt}]}. Every name and note is untrusted.
   For other views (Contract A), call these only if they exist:
     setPickHTML(target)   the HTML of a small "Use a saved set" control ("" when there are no sets or they haven't
                           loaded); its click is handled here.
     SET_TARGETS[target] = (companies, set) => ...   companies: [{kind:"companyId"|"institutionId", id:"123", name,
                           group}], each once, only those with an S&P id; group is the name of the set's group the
                           company came from, as written in the set, or null for one of the set's single companies.
                           set: {id, name, note, groups (the set's group names), total, withId, noId, leftOut (companies
                           dropped: no S&P id, or past a group's look-up limit), cut, missingGroups, failedGroups,
                           cutGroups, notes}. It may return a message to show under
                           the control (or a promise of one). This block registers "filings", "snapshot" and "watch". */
const SET_MAX = {sets:40, companies:100, groups:20, name:80, note:200};
const SET_LABELS = {watch:"Add a saved set"};   // the control's label for a target, when "Use a saved set" doesn't fit
const SET_WATCH_MAX = 500;                      // companies the watchlist keeps (cleanWatch)
function freshSets(){ return {loaded:false, loading:false, sets:[], problems:0, readErr:"", saving:false, saveErr:"", open:false, opener:"", edit:"", renaming:"", del:"",
  rn:{name:"", note:""}, nw:{name:"", note:"", from:""}, find:{q:"", asked:"", matches:null, groups:[], groupNote:"", note:"", busy:false, err:""}, groups:{}, pick:{}, said:{}, using:""}; }
S.sets=freshSets();
const setText = (v, max) => (typeof v==="string"||typeof v==="number"?String(v):"").replace(/[\x00-\x1f\x7f-\x9f\u200b-\u200f\u2028-\u202e\u2060-\u206f\ufeff]+/g," ").replace(/\s+/g," ").trim().slice(0,max);
const setIdNum = v => { const s=typeof v==="number"&&Number.isInteger(v)&&v>=0?String(v):typeof v==="string"?v.trim():""; return /^\d{1,12}$/.test(s)?String(Number(s)):null; };
const setCoKey = c => c.companyId!==null ? "c:"+c.companyId : c.institutionId!==null ? "i:"+c.institutionId : c.companyName ? "n:"+c.companyName.toLowerCase() : "";
const setTarget = t => /^[A-Za-z][A-Za-z0-9_-]{0,39}$/.test(String(t??"")) ? String(t) : "";
const setQ = s => `"${s}"`;
function setHash(s){ let h=7; for(const ch of String(s)) h=(h*31+ch.codePointAt(0))>>>0; return "s-"+h.toString(36); }
/* The saved setting, keeping only what can be used (the functions read it the same way: cleanCarrierSets in
   supabase/functions/_shared/filings.ts). problems counts what was left out. */
function cleanSets(raw){
  const d=raw&&typeof raw==="object"&&!Array.isArray(raw)?raw:{}, sets=[], names=new Set(), ids=new Set();
  let problems=raw===null||raw===undefined||Array.isArray(d.sets)?0:1;
  for(const s of Array.isArray(d.sets)?d.sets:[]){
    const o=s&&typeof s==="object"&&!Array.isArray(s)?s:null, name=o?setText(o.name,SET_MAX.name):"";
    if(!o || !name || names.has(name.toLowerCase()) || sets.length>=SET_MAX.sets){ problems++; continue; }
    names.add(name.toLowerCase());
    const companies=[], keys=new Set();
    for(const c of Array.isArray(o.companies)?o.companies:[]){
      const x=c&&typeof c==="object"&&!Array.isArray(c)?c:{}, co={companyName:setText(x.companyName,120), companyId:setIdNum(x.companyId), institutionId:setIdNum(x.institutionId)}, k=setCoKey(co);
      if(!k || companies.length>=SET_MAX.companies){ problems++; continue; }
      if(!keys.has(k)){ keys.add(k); companies.push(co); }
    }
    const groups=[];
    for(const g of Array.isArray(o.groups)?o.groups:[]){ const n=setText(g,120); if(!n || groups.length>=SET_MAX.groups){ problems++; continue; } if(!groups.some(x=>x.toLowerCase()===n.toLowerCase())) groups.push(n); }
    let id=typeof o.id==="string"&&/^[A-Za-z0-9_-]{1,40}$/.test(o.id)?o.id:setHash(name); if(ids.has(id)) id=setHash(name+"|"+sets.length); ids.add(id);
    sets.push({id, name, note:setText(o.note,SET_MAX.note), companies, groups, updatedAt:typeof o.updatedAt==="string"&&!isNaN(Date.parse(o.updatedAt))?o.updatedAt:null});
  }
  return {sets, problems};
}
async function readSetsDoc(){
  try{ const {data, error}=await S.sb.from("snl_settings").select("doc").eq("id","carrier_sets").maybeSingle(); if(error) return {error}; return cleanSets(data&&data.doc); }
  catch(e){ return {error:e}; }
}
async function loadSets(){
  const ss=S.sets; if(ss.loading) return;
  ss.loading=true;
  const doc=await readSetsDoc();
  if(!S.session || S.sets!==ss) return;
  ss.loading=false; ss.loaded=true;
  if(doc.error) ss.readErr="Couldn't read the carrier sets: "+((doc.error&&doc.error.message)||"unknown error")+".";
  else { ss.sets=doc.sets; ss.problems=doc.problems; ss.readErr=""; }
  render(); setsCount();
}
/* Every change starts from what is saved now, so two people editing at once don't undo each other's changes (as the
   watchlist does). change gets the saved sets and returns them changed, null for no change, or a message to show. */
async function changeSets(change, done){
  const ss=S.sets; if(ss.saving) return false;
  if(!isCorpDev()){ ss.saveErr="Only Corp Dev logins can change carrier sets. Ask Corp Dev."; render(); return false; }
  ss.saving=true; ss.saveErr=""; render();
  const cur=await readSetsDoc();
  if(!S.session || S.sets!==ss) return false;
  if(cur.error){ ss.saving=false; ss.saveErr="Couldn't read the carrier sets: "+((cur.error&&cur.error.message)||"unknown error")+". Nothing was changed."; render(); return false; }
  ss.sets=cur.sets; ss.problems=cur.problems; ss.loaded=true; ss.readErr="";
  const next=change(JSON.parse(JSON.stringify(cur.sets)));
  if(!next || typeof next==="string"){ ss.saving=false; ss.saveErr=typeof next==="string"?next:""; render(); return false; }
  let error=null;
  try{ ({error}=await S.sb.from("snl_settings").upsert({id:"carrier_sets", doc:{sets:next}})); }catch(e){ error=e; }
  if(!S.session || S.sets!==ss) return false;
  ss.saving=false;
  if(error){ const t=`${error.code||""} ${error.message||""}`;
    ss.saveErr=/42501|row-level security|permission/i.test(t) ? "Only Corp Dev logins can change carrier sets. Ask Corp Dev."
      : /23514|check constraint/i.test(t) ? "The carrier sets are too big to save. Remove some companies, or delete a set the team no longer uses. Nothing was changed."
      : "Couldn't save the carrier sets: "+(error.message||"unknown error")+". Nothing was changed.";
    render(); return false; }
  ss.sets=cleanSets({sets:next}).sets; ss.problems=0; render();
  if(done) toast(typeof done==="function"?done():done);
  setsCount();
  return true;
}
const SET_GONE = "That set has been deleted, here or by someone else. Nothing was changed.";
const setNow = () => new Date().toISOString();
function setNameProblem(list, name, exceptId){
  if(!name) return "Give the set a name.";
  if(list.some(s=>s.id!==exceptId && s.name.toLowerCase()===name.toLowerCase())) return `There is already a set named ${setQ(name)}. Choose another name.`;
  return "";
}
/** One change to one set, by id, from what is saved now. fn returns true when it changed the set, null for no change, or a message. */
function setsEditOne(id, fn, done){
  return changeSets(list=>{ const s=list.find(x=>x.id===id); if(!s) return SET_GONE; const r=fn(s, list); if(r!==true) return r; s.updatedAt=setNow(); return list; }, done);
}
function setsCreate(fromFilings){
  const ss=S.sets, name=setText(ss.nw.name, SET_MAX.name), note=setText(ss.nw.note, SET_MAX.note);
  if(!name){ ss.saveErr="Give the set a name."; render(); document.getElementById("sets_name")?.focus(); return; }
  const chips=fromFilings&&S.f ? S.f.chips.slice(0, SET_MAX.companies) : [];
  if(fromFilings && !chips.length){ ss.saveErr="Choose companies in the Filings form first, then save them as a set."; render(); return; }
  let id="s-"+Math.random().toString(36).slice(2,8);
  changeSets(list=>{
    if(list.length>=SET_MAX.sets) return `There are ${SET_MAX.sets} sets, the most the app keeps. Delete one the team no longer uses to make room.`;
    const bad=setNameProblem(list, name, ""); if(bad) return bad;
    while(list.some(s=>s.id===id)) id+="x";
    list.push({id, name, note, companies:chips.map(c=>({companyName:c.name||"", companyId:c.kind==="companyId"?c.id:null, institutionId:c.kind==="institutionId"?c.id:null})), groups:[], updatedAt:setNow()});
    return list;
  }, fromFilings ? `Saved ${plural(chips.length,"company","companies")} as ${setQ(name)}.` : `Created ${setQ(name)}. Add companies and groups to it below.`)
  .then(done=>{ if(done){ ss.nw={name:"", note:"", from:""}; if(!fromFilings){ ss.edit=id; setFindReset(); } render(); } });
}
function setsRename(id){
  const ss=S.sets, name=setText(ss.rn.name, SET_MAX.name), note=setText(ss.rn.note, SET_MAX.note);
  if(!name){ ss.saveErr="Give the set a name."; render(); return; }
  setsEditOne(id, (s, list)=>{ const bad=setNameProblem(list, name, id); if(bad) return bad; if(s.name===name && s.note===note) return null; s.name=name; s.note=note; return true; }, "Saved the name and note.")
  .then(done=>{ if(done){ ss.renaming=""; render(); } });
}
function setsDelete(id){
  const ss=S.sets, s=ss.sets.find(x=>x.id===id); const name=s?s.name:"the set";
  changeSets(list=>{ const n=list.filter(x=>x.id!==id); return n.length===list.length ? SET_GONE : n; }, `Deleted ${setQ(name)}.`)
  .then(done=>{ if(done){ ss.del=""; if(ss.edit===id) ss.edit=""; render(); } });
}
function setsAddCompany(i){
  const ss=S.sets, m=(ss.find.matches||[])[i]; if(!m || !ss.edit) return;
  const co={companyName:setText(m.companyName,120), companyId:setIdNum(m.companyId), institutionId:setIdNum(m.institutionId)};
  if(co.companyId===null && co.institutionId===null) return;
  const label=co.companyName||"That company";
  setsEditOne(ss.edit, s=>{
    if(s.companies.some(c=>(co.companyId!==null&&c.companyId===co.companyId) || (co.institutionId!==null&&c.institutionId===co.institutionId))) return `${label} is already in the set.`;
    if(s.companies.length>=SET_MAX.companies) return `A set holds at most ${SET_MAX.companies} single companies. Add a whole group instead, or remove a company.`;
    s.companies.push(co); return true;
  }, `Added ${label} to the set.`);
}
function setsAddGroup(i){
  const ss=S.sets, g=(ss.find.groups||[])[i]; if(!g || !ss.edit) return;
  const name=setText(!blank(g.name)?g.name:g.code, 120); if(!name) return;
  setsEditOne(ss.edit, s=>{
    if(s.groups.some(x=>x.toLowerCase()===name.toLowerCase())) return `${name} is already in the set.`;
    if(s.groups.length>=SET_MAX.groups) return `A set holds at most ${SET_MAX.groups} groups. Remove one to add another.`;
    s.groups.push(name); return true;
  }, `Added the group ${name} to the set. Its companies are counted when the set is used.`);
}
function setsRemoveCompany(id, k){ setsEditOne(id, s=>{ const n=s.companies.filter(c=>setCoKey(c)!==k); if(n.length===s.companies.length) return null; s.companies=n; return true; }, "Removed from the set."); }
function setsRemoveGroup(id, g){ setsEditOne(id, s=>{ const n=s.groups.filter(x=>x!==g); if(n.length===s.groups.length) return null; s.groups=n; return true; }, "Removed the group from the set."); }

/* ----- finding companies and groups to add, with the same look-up as the Filings company finder ----- */
function setFindReset(){ S.sets.find={q:"", asked:"", matches:null, groups:[], groupNote:"", note:"", busy:false, err:""}; }
async function setsFind(){
  const ss=S.sets, fd=ss.find, q=fd.q.trim();
  if(!q){ fd.matches=null; fd.groups=[]; fd.err="Type a company name, a group name, a NAIC code or an S&P id."; render(); return; }
  fd.busy=true; fd.err=""; fd.asked=q; fd.matches=null; fd.groups=[]; render();
  const r=await callFn("snl-filings",{action:"resolve", q});
  if(!S.session || S.sets!==ss || ss.find!==fd || fd.asked!==q) return;
  fd.busy=false;
  if(r.data){ fd.matches=Array.isArray(r.data.matches)?r.data.matches.filter(m=>m&&typeof m==="object"):[]; fd.groups=Array.isArray(r.data.groups)?r.data.groups.filter(g=>g&&typeof g==="object"&&Array.isArray(g.members)):[]; fd.groupNote=typeof r.data.groupNote==="string"?r.data.groupNote:""; fd.note=typeof r.data.note==="string"?r.data.note:""; }
  else if(r.err!=="signin"){ fd.matches=[]; fd.err="Couldn't look that up. "+errText(r); }
  render();
}

/* ----- a set's groups, expanded to their member companies (no S&P requests: the company list only) ----- */
// The look-up keeps only plain characters of what it is given, so "Calloway Group (SNL P&C Group)" is looked up by its
// first plain part (as the Snapshot does) and the group is then held to its full name.
function setGroupQuery(name){
  const s=String(name).trim(); if(/^\d{1,6}$/.test(s)) return s;
  return s.split(/[^\p{L}\p{N} .&'-]/u).map(p=>p.replace(/\s+/g," ").trim()).find(p=>p.replace(/[^\p{L}\p{N}]/gu,"").length>=3)||"";
}
function setMemberOf(m){
  if(!m || typeof m!=="object") return null;
  const name=setText(m.companyName,120), co=setIdNum(m.companyId), inst=setIdNum(m.institutionId);
  return co!==null ? {kind:"companyId", id:co, name} : inst!==null ? {kind:"institutionId", id:inst, name} : null;
}
function setGroupFetch(name){
  const ss=S.sets, key=name.toLowerCase(), have=ss.groups[key];
  if(have && have.status==="loading") return have.p;
  if(have && have.status!=="error") return Promise.resolve();
  const p=(async()=>{
    const q=setGroupQuery(name);
    if(!q){ ss.groups[key]={status:"missing"}; return; }
    const r=await callFn("snl-filings",{action:"resolve", q});
    if(S.sets!==ss) return;
    if(!r.data){ ss.groups[key]={status:"error", msg:errText(r)}; return; }
    const code=/^\d{1,6}$/.test(name.trim());
    const g=(Array.isArray(r.data.groups)?r.data.groups:[]).find(x=>x&&typeof x==="object"&&Array.isArray(x.members)&&(code ? String(x.code??"").trim()===name.trim() : setText(x.name,120).toLowerCase()===key));
    if(!g){ ss.groups[key] = !blank(r.data.groupNote) ? {status:"error", msg:"other groups in the company list have names like it, so it couldn't be picked out"} : {status:"missing"}; return; }
    const seen=new Set(), members=[];
    for(const m of g.members){ const x=setMemberOf(m), k=x&&x.kind+":"+x.id; if(x && !seen.has(k)){ seen.add(k); members.push(x); } }
    const n=v=>isNum(v)?Math.max(0, Math.round(+v)):0, searchable=Math.max(n(g.searchable), members.length);
    ss.groups[key]={status:"ok", members, noId:Math.max(0, n(g.companies)-searchable), cut:Math.max(0, searchable-members.length)};
  })();
  ss.groups[key]={status:"loading", p};
  return p;
}
async function setGroupsReady(names){ for(const n of names) await setGroupFetch(n); }
/* Counts what every set expands to today, for the panel. Runs when the panel opens and after each change. */
async function setsCount(){
  const ss=S.sets; if(!ss.open || !ss.loaded) return;
  const names=[...new Map(ss.sets.flatMap(s=>s.groups).map(g=>[g.toLowerCase(), g])).values()].filter(g=>!ss.groups[g.toLowerCase()] || ss.groups[g.toLowerCase()].status==="error");
  for(const g of names){ if(S.sets!==ss || !ss.open) return; await setGroupFetch(g); if(S.sets===ss && ss.open) renderSets(); }
}
/** What a set gives today: its companies with S&P ids (single companies and group members, each once), and what
    can't be used. pending: a group is still being looked up. */
function expandSet(s){
  const ss=S.sets, seen=new Set(), companies=[], missing=[], failed=[], cutGroups=[];
  let noId=0, cut=0, pending=false;
  const add=c=>{ const k=c.kind+":"+c.id; if(!seen.has(k)){ seen.add(k); companies.push(c); } };
  for(const c of s.companies){ if(c.companyId!==null) add({kind:"companyId", id:c.companyId, name:c.companyName, group:null}); else if(c.institutionId!==null) add({kind:"institutionId", id:c.institutionId, name:c.companyName, group:null}); else noId++; }
  for(const g of s.groups){
    const e=ss.groups[g.toLowerCase()];
    if(!e || e.status==="loading"){ pending=true; continue; }
    if(e.status==="missing"){ missing.push(g); continue; }
    if(e.status==="error"){ failed.push(g); continue; }
    e.members.forEach(m=>add({...m, group:g})); noId+=e.noId; if(e.cut){ cut+=e.cut; cutGroups.push(g); }
  }
  return {companies, noId, cut, missing, failed, cutGroups, pending, total:companies.length+noId+cut};
}
function setInfo(s, x){
  const info={id:s.id, name:s.name, note:s.note, groups:s.groups.slice(), total:x.total, withId:x.companies.length, noId:x.noId, leftOut:x.noId+x.cut, cut:x.cut,
    missingGroups:x.missing.slice(), failedGroups:x.failed.slice(), cutGroups:x.cutGroups.slice()};
  info.notes=setLeftNotes(info);
  return info;
}
/* What a set couldn't give, in plain sentences: never left out silently. */
function setLeftNotes(set){
  const out=[], list=a=>andList(a.map(setQ), 3);
  if(set.noId) out.push(`${plural(set.noId,"company in the set has","companies in the set have")} no S&P id, so ${set.noId===1?"its":"their"} filings can't be searched.`);
  if(set.missingGroups.length) out.push(`${list(set.missingGroups)} no longer ${set.missingGroups.length===1?"matches":"match"} the company list, so ${set.missingGroups.length===1?"it was":"they were"} left out. Corp Dev can remove ${set.missingGroups.length===1?"it":"them"} from the set.`);
  if(set.failedGroups.length) out.push(`${list(set.failedGroups)} couldn't be looked up just now and ${set.failedGroups.length===1?"was":"were"} left out. Try again.`);
  if(set.cut) out.push(`${list(set.cutGroups)} ${set.cutGroups.length===1?"has":"have"} more companies than one look-up lists, so ${plural(set.cut,"company was","companies were")} left out.`);
  return out;
}
const setSay = (lead, set, extra) => [lead, extra||"", ...set.notes].filter(Boolean).join(" ");

/* ----- using a set: the control, and what it does ----- */
var SET_TARGETS = window.SET_TARGETS || SET_TARGETS || {};
function setPickHTML(target, label){
  const ss=S.sets, t=setTarget(target); if(!t || !ss || !ss.loaded || ss.readErr || !ss.sets.length) return "";
  const pick=ss.pick[t]&&ss.sets.some(s=>s.id===ss.pick[t]) ? ss.pick[t] : ss.sets[0].id, lab=label||SET_LABELS[t]||"Use a saved set";

   companies as a set" for Corp Dev. */
function setsBarHTML(target){

}
async function useSet(target, id){
  const ss=S.sets, t=setTarget(target); if(!t || ss.using) return;
  const s=ss.sets.find(x=>x.id===id) || ss.sets[0];
  if(!s){ ss.said[t]="There are no saved sets yet."; render(); return; }
  ss.pick[t]=s.id;
  const T=SET_TARGETS[t];
  if(typeof T!=="function"){ ss.said[t]="Saved sets can't be used here yet."; render(); return; }
  ss.using=t; ss.said[t]=""; render();
  await setGroupsReady(s.groups);
  if(!S.session || S.sets!==ss) return;
  const x=expandSet(s), info=setInfo(s, x);
  let msg="";
  try{ msg=await T(x.companies.map(c=>({...c})), info); }catch(e){ msg="Couldn't use the set here: "+((e&&e.message)||"unknown error")+"."; }
  if(S.sets!==ss) return;
  ss.using=""; ss.said[t]=typeof msg==="string"?msg:""; render();
}
// The Filings form: the set's companies join those chosen, up to the most one search takes.
SET_TARGETS.filings=(companies, set)=>{
  const f=S.f; let added=0, have=0, full=0;
  for(const c of companies){
    if(f.chips.some(x=>x.kind===c.kind && x.id===c.id)){ have++; continue; }
    if(f.chips.length>=MAX_COMPANIES){ full++; continue; }
    f.chips.push({kind:c.kind, id:c.id, name:c.name||""}); added++;
  }
  f.formErr="";
  const lead = added ? `Added ${plural(added,"company","companies")} from ${setQ(set.name)}.` : have ? `Every company in ${setQ(set.name)} with an S&P id is already chosen.` : `${setQ(set.name)} has no company with an S&P id to add.`;
  return setSay(lead, set, full ? `A search takes at most ${MAX_COMPANIES} companies, so ${plural(full,"company was","companies were")} left out: remove some to make room, or search the rest separately.` : "");
};
// The Snapshot: a set is taken like a group, all its companies, with the Snapshot's own cost line and size checks.
SET_TARGETS.snapshot=(companies, set)=>{
  const sn=S.snap; if(sn.busy || sn.picking) return "A snapshot is being made. Try again when it has finished.";
  sn.pick={kind:"group", name:`${set.name} (saved set)`, group:"", ids:companies.map(c=>({kind:c.kind, id:c.id, name:c.name||""})), noId:set.noId, cut:false, over:companies.length+set.cut>MAX_COMPANIES};
  sn.find.matches=null; sn.formErr=""; sn.pickErr="";
  return setSay(`Chosen: ${setQ(set.name)}, ${plural(companies.length,"company","companies")} with S&P ids.`, {...set, notes:set.notes.filter(n=>!/no S&P id/.test(n))}, "");
};
// The watchlist (Corp Dev, under Manage): the set's companies join what is watched.
SET_TARGETS.watch=(companies, set)=>{
  if(!isCorpDev()) return "Only Corp Dev logins can change the watchlist.";
  let added=0, full=0;
  return changeWatch(l=>{
    added=0; full=0;
    for(const c of companies){ if(l.companies.some(x=>x.kind===c.kind && x.id===c.id)) continue; if(l.companies.length>=SET_WATCH_MAX){ full++; continue; } l.companies.push({kind:c.kind, id:c.id, name:c.name||""}); added++; }
    return added ? l : null;
  }).then(()=> S.w.saveErr ? "" : setSay(added ? `Added ${plural(added,"company","companies")} from ${setQ(set.name)} to the watchlist.` : full ? "" : `Every company in ${setQ(set.name)} with an S&P id is already watched.`, set,
    full ? `The watchlist keeps at most ${count(SET_WATCH_MAX)} companies, so ${plural(full,"company was","companies were")} left out.` : ""));
};

function keepUi(rootId){

  const typed=["li_user","li_pw"].map(i=>[i, document.getElementById(i)?.value]).filter(x=>x[1]!==undefined);
  return ()=>{
    for(const [i,v] of typed){ const e=document.getElementById(i); if(e) e.value=v; }
    for(const [i,t,l] of scroll){ const e=document.getElementById(i); if(e){ e.scrollTop=t; e.scrollLeft=l; } }

/* ---------- Market index (#market): search filings swept for every company in the list; Corp Dev runs the sweeps ----------
   The snl-index function keeps filing details for chosen states in the app's own database. Searching it costs no S&P
   request. Every answer says what it rests on (the state, the period swept, when, and how many companies were and
   weren't covered), and the coverage line stays on screen. Corp Dev starts a sweep (its cost shown first), and while
   this page is open it carries the sweep on step by step, as the Ask Claude panel carries on an answer; closing the
   tab only pauses it. Three functions are what the rest of the page needs: renderMarket, enterMarket, resetMarket. */
VIEWS.push("market");
FN["snl-index"]="the market index function";
const MK_PAGE = 50, MK_EXPORT = 500;
const MK_PERIODS = [["this_year","This year"],["last_12_months","Last 12 months"],["last_3_years","Last 3 years"]];
const MK_FTYPES = ["Rate","Rule","Form"];
function freshMarket(){
  return {loading:false, status:null, statusErr:null, state:"", types:{}, typesBusy:"", f:{toi:"", ftype:"", fstatus:"", from:"", to:"", words:""},
    busy:false, err:null, res:null, byCo:null, asked:null, tab:"rows", more:false, moreBusy:false, exporting:"",
    mgr:{state:"", period:"last_12_months", busy:"", err:"", note:""}, timer:null, stepping:false, stepErr:""};
}

const mkStates = () => (S.mk.status&&Array.isArray(S.mk.status.states) ? S.mk.status.states.filter(s=>s&&/^[A-Z]{2}$/.test(String(s.state))) : []);
const mkStateName = s => US_MAP[s] ? US_MAP[s][1] : s;

async function loadMarket(quiet){

async function mkLoadTypes(state){
  const mk=S.mk; if(mk.typesBusy===state) return; mk.typesBusy=state;

/* Narrow it down on the Market: the states (the index's own) and types of insurance (the index's names) chosen. The
   first indexed state is chosen to start with, as the one state always was. Nothing chosen means every indexed state,
   at most MK_MAX_STATES (the snl-index function's MAX_QUERY_STATES). One state and one type are asked exactly as
   before; several go as lists, which the index answers after migration 0009. */
const MK_MAX_STATES = 10;
function mkNarrowInit(){
  const mk=S.mk, nw=nwOf("mk"), have=new Set(mkStates().map(s=>String(s.state)));
  if(!nw.touched) nw.states=mk.state?[mk.state]:[];
  nw.states=nw.states.filter(s=>have.has(s));
}
const mkAskStates = () => { const c=nwStates("mk"); return c.length ? c : mkStates().map(s=>String(s.state)).sort(); };
const mkAskTypes = () => nwTois("mk").map(t=>t.name);
async function mkNarrowChanged(){
  const mk=S.mk, nw=nwOf("mk"), before=mk.state; nw.touched=true;
  const sts=mkAskStates(); mk.state=sts[0]||"";
  if(JSON.stringify(sts)!==JSON.stringify(mk.lastStates||[before])){ mk.res=null; mk.byCo=null; mk.err=null; }
  mk.lastStates=sts;
  for(const s of sts.slice(0, MK_MAX_STATES)) if(!mk.types[s] && S.mk===mk){ await mkLoadTypes(s); }
}
// the scope of an answer, from the question it echoes: its states and types
function mkScopeOf(q){
  const sts=Array.isArray(q&&q.states)&&q.states.length ? q.states : q&&q.state ? [q.state] : [];
  const tys=Array.isArray(q&&q.types)&&q.types.length ? q.types : q&&q.typeOfInsurance ? [q.typeOfInsurance] : [];
  return nwScope(sts, tys.map(t=>({id:String(t), name:String(t)})));
}
function mkQuery(extra){
  const mk=S.mk, f=mk.f, sts=mkAskStates(), tys=mkAskTypes();
  const q={action:"query", state:sts[0]||mk.state, typeOfInsurance:tys.length===1?tys[0]:null, filingType:f.ftype||null, status:f.fstatus.trim()||null, from:f.from||null, to:f.to||null, words:f.words.trim()||null, ...extra};
  if(sts.length>1 || tys.length>1){ q.states=sts; q.typesOfInsurance=tys; }
  return q;
}
async function mkSearch(){
  const mk=S.mk; if(mk.busy || !mk.state) return;
  if(mkAskStates().length>MK_MAX_STATES){ mk.err={err:"bad", msg:`Choose at most ${MK_MAX_STATES} states: the index answers up to ${MK_MAX_STATES} at once.`}; render(); return; }
  if(mk.f.from && mk.f.to && mk.f.from>mk.f.to){ mk.err={err:"bad", msg:"The start date is after the end date."}; render(); return; }
  mk.busy=true; mk.err=null; render();
  const q=mkQuery({});
  const [rows, byCo]=await Promise.all([callFn("snl-index",{...q, group:"rows", limit:MK_PAGE, offset:0}), callFn("snl-index",{...q, group:"company", limit:100})]);
  if(!S.session || S.mk!==mk) return;
  mk.busy=false;
  // several states or types asked of a function from before Narrow it down would be answered wider: shown as not done
  if(rows.data && (q.states||q.typesOfInsurance) && !(rows.data.query&&Array.isArray(rows.data.query.states))){ mk.err={err:"not_updated", msg:"The market index function on this site can only search one state and one type of insurance at a time. Choose one of each, or ask Corp Dev to deploy snl-index again (README, Market index)."}; mk.res=null; mk.byCo=null; }
  else if(rows.data){ mk.res=rows.data; mk.asked=q; mk.more=!!rows.data.more; mk.byCo=byCo.data||null; }
  else if(rows.err!=="signin"){ mk.err=rows; mk.res=null; mk.byCo=null; }
  render();
}
async function mkMore(){
  const mk=S.mk, res=mk.res; if(!res || mk.moreBusy || !mk.asked) return;
  mk.moreBusy=true; render();
  const r=await callFn("snl-index",{...mk.asked, group:"rows", limit:MK_PAGE, offset:res.rows.length});
  if(S.mk!==mk || mk.res!==res) return;
  mk.moreBusy=false;
  if(r.data&&Array.isArray(r.data.rows)){ res.rows=res.rows.concat(r.data.rows); mk.more=!!r.data.more; }
  else if(r.err!=="signin") toast("Couldn't load more. "+errText(r));
  render();
}

      rows:g.map(x=>[x.name, x.companyId, x.institutionId, isNum(x.filings)?+x.filings:null, isNum(x.rateFilings)?+x.rateFilings:null, isNum(x.rateMin)?+x.rateMin:null, isNum(x.rateMax)?+x.rateMax:null, dayOut(x.latest)])}, fmt);
    return;
  }
  mk.exporting=fmt; render();
  const r=await callFn("snl-index",{...mk.asked, group:"rows", limit:MK_EXPORT, offset:0});
  if(S.mk!==mk) return; mk.exporting=""; render();
  if(!r.data){ if(r.err!=="signin") toast("Couldn't export. "+errText(r)); return; }
  const rows=Array.isArray(r.data.rows)?r.data.rows:[];
  if(r.data.more) toast(`The export holds the newest ${count(rows.length)} of ${count(r.data.total)} filings. Narrow the search for the rest.`);
  exportTable({name:`snl-market-${stamp}`, sheet:"Filings", cols:["Companies","State","Type of insurance","Sub-type of insurance","Filing type","Status","Date submitted","Date published","Effective date, new business","Effective date, renewals","Rate impact","Rate impact (number)","Description","Filing number","Document id","Filing version id","Pages"],
    rows:rows.map(x=>[companiesOf(x).map(c=>c.companyName).filter(n=>!blank(n)).join("; "), x.serffFilingStateId, x.typeOfInsurance, x.subTypeOfInsurance, x.serffFilingType, x.filingStatus, dayOut(x.dateSubmitted), dayOut(x.publishDate), dayOut(x.newBusReqEffDate), dayOut(x.renewBusReqEffDate), rateImpact(x), isNum(x.overallRateImpact)?+x.overallRateImpact:null, x.filingDescription, filingNoText(x), x.documentId, x.filingVersionId, isNum(x.pages)?+x.pages:null])}, fmt);
}

const MK_STATUS = {running:"Working", waiting:"Waiting to carry on", held:"Paused", done:"Finished", failed:"Failed", stopped:"Stopped"};
function mkOpenHTML(o){
  const pctDone=Math.max(0, Math.min(100, +o.percent||0)), held=o.status==="held", what=o.kind==="top_up"?"Top-up":"Sweep";

    <div class="mkbar" role="progressbar" aria-label="Sweep progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pctDone}"><span style="width:${pctDone}%"></span></div>

      ${tu?`<button class="btn sm" data-act="mk-topup" data-s="${esc(s.state)}" ${open||m.busy||st.configured===false?"disabled":""}>Top up</button>`:`<span class="t2">Up to date</span>`}</div>

      ${Array.isArray(s.missed)&&s.missed.length?`<details class="mkmiss"><summary>Not covered (${count(s.companiesMissed)})</summary><p class="t2" style="margin:4px 0 0">${esc(s.missed.join("; "))}${+s.companiesMissed>s.missed.length?` and ${count(+s.companiesMissed-s.missed.length)} more`:""}. Their batch failed twice; the next sweep tries them again.</p></details>`:""}</li>`; }).join("")}</ul>`:`<p class="t2" style="margin:4px 0 0">None yet.</p>`}</div>`;
  const c=costs[m.period]||null, refused=c&&c.refused;
  h+=`<div class="mkstart" id="mkStart"><b>Start a sweep</b>
    <div class="fgrid"><label class="f">State<select id="mk_mstate"><option value="">Choose a state</option>${US_STATES.map(s=>`<option value="${s}"${s===m.state?" selected":""}>${s} ${esc(mkStateName(s))}</option>`).join("")}</select></label>
    <div class="f"><span>Period</span><div class="seg" role="group" aria-label="Period">${MK_PERIODS.map(([id,label])=>`<button type="button" class="btn sm" data-act="mk-period" data-p="${id}" aria-pressed="${m.period===id}">${label}</button>`).join("")}</div></div></div>
    ${c?`<p class="t2 mkcost" id="mkCost" style="margin:0"><b>What it costs:</b> ${esc(c.words||"")}${c.finishesToday===false&&!refused?` Fewer requests are left today than it needs, so it carries on after midnight UTC.`:""}</p>`:""}
    ${refused?`<p class="err" id="mkRefusedCost" role="alert">${esc(refused)}</p>`:""}
    ${m.state&&states.some(s=>s.state===m.state)?`<p class="t2" style="margin:0">${esc(m.state)} is already indexed: a new sweep replaces its period when it finishes. To add only new filings, top it up instead.</p>`:""}
    <div class="toolbar"><button class="btn primary" data-act="mk-start" id="mkStartBtn" ${open||refused||m.busy||st.configured===false?"disabled":""}>${m.busy==="start"?"Starting…":"Start the sweep"}</button>${open?`<span class="t2">One sweep runs at a time.</span>`:""}</div></div>`;
  const sch=st.schedule||{};
  h+=`<p class="t2" id="mkSchedule" style="margin:0">${sch.ready?`The schedule is set up: it carries a sweep on with this page closed, and tops up each indexed state ${+sch.topUpDays?`every ${count(sch.topUpDays)} days`:"never (switched off)"}.`:"No schedule: a sweep only runs while this page is open. To let it run with the page closed and keep states topped up, the owner sets INDEX_SECRET and runs supabase/index_schedule.sql (README, Market index)."}</p>`;
  const recent=(Array.isArray(st.recent)?st.recent:[]).filter(x=>x&&!["running","waiting","held"].includes(x.status)).slice(0,5);
  if(recent.length) h+=`<details class="mkrecent" id="mkRecent"><summary>Recent sweeps</summary><ul class="mklist">${recent.map(x=>`<li><b>${esc(x.state)}</b> <span class="pill">${esc(MK_STATUS[x.status]||x.status)}</span> <span class="t2">${esc(fmtAt(x.started_at))}</span>${!blank(x.message)?`<div class="t2">${esc(x.message)}</div>`:""}</li>`).join("")}</ul></details>`;
  return h+`</section>`;
}
function renderMarket(){

/* ----- Corp Dev's actions, and carrying a sweep on while this page is open ----- */
async function mkAct(action, extra){
  const mk=S.mk, m=mk.mgr; if(m.busy) return;
  m.busy=action; m.err=""; m.note=""; render();
  const r=await callFn("snl-index",{action, ...(extra||{})});
  if(S.mk!==mk) return; m.busy="";
  if(r.data){ m.note=r.data.message||""; if(r.data.used) takeUsage(r.data); mk.stepErr=""; }
  else if(r.err!=="signin") m.err=errText(r);
  await loadMarket(true);
}
function mkStart(){
  const m=S.mk.mgr;
  if(!m.state){ m.err="Choose a state to sweep."; render(); document.getElementById("mk_mstate")?.focus(); return; }
  mkAct("start", {state:m.state, period:m.period});
}
/* One step at a time while this page shows the index: right away while the sweep is waiting to carry on, at the time
   it gave when it is leaving room for people, and a look every 15 seconds while someone else's step is running. */
function mkDrive(){
  const mk=S.mk; clearTimeout(mk.timer); mk.timer=null;
  const o=mk.status&&mk.status.open;
  if(!S.session || !isCorpDev() || S.view!=="market" || !o || mk.stepping || mk.stepErr || o.status==="held") return;
  if(o.status==="running"){ mk.timer=setTimeout(()=>{ if(S.mk===mk) loadMarket(true); }, 15000); return; }
  // A step that didn't run (someone else's step had just started, say) is tried again in 15 seconds, not at once.
  const wait=o.resume_after ? Date.parse(o.resume_after)-Date.now() : mk.idle ? 15000 : 0;
  mk.timer=setTimeout(()=>{ if(S.mk===mk) mkStep(); }, wait>0 ? Math.min(wait+2000, 3600000) : 0);
}
async function mkStep(){
  const mk=S.mk; if(mk.stepping) return;
  mk.stepping=true; mk.stepErr=""; if(S.view==="market") render();
  const r=await callFn("snl-index",{action:"continue"});
  if(S.mk!==mk) return;
  mk.stepping=false;
  mk.idle=!(r.data&&r.data.step&&r.data.step.ran);
  if(r.data){ if(r.data.used) takeUsage(r.data); }
  else if(r.err!=="signin") mk.stepErr="The sweep couldn't carry on: "+errText(r)+" It hasn't lost its place.";
  await loadMarket(true);
}

  if(error || !data || !ROLES[data.role]){ S.leaving=true; try{ await S.sb.auth.signOut(); }catch{} S.leaving=false; resetState(); S.loginErr="This login has no role on this site yet. Ask the site owner to set it up."; render(); return; }

async function doLogin(){
  if(S.loginBusy) return;
  const u=(document.getElementById("li_user")?.value||"").trim(), pw=document.getElementById("li_pw")?.value||"";
  if(!u||!pw){ S.loginErr="Enter your username and password."; render(); return; }
  S.loginBusy=true; S.loginErr=""; render();
  let data=null, error=null;
  try{ ({data, error}=await S.sb.auth.signInWithPassword({email:toEmail(u), password:pw})); }catch(e){ error=e; }
  S.loginBusy=false;
  if(error || !data || !data.session){
    const m=(error&&error.message)||"No session returned";
    S.loginErr = /rate|too many/i.test(m) ? "Too many attempts. Wait a few minutes and try again."
      : (error && (error.code==="invalid_credentials" || /invalid login credentials/i.test(m))) ? "That username and password don't match. Check them, or ask the site owner to reset your password."
      : (error && error.code==="email_provider_disabled") ? "Sign-in is switched off in Supabase (Authentication > Sign In / Providers > Email). Tell the site owner."
      : "Sign-in failed: "+m+". The site's Supabase settings may be wrong; tell the site owner.";
    render(); const f=document.getElementById("li_pw"); if(f){ f.value=""; f.focus(); } return;
  }
  await onSignedIn(data.session);
}

/* ---------- Cloudflare sign-on ----------
   When config.js says signOn "cloudflare", the site is served by the Cloudflare Worker (worker/index.js) behind
   Cloudflare Access, and there is no username and password here: Cloudflare has already signed the person in. The
   Worker's /auth/session turns that sign-in into a short Supabase session (the access token only, never a refresh
   token). The Supabase client is given that token for every table read, storage call and function call; it is
   renewed quietly a few minutes before it ends, and once when Supabase answers 401. Sign out goes through Access's
   own logout. Without the marker, the username and password sign-in above is used as before. */
const CF_TIMING = {before:300000, retry:30000, soon:60000};   // renew this long before the end; retry a failed renewal; renew first when the token ends sooner than this
S.cf=null;        // {token, exp: when it ends on this computer's clock, timer, renewing}
S.cfState=null;   // why no one is signed in: {kind:"loading"|"notset"|"unreachable"|"ended"|"leaving", msg}
const CF_ENDED = "Cloudflare sign-ins last a set time, and the site owner may have changed who can use the site. Reload the page to sign in again through Cloudflare.";
/* Asks the Worker for a session. {ok:true, data} or {kind, msg}. A redirect means Access wants a fresh sign-in. */
async function cfAsk(){
  let res;
  try{ res=await fetch("/auth/session", {method:"POST", credentials:"same-origin", redirect:"manual", cache:"no-store", headers:{"Content-Type":"application/json"}, body:'{"action":"session"}'}); }
  catch{ return {kind:"unreachable", msg:"The sign-in service can't be reached. Check your connection and try again."}; }
  if(res.type==="opaqueredirect" || res.status===0) return {kind:"ended", msg:CF_ENDED};
  let body=null; try{ body=await res.json(); }catch{}
  if(res.ok && body && typeof body.accessToken==="string" && body.accessToken && body.profile && ROLES[body.profile.role]) return {ok:true, data:body};
  const msg=body && typeof body.message==="string" && body.message ? body.message : "";
  if(body && body.error==="not_configured") return {kind:"notset", msg:msg||"Cloudflare let you in, but the site isn't set up yet. Ask the site owner."};
  if(res.status===401 || res.status===403) return {kind:"ended", msg:msg||CF_ENDED};
  return {kind:"unreachable", msg:msg||"The sign-in service can't be reached. Try again in a minute."};
}
function cfTake(d){
  const now=Date.now(), life=Number(d.expiresIn)>0 ? Number(d.expiresIn)*1000 : Math.max(0, Number(d.expiresAt)*1000-now);
  if(S.cf) clearTimeout(S.cf.timer);
  S.cf={token:d.accessToken, exp:now+life, timer:null, renewing:null};
  const p=d.profile, name=String(p.displayName||p.username||p.email||"").trim()||"Signed in";
  const next={username:String(p.email||p.username||""), name, role:p.role, uid:String(p.id||"")};
  const changed=!S.session || S.session.role!==next.role || S.session.name!==next.name;
  S.session=S.session ? Object.assign(S.session, next) : next;
  cfSchedule();
  return changed;
}
function cfSchedule(delay){
  if(!S.cf) return;
  clearTimeout(S.cf.timer);
  const left=S.cf.exp-Date.now();
  if(delay===undefined) delay=Math.max(left/2, left-CF_TIMING.before);   // a few minutes before the end (halfway for a short token)
  S.cf.timer=setTimeout(()=>{ cfRenew(); }, Math.max(1000, delay));
}
/* Renews the token. One renewal at a time; everyone waiting gets the same answer. */
function cfRenew(){
  if(!S.cf) return Promise.resolve(false);
  if(S.cf.renewing) return S.cf.renewing;
  const mine=S.cf;
  mine.renewing=(async()=>{
    const r=await cfAsk();
    if(S.cf!==mine) return false;   // signed out meanwhile
    mine.renewing=null;
    if(r.ok){ if(cfTake(r.data) && S.session) render(); return true; }
    if(r.kind==="unreachable" && mine.exp-Date.now()>10000){ cfSchedule(CF_TIMING.retry); return false; }   // still good for now: try again shortly
    cfEnded(r.kind, r.kind==="unreachable" ? "The sign-in service can't be reached, so your session couldn't be renewed. Check your connection and try again." : r.msg);
    return false;
  })();
  return mine.renewing;
}
/* The token for the next request (supabase-js asks before each one), renewed first when it is about to end. */
async function cfToken(){
  if(S.cf && S.cf.exp-Date.now()<CF_TIMING.soon) await cfRenew();
  return S.cf ? S.cf.token : null;
}
async function cfSessionNow(){ const t=await cfToken(); return t ? {access_token:t} : null; }
/* fetch for everything sent to Supabase: on a 401, renew the token once and send the same request again. */
async function cfFetch(input, init){
  const res=await fetch(input, init);
  const url=typeof input==="string" ? input : input instanceof URL ? input.href : (input && input.url) || "";
  if(res.status!==401 || !S.cf || !CFG.supabaseUrl || !url.startsWith(CFG.supabaseUrl) || (init && init.body && typeof init.body.getReader==="function")) return res;
  const h=new Headers((init && init.headers) || (input && input.headers) || {}), was=(h.get("Authorization")||"").replace(/^Bearer\s+/i,"");
  if(S.cf.token===was && !(await cfRenew())) return res;
  if(!S.cf || S.cf.token===was) return res;
  h.set("Authorization", "Bearer "+S.cf.token);
  return fetch(input, {...(init||{}), headers:h});
}
function cfEnded(kind, msg){
  if(S.cf) clearTimeout(S.cf.timer);
  S.cf=null;
  if(S.session) resetState();
  S.cfState={kind, msg}; S.authChecked=true; render();
}
async function cfSignOut(){
  const t=S.cf && S.cf.token;
  cfEnded("leaving", "");
  // End this Supabase session too (best effort), then let Access sign the browser out.
  if(t && CFG.supabaseUrl){ try{ await Promise.race([fetch(CFG.supabaseUrl+"/auth/v1/logout?scope=local", {method:"POST", headers:{"Authorization":"Bearer "+t, "apikey":CFG.supabaseAnonKey}}), new Promise(r=>setTimeout(r, 3000))]); }catch{} }
  location.assign("/auth/signout");
}
function cfHeader(){
  document.getElementById("pwBtn").hidden=true;
  document.querySelectorAll('#whoMenu [data-act="change-pw"]').forEach(b=>{ b.hidden=true; });
}
function cfLoginHTML(){
  const st=S.cfState||{kind:"loading"};
  const box=(h, p, btn) => `<div class="kicker">Strategy and corporate development</div><h2>${esc(h)}</h2><p role="${st.kind==="loading"||st.kind==="leaving"?"status":"alert"}">${esc(p)}</p>${btn||""}`;
  if(st.kind==="notset") return box("Not set up yet", st.msg)+`<p class="source">The README has the steps (Cloudflare sign-on).</p>`;
  if(st.kind==="unreachable") return box("Can't reach the sign-in service", st.msg, `<div class="inline"><button class="btn primary" data-act="cf-retry">Try again</button></div>`);
  if(st.kind==="ended") return box("Your sign-in has ended", st.msg, `<div class="inline"><button class="btn primary" data-act="cf-reload">Reload</button></div>`);
  if(st.kind==="leaving") return box("Signing you out", "One moment…");
  return box("SNL lookup", "Signing you in…");
}
async function cfBoot(){
  S.cfState={kind:"loading"}; render();
  if(!CFG.supabaseUrl || !CFG.supabaseAnonKey){
    S.cfState={kind:"notset", msg: CFG.configProblem==="secret_key"
      ? "Cloudflare let you in, but the site isn't set up yet: the Worker's SUPABASE_PUBLISHABLE_KEY setting holds a secret key, which is never sent to browsers. Ask the site owner to set the publishable key (sb_publishable_...) instead."
      : "Cloudflare let you in, but the site isn't set up yet: the Worker doesn't know which Supabase project to use. Ask the site owner to set SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY on the Worker."};
    render(); return;
  }
  if(!window.supabase){ S.cfState={kind:"unreachable", msg:"Part of the page couldn't load. Check your connection and try again."}; render(); return; }
  const r=await cfAsk();
  if(!r.ok){ S.cfState={kind:r.kind, msg:r.msg}; render(); return; }
  if(!S.sb) S.sb=window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey, {accessToken:cfToken, global:{fetch:cfFetch}});
  cfTake(r.data); S.cfState=null; S.authChecked=true; S.loginErr="";
  route(); loadStatus(); loadPast(false);
}

async function boot(){
  S.f=freshFilings(); S.st=freshStat();
  if(CF_SIGNON){ cfBoot(); return; }
  if(!CFG.supabaseUrl || !CFG.supabaseAnonKey || !window.supabase){ S.configMissing=true; render(); return; }
  S.sb=window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey);
  render();
  let session=null;
  try{ ({data:{session}}=await S.sb.auth.getSession()); }catch{}
  S.authChecked=true;
  if(session) await onSignedIn(session); else render();
  S.sb.auth.onAuthStateChange((event)=>{ if(event==="SIGNED_OUT" && S.session && !S.leaving){ resetState(); S.loginErr="You were signed out. Sign in again."; render(); } });
}
boot();
</script>
