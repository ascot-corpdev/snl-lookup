/* ---------- Ask Claude: past answers, and an answer that outlives a reload ----------
   The database is the only record: the page reads the login's own snl_jobs rows (row-level security limits them to
   the login, and the page asks for its own owner too). The list reads a few small columns; one answer's full row is
   read only when it is opened. The only thing kept in the browser is the id of the last answer the reader has seen. */
const PAST_COLS = "id,status,question,error,created_at,updated_at,heartbeat_at";
const PAST_PAGE = 10, PAST_DAYS = 30, SEEN_KEY = "snl.seenAnswer";
// rows: the list (null until it first loads); failedMore: whether the load that failed was "Show more";
// resumed: the latest answer has been checked once since sign-in; opening: the id being fetched
function freshPast(){ return {rows:null, loading:false, err:"", failedMore:false, more:false, resumed:false, opening:"", openErr:""}; }
S.past = freshPast();
function seenId(){ try{ return localStorage.getItem(SEEN_KEY)||""; }catch{ return ""; } }
function markSeen(id){ if(!id) return; try{ localStorage.setItem(SEEN_KEY, String(id)); }catch{} }
const shortText = (s, n) => { s=String(s??"").replace(/\s+/g," ").trim(); return s.length>n ? s.slice(0,n-1).trimEnd()+"…" : s; };
const askedText = s => { const d=fmtAt(s), h=fmtTime(s); return `Asked ${d}${h?` at ${h}`:""}`; };
function pastState(r){
  if(r.status==="done") return {text:"Answered", cls:""};
  if(r.status==="error") return {text:"Stopped: "+shortText(r.error||"Claude couldn't finish this answer.", 160), cls:"stopped"};
  return {text:"Still running", cls:""};
}
/* A row of snl_jobs as a turn of the conversation, the same shape askQuestion makes. saved: opened from the list.
   asked is when the question was asked, which the exported answer shows. */
function jobTurn(row, saved){
  const st=["queued","running","paused","done","error"].includes(row.status) ? row.status : "running";
  return {question:String(row.question??""), told:"", status:st, progress:Array.isArray(row.progress)?row.progress:[], partial:typeof row.partial==="string"?row.partial:"",
    result: st==="done" ? (row.result&&typeof row.result==="object"?row.result:{}) : null, error: st==="error" ? (row.error||"Claude couldn't finish this answer. Ask again.") : "",
    calm:false, jobId:row.id, lastContinue:0, note:"", contNote:"", asked:String(row.created_at||""), saved:!!saved};
}
function pastQuery(cols){
  return S.sb.from("snl_jobs").select(cols).eq("owner", S.session.uid).gte("created_at", new Date(Date.now()-PAST_DAYS*DAY).toISOString()).order("created_at",{ascending:false});
}
/* The first page of the list (again), or the next page with "Show more". */
async function loadPast(more){
  const p=S.past; if(!S.session || p.loading) return;
  const from = more && p.rows ? p.rows.length : 0;
  p.loading=true; p.err=""; renderAsk();
  let data=null, error=null;
  try{ ({data, error}=await pastQuery(PAST_COLS).range(from, from+PAST_PAGE)); }catch(e){ error=e; }
  if(S.past!==p || !S.session) return;   // signed out meanwhile: this list belonged to that login
  p.loading=false;
  if(error || !Array.isArray(data)){ p.err="Couldn't load your past answers. Check your connection and try again."; p.failedMore=!!from; renderAsk(); return; }
  const base=from ? p.rows : [], ids=new Set(base.map(r=>r.id));
  p.rows=base.concat(data.slice(0, PAST_PAGE).filter(r=>r && !ids.has(r.id))); p.more=data.length>PAST_PAGE;
  if(!p.resumed){ p.resumed=true; await resumeLatest(p.rows[0]); }
  renderAsk();
}
/* After a reload or a sign-in: follow the latest answer again if it is still going, or hold it ready if it ended
   while the page was closed and hasn't been seen. */
async function resumeLatest(row){
  const a=S.ask, p=S.past;
  if(!row || a.turns.length) return;
  const going=["queued","running","paused"].includes(row.status);
  if(!going && (!["done","error"].includes(row.status) || row.id===seenId())) return;
  let full=row;
  if(row.status==="done"){
    let data=null; try{ ({data}=await S.sb.from("snl_jobs").select(JOB_COLS).eq("id", row.id).eq("owner", S.session.uid).maybeSingle()); }catch{}
    if(S.past!==p || S.ask!==a || a.turns.length || !data) return;
    full=data;
  }
  const t=jobTurn(full, false); a.turns=[t];
  if(going){ pollJob().then(()=>{ if(S.session && activeTurn() && !S.ask.timer) schedulePoll(); }); }
  else if(a.open){ a.scroll=0; markSeen(t.jobId); }
  else a.unseen=t.status;
}
/* Opens one past answer: its full row, shown as a fresh answer is. A running one is followed again. */
async function openPast(id){
  const p=S.past, a=S.ask;
  if(!id || p.opening || a.turns.length) return;
  p.opening=id; p.openErr=""; renderAsk();
  let data=null, error=null;
  try{ ({data, error}=await S.sb.from("snl_jobs").select(JOB_COLS).eq("id", id).eq("owner", S.session.uid).maybeSingle()); }catch(e){ error=e; }
  if(S.past!==p || !S.session) return;
  p.opening="";
  if(error || !data){ p.openErr = error ? "Couldn't open that answer. Check your connection and try again." : "That answer is no longer kept. Answers are kept for 30 days."; renderAsk(); return; }
  if(S.ask!==a || a.turns.length){ renderAsk(); return; }
  const t=jobTurn(data, true); a.turns=[t]; a.scroll=0;
  if(activeTurn()){ a.scroll="bottom"; pollJob().then(()=>{ if(S.session && activeTurn() && !S.ask.timer) schedulePoll(); }); }
  else if(p.rows && p.rows[0] && p.rows[0].id===data.id) markSeen(data.id);   // only the latest counts as seen

/* ---------- Ask Claude: the team library ----------
   Answers a login chose to share with everyone who has a login on this site (migration 0007). The list and an opened
   entry are read straight from snl_library, as Past answers are read from snl_jobs: row-level security lets every
   login read it, so the list needs no function call and works even before snl-chat is redeployed. Saving, renaming
   and removing go through the snl-chat function, which copies the answer and checks who is asking.
   An entry was written by someone else: every part of it is shown through esc(), and when a reader follows it up it
   goes back to Claude only as one labelled turn of history, as bounded as any other. */
const LIB_COLS = "id,job_id,title,tags,companies,saved_by,saved_by_name,saved_at,answered_at";
const LIB_PAGE = 10, LIB_TITLE = 120, LIB_TAGS = 5, LIB_TAG = 30;
const LIB_NOTICE = "Everyone with a login on this site will be able to read this question and its answer, including which companies it is about. It stays until you or Corp Dev remove it.";
const LIB_GONE = "That entry is no longer in the team library. Someone may have removed it.";
// tab: which list an empty conversation starts with; rows: the list (null until loaded); seq: the latest load, so an
// older answer is dropped; q: the search box; applied: the search the rows are for; missing: the table isn't there
// (migration not run); form: the save or edit form {turn, mode, title, tags, busy, err}; confirm: a removal being
// confirmed {turn, busy, err}
function freshLib(){ return {tab:"past", rows:null, loading:false, seq:0, err:"", failedMore:false, more:false, q:"", applied:"", missing:false, opening:"", openErr:"", form:null, confirm:null}; }
S.lib = freshLib();
const libMissingErr = e => !!e && (e.code==="PGRST205" || e.code==="42P01" || (/snl_library/.test(String(e.message||"")) && /does not exist|schema cache/.test(String(e.message||""))));
const libMissingText = () => "The team library isn't set up yet, so answers can't be shared. " + (isCorpDev() ? "To set it up, run supabase/migrations/0007_answer_library.sql in the Supabase SQL editor (see the README)." : "Ask Corp Dev to set it up.") + " Everything else here works as before.";
const libMayChange = savedBy => !!S.session && (isCorpDev() || savedBy===S.session.uid);
const libTagsHTML = tags => { const a=(Array.isArray(tags)?tags:[]).filter(x=>!blank(x)).map(String); return a.length ? `<span class="libtags">${a.map(x=>`<span class="libtag">${esc(x)}</span>`).join("")}</span>` : ""; };
/* What a library entry's question is sent to Claude as when a reader follows it up: labelled as a colleague's, and
   no longer than any question. */
const libHistoryQuestion = q => ("(A colleague's question, saved in the team library) "+String(q??"")).slice(0, MAX_QUESTION);
/* The words in the search box, each made safe to use inside a pattern: no wildcards, commas, brackets or quotes. */
function libWords(q){ return String(q||"").toLowerCase().replace(/[%_\\*,()"'.:;]/g," ").split(/\s+/).filter(Boolean).slice(0,6); }
function libQuery(){
  let q=S.sb.from("snl_library").select(LIB_COLS);
  for(const w of libWords(S.lib.applied)) q=q.ilike("search_text", `%${w}%`);
  return q.order("saved_at",{ascending:false});
}
/* The first page of the list (again), or the next one with "Show more". */
async function loadLib(more){
  const l=S.lib; if(!S.session || (more && l.loading)) return;
  const from = more && l.rows ? l.rows.length : 0, seq=++l.seq;
  l.loading=true; l.err=""; renderAsk();
  let data=null, error=null;
  try{ ({data, error}=await libQuery().range(from, from+LIB_PAGE)); }catch(e){ error=e; }
  if(S.lib!==l || !S.session || seq!==l.seq) return;   // signed out, or a newer search meanwhile
  l.loading=false;
  if(libMissingErr(error)){ l.missing=true; l.rows=[]; l.more=false; renderAsk(); return; }
  if(error || !Array.isArray(data)){ l.err="Couldn't load the team library. Check your connection and try again."; l.failedMore=!!from; renderAsk(); return; }
  l.missing=false;
  const base=from ? l.rows : [], ids=new Set(base.map(r=>r.id));
  l.rows=base.concat(data.slice(0, LIB_PAGE).filter(r=>r && !ids.has(r.id))); l.more=data.length>LIB_PAGE;
  renderAsk();
}
function libSearch(){ const l=S.lib; l.applied=String(l.q||"").replace(/\s+/g," ").trim(); l.rows=null; l.openErr=""; loadLib(false); }
function libClear(){ const l=S.lib; l.q=""; l.applied=""; l.rows=null; l.openErr=""; loadLib(false); }
function libTab(tab){ const l=S.lib; l.tab=tab==="lib"?"lib":"past"; if(l.tab==="lib" && l.rows===null && !l.loading) loadLib(false); renderAsk(); }

function libShowList(){ S.lib.form=null; S.lib.confirm=null; S.lib.tab="lib"; S.lib.openErr=""; newConversation(); loadLib(false); }
/* A library entry as a turn of the conversation, the same shape jobTurn makes; lib says where it came from. */
function libTurn(row){
  const a=row.answer&&typeof row.answer==="object"&&!Array.isArray(row.answer)?row.answer:{};
  return {question:String(row.question??""), told:"", status:"done", progress:[], partial:"", result:{...a, model:blank(row.model)?"":String(row.model)}, error:"", calm:false, jobId:null, lastContinue:0, note:"", contNote:"",
    asked:String(row.asked_at||""), saved:false, lib:{id:row.id, title:String(row.title??""), tags:Array.isArray(row.tags)?row.tags.map(String):[], savedBy:row.saved_by, savedByName:String(row.saved_by_name??""), savedAt:row.saved_at, answeredAt:row.answered_at, removed:false, note:""}};

/* An older snl-chat (before the library) answers "Unknown action": say what to do about it. */
const libOld = r => r.err==="bad" && /^Unknown action/.test(String(r.msg||""));
const libNotDeployed = () => isCorpDev() ? "Saving to the team library needs the latest questions function. Run: supabase functions deploy snl-chat --no-verify-jwt (see the README), then try again." : "Saving to the team library isn't switched on yet. Ask Corp Dev to update the site.";
async function libSubmit(){
  const f=S.lib.form; if(!f || f.busy) return;
  const t=f.turn, title=f.title.replace(/\s+/g," ").trim(), tags=libParseTags(f.tags);
  f.err = !title ? "Give the entry a title." : title.length>LIB_TITLE ? `Keep the title to ${LIB_TITLE} characters.` : tags.length>LIB_TAGS ? `Use up to ${LIB_TAGS} tags.` : tags.some(x=>x.length>LIB_TAG) ? `Keep each tag to ${LIB_TAG} characters.` : "";
  if(f.err){ renderAsk(); return; }
  f.busy=true; renderAsk();
  const r=await callFn("snl-chat", f.mode==="edit" ? {action:"library_update", id:t.lib.id, title, tags} : {action:"library_save", jobId:t.jobId, title, tags});
  if(!S.session || S.lib.form!==f) return;   // signed out, or the form was closed meanwhile

    const e=r.data.entry; S.lib.form=null;

}

/* ---------- Statutory ---------- */
async function loadStatStatus(){
  const st=S.st; if(st.loading) return;
  st.loading=true; st.statusErr=null; render();
  const r=await callFn("snl-statutory",{action:"status"});
  st.loading=false;
  if(!S.session) return;
  if(r.data) st.status=r.data; else if(r.err!=="signin") st.statusErr=r;
  render();
}
function statCodes(){ return [...new Set(S.st.codes.split(/[\s,;]+/).map(s=>s.trim()).filter(Boolean))]; }
function statProblem(){
  const st=S.st, codes=statCodes(), y=new Date().getFullYear();
  if(!codes.length) return `Type at least one NAIC ${st.kind==="group"?"group":"company"} code.`;
  if(codes.length>MAX_CODES) return `Compare at most ${MAX_CODES} codes at a time: one subject and ${MAX_CODES-1} peers.`;
  if(codes.some(c=>!/^[0-9]{1,6}$/.test(c))) return "NAIC codes are numbers of up to 6 digits, like 90001. Separate them with commas.";
  const a=/^\d{4}$/.test(st.fromYear)?+st.fromYear:0, b=/^\d{4}$/.test(st.toYear)?+st.toYear:0;
  if(!a || !b || a<1990 || b>y) return `Choose years between 1990 and ${y}.`;
  if(a>b) return "The first year is after the last year.";
  if(b-a>MAX_STAT_YEARS-1) return `Choose at most ${MAX_STAT_YEARS} years at a time.`;
  return "";
}
async function runStat(refresh){
  const st=S.st; if(st.busy) return;
  let payload;
  if(refresh){ if(!st.last) return; payload={...st.last, refresh:true}; }
  else{
    const problem=statProblem(); if(problem){ st.formErr=problem; render(); return; }
    payload={action:"query", kind:st.kind, codes:statCodes(), fromYear:+st.fromYear, toYear:+st.toYear}; st.last=payload; st.res=null; st.ent={}; st.resNames={...statFind().names[st.kind]};
  }
  st.formErr=""; st.busy=true; st.err=null; render();
  const r=await callFn("snl-statutory", payload);
  st.busy=false;
  if(!S.session) return;
  if(r.data){ st.res=r.data; takeUsage(r.data); loadStatus(); }
  else if(r.err!=="signin"){ st.err=r; if(r.err==="not_configured"||r.err==="not_mapped") loadStatStatus(); }
  render();
}
const statVal = (unit, v) => unit==="pct" ? pct(v) : usdM(v);
const statYears = res => { const a=+res.fromYear, b=+res.toYear, out=[]; if(isFinite(a)&&isFinite(b)) for(let y=a; y<=b && out.length<40; y++) out.push(y); return out; };
function statEntities(res, field){
  const list=(Array.isArray(res.entities)?res.entities:[]).map(e=>({code:String(e.code), name:e.name}));
  for(const c of (Array.isArray(res.codes)?res.codes:[])) if(!list.some(e=>e.code===String(c))) list.push({code:String(c), name:null});
  for(const r of (field&&Array.isArray(field.rows)?field.rows:[])) if(!blank(r.code) && !list.some(e=>e.code===String(r.code))) list.push({code:String(r.code), name:null});
  const known=S.st.resNames||{};   // the names found by name when the figures were asked for fill the gaps
  return list.map(e=>blank(e.name) && !blank(known[e.code]) ? {...e, name:known[e.code]} : e);
}
const entLabel = e => blank(e.name) ? `NAIC ${e.code}` : `${e.name} (NAIC ${e.code})`;
/* One block's table: for a "by year" field one row per company (the subject first, then peers); for a "by line"
   or "by state" field one row per line or state for the company chosen in the block. */
function statBlock(res, field){
  const years=statYears(res), ents=statEntities(res, field), rows=Array.isArray(field.rows)?field.rows:[], dim=field.by==="line"?"line":field.by==="state"?"state":null;
  const find=(code, y, d)=>{ const r=rows.find(x=>String(x.code)===code && +x.year===y && (!dim || String(x[dim]??"")===d)); return r ? r.value : null; };
  if(!dim) return {years, ents, dim, lines:ents.map((e,i)=>({label:entLabel(e), tag:ents.length>1?(i?"Peer":"Subject"):"", vals:years.map(y=>find(e.code,y))}))};
  const chosen=ents.some(e=>e.code===S.st.ent[field.id]) ? S.st.ent[field.id] : (ents[0]?ents[0].code:"");
  const keys=[...new Set(rows.filter(r=>String(r.code)===chosen && !blank(r[dim])).map(r=>String(r[dim])))];
  const last=years[years.length-1];
  const lines=sortRows(keys.map(k=>({label:k, tag:"", vals:years.map(y=>find(chosen,y,k))})), l=>{ const v=l.vals[l.vals.length-1]; return isNum(v)?+v:null; }, -1);   // largest in the latest year first
  return {years, ents, dim, chosen, lines, last};
}
function statExport(fieldId){
  const res=S.st.res, field=res&&(res.fields||[]).find(f=>f.id===fieldId); if(!field) return null;
  const years=statYears(res), ents=statEntities(res, field), rows=Array.isArray(field.rows)?field.rows:[], dim=field.by==="line"?"line":field.by==="state"?"state":null, unit=field.unit==="pct"?"%":"US dollars";
  const val=(code,y,d)=>{ const r=rows.find(x=>String(x.code)===code && +x.year===y && (!dim || String(x[dim]??"")===d)); return r&&isNum(r.value) ? +r.value : null; };
  const out=[];
  for(const e of ents){
    if(!dim){ out.push([e.code, e.name, unit, ...years.map(y=>val(e.code,y))]); continue; }
    for(const k of [...new Set(rows.filter(r=>String(r.code)===e.code && !blank(r[dim])).map(r=>String(r[dim])))]) out.push([e.code, e.name, k, unit, ...years.map(y=>val(e.code,y,k))]);
  }
  return {name:`snl-statutory-${String(field.id).replace(/[^\w-]+/g,"-")}-${TODAY()}`, sheet:field.label||field.id, cols:["NAIC code","Name", ...(dim?[dim==="line"?"Line of business":"State"]:[]), "Unit", ...years.map(String)], rows:out};
}

function mappingProblem(text){
  let doc; try{ doc=JSON.parse(text); }catch(e){ return {problem:"This isn't valid JSON yet: "+String(e&&e.message||e).replace(/^JSON\.parse: /,"")+"."}; }
  const obj=v=>v!==null && typeof v==="object" && !Array.isArray(v);
  if(!obj(doc)) return {problem:'The mapping must be an object, like {"fields": {...}}.'};
  if(!obj(doc.fields)) return {problem:'The mapping needs a "fields" object, with one entry for each figure.'};
  const bad=Object.keys(doc.fields).find(k=>!obj(doc.fields[k]));
  if(bad!==undefined) return {problem:`The entry for "${bad}" must be an object with view, entity, year and value.`};
  if(text.length>200000) return {problem:"The mapping is too large to save."};
  return {doc};
}
async function saveMapping(){
  const su=S.st.setup, {doc, problem}=mappingProblem(su.text||"");
  if(problem){ su.mapErr=problem; render(); return; }
  su.saving=true; su.mapErr=""; render();
  let error=null;
  try{ ({error}=await S.sb.from("snl_settings").upsert({id:"statutory_mapping", doc})); }catch(e){ error=e; }
  su.saving=false;
  if(error){ su.mapErr = /42501|row-level security|permission/i.test(`${error.code||""} ${error.message||""}`) ? "Only Corp Dev logins can save the mapping." : "Couldn't save the mapping: "+(error.message||"unknown error")+"."; render(); return; }
  su.text=JSON.stringify(doc, null, 2); toast("Mapping saved"); S.st.status=null; S.st.res=null; render(); loadStatStatus();
}

/* ---------- Statutory: find companies and groups by name ---------- */
/* The same company list as the Filings view (the resolve action). Looking up by company, a match adds its NAIC

function statFind(){ const st=S.st; if(!st.nf) st.nf={q:"", asked:"", matches:null, note:"", busy:false, err:"", names:{company:{}, group:{}}}; return st.nf; }
const naicOk = c => /^[0-9]{1,6}$/.test(String(c??"").trim());
async function statLookup(){
  const nf=statFind(), q=nf.q.trim();
  if(!q){ nf.matches=null; nf.err="Type part of a company or group name, or a NAIC code."; render(); return; }
  nf.busy=true; nf.err=""; nf.note=""; nf.matches=null; nf.asked=q; render();
  const r=await callFn("snl-filings",{action:"resolve", q});
  if(!S.session || S.st.nf!==nf) return;
  nf.busy=false;
  if(r.data){ nf.matches=Array.isArray(r.data.matches)?r.data.matches.filter(m=>m&&typeof m==="object"):[]; nf.note=r.data.note||""; }
  else if(r.err!=="signin") nf.err="Couldn't look that up. "+errText(r);

}
/* Adds one code to the end of the list: the first code is the subject, the rest are peers. */
function statAddCode(code, name){
  const st=S.st, codes=statCodes(); code=String(code??"").trim();
  if(!naicOk(code)) return "bad";
  if(codes.includes(code)) return "dup";
  if(codes.length>=MAX_CODES) return "full";
  st.codes=codes.concat(code).join(", "); st.formErr="";
  if(!blank(name)) statFind().names[st.kind][code]=String(name);
  return "added";
}
const STAT_FULL = () => `The list is full: one subject and ${MAX_CODES-1} peers. Remove a code to add another.`;
function statAdd(code, name){
  const r=statAddCode(code, name);
  if(r==="dup") toast("That code is already in the list.");
  else if(r==="full") toast(STAT_FULL());
  else if(r==="bad") toast("NAIC codes are numbers of up to 6 digits.");

  for(const m of statAddable(nf.matches||[])){ const r=statAddCode(m.naicCompanyCode, m.companyName); if(r==="added") added++; else if(r==="full") left++; }
  render();
  toast(left && !added ? STAT_FULL() : left ? `Added ${added}. A comparison takes at most ${MAX_CODES} codes, so ${left} ${left===1?"was":"were"} left out.` : added ? `Added ${plural(added,"company","companies")}.` : "Those companies are already in the list.");

/* The distinct groups among the matches, with how many matching companies each has. */
function statGroups(matches){
  const out=[];
  for(const m of matches){
    const code=blank(m.naicGroupCode)?"":String(m.naicGroupCode).trim(), name=blank(m.naicGroupName)?"":String(m.naicGroupName);
    if(!code && !name) continue;
    const key=code||"name:"+name.toLowerCase(); let g=out.find(x=>x.key===key);
    if(!g){ g={key, code, name, n:0}; out.push(g); }
    if(!g.name && name) g.name=name;
    g.n++;
  }
  return out;
}

/* ---------- Profile: a company profile as a PowerPoint file on the team's own template ----------
   The profile function gives the figures (facts) and plain slide text, or Claude's draft of the text. The slides are
   built in this browser by deck.js and profile-slides.js, loaded on first use after the zip library. The template
   lives in private storage: it is downloaded once per session and kept in memory only (never in browser storage),
   and the built file is only handed to the browser to save. Both are dropped on sign-out. */
FN["snl-profile"]="the profile function";
const JSZIP_SRC = "https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js";   // the zip library the slide builder needs
const DECK_SRC = "deck.js", SLIDES_SRC = "profile-slides.js";                        // beside this page
const PPTX_TYPE = "application/vnd.openxmlformats-officedocument.presentationml.presentation";
const TPL_BUCKET = "snl-template", TPL_PATH = "template.pptx", TPL_MAX = 50*1024*1024;
function freshTemplate(){ return {checked:false, loading:false, info:null, err:"", errKind:"", bytes:null, uploading:"", upErr:"", upNote:"", ...freshTplMore()}; }
function freshProfile(){

    busy:"", asked:null, res:null, err:null, plan:null, libsErr:"", draft:null, drafted:null, draftErr:null, built:null, buildErr:"", tpl:freshTemplate(),
    mode:null, fp:freshFp()};   // mode and fp: the filings profile (its block is after renderProfile)
}
S.pf=freshProfile();
ASK_SUGGEST.profile=["What stands out in this company's results over these years?", "How has policyholder surplus moved against premiums written?", "Which lines of business and states drive this company's premiums?"];
const askSuggestKey = sc => S.view==="snapshot" ? "snapshot" : S.view==="profile" && sc && sc.view==="statutory" ? "profile" : sc.view;

const pfClaude = () => !!(S.pf.status&&S.pf.status.claude&&S.pf.status.claude.configured);

const pfHasTemplate = () => true;   // there is always a template to build on: at worst the built-in plain one (see tplLevel)
// Claude drafts when it is set up, the reader hasn't switched it off, today's limit isn't reached, and it isn't the sample
const pfDraftWanted = () => pfClaude() && S.pf.draft!==false && !chatAtLimit(S.chatUse) && !!S.pf.res && !S.pf.res.facts.sample;
const pfEntLabel = (kind, code) => `NAIC ${kind==="group"?"group":"company"} ${code}`;
function pfName(f){ const e=f&&f.entity||{}; return !blank(e.name) ? String(e.name) : S.pf.asked&&!blank(S.pf.asked.name) ? S.pf.asked.name : pfEntLabel(e.kind, e.code); }
function pfYears(f){ const y=(f.years||[]).filter(isNum).map(Number); return !y.length ? "n/d" : y.length===1 ? String(y[0]) : `${Math.min(...y)} to ${Math.max(...y)}`; }

function enterProfile(){

/* ----- which template a deck is built on: three levels and a one-off, the first found is used -----
   1. "once": a file chosen from this computer for the next deck only, never stored anywhere;
   2. "own": the login's own template, "<their user id>/template.pptx" in the private bucket (migration 0008): only
      they can read or change it, Corp Dev included, and nothing on the page lists who has one;
   3. "std": the standard template.pptx that Corp Dev uploads for everyone (migration 0004);
   4. "builtin": template-builtin.pptx beside this page (made by scripts/make-builtin-template.py), so a deck can be
      built before anyone has uploaded anything.
   The chosen template's bytes are kept in memory for the session only (never in browser storage); a change of
   template drops them. */
const TPL_OWN_MAX = 20*1024*1024, TPL_BUILTIN = "template-builtin.pptx";
function freshTplMore(){ return {ownOn:null, own:null, ownBusy:"", ownErr:"", ownNote:"", once:null, onceBusy:"", onceErr:"", bytesKey:"", builtinErr:"", askRemove:false, used:null}; }
const tplLevel = tp => tp.once ? "once" : tp.own ? "own" : tp.info ? "std" : "builtin";
const tplKeyOf = tp => { const l=tplLevel(tp); return l==="own" ? "own:"+(tp.own.at||"") : l==="std" ? "std:"+(tp.info.at||"") : l; };
const tplUid = () => { const u=S.session&&S.session.uid; return u && /^[A-Za-z0-9-]{1,64}$/.test(String(u)) ? String(u) : ""; };
const tplOwnPath = () => tplUid()+"/"+TPL_PATH;
// a file name for the page: no control or direction characters, at most 80 characters
const tplFileName = n => String(n==null?"":n).replace(/[\u0000-\u001f\u007f-\u009f‎‏‪-‮⁦-⁩]/g,"").trim().slice(0,80) || "the file you chose";
const tplNext = tp => tp.own&&tplLevel(tp)!=="own" ? "your own template" : tp.info ? "the standard template" : "the built-in plain template";
const TPL_BUILTIN_ERR = "The built-in plain template couldn't be loaded. Check your connection and try again, or upload a template to build on.";
const tplOwnOffText = () => isCorpDev() ? "Templates of your own aren't switched on yet. Run migration 0008_own_templates.sql in the Supabase SQL editor (see the README), then reload this page."
  : "Templates of your own aren't switched on yet. Ask Corp Dev to run migration 0008_own_templates.sql in Supabase (see the README).";
function tplDropBytes(tp){ if(tp.bytes && tp.bytesKey!==tplKeyOf(tp)){ tp.bytes=null; tp.bytesKey=""; } }
/* The built-in template, from beside this page. Throws an Error with TPL_BUILTIN_ERR, which the block also shows. */
function builtinBytes(pf){
  const tp=pf.tpl; if(tp.builtinP) return tp.builtinP;
  return tp.builtinP=(async()=>{
    let buf=null;
    try{ const r=await fetch(TPL_BUILTIN, {cache:"no-cache"}); if(r.ok) buf=await r.arrayBuffer(); }catch{ buf=null; }
    const u=buf&&buf.byteLength>4 ? new Uint8Array(buf, 0, 2) : null;
    if(!u || u[0]!==0x50 || u[1]!==0x4B){ if(S.pf===pf){ tp.builtinErr=TPL_BUILTIN_ERR; render(); } throw new Error(TPL_BUILTIN_ERR); }   // a zip starts "PK"
    if(S.pf===pf){ tp.builtinErr=""; if(tplLevel(tp)==="builtin"){ tp.bytes=buf; tp.bytesKey="builtin"; } }
    return buf;
  })().finally(()=>{ tp.builtinP=null; });
}
/* A file chosen for a template, checked here before anything is stored or built. Returns {bytes, r} or a message. */
async function tplCheckFile(file, max, what){
  if(!/\.pptx$/i.test(String(file.name||""))) return "Choose a PowerPoint file whose name ends in .pptx.";
  if(+file.size>max) return `That file is ${(+file.size/1048576).toFixed(1)} MB. ${what} can be at most ${Math.round(max/1048576)} MB.`;
  let bytes; try{ bytes=await file.arrayBuffer(); }catch{ return "Couldn't read that file. Choose it again."; }
  try{ await loadProfileLibs(); }catch{ return "Couldn't load the template check. Check your connection and try again."; }
  let r; try{ r=await window.SNLDeck.inspect(bytes); }catch{ r=null; }
  if(!r || !r.ok) return r&&!blank(r.message) ? String(r.message) : "That file can't be used as a template. Choose a PowerPoint file.";
  return {bytes, r};
}
const tplFound = r => `${plural(r.slides,"slide")}, ${isNum(r.widthIn)?(+r.widthIn).toFixed(2).replace(/\.?0+$/,""):"n/d"} x ${isNum(r.heightIn)?(+r.heightIn).toFixed(2).replace(/\.?0+$/,""):"n/d"} in`;
/* Your own template: upload or replace it */
function tplOwnPick(){
  const tp=S.pf.tpl; tp.ownErr=""; tp.ownNote="";
  if(tp.ownOn===false || !tplUid()){ tp.ownErr=tplOwnOffText(); render(); return; }
  document.getElementById("pf_ownFile")?.click();
}
async function uploadOwnTemplate(file){
  const pf=S.pf, tp=pf.tpl; if(!file || tp.ownBusy) return;
  const stop=msg=>{ if(S.pf!==pf) return; tp.ownBusy=""; tp.ownErr=msg; render(); };
  tp.ownErr=""; tp.ownNote="";
  if(tp.ownOn===false || !tplUid()){ stop(tplOwnOffText()); return; }
  tp.ownBusy="checking"; render();
  const c=await tplCheckFile(file, TPL_OWN_MAX, "Your own template");
  if(!S.session || S.pf!==pf) return;
  if(typeof c==="string"){ stop(c); return; }
  tp.ownBusy="uploading"; render();
  const replaced=!!tp.own;
  let error=null;
  try{ ({error}=await S.sb.storage.from(TPL_BUCKET).upload(tplOwnPath(), file, {upsert:true, contentType:PPTX_TYPE, cacheControl:"60"})); }catch(e){ error=e; }
  if(!S.session || S.pf!==pf) return;
  if(error){ const k=tplErrKind(error);
    stop(k==="refused"||k==="nobucket" ? tplOwnOffText() : k==="network" ? "Couldn't reach storage to upload your template. Check your connection and try again." : `Couldn't upload your template: ${(error&&error.message)||"unknown error"}. Try again.`); return; }
  tp.ownBusy=""; tp.own={at:new Date().toISOString(), size:+file.size||null}; tplDropBytes(tp);
  if(tplLevel(tp)==="own"){ tp.bytes=c.bytes; tp.bytesKey=tplKeyOf(tp); }
  tp.ownNote=`Your own template is ${replaced?"replaced":"uploaded"}: ${tplFound(c.r)}. Your decks are built on it from now on, and nobody else can see it.`;
  render();
}
async function removeOwnTemplate(){
  const pf=S.pf, tp=pf.tpl; if(tp.ownBusy || !tp.own) return;
  tp.ownBusy="removing"; tp.ownErr=""; tp.ownNote=""; render();
  let error=null;
  try{ ({error}=await S.sb.storage.from(TPL_BUCKET).remove([tplOwnPath()])); }catch(e){ error=e; }
  if(!S.session || S.pf!==pf) return;
  if(error){ tp.ownBusy=""; tp.ownErr=tplErrKind(error)==="network" ? "Couldn't reach storage to remove your template. Check your connection and try again." : `Couldn't remove your template: ${(error&&error.message)||"unknown error"}. Try again.`; render(); return; }
  tp.own=null; tplDropBytes(tp);
  await checkTemplate();   // what storage says now
  if(!S.session || S.pf!==pf) return;
  tp.ownBusy="";
  if(tp.own) tp.ownErr="Your own template couldn't be removed. Try again, or ask Corp Dev to check that migration 0008_own_templates.sql has been run.";
  else if(!tp.err) tp.ownNote=`Your own template is removed. Your next deck uses ${tplNext(tp)}.`;
  render();
}
/* The standard template: Corp Dev removes it, after one question */
async function removeStdTemplate(){
  const pf=S.pf, tp=pf.tpl; if(tp.uploading || !isCorpDev()) return;
  tp.uploading="removing"; tp.upErr=""; tp.upNote=""; render();
  let error=null;
  try{ ({error}=await S.sb.storage.from(TPL_BUCKET).remove([TPL_PATH])); }catch(e){ error=e; }
  if(!S.session || S.pf!==pf) return;
  if(error){ tp.uploading=""; tp.upErr=tplErrKind(error)==="network" ? "Couldn't reach storage to remove the standard template. Check your connection and try again." : `Couldn't remove the standard template: ${(error&&error.message)||"unknown error"}. Try again.`; render(); return; }
  tp.info=null; tplDropBytes(tp);
  await checkTemplate();
  if(!S.session || S.pf!==pf) return;
  tp.uploading=""; tp.askRemove=false;
  if(tp.info) tp.upErr="The standard template couldn't be removed. Check that this login is a Corp Dev login and that migration 0004_profile_template.sql has been run.";
  else if(!tp.err) tp.upNote="The standard template is removed. Everyone without a template of their own now builds on the built-in plain template, until a new standard template is uploaded.";
  render();
}
/* Just this once: a file from this computer, checked, kept in memory for the next deck only */
async function chooseOnceTemplate(file){
  const pf=S.pf, tp=pf.tpl; if(!file || tp.onceBusy) return;

}
function tplOnceCancel(){ const tp=S.pf.tpl; tp.once=null; tp.onceErr=""; render(); }
document.addEventListener("change", e=>{

});
/* For a built deck's "ready" message: the template it was built on, fixed the first time the message is drawn (right
   after the build). A file used just this once has then been used, so it is let go. */
function tplBuiltOnText(b){
  if(!b) return "";
  const tp=S.pf.tpl;
  if(!b.tpl){ const u=tp.used; b.tpl=u ? {level:u.level, name:u.name||""} : {level:""}; if(u && u.level==="once" && u.ref && tp.once===u.ref) tp.once=null; }
  const l=b.tpl.level;
  return l==="once" ? ` Built on ${b.tpl.name}, a file used just this once.` : l==="own" ? " Built on your own template." : l==="std" ? " Built on the standard template." : l==="builtin" ? " Built on the built-in plain template." : "";
}
function pfTplNowHTML(tp){

  const line = lv==="own" ? `<b>Your own template</b>, uploaded ${esc(fmtAt(tp.own.at))}.`
    : lv==="std" ? `<b>The standard template</b>, uploaded by Corp Dev on ${esc(fmtAt(tp.info.at))}.`
    : `<b>The built-in plain template</b>: nobody has uploaded one yet.`;

async function loadProfileStatus(){

// today's questions and their cost, for the line under the draft choice and the Ask Claude panel alike
function pfChatUse(){ loadChatUse().then(()=>{ if(S.session && S.view==="profile") render(); }); }

/* The scripts that build the slides, loaded once, in order; a failed load can be tried again. */
function loadProfileLibs(){
  if(window.JSZip && window.SNLDeck && window.SNLProfile) return Promise.resolve();
  return loadProfileLibs.p || (loadProfileLibs.p=(async()=>{
    if(!window.JSZip) await loadScript(JSZIP_SRC);
    if(!window.SNLDeck) await loadScript(DECK_SRC);
    if(!window.SNLProfile) await loadScript(SLIDES_SRC);
    if(!window.JSZip || !window.SNLDeck || !window.SNLProfile) throw new Error("The slide builder didn't load");
  })().finally(()=>{ loadProfileLibs.p=null; }));
}
const PF_LIBS_ERR = "Couldn't load the slide builder. Check your connection and try again.";

/* ----- the template in storage ----- */
function tplErrKind(e){
  const m=`${e&&e.statusCode||""} ${e&&e.status||""} ${e&&e.error||""} ${e&&e.message||""}`;
  return /bucket not found/i.test(m) ? "nobucket" : /row-level security|unauthori[sz]ed|forbidden|permission|denied|\b403\b|policy/i.test(m) ? "refused"
    : /not found|\b404\b/i.test(m) ? "nofile" : /fetch|network|load failed|timed? ?out/i.test(m) ? "network" : "other";
}
function tplErrText(kind, e, upload){
  const what=upload?"upload":"get";
  if(kind==="nobucket") return isCorpDev() ? "The place the template is kept isn't set up yet. Run migration 0004_profile_template.sql in Supabase (see the README), then try again." : "The place the template is kept isn't set up yet. Ask Corp Dev to finish the set-up.";
  if(kind==="refused") return upload ? "Only Corp Dev logins can upload the template. If this is a Corp Dev login, check that migration 0004_profile_template.sql has been run (see the README)." : "This login isn't allowed to read the template. Ask Corp Dev.";
  if(kind==="network") return `Couldn't reach storage to ${what} the template. Check your connection and try again.`;
  if(kind==="nofile") return isCorpDev() ? "There is no template yet. Upload your PowerPoint template first." : "There is no template yet. Ask Corp Dev to upload the template.";
  return `Couldn't ${what} the template: ${(e&&e.message)||"unknown error"}. Try again.`;
}
/* Which templates exist for this login: the standard one (a listing of the bucket), whether templates of your own are
   switched on (migration 0008 lets logins see the bucket's settings; before it they can't), and this login's own (a
   listing of its own folder, which only it can read). The three are asked at once. Returns a promise. */
function checkTemplate(){
  const pf=S.pf, tp=pf.tpl; if(tp.loading && tp.checking) return tp.checking;
  tp.loading=true; tp.err=""; tp.errKind=""; render();
  const ask=f=>Promise.resolve().then(f).then(r=>r||{}, e=>({error:e}));
  const st=S.sb.storage, uid=tplUid();
  return tp.checking=(async()=>{
    const [b, root, mine]=await Promise.all([ask(()=>typeof st.getBucket==="function" ? st.getBucket(TPL_BUCKET) : {error:{message:"Bucket not found"}}),
      ask(()=>st.from(TPL_BUCKET).list("", {limit:100, search:TPL_PATH})), uid ? ask(()=>st.from(TPL_BUCKET).list(uid, {limit:100, search:TPL_PATH})) : {data:[]}]);
    if(!S.session || S.pf!==pf) return;
    tp.loading=false; tp.checked=true; tp.checking=null;
    const {data, error}=root, find=d=>{ const o=(Array.isArray(d)?d:[]).find(x=>x && x.name===TPL_PATH), m=o&&o.metadata||{}; return o ? {at:o.updated_at||o.created_at||m.lastModified||null, size:isNum(m.size)?+m.size:null} : null; };
    if(error){ tp.errKind=tplErrKind(error); if(tp.errKind==="nofile"||tp.errKind==="nobucket") tp.info=null; if(tp.errKind!=="nofile") tp.err=tplErrText(tp.errKind, error, false); }
    else tp.info=find(data);
    tp.ownOn = b.error ? (tplErrKind(b.error)==="network" ? null : false) : !!b.data;
    tp.own = tp.ownOn && !mine.error ? find(mine.data) : null;
    tplDropBytes(tp);   // a change of template drops the bytes kept
    render();
    if((!tp.err || tp.errKind==="nobucket") && tplLevel(tp)==="builtin" && !tp.bytes) builtinBytes(pf).catch(()=>{});   // early, so a failure shows in the block
  })();
}
/* The bytes of the template the next deck is built on: from memory when they are the same template as last time.
   Records which template it was (tp.used) for the "ready" message. Throws an Error with a message for the page. */
async function templateBytes(pf){
  const tp=pf.tpl;
  if(tp.once){ tp.used={level:"once", name:tp.once.name, ref:tp.once}; return tp.once.bytes; }
  if(!tp.checked || tp.loading || (tp.err && tp.errKind!=="nobucket")){
    await checkTemplate();
    if(!S.session || S.pf!==pf) throw new Error("Your session has ended. Sign in again.");
    if(tp.err && tp.errKind!=="nobucket") throw new Error(tp.err);
    if(tp.once) return templateBytes(pf);
  }
  const lv=tplLevel(tp), key=tplKeyOf(tp);
  if(tp.bytes && tp.bytesKey===key){ tp.used={level:lv}; return tp.bytes; }
  let buf;
  if(lv==="builtin") buf=await builtinBytes(pf);
  else {
    let data=null, error=null;
    try{ ({data, error}=await S.sb.storage.from(TPL_BUCKET).download(lv==="own"?tplOwnPath():TPL_PATH)); }catch(e){ error=e; }
    if(error || !data){ const k=error?tplErrKind(error):"other";
      if(k==="nofile" && S.pf===pf){
        if(lv==="own") tp.own=null; else tp.info=null;
        tplDropBytes(tp);
        throw new Error(`${lv==="own"?"Your own template":"The standard template"} has been removed since this page checked. Choose Try again to build on ${tplNext(tp)}.`); }
      throw new Error(tplErrText(k, error, false)); }
    try{ buf=await data.arrayBuffer(); }catch{ throw new Error(tplErrText("network", null, false)); }
  }
  if(S.pf===pf && tplKeyOf(tp)===key){ tp.bytes=buf; tp.bytesKey=key; }
  tp.used={level:lv};
  return buf;
}
async function uploadTemplate(file){
  const pf=S.pf, tp=pf.tpl; if(!file || tp.uploading || !isCorpDev()) return;
  const stop=msg=>{ if(S.pf!==pf) return; tp.uploading=""; tp.upErr=msg; render(); };
  tp.upErr=""; tp.upNote=""; tp.askRemove=false;
  if(!/\.pptx$/i.test(String(file.name||""))){ stop("Choose a PowerPoint file whose name ends in .pptx."); return; }
  if(+file.size>TPL_MAX){ stop(`That file is ${(+file.size/1048576).toFixed(1)} MB. The standard template can be at most 50 MB.`); return; }
  tp.uploading="checking"; render();
  const c=await tplCheckFile(file, TPL_MAX, "The standard template");
  if(!S.session || S.pf!==pf) return;
  if(typeof c==="string"){ stop(c); return; }
  const {bytes, r}=c;
  tp.uploading="uploading"; render();
  const replaced=!!tp.info;
  let error=null;
  try{ ({error}=await S.sb.storage.from(TPL_BUCKET).upload(TPL_PATH, file, {upsert:true, contentType:PPTX_TYPE, cacheControl:"60"})); }catch(e){ error=e; }
  if(!S.session || S.pf!==pf) return;
  if(error){ stop(tplErrText(tplErrKind(error), error, true)); return; }
  tp.uploading=""; tp.info={at:new Date().toISOString(), size:+file.size||null}; tp.checked=true; tp.err=""; tp.errKind=""; tplDropBytes(tp);
  if(tplLevel(tp)==="std"){ tp.bytes=bytes; tp.bytesKey=tplKeyOf(tp); }
  tp.upNote=`Standard template ${replaced?"replaced":"uploaded"}: ${tplFound(r)}. Everyone without a template of their own builds on it from now on.${tp.own?" Your own decks still use your own template.":""}`;
  render();
}
document.addEventListener("change", e=>{

});

/* ----- the figures, Claude's draft, and the file ----- */
function pfReset(pf){ pf.res=null; pf.err=null; pf.plan=null; pf.libsErr=""; pf.drafted=null; pf.draftErr=null; pf.built=null; pf.buildErr=""; }
async function pfFacts(){
  const pf=S.pf; if(pf.busy) return;
  const code=pf.code.trim(), kind=pf.kind;
  if(!naicOk(code)){ pf.formErr = code ? "NAIC codes are numbers of up to 6 digits, like 90001." : `Choose a ${kind}: find it by name, or type its NAIC ${kind} code.`; render(); return; }
  pf.formErr=""; pfReset(pf); pf.busy="facts"; pf.asked={kind, code, name:pf.name}; render();
  const r=await callFn("snl-profile",{action:"facts", kind, code});
  if(!S.session || S.pf!==pf) return;
  pf.busy="";
  if(r.data && r.data.facts && typeof r.data.facts==="object" && r.data.text){ pfTake(pf, r.data); loadStatus(); }
  else if(r.err!=="signin"){ pf.err = r.data ? {err:"bad_answer", msg:"The profile function sent back something the page can't read. Try again."} : r; if(r.err==="not_configured"||r.err==="not_mapped"){ pf.status=null; loadProfileStatus(); } }
  render();
}
function pfTake(pf, data){ pf.res={facts:data.facts, text:data.text}; pf.plan=null; pf.libsErr=""; if(pfHasData(data.facts)) pfPlan(pf); }
async function pfPlan(pf){
  try{ await loadProfileLibs(); }catch{ if(S.pf===pf){ pf.libsErr=PF_LIBS_ERR; render(); } return; }
  if(S.pf!==pf || !pf.res) return;
  let plan=null; try{ plan=window.SNLProfile.plan(pf.res.facts); }catch{}
  if(!Array.isArray(plan)){ pf.libsErr="Couldn't work out which slides these figures fill. Try again."; render(); return; }
  pf.plan=plan.filter(s=>s&&typeof s==="object"); pf.libsErr=""; render();
}
async function pfSample(){
  const pf=S.pf; if(pf.busy || pf.fp.busy) return;
  pf.mode="full";   // the full profile's sample shows in the full profile
  pfReset(pf); pf.busy="sample"; pf.asked=null; render();
  const r=await callFn("snl-profile",{action:"sample"});
  if(!S.session || S.pf!==pf) return;
  pf.busy="";
  if(r.data && r.data.facts && typeof r.data.facts==="object" && r.data.text){ pfTake(pf, r.data); if(pfHasTemplate()){ await pfMake(pf); return; } }
  else if(r.err!=="signin") pf.err = r.data ? {err:"bad_answer", msg:"The profile function sent back something the page can't read. Try again."} : r;
  render();
}
/* Build: Claude drafts the text first when that is chosen (once per set of figures), then the file is made. plain:
   build with the plain text, after a draft couldn't be had. */
async function pfBuild(plain){
  const pf=S.pf; if(pf.busy || !pf.res || !pfHasData(pf.res.facts)) return;
  if(!pfHasTemplate()){ pf.buildErr=tplErrText("nofile"); render(); return; }
  if(plain){ pf.draft=false; pf.draftErr=null; }
  if(!plain && pfDraftWanted() && !pf.drafted){
    pf.busy="draft"; pf.draftErr=null; pf.built=null; pf.buildErr=""; render();
    const e=pf.res.facts.entity||{};
    const r=await callFn("snl-profile",{action:"draft", kind:e.kind==="group"?"group":"company", code:String(e.code??"")});
    if(!S.session || S.pf!==pf) return;
    pfChatUse();   // the day's count and cost, now with this draft
    if(r.data && r.data.facts && typeof r.data.facts==="object" && r.data.text){
      pf.drafted={facts:r.data.facts, text:r.data.text, usage:r.data.usage||null};
      markSeen(r.data.jobId);   // the draft is saved as a past answer; it is already in front of the reader, so no "Answer ready"
    } else if(r.err!=="signin"){ pf.busy=""; pf.draftErr = r.data ? {err:"bad_answer", msg:"Claude's draft came back in a form the page can't read."} : r; render(); return; }
    else return;
  }
  await pfMake(pf);
}
function pfFileName(spec){
  const n=String(spec&&spec.fileName||"").replace(/[\\/:*?"<>|\u0000-\u001f]+/g,"-").trim();
  return n ? (/\.pptx$/i.test(n) ? n : n+".pptx") : `profile-${TODAY()}.pptx`;
}
async function pfMake(pf){
  pf.busy="build"; pf.buildErr=""; pf.built=null; render();
  const use = pf.drafted && pfDraftWanted() ? pf.drafted : pf.res;
  const fail=msg=>{ if(!S.session || S.pf!==pf) return; pf.busy=""; pf.buildErr=msg; render(); };
  let bytes; try{ bytes=await templateBytes(pf); }catch(e){ fail(e.message); return; }
  if(!S.session || S.pf!==pf) return;
  try{ await loadProfileLibs(); }catch{ fail(PF_LIBS_ERR); return; }
  if(!S.session || S.pf!==pf) return;
  let spec; try{ spec=window.SNLProfile.spec(use.facts, use.text); }catch(e){ fail("Couldn't lay out the slides from these figures. "+((e&&e.message)||"")); return; }
  let out; try{ out=await window.SNLDeck.build(bytes.slice(0), spec); }catch(e){ fail("Couldn't build the PowerPoint file. "+((e&&e.message)||"Try again.")); return; }
  if(!S.session || S.pf!==pf) return;
  pf.busy=""; pf.built={blob:new Blob([out],{type:PPTX_TYPE}), name:pfFileName(spec), by:use.text&&use.text.by==="claude"?"claude":"plain"};
  render(); saveBlob(pf.built.blob, pf.built.name);
}
function pfDownloadAgain(){ const b=S.pf.built; if(b) saveBlob(b.blob, b.name); }

function pfDraftErrText(r){
  if(r.err==="limit"||r.err==="daily_limit") return "You've reached today's limit of questions to Claude, so it can't draft the text now. Build with plain text instead, or try again tomorrow.";

/* ---------- Profile, filings: a profile deck from S&P filings alone ----------
   The second kind of profile on this view. The reader chooses one company or a whole group from the company list (by
   name: the list has S&P institution ids and group names, not NAIC codes) and a period; the profile function runs ONE
   filing search (saved unlisted, inside a cap of S&P requests) and works out every figure; the deck is built here by
   SNLProfile.filingsSpec on the same template. The page sends who and the period, never figures. */

const FP_WINDOW_DAYS = 365;
function freshFp(){ return {find:{q:"", asked:"", matches:null, groups:null, busy:false, err:""}, pick:null, years:3, formErr:"", busy:"", asked:null, res:null, err:null, plan:null, libsErr:"", draft:null, drafted:null, draftErr:null, built:null, buildErr:"",
  cand:null, nRate:null, nForm:null, dst:null, dErr:null, mk:null, refreshErr:null}; }
// which profile the view shows: the reader's choice, else the full one once statutory data is ready, else filings
const pfMode = () => S.pf.mode || (pfLive() ? "full" : "filings");
const fpFilingsOff = () => { const s=S.pf.status&&S.pf.status.filings; return !!s && s.configured===false; };
const fpDraftWanted = () => pfClaude() && S.pf.fp.draft!==false && !chatAtLimit(S.chatUse) && !!S.pf.fp.res && !S.pf.fp.res.facts.sample;

}

/* ----- choosing: a company or a whole group from the company list ----- */
async function fpLookup(){
  const fp=S.pf.fp, fd=fp.find, q=fd.q.trim();
  if(!q){ fd.matches=null; fd.groups=null; fd.err="Type part of a company or group name."; render(); return; }
  fd.busy=true; fd.err=""; fd.matches=null; fd.groups=null; fd.asked=q; render();
  const r=await callFn("snl-filings",{action:"resolve", q});
  if(!S.session || S.pf.fp!==fp || fd.asked!==q) return;
  fd.busy=false;
  if(r.data){ fd.matches=Array.isArray(r.data.matches)?r.data.matches.filter(m=>m&&typeof m==="object"):[];
    fd.groups=Array.isArray(r.data.groups)?r.data.groups.filter(g=>g&&typeof g==="object"&&!blank(g.name)&&Array.isArray(g.members)):[]; }
  else if(r.err!=="signin") fd.err="Couldn't look that up. "+errText(r);
  render();
}
function fpChooseCompany(i){
  const fp=S.pf.fp, m=fp.find.matches&&fp.find.matches[i], id=m&&snapIdOf(m); if(!id || fp.busy) return;
  fp.pick={kind:"company", name:id.name||`S&P ${id.kind==="companyId"?"company":"institution"} id ${id.id}`, group:blank(m.naicGroupName)?"":String(m.naicGroupName), ids:[id], noId:0, over:false};
  fp.find.matches=null; fp.find.groups=null; fp.formErr=""; render(); document.getElementById("fp_get")?.focus();
}
function fpChooseGroup(i){
  const fp=S.pf.fp, g=fp.find.groups&&fp.find.groups[i]; if(!g || fp.busy) return;
  const seen=new Set(), ids=[];
  for(const m of g.members){ const id=m&&typeof m==="object"?snapIdOf(m):null, k=id&&id.kind+":"+id.id; if(id && !seen.has(k)){ seen.add(k); ids.push(id); } }
  const n=v=>isNum(v)?Math.max(0, Math.round(+v)):0;
  fp.pick={kind:"group", name:String(g.name), group:String(g.name), ids, noId:Math.max(0, n(g.companies)-n(g.searchable)), over:!!g.tooBig || n(g.searchable)>ids.length};
  fp.find.matches=null; fp.find.groups=null; fp.formErr=""; render(); document.getElementById("fp_get")?.focus();
}
// the period as the function works it out: the last N x 365 days up to today, exactly N windows of dates for S&P
function fpRange(years){ const to=TODAY(); return {from:daysBefore(to, FP_WINDOW_DAYS*years-1), to}; }
function fpPlanned(ids, years){ const r=fpRange(years); return snapCost(ids, r.from, r.to); }
/* Why this profile can't be built, with what to choose instead; "" when it can. The function checks the same before
   any S&P request (fpRefusal in profile.ts), so this is the reader's early warning. */
function fpTooBig(pick, years){
  if(!pick) return "";
  if(!pick.ids.length) return pick.kind==="group" ? "No company in this group has an S&P id in the company list, so the group's filings can't be searched." : "This company has no S&P id in the company list, so its filings can't be searched.";
  if(pick.over || pick.ids.length>MAX_COMPANIES) return `${pick.name} has more than ${MAX_COMPANIES} companies with S&P ids in the company list, and one filings profile covers at most ${MAX_COMPANIES}. Profile one of its companies instead.`;
  const need=fpPlanned(pick.ids, years);
  if(need<=FP_MAX_PLANNED) return "";
  const fit=FP_YEARS.filter(y=>fpPlanned(pick.ids, y)<=FP_MAX_PLANNED);
  return `A filings profile of ${pick.name} over ${fpYearsText(years)} needs at least ${need} S&P requests (one for each 10 companies and each year of dates), more than the ${FP_MAX_PLANNED} one filings profile may plan. ${fit.length?`Choose ${fpYearsText(Math.max(...fit))} instead.`:"Profile one of its companies instead."}`;
}
function fpBody(action, pick, years, scope){
  const b={action, kind:pick.kind, years};
  if(pick.kind==="group") b.group=pick.name; else b[pick.ids[0].kind]=String(pick.ids[0].id);
  // Narrow it down: only when something is chosen, so a profile nobody narrowed asks exactly what it always has
  if(scope && scope.states && scope.states.length) b.states=scope.states.slice();
  const ids=(scope&&scope.tois||[]).map(t=>Number(t.id)).filter(Number.isInteger); if(ids.length) b.typeOfInsuranceIds=ids;
  return b;
}
// what a filings profile was narrowed to: the facts' own scope (the function's words), else not narrowed
function fpScopeOf(f){ const s=f&&f.scope; return s&&typeof s==="object"&&s.narrowed===true&&typeof s.words==="string"&&typeof s.short==="string" ? s : null; }

/* ----- the figures, Claude's draft and the file ----- */
function fpReset(fp){ fp.res=null; fp.err=null; fp.plan=null; fp.libsErr=""; fp.drafted=null; fp.draftErr=null; fp.built=null; fp.buildErr=""; }
async function fpFacts(){
  const fp=S.pf.fp; if(fp.busy) return;
  if(!fp.pick){ fp.formErr="Choose a company or a group first: find it by name above."; render(); return; }
  const big=fpTooBig(fp.pick, fp.years); if(big){ fp.formErr=big; render(); return; }
  fp.formErr=""; fpReset(fp); fp.busy="facts"; fp.asked={pick:JSON.parse(JSON.stringify(fp.pick)), years:fp.years, scope:nwKeep("fp")}; render();
  const r=await callFn("snl-profile", fpBody("filings_facts", fp.asked.pick, fp.asked.years, fp.asked.scope));
  if(!S.session || S.pf.fp!==fp) return;
  fp.busy="";
  if(r.data && r.data.facts && typeof r.data.facts==="object" && r.data.text){ fpTake(fp, r.data); loadStatus(); }
  else if(r.err!=="signin") fp.err = r.data ? {err:"bad_answer", msg:"The profile function sent back something the page can't read. Try again."} : r;
  render();
}
function fpTake(fp, data){ fp.res={facts:data.facts, text:data.text, search:data.search&&typeof data.search==="object"?data.search:null, spRequests:isNum(data.spRequests)?+data.spRequests:null}; fp.plan=null; fp.libsErr=""; fpPlan(fp);
  fp.cand=fpCandOf(data.candidates); if(!data.facts.sample && !fp.dst && !fp.dErr) fpDigestStatus(fp); }
async function fpPlan(fp){
  try{ await loadProfileLibs(); }catch{ if(S.pf.fp===fp){ fp.libsErr=PF_LIBS_ERR; render(); } return; }
  if(S.pf.fp!==fp || !fp.res) return;
  let plan=null; try{ plan=typeof window.SNLProfile.filingsPlan==="function" ? window.SNLProfile.filingsPlan(fp.res.facts, {usMap:US_MAP}) : null; }catch{}
  if(!Array.isArray(plan)){ fp.libsErr="Couldn't work out which slides these filings fill. Reload the page and try again."; render(); return; }

}
async function fpSample(){

async function fpBuild(plain){
  const pf=S.pf, fp=pf.fp; if(fp.busy || !fp.res) return;
  if(!pfHasTemplate()){ fp.buildErr=tplErrText("nofile"); render(); return; }
  if(plain){ fp.draft=false; fp.draftErr=null; }

      fp.drafted={facts:r.data.facts, text:r.data.text, usage:r.data.usage||null};
      markSeen(r.data.jobId);   // saved as a past answer; already in front of the reader
    } else if(r.err!=="signin"){ fp.busy=""; fp.draftErr = r.data ? {err:"bad_answer", msg:"Claude's draft came back in a form the page can't read."} : r; render(); return; }

async function fpMake(fp){

  const fail=msg=>{ if(!S.session || S.pf.fp!==fp) return; fp.busy=""; fp.buildErr=msg; render(); };
  let bytes; try{ bytes=await templateBytes(pf); }catch(e){ fail(e.message); return; }
  if(!S.session || S.pf.fp!==fp) return;
  try{ await loadProfileLibs(); }catch{ fail(PF_LIBS_ERR); return; }

  let spec; try{ spec=window.SNLProfile.filingsSpec(use.facts, use.text, {usMap:US_MAP}); }catch(e){ fail("Couldn't lay out the slides from these filings. "+((e&&e.message)||"")); return; }
  let out; try{ out=await window.SNLDeck.build(bytes.slice(0), spec); }catch(e){ fail("Couldn't build the PowerPoint file. "+((e&&e.message)||"Try again.")); return; }
  if(!S.session || S.pf.fp!==fp) return;

}

/* ----- saved filing summaries: what the profile has, and summarising more before building, only when chosen -----
   The profile function reads the saved summaries of the company's filings for free and says which rate and form
   filings have none (candidates, newest first). Making one is the summaries function's "make": 1 S&P request and one
   Claude read of up to 150 pages, and one of the day's questions, so nothing is made until the reader chooses how
   many, with the cost stated first. Then the figures are worked out again from the saved search (no new S&P search).
   Uses the Programs and forms page's helpers (fcEstimate, fcUsd, fcWhy) when they are there. */
const FP_SUM_MAX = 10, FP_SUM_RATE = 5, FP_SUM_FORM = 3;
function fpCandOf(c){
  const ok=x=>x&&typeof x==="object"&&!Array.isArray(x)&&x.row&&typeof x.row==="object"&&!Array.isArray(x.row);
  const list=v=>(Array.isArray(v)?v:[]).filter(ok).slice(0, 25);
  return c&&typeof c==="object" ? {rate:list(c.rate), form:list(c.form)} : {rate:[], form:[]};
}
function fpSumNs(fp){
  const c=fp.cand||{rate:[],form:[]}, n=(v, max, d)=>{ const k=v===null||v===undefined||v==="" ? d : Math.round(+v); return Number.isFinite(k)&&k>=0 ? Math.min(k, max) : Math.min(d, max); };
  return {r:n(fp.nRate, Math.min(FP_SUM_MAX, c.rate.length), FP_SUM_RATE), f:n(fp.nForm, Math.min(FP_SUM_MAX, c.form.length), FP_SUM_FORM)};
}
function fpSumQueue(fp){ const c=fp.cand||{rate:[],form:[]}, n=fpSumNs(fp); return [...c.rate.slice(0,n.r), ...c.form.slice(0,n.f)]; }
function fpSumEstimate(q){
  const shaped=q.map(c=>({f:{r:{pages:isNum(c.pages)?+c.pages:null}}}));
  if(typeof fcEstimate==="function"){ try{ return fcEstimate(shaped); }catch{} }
  const pages=q.reduce((a,c)=>a+(isNum(c.pages)&&+c.pages>0?Math.min(+c.pages,150):150),0);
  return {pages, lo:pages*2.30/150, hi:pages*3.50/150, unknown:q.filter(c=>!(isNum(c.pages)&&+c.pages>0)).length};
}
const fpUsd = v => typeof fcUsd==="function" ? fcUsd(v) : "$"+(+v).toLocaleString("en-US",{minimumFractionDigits:2, maximumFractionDigits:2});
async function fpDigestStatus(fp){
  const r=await callFn("snl-digest",{action:"status"});
  if(!S.session || S.pf.fp!==fp) return;
  if(r.data){ fp.dst=r.data; fp.dErr=null; } else if(r.err!=="signin") fp.dErr=r;
  render();
}
function fpSumOff(fp){
  const d=fp.dst, e=fp.dErr;
  if(e && e.err==="not_deployed") return "Summaries can't be made here: the summaries function isn't on this site"+(isCorpDev()?" (deploy snl-digest; see the README).":".");
  if(e && e.err==="no_tables") return "Summaries can't be made yet: their table isn't in the database (migration 0005).";
  if(d && d.claude && d.claude.configured===false) return "New summaries can't be made yet: Claude isn't set up on this site.";
  if(d && d.filings && d.filings.configured===false) return "New summaries can't be made yet: S&P isn't set up on this site.";
  if(chatAtLimit(S.chatUse)) return "Today's limit on questions is reached, so no summary can be made until midnight UTC.";
  return "";
}
function fpSumHTML(fp){
  const f=fp.res.facts, U=f.summaries;

  const c=k=>U[k]&&typeof U[k]==="object"?U[k]:{filings:0, summarised:0, older:0, withDocument:0};
  const R=c("rate"), F=c("form"), older=(+R.older||0)+(+F.older||0);

  h+=`<div class="inline fpsumpick"><label for="fp_nRate" class="t2"><b>Summarise the latest</b></label><select id="fp_nRate" data-bind="pf.fp.nRate" data-live style="width:auto" ${fp.busy?"disabled":""}>${opts(Math.min(FP_SUM_MAX, cand.rate.length), n.r)}</select><label for="fp_nForm" class="t2"><b>rate filings and the latest</b></label><select id="fp_nForm" data-bind="pf.fp.nForm" data-live style="width:auto" ${fp.busy?"disabled":""}>${opts(Math.min(FP_SUM_MAX, cand.form.length), n.f)}</select><span class="t2"><b>form filings</b></span></div>`;
  h+=`<p class="t2" id="fpSumWhich" style="margin:0">${plural(cand.rate.length,"rate filing")} and ${plural(cand.form.length,"form filing")}${sw?` in ${esc(sw.short)}`:""} have no current summary${cand.rate.some(x=>x.older)||cand.form.some(x=>x.older)?" (older summaries are made again)":""}; the newest are taken first.</p>`;
  if(q.length){
    const est=fpSumEstimate(q), cu=S.chatUse, left = cu && isNum(cu.dailyLimit) && isNum(cu.askedToday) ? Math.max(0, +cu.dailyLimit - +cu.askedToday) : null;
    h+=`<p style="margin:0" id="fpSumCost"><b>${plural(q.length,"new summary","new summaries")}: ${plural(q.length,"S&amp;P request")}, roughly ${fpUsd(est.lo)} to ${fpUsd(est.hi)} of Claude reading, and ${plural(q.length,"of today's questions","of today's questions")}.</b> <span class="t2">An estimate: up to the first 150 pages of each filing (${count(est.pages)} pages in all${est.unknown?`, counting ${plural(est.unknown,"filing")} with no page count as 150`:""}). What it really cost shows when it is done. Summaries are saved for everyone, so nobody pays to read these filings again.</span></p>`;

function fpSumMadeHTML(mk){

    <ul class="fcres" id="fpSumList">${mk.items.map(x=>x.state==="made"?`<li>${name(x)}: summarised.</li>`:x.state==="failed"?`<li class="no">${name(x)}: not summarised: ${esc(x.why)}</li>`:`<li class="no">${name(x)}: not started: ${esc(x.why||"")}</li>`).join("")}</ul></div>`;

async function fpSumMake(){
  const fp=S.pf.fp; if(fp.busy || (fp.mk&&fp.mk.busy) || !fp.res || fp.res.facts.sample || fpSumOff(fp)) return;
  const q=fpSumQueue(fp); if(!q.length) return;
  const mk=fp.mk={busy:true, stop:false, halt:"", n:q.length, i:0, cur:null, items:q.map(c=>({c, state:"queued", why:""})), made:0, usd:0, usdKnown:false, sp:0};
  fp.refreshErr=null; render();
  for(let i=0;i<mk.items.length;i++){
    const x=mk.items[i];
    if(mk.stop || mk.halt){ x.state="skipped"; x.why=mk.halt||"you pressed Stop."; continue; }
    mk.i=i+1; mk.cur=x; x.state="running"; render();
    const r=await callFn("snl-digest",{action:"make", filing:x.c.row, ...(x.c.older?{refresh:true}:{})});
    if(!S.session || S.pf.fp!==fp) return;   // the session ended: everything here was forgotten with it
    if(r.data && r.data.digest && typeof r.data.digest==="object"){
      x.state="made"; mk.made++;
      const u=r.data.usage&&typeof r.data.usage==="object"?r.data.usage:{};
      if(isNum(u.costUsd)){ mk.usd+=+u.costUsd; mk.usdKnown=true; } if(isNum(u.spRequests)) mk.sp+=+u.spRequests;
    } else {
      const res=r.data ? {err:"bad_answer", msg:"The summaries function sent back something the page can't read."} : r;
      x.state="failed"; x.why=typeof fcWhy==="function" ? fcWhy(res) : errText(res);
      if(["limit","daily_limit"].includes(res.err)) mk.halt="today's limit on questions was reached.";
      if(["not_configured","not_deployed","no_tables"].includes(res.err)){ mk.halt="summaries aren't set up yet."; fp.dErr=res; }
    }
  }
  mk.busy=false; mk.cur=null; render();
  pfChatUse(); loadStatus();
  if(mk.made) await fpRefresh(fp);
}
/* The figures again, after new summaries: the same company and period, from the saved search (no new S&P search). */
async function fpRefresh(fp){
  if(!fp.asked || fp.busy) return;
  fp.busy="refresh"; fp.refreshErr=null; render();
  const r=await callFn("snl-profile", fpBody("filings_facts", fp.asked.pick, fp.asked.years, fp.asked.scope));
  if(!S.session || S.pf.fp!==fp) return;
  fp.busy="";
  if(r.data && r.data.facts && typeof r.data.facts==="object" && r.data.text){ const keep=fp.mk; fpTake(fp, r.data); fp.mk=keep; fp.drafted=null; fp.built=null; fp.nRate=null; fp.nForm=null; }
  else if(r.err!=="signin") fp.refreshErr = r.data ? {err:"bad_answer", msg:"The profile function sent back something the page can't read. Try again."} : r;
  render();
}

/* ---------- Narrow it down: states and types of insurance on Snapshot, Compare, Market and the filings profile ----------

/* A scope in words, as the profile function writes it (fpScopeOf in profile.ts): words for sentences ("Florida and

const nwLower = s => /^[A-Z][a-z]/.test(s) ? s[0].toLowerCase()+s.slice(1) : s;

  const o=NW_OF[k]&&NW_OF[k](); if(o && "formErr" in o) o.formErr="";
