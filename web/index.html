/* ---------- Snapshot: one company or group over 1, 3 or 5 years, on one page ----------
   Page only. It looks companies up with the snl-filings "resolve" action, runs ONE "search" (every state in S&P's
   list, every filing type and status, by publish date: the same search the Filings view runs from that form, saved
   the same way) and works out every figure here from the rows that come back. */
VIEWS.push("snapshot");
const SNAP_YEARS = [1,3,5];
const SNAP_MAX_REQUESTS = 60;      // S&P requests one search may use: MAX_SEARCH_REQUESTS in supabase/functions/_shared/filings.ts
const SNAP_IDS_PER_REQUEST = 10;   // S&P takes 10 company ids a request (MAX_IDS_PER_REQUEST there)
const SNAP_WINDOW_DAYS = 365;      // and 365 days of dates a request, so a period of N years is exactly N windows
const SNAP_LOOKUP_MAX = 50;        // the most companies one look-up returns (resolveEntity there)
const SNAP_RECENT = 6, SNAP_LATEST = 10;
// The companies one snapshot can cover is MAX_COMPANIES, the same limit as one search on the Filings view.
function freshSnap(){ return {find:{q:"", asked:"", matches:null, busy:false, err:""}, pick:null, picking:"", pickErr:"", years:3, formErr:"", busy:false, res:null, err:null, ran:null, mapBy:"count"}; }
S.snap=freshSnap();
const snapNarrow = () => { try{ return window.matchMedia("(max-width:700px)").matches; }catch{ return false; } };
try{ window.matchMedia("(max-width:700px)").addEventListener("change", ()=>{ if(S.session && S.view==="snapshot" && S.snap.res) render(); }); }catch{}   // the charts are drawn for the width
function enterSnapshot(){ if(!S.refs && !S.refsLoading) loadRefs(false); }

/* ----- choosing: a company, or a group (every member company in the company list) ----- */
// the S&P id a search takes for a directory row: the company id when there is one, otherwise the institution id
function snapIdOf(m){
  const ok=v=>!blank(v) && /^\d{1,12}$/.test(String(v).trim()), name=blank(m.companyName)?"":String(m.companyName);
  return ok(m.companyId) ? {kind:"companyId", id:String(m.companyId).trim(), name} : ok(m.institutionId) ? {kind:"institutionId", id:String(m.institutionId).trim(), name} : null;
}
// groups among the matches, by group name (the company list has group names, not group codes)
function snapGroups(matches){
  const out=[];
  for(const m of matches){ const name=blank(m.naicGroupName)?"":String(m.naicGroupName).trim(); if(!name) continue;
    const key=name.toLowerCase(); let g=out.find(x=>x.key===key); if(!g){ g={key, name, n:0}; out.push(g); } g.n++; }
  return out;
}
/* The look-up keeps only letters, digits, spaces and . & ' - of what it is given, so a group name like
   "Calloway Group (SNL P&C Group)" is looked up by its first plain part, and members are then matched on the full name. */
const snapGroupQuery = name => String(name).split(/[^\p{L}\p{N} .&'-]/u)[0].replace(/\s+/g," ").trim().slice(0,100);
async function snapLookup(){
  const sn=S.snap, fd=sn.find, q=fd.q.trim();
  if(!q){ fd.matches=null; fd.err="Type part of a company or group name."; render(); return; }
  fd.busy=true; fd.err=""; fd.matches=null; fd.asked=q; sn.pickErr=""; render();
  const r=await callFn("snl-filings",{action:"resolve", q});
  if(!S.session || S.snap!==sn || fd.asked!==q) return;
  fd.busy=false;
  if(r.data) fd.matches=Array.isArray(r.data.matches)?r.data.matches.filter(m=>m&&typeof m==="object"):[];
  else if(r.err!=="signin") fd.err="Couldn't look that up. "+errText(r);
  render();
}
function snapChooseCompany(i){
  const sn=S.snap, m=sn.find.matches&&sn.find.matches[i], id=m&&snapIdOf(m); if(!id || sn.busy) return;
  sn.pick={kind:"company", name:id.name||`S&P ${id.kind==="companyId"?"company":"institution"} id ${id.id}`, group:blank(m.naicGroupName)?"":String(m.naicGroupName), ids:[id], noId:0, cut:false};
  sn.find.matches=null; sn.formErr=""; sn.pickErr=""; render(); document.getElementById("sn_run")?.focus();
}
async function snapChooseGroup(i){
  const sn=S.snap, all=sn.find.matches||[], g=snapGroups(all)[i]; if(!g || sn.picking || sn.busy) return;
  sn.picking=g.name; sn.pickErr=""; sn.pick=null; sn.formErr=""; render();
  let found=all.slice(), cut=false;
  const q=snapGroupQuery(g.name);
  if(q.length>=2){
    const r=await callFn("snl-filings",{action:"resolve", q});
    if(!S.session || S.snap!==sn || sn.picking!==g.name) return;
    if(!r.data){ sn.picking=""; sn.pickErr="Couldn't list the group's companies. "+errText(r); render(); return; }
    // The function names whole groups with every member (up to the most one search takes): use that when it is there.
    const whole=(Array.isArray(r.data.groups)?r.data.groups:[]).find(x=>x&&typeof x==="object"&&Array.isArray(x.members)&&String(x.name??"").trim().toLowerCase()===g.key);
    if(whole){
      const seen=new Set(), ids=[];
      for(const m of whole.members){ const id=m&&typeof m==="object"?snapIdOf(m):null, k=id&&id.kind+":"+id.id; if(id && !seen.has(k)){ seen.add(k); ids.push(id); } }
      const n=v=>isNum(v)?Math.max(0, Math.round(+v)):0;
      sn.picking=""; sn.pick={kind:"group", name:g.name, group:g.name, ids, noId:Math.max(0, n(whole.companies)-n(whole.searchable)), cut:false, over:!!whole.tooBig || n(whole.searchable)>ids.length};
      sn.find.matches=null; render(); document.getElementById("sn_run")?.focus(); return;
    }
    // An older filings function gives only the matching companies, at most SNAP_LOOKUP_MAX of them.
    const ms=Array.isArray(r.data.matches)?r.data.matches.filter(m=>m&&typeof m==="object"):[];
    cut=ms.length>=SNAP_LOOKUP_MAX; found=found.concat(ms);
  }
  const seen=new Set(), ids=[]; let noId=0;
  for(const m of found){
    if(blank(m.naicGroupName) || String(m.naicGroupName).trim().toLowerCase()!==g.key) continue;
    const id=snapIdOf(m), k=id ? id.kind+":"+id.id : "n:"+String(m.companyName??"").toLowerCase()+"|"+String(m.naicCompanyCode??"");
    if(seen.has(k)) continue; seen.add(k);
    if(id) ids.push(id); else noId++;
  }
  sn.picking=""; sn.pick={kind:"group", name:g.name, group:g.name, ids, noId, cut}; sn.find.matches=null; render();
  document.getElementById("sn_run")?.focus();
}

/* ----- the period and what it costs ----- */
function snapRange(years){ const to=TODAY(); return {from:daysBefore(to, SNAP_WINDOW_DAYS*years-1), to}; }
// one S&P request for each 10 companies of a kind for each 365 days of dates, before any extra pages
function snapCost(ids, from, to){
  const a=parseDay(from), b=parseDay(to); if(!a || !b || a>b) return 0;
  const windows=Math.ceil((Math.round((b-a)/DAY)+1)/SNAP_WINDOW_DAYS), n=k=>Math.ceil(ids.filter(c=>c.kind===k).length/SNAP_IDS_PER_REQUEST);
  return windows*(n("companyId")+n("institutionId"));
}
const snapYearsText = y => y===1 ? "last year" : `last ${y} years`;
/* Why one search can't take this snapshot, in plain words with what to choose instead; "" when it can. */
function snapTooBig(pick, years, maxIds=MAX_COMPANIES, maxReq=SNAP_MAX_REQUESTS){
  if(!pick) return "";
  if(!pick.ids.length) return pick.kind==="group" ? `None of the companies in ${pick.name} has an S&P id in the company list, so the group's filings can't be searched. Its companies can be added on the Filings view by S&P id.` : "This company has no S&P id in the company list, so its filings can't be searched.";
  if(pick.ids.length>maxIds) return `${pick.name} has ${pick.cut?"at least ":""}${plural(pick.ids.length,"company","companies")} with S&P ids in the company list, and one snapshot covers at most ${maxIds}. Choose one of its companies instead, or search the group in parts on the Filings view.`;
  if(pick.over) return `${pick.name} has more than ${maxIds} companies with S&P ids in the company list, and one snapshot covers at most ${maxIds}. Choose one of its companies instead, or search the group in parts on the Filings view.`;
  if(pick.cut) return `${pick.name} has more companies in the company list than one look-up returns (${SNAP_LOOKUP_MAX}), so a snapshot can't be sure to cover all of it. Choose one of its companies instead, or search the group in parts on the Filings view.`;
  const r=snapRange(years), need=snapCost(pick.ids, r.from, r.to);
  if(need>maxReq){
    const fit=SNAP_YEARS.filter(y=>{ const x=snapRange(y); return snapCost(pick.ids, x.from, x.to)<=maxReq; });
    return `This snapshot needs at least ${need} S&P requests, more than the ${maxReq} one search may use. ${fit.length?`Choose the ${snapYearsText(Math.max(...fit))} instead.`:"Choose one of its companies instead."}`;
  }
  return "";
}

/* ----- running it, and snapshots run before in this browser ----- */
const snapRecentKey = () => "snl.snapshots."+(S.session&&S.session.uid||"");
function snapRecentList(){
  try{ const a=JSON.parse(localStorage.getItem(snapRecentKey())||"[]"); return Array.isArray(a) ? a.filter(x=>x&&x.pick&&Array.isArray(x.pick.ids)&&x.payload&&x.payload.action==="search").slice(0,SNAP_RECENT) : []; }catch{ return []; }
}
// only a complete, saved result is listed: reopening it sends the same search, which opens from the saved result
function snapRemember(run, res){
  if(res.capped || res.saved===false) return;
  const key=JSON.stringify(run.payload), list=[{pick:run.pick, years:run.years, ...(run.scope?{scope:run.scope}:{}), payload:run.payload, at:new Date().toISOString()}].concat(snapRecentList().filter(x=>JSON.stringify(x.payload)!==key)).slice(0,SNAP_RECENT);
  try{ localStorage.setItem(snapRecentKey(), JSON.stringify(list)); }catch{}
}
async function snapRun(refresh, given){
  const sn=S.snap; if(sn.busy) return;
  let run;
  if(given) run=given;
  else if(refresh){ if(!sn.ran) return; run=sn.ran; }
  else{
    if(!sn.pick){ sn.formErr="Choose a company or a group first: find it by name above."; render(); return; }
    const big=snapTooBig(sn.pick, sn.years); if(big){ sn.formErr=big; render(); return; }
    const {from, to}=snapRange(sn.years), nums=k=>sn.pick.ids.filter(c=>c.kind===k).map(c=>Number(c.id)), scope=nwKeep("snap");
    run={pick:JSON.parse(JSON.stringify(sn.pick)), years:sn.years, scope, payload:snapPayload(nums("companyId"), nums("institutionId"), scope, from, to)};
  }
  sn.formErr=""; sn.busy=true; sn.err=null; if(!refresh) sn.res=null; sn.ran=run; render();
  sn.prog=null;
  const r=await searchParts(refresh ? {...run.payload, refresh:true} : run.payload, {onPart:p=>{ if(S.snap===sn){ sn.prog=p; render(); } }});   // a wide search comes in parts (big-searches)
  if(!S.session || S.snap!==sn) return;   // signed out, or the session ended, while it ran
  sn.prog=null;
  sn.busy=false;
  if(r.data && Array.isArray(r.data.rows)){ sn.res=r.data; sn.err=null; takeUsage(r.data); loadStatus(); snapRemember(run, r.data); }
  else if(r.err!=="signin") sn.err = r.data ? {err:"bad_answer", msg:"The filings function sent back something the page can't read. Try again."} : r;
  render();
}
/* The search a snapshot runs: every state in the list, or only those chosen; the types of insurance chosen, by S&P's id,
   only when there are some (a snapshot nobody narrowed sends exactly what it always has). */
function snapPayload(companyIds, institutionIds, scope, from, to){
  const p={action:"search", companyIds, institutionIds, states:(scope&&scope.states&&scope.states.length?scope.states:stateOptions().map(s=>s.id)).slice().sort(), from, to};
  const ids=(scope&&scope.tois||[]).map(t=>Number(t.id)).filter(Number.isInteger);
  if(ids.length) p.typeOfInsuranceIds=ids;
  return p;
}
// the result as shown: the rows narrowed on this page (when the choice is inside what was searched), and what says so
function snapView(r, run){
  const sc=nwRunScope(run&&run.scope), sh=nwShown("snap", sc), f=nwFilterRows(sh, r.rows), p=r.params||run&&run.payload||{};
  return {sc, sh, noToi:f.noToi, res:sh.narrowed ? {...r, rows:f.rows, params:{...p, states:sh.states?sh.states.slice():p.states}} : r};
}
// how the map and its key name a state that isn't in the snapshot
function snapNsWhy(c, v){
  if(v.sh.states){ c.nsWhy="not shown: this page is narrowed to "+v.sh.shown.stWords; c.nsKey="Not shown: outside what this page is narrowed to"; c.shownOnly=true; }
  else if(v.sc.states.length){ c.nsWhy="not searched: this snapshot was narrowed to "+v.sc.stWords; c.nsKey="Not searched: outside what this snapshot was narrowed to"; }
}
function snapShowAll(){ const run=S.snap.ran; if(run) nwShowAll("snap", nwRunScope(run.scope)); }
function snapReopen(i){
  const sn=S.snap, run=snapRecentList()[i]; if(!run || sn.busy) return;
  sn.pick=run.pick; sn.years=SNAP_YEARS.includes(+run.years)?+run.years:3; sn.find.matches=null; nwSetFrom("snap", run.scope);
  snapRun(false, run);
}
/* The same search on the Filings view, form filled in, so every row can be read there. A complete result opens from
   the saved one; a partial one isn't saved, so the form is filled and the reader decides whether to ask S&P again. */
function snapToFilings(){
  const sn=S.snap, run=sn.ran, r=sn.res, f=S.f; if(!run || !r) return;
  if(f.busy){ toast("The Filings view is still running a search. Try again when it has finished."); return; }
  const p=run.payload;
  f.chips=run.pick.ids.slice(0, MAX_COMPANIES).map(c=>({kind:c.kind, id:String(c.id), name:c.name||""}));
  f.states=[...p.states]; f.from=p.from; f.to=p.to; f.toi=(Array.isArray(p.typeOfInsuranceIds)?p.typeOfInsuranceIds:[]).map(String); f.ftype=[]; f.fstatus=[]; f.toiFilter=""; f.tracking="";
  f.q=""; f.matches=null; f.resolveNote=""; f.resolveErr=""; f.formErr="";
  location.hash="#filings";
  if(r.capped){ f.res=null; f.err=null; toast("The form is filled in. Press Search filings to run it: a partial result isn't saved, so it asks S&P again."); }
  else runSearch(false, {...p});
}

/* ----- working it out: every figure comes from the rows of the one search ----- */
/* UNCONFIRMED: S&P's filing types are SERFF's names, like "Rate", "Rule" and "Form", and combinations such as
   "Rate/Rule" or "Rate and rule". A filing counts as a rate, rule or form filing when its type names that word, so a
   combined filing counts in each kind it names. Change this one function if S&P names them some other way. */
function snapKinds(type){ const t=String(type??"").toLowerCase(); return {rate:/\brates?\b/.test(t), rule:/\brules?\b/.test(t), form:/\bforms?\b/.test(t)}; }
/* UNCONFIRMED: which of S&P's statuses mean the filing is approved. Only a status that says "approved" is drawn as
   approved; every other status (pending, withdrawn, disapproved, or one this page doesn't know) is drawn as not approved. */
const snapApproved = s => /approv/i.test(String(s??"")) && !/disapprov|not approv/i.test(String(s??""));
const snapState = r => { const s=String(r.serffFilingStateId??"").trim().toUpperCase(); return /^[A-Z]{2}$/.test(s) ? s : ""; };
const snapStateName = s => { const o=stateOptions().find(x=>x.id===s); return o&&o.name!==s ? o.name : US_MAP[s] ? US_MAP[s][1] : s; };
/* One entry per filing version, as the Filings view keys its rows (rowKey): rows S&P sent more than once for the
   same version, one for each company on it, become one filing that lists every company. */
function snapFilings(rows){
  const by=new Map(), out=[];
  (Array.isArray(rows)?rows:[]).forEach((r,i)=>{ if(!r || typeof r!=="object") return;
    const k=rowKey(r,i), cos=companiesOf(r), kept=by.get(k);
    if(!kept){ const f={...r, companies:cos.slice()}; by.set(k,f); out.push(f); return; }
    for(const c of cos) if(!kept.companies.some(x=>String(x.companyId??"")===String(c.companyId??"") && String(x.institutionId??"")===String(c.institutionId??"") && x.companyName===c.companyName)) kept.companies.push(c); });
  return out;
}
const snapMedian = a => { const s=[...a].sort((x,y)=>x-y), n=s.length; return !n ? null : n%2 ? s[(n-1)/2] : (s[n/2-1]+s[n/2])/2; };
// newest publish date first; a filing with no publish date after every dated one
const snapByDate = (a,b) => (b.pub?b.pub.getTime():-Infinity)-(a.pub?a.pub.getTime():-Infinity);
/* UNCONFIRMED: publishDate is when S&P published the filing (the date the Filings view searches by), which is close
   to, but not always the same as, the date the regulator decided it. The days from dateSubmitted to publishDate are
   shown as an approximate time with the regulator. */
const snapDays = f => f.sub && f.pub ? Math.round((f.pub-f.sub)/DAY) : null;
function snapCompute(res, run){
  const p=res.params||run&&run.payload||{};
  const fs=snapFilings(res.rows).map(r=>({r, k:snapKinds(r.serffFilingType), st:snapState(r), toi:blank(r.typeOfInsurance)?"":String(r.typeOfInsurance), type:blank(r.serffFilingType)?"":String(r.serffFilingType),
    pub:parseDay(r.publishDate), sub:parseDay(r.dateSubmitted), rate:isNum(r.overallRateImpact)?+r.overallRateImpact:null, ok:snapApproved(r.filingStatus)}));
  const searched=[...new Set((Array.isArray(p.states)?p.states:[]).map(s=>String(s).toUpperCase()))];
  const states=new Map(searched.map(s=>[s,[]])); for(const f of fs) if(f.st){ if(!states.has(f.st)) states.set(f.st,[]); states.get(f.st).push(f); }
  const latestRate=list=>list.filter(f=>f.rate!==null).sort(snapByDate)[0]||null;
  const byState=[...states.entries()].map(([st, list])=>({st, name:snapStateName(st), n:list.length, rates:list.filter(f=>f.k.rate||f.rate!==null).length, latest:latestRate(list)}));
  const dated=fs.filter(f=>f.pub);
  // rate filings: those S&P types as rate filings, and any other filing that carries an overall rate impact
  const rateFs=fs.filter(f=>f.k.rate||f.rate!==null), rateGroups=new Map();
  for(const f of rateFs){ const k=`${f.st}|${f.toi}`; if(!rateGroups.has(k)) rateGroups.set(k,{st:f.st, toi:f.toi, list:[]}); rateGroups.get(k).list.push(f); }
  const rateRows=[...rateGroups.values()].map(g=>{ const v=g.list.filter(f=>f.rate!==null).map(f=>f.rate);
    return {st:g.st, toi:g.toi, n:g.list.length, withRate:v.length, lo:v.length?Math.min(...v):null, hi:v.length?Math.max(...v):null, latest:latestRate(g.list)}; })
    .sort((a,b)=>(a.st||"~").localeCompare(b.st||"~") || (a.toi||"~").localeCompare(b.toi||"~"));
  // filings by year published and filing type: S&P's own type names, rate, rule and form first
  const y0=parseDay(p.from), y1=parseDay(p.to), years=[];
  const yLo=Math.min(y0?y0.getFullYear():Infinity, ...dated.map(f=>f.pub.getFullYear())), yHi=Math.max(y1?y1.getFullYear():-Infinity, ...dated.map(f=>f.pub.getFullYear()));
  if(isFinite(yLo) && isFinite(yHi)) for(let y=yLo; y<=yHi && years.length<20; y++) years.push(y);
  const order=t=>{ const i=["rate","rule","form"].indexOf(t.toLowerCase()); return i<0 ? (t ? 3 : 4) : i; };
  const types=[...new Set(fs.map(f=>f.type))].sort((a,b)=>order(a)-order(b) || a.localeCompare(b));
  const yearRows=years.map(y=>{ const list=dated.filter(f=>f.pub.getFullYear()===y); return {year:y, total:list.length, by:types.map(t=>list.filter(f=>f.type===t).length)}; });
  // time with the regulator, by state
  const withDays=fs.map(f=>({f, d:snapDays(f)})).filter(x=>x.d!==null && x.d>=0), dayGroups=new Map();
  for(const x of withDays){ if(!dayGroups.has(x.f.st)) dayGroups.set(x.f.st,[]); dayGroups.get(x.f.st).push(x.d); }
  const dayRow=(st, a)=>({st, n:a.length, median:snapMedian(a), lo:a.length?Math.min(...a):null, hi:a.length?Math.max(...a):null});
  const dayRows=[...dayGroups.entries()].sort((a,b)=>(a[0]||"~").localeCompare(b[0]||"~")).map(([st,a])=>dayRow(st,a));
  return {p, fs, searched, byState, from:p.from, to:p.to,
    tiles:{n:fs.length, rate:fs.filter(f=>f.k.rate).length, rule:fs.filter(f=>f.k.rule).length, form:fs.filter(f=>f.k.form).length, other:fs.filter(f=>!f.k.rate&&!f.k.rule&&!f.k.form).length,
      states:byState.filter(s=>s.n).length, latest:dated.length?dated.slice().sort(snapByDate)[0].pub:null},
    rateFs, rateRows, ratePts:rateFs.filter(f=>f.rate!==null&&f.pub).sort((a,b)=>a.pub-b.pub), rateNoDate:rateFs.filter(f=>f.rate!==null&&!f.pub).length,
    years:yearRows, types, undated:fs.length-dated.length,
    latestFR:fs.filter(f=>f.k.form||f.k.rule).sort(snapByDate), dayRows, dayAll:dayRow("", withDays.map(x=>x.d)), dayLeft:fs.length-withDays.length};
}

/* ----- drawing: charts by hand as inline SVG, every one with its numbers as text beside or under it ----- */
const snapPct = v => v===null||v===undefined ? "n/d" : pct(v);
const snapRange2 = (lo, hi, fmt) => lo===null ? "n/d" : lo===hi ? fmt(lo) : `${fmt(lo)} to ${fmt(hi)}`;
const snapStatus = f => blank(f.r.filingStatus) ? "n/d" : String(f.r.filingStatus);
const snapStLabel = st => st ? `${snapStateName(st)} (${st})` : "State n/d";
function snapMark(f, cx, cy, s){
  const cls=`mk ${f.rate>0?"up":f.rate<0?"dn":"z"}${f.ok?"":" open"}`;
  const title=`<title>${esc(`${fmtD(f.pub)}, ${f.st||"state n/d"}${f.toi?` ${f.toi}`:""}: ${pct(f.rate)}, ${snapStatus(f)}`)}</title>`;
  if(f.rate>0) return `<path class="${cls}" d="M${cx} ${cy-s}L${cx+s} ${cy+s*.75}L${cx-s} ${cy+s*.75}Z">${title}</path>`;
  if(f.rate<0) return `<path class="${cls}" d="M${cx} ${cy+s}L${cx+s} ${cy-s*.75}L${cx-s} ${cy-s*.75}Z">${title}</path>`;
  return `<circle class="${cls}" cx="${cx}" cy="${cy}" r="${s*.7}">${title}</circle>`;
}
function snapRateChart(c){
  const pts=c.ratePts; if(!pts.length) return "";
  const nar=snapNarrow(), W=nar?360:1240, H=nar?230:300, L=nar?50:64, R=12, T=12, B=26;
  const t0=(parseDay(c.from)||pts[0].pub).getTime(), t1=Math.max((parseDay(c.to)||pts[pts.length-1].pub).getTime(), t0+DAY);
  const m=Math.max(5, Math.ceil(Math.max(...pts.map(f=>Math.abs(f.rate)))/5)*5);

function snapAskQs(){

    q.names=`Which company names does ${who} file under, and in which states?`;

  if(top && top.rate!==0){

    q.rates=`What explains the rate changes ${who} filed${inSt(snapAskStates(withRate.filter(f=>f.rate!==0),3))} since ${since}? The largest on screen is ${what}. Read the filings behind the largest ones.`;

  else if(yrs.length) q.years=`What did the${tt} filings ${who} made in ${yrs[0].year} change?`;

  const list=[], seen=new Set();
  for(const c of Array.isArray(companies)?companies:[]){ if(!c || !["companyId","institutionId"].includes(c.kind) || !/^\d{1,12}$/.test(String(c.id??"").trim())) continue;
    const k=c.kind+":"+String(c.id).trim(); if(seen.has(k)) continue; seen.add(k); list.push({kind:c.kind, id:String(c.id).trim(), name:blank(c.name)?"":String(c.name)}); }
  const name=set&&!blank(set.name) ? String(set.name).slice(0,80) : "Saved set";
  if(!list.length){ toast(`${name} has no companies with an S&P id, so nothing was added.`); return; }
  if(list.length<=FC_MAX){
    fc.picks=list.map(c=>({kind:"company", name:c.name||`S&P ${c.kind==="companyId"?"company":"institution"} id ${c.id}`, group:"", ids:[c], noId:0, cut:false}));
    toast(`Each company in ${name} is now a carrier to compare.`);
  } else {
    if(fc.picks.length>=FC_MAX){ toast(`You can compare at most ${FC_MAX} carriers. Remove one to add ${name}.`); return; }
    fc.picks.push({kind:"set", name, group:"", ids:list, noId:0, cut:false, over:list.length>MAX_COMPANIES});
    toast(`${name} has ${count(list.length)} companies, so it was added as one carrier.`);
  }
  fc.formErr=""; fc.pickErr=""; render();
}

/* ----- choosing carriers: a company, or a whole group, from the company list (as the Snapshot does) ----- */
async function fcLookup(){
  const fc=S.fc, fd=fc.find, q=fd.q.trim();
  if(!q){ fd.matches=null; fd.groups=[]; fd.err="Type part of a company or group name."; render(); return; }
  fd.busy=true; fd.err=""; fd.matches=null; fd.groups=[]; fd.asked=q; fc.pickErr=""; render();
  const r=await callFn("snl-filings",{action:"resolve", q});
  if(!S.session || S.fc!==fc || fd.asked!==q) return;
  fd.busy=false;
  if(r.data){ fd.matches=Array.isArray(r.data.matches)?r.data.matches.filter(m=>m&&typeof m==="object"):[]; fd.groups=Array.isArray(r.data.groups)?r.data.groups.filter(g=>g&&typeof g==="object"&&Array.isArray(g.members)):[]; }
  else if(r.err!=="signin") fd.err="Couldn't look that up. "+errText(r);
  render();
}
// the groups to offer: whole groups the function listed, then groups named by the matching companies
function fcGroupList(fd){
  const out=[], seen=new Set();
  for(const g of fd.groups||[]){ const name=blank(g.name)?"":String(g.name).trim(); if(!name || seen.has(name.toLowerCase())) continue; seen.add(name.toLowerCase()); out.push({name, key:name.toLowerCase(), whole:g}); }
  for(const g of snapGroups(fd.matches||[])) if(!seen.has(g.key)){ seen.add(g.key); out.push({name:g.name, key:g.key, n:g.n}); }
  return out;
}
function fcWholePick(name, whole){
  const seen=new Set(), ids=[], n=v=>isNum(v)?Math.max(0, Math.round(+v)):0;
  for(const m of whole.members){ const id=m&&typeof m==="object"?snapIdOf(m):null, k=id&&id.kind+":"+id.id; if(id && !seen.has(k)){ seen.add(k); ids.push(id); } }
  return {kind:"group", name, group:name, ids, noId:Math.max(0, n(whole.companies)-n(whole.searchable)), cut:false, over:!!whole.tooBig || n(whole.searchable)>ids.length};
}
function fcAddPick(pk){
  const fc=S.fc, key=p=>p.ids.map(c=>c.kind+":"+c.id).sort().join(",");
  fc.picking="";
  if(fc.picks.length>=FC_MAX){ fc.pickErr=`You can compare at most ${FC_MAX} carriers. Remove one to add another.`; render(); return; }
  if(pk.ids.length && fc.picks.some(p=>key(p)===key(pk))){ toast(`${pk.name} is already chosen.`); fc.find.matches=null; fc.find.groups=[]; render(); return; }
  fc.picks.push(pk); fc.find.matches=null; fc.find.groups=[]; fc.find.q=""; fc.formErr=""; fc.pickErr=""; render();
  document.getElementById(fc.picks.length<FC_MAX?"fc_find":"fc_state")?.focus();
}
function fcChooseCompany(i){
  const fc=S.fc, m=fc.find.matches&&fc.find.matches[i], id=m&&snapIdOf(m); if(!id || fc.busy) return;
  fcAddPick({kind:"company", name:id.name||`S&P ${id.kind==="companyId"?"company":"institution"} id ${id.id}`, group:blank(m.naicGroupName)?"":String(m.naicGroupName), ids:[id], noId:0, cut:false});
}
async function fcChooseGroup(i){
  const fc=S.fc, fd=fc.find, g=fcGroupList(fd)[i]; if(!g || fc.picking || fc.busy) return;
  if(fc.picks.length>=FC_MAX){ fc.pickErr=`You can compare at most ${FC_MAX} carriers. Remove one to add another.`; render(); return; }
  if(g.whole){ fcAddPick(fcWholePick(g.name, g.whole)); return; }
  fc.picking=g.name; fc.pickErr=""; render();
  let found=(fd.matches||[]).slice(), cut=false;
  const q=snapGroupQuery(g.name);
  if(q.length>=2){
    const r=await callFn("snl-filings",{action:"resolve", q});
    if(!S.session || S.fc!==fc || fc.picking!==g.name) return;
    if(!r.data){ fc.picking=""; fc.pickErr="Couldn't list the group's companies. "+errText(r); render(); return; }
    const whole=(Array.isArray(r.data.groups)?r.data.groups:[]).find(x=>x&&typeof x==="object"&&Array.isArray(x.members)&&String(x.name??"").trim().toLowerCase()===g.key);
    if(whole){ fcAddPick(fcWholePick(g.name, whole)); return; }
    const ms=Array.isArray(r.data.matches)?r.data.matches.filter(m=>m&&typeof m==="object"):[];
    cut=ms.length>=SNAP_LOOKUP_MAX; found=found.concat(ms);
  }
  const seen=new Set(), ids=[]; let noId=0;
  for(const m of found){
    if(blank(m.naicGroupName) || String(m.naicGroupName).trim().toLowerCase()!==g.key) continue;
    const id=snapIdOf(m), k=id ? id.kind+":"+id.id : "n:"+String(m.companyName??"").toLowerCase();
    if(seen.has(k)) continue; seen.add(k);
    if(id) ids.push(id); else noId++;
  }
  fcAddPick({kind:"group", name:g.name, group:g.name, ids, noId, cut});
}

/* ----- what is searched, and what it costs ----- */
/* UNCONFIRMED: which of S&P's filing types are form filings. S&P's list of filing types (serffFilingType) has short
   names such as "Form", "Rate", "Rule" and "Rate and rule" (Live check, 18 Nov 2026). A type counts as a form filing
   when its name contains "form"; with the tick for rule and rate filings, also when it names a rule or a rate. Change
   only this function if S&P names them some other way. */
function fcFilingTypes(wide){
  return refOptions("serffFilingType").map(o=>({id:Number(o.id), name:String(o.name??"")})).filter(o=>Number.isInteger(o.id))
    .filter(o=>{ const n=o.name.toLowerCase(); return n.includes("form") || (wide && /\b(rules?|rates?)\b/.test(n)); });
}
const fcToiName = id => { const o=refOptions("typeOfInsurance").find(x=>String(x.id)===String(id)); return o ? String(o.name) : ""; };
const fcStateName = s => s ? snapStateName(s) : "";
const fcUniq = ids => { const seen=new Set(); return ids.filter(c=>{ const k=c.kind+":"+c.id; if(seen.has(k)) return false; seen.add(k); return true; }); };
/* The carriers packed, in order, into as few searches as the limits allow: each search at most MAX_COMPANIES companies
   and SNAP_MAX_REQUESTS S&P requests (one for each 10 ids of a kind for each 365 days, as snapCost counts). */
function fcPlan(picks, years){
  const rg=snapRange(years), out=[];
  picks.forEach((pk,i)=>{
    const s=out.find(x=>{ const m=fcUniq(x.ids.concat(pk.ids)); return m.length<=MAX_COMPANIES && snapCost(m, rg.from, rg.to)<=SNAP_MAX_REQUESTS; });
    if(s){ s.ids=fcUniq(s.ids.concat(pk.ids)); s.carriers.push(i); } else out.push({ids:fcUniq(pk.ids), carriers:[i]});
  });
  return out.map(s=>({...s, cost:snapCost(s.ids, rg.from, rg.to)}));
}
function fcPickProblem(pk, years){
  if(!pk.ids.length) return pk.kind==="group" ? `None of the companies in ${pk.name} has an S&P id in the company list, so its filings can't be searched. Remove it.` : `${pk.name} has no S&P id in the company list, so its filings can't be searched. Remove it.`;
  if(pk.ids.length>MAX_COMPANIES || pk.over) return `${pk.name} has more than ${MAX_COMPANIES} companies with S&P ids, and one search takes at most ${MAX_COMPANIES}. Choose one of its companies instead.`;
  if(pk.cut) return `${pk.name} has more companies in the company list than one look-up returns (${SNAP_LOOKUP_MAX}), so the search can't be sure to cover all of it. Choose one of its companies instead.`;
  const rg=snapRange(years), need=snapCost(pk.ids, rg.from, rg.to);
  if(need>SNAP_MAX_REQUESTS) return `${pk.name} needs at least ${need} S&P requests over the ${snapYearsText(years)}, more than the ${SNAP_MAX_REQUESTS} one search may use. Choose a shorter period or one of its companies.`;
  return "";
}
function fcProblem(){
  const fc=S.fc;
  if(fc.picks.length<FC_MIN) return `Choose at least ${FC_MIN} carriers to compare: find each by name above.`;
  for(const pk of fc.picks){ const p=fcPickProblem(pk, fc.years); if(p) return p; }
  if(!fc.state) return "Choose a state.";
  if(!fc.toi) return "Choose a type of insurance.";
  if(!refOptions("serffFilingType").length) return "S&P's list of filing types isn't loaded, so form filings can't be picked out. Wait for the lists to load, or refresh them on the Filings view.";
  if(!fcFilingTypes(false).length) return "S&P's list of filing types has no type named as a form filing, so the search can't be limited to form filings. Tell Corp Dev.";
  return "";
}
function fcCostHTML(){
  const fc=S.fc, rg=snapRange(fc.years), types=fcFilingTypes(fc.wide);
  const what=`<span class="t2" id="fc_dates">${esc(fc.wide?"Form, rule and rate filings":"Form filings")} published ${fmtDay(rg.from)} to ${fmtDay(rg.to)}${fc.state?` in ${esc(fcStateName(fc.state))}`:""}${fc.toi&&fcToiName(fc.toi)?`, ${esc(fcToiName(fc.toi))}`:""}, every status${types.length?` (S&amp;P's filing ${types.length===1?"type":"types"} ${esc(types.map(t=>t.name).join(", "))})`:""}.</span>`;
  if(fc.picks.length<FC_MIN || fc.picks.some(pk=>fcPickProblem(pk, fc.years))) return what+(fc.picks.length ? fc.picks.map(pk=>fcPickProblem(pk, fc.years)).filter(Boolean).map(m=>`<div class="banner" role="alert"><span>${esc(m)}</span></div>`).join("") : "");
  const plan=fcPlan(fc.picks, fc.years), req=plan.reduce((a,s)=>a+s.cost,0);
  return what+`<p class="t2" id="fc_cost" style="margin:0"><b>About ${plural(req,"S&amp;P request")}</b>${plan.length>1?` in ${count(plan.length)} searches run one after another, since one search takes at most ${MAX_COMPANIES} companies and ${SNAP_MAX_REQUESTS} requests`:" in one search"} (one for each 10 companies for each year of dates), more if S&amp;P has many filings. A search someone has already run costs none.</p>`;
}

/* ----- running the searches, then asking for the saved summaries ----- */
async function fcRun(){
  const fc=S.fc; if(fc.busy || (fc.mk&&fc.mk.busy)) return;
  const problem=fcProblem(); if(problem){ fc.formErr=problem; render(); document.getElementById("fc_formErr")?.scrollIntoView({block:"nearest"}); return; }
  const rg=snapRange(fc.years), types=fcFilingTypes(fc.wide), nums=(ids,k)=>ids.filter(c=>c.kind===k).map(c=>Number(c.id));
  fc.ran={picks:JSON.parse(JSON.stringify(fc.picks)), state:fc.state, toi:fc.toi, toiName:fcToiName(fc.toi), years:fc.years, wide:fc.wide, types, from:rg.from, to:rg.to};
  fc.runs=fcPlan(fc.picks, fc.years).map(s=>({carriers:s.carriers, cost:s.cost, res:null, err:null,
    payload:{action:"search", companyIds:nums(s.ids,"companyId"), institutionIds:nums(s.ids,"institutionId"), states:[fc.state], from:rg.from, to:rg.to, typeOfInsuranceIds:[Number(fc.toi)], filingTypeIds:types.map(t=>t.id)}}));
  fc.digests={}; fc.asked={}; fc.getErr=null; fc.results={}; fc.mk=null; fc.open={}; fc.formErr="";
  await fcSearches(fc);
}
// runs every search not yet answered, one after another, then asks for the summaries of what came back
async function fcSearches(fc){
  const todo=fc.runs.filter(x=>!x.res); if(!todo.length) return;
  fc.busy=true; render();
  for(let k=0;k<todo.length;k++){
    const run=todo[k]; run.err=null; fc.step={i:k+1, n:todo.length}; render();
    fc.prog=null;
    const r=await searchParts(run.payload, {onPart:p=>{ if(S.fc===fc){ fc.prog=p; render(); } }});   // a wide search comes in parts (big-searches)
    if(!S.session || S.fc!==fc) return;   // signed out, or the session ended, while it ran
    fc.prog=null;
    if(r.data && Array.isArray(r.data.rows)){ run.res=r.data; takeUsage(r.data); }
    else run.err = r.data ? {err:"bad_answer", msg:"The filings function sent back something the page can't read. Try again."} : r;
  }
  fc.busy=false; fc.step=null; render(); loadStatus();
  fcGetDigests(fc);
}
function fcRetry(){ const fc=S.fc; if(fc.busy || !fc.runs) return; fcSearches(fc); }
/* Each carrier's filings, each filing once, newest first. A filing names a carrier when any of its companies has one of
   the carrier's S&P ids. list is null while the carrier's search hasn't answered (err says why when it failed). */
function fcCarriers(fc){
  const ran=fc.ran; if(!ran || !fc.runs) return [];
  return ran.picks.map((pk,i)=>{
    const run=fc.runs.find(x=>x.carriers.includes(i));
    if(!run || !run.res) return {pk, i, run, list:null};
    const ids=new Set(pk.ids.map(c=>c.kind+":"+c.id)), has=(k,v)=>!blank(v) && ids.has(k+":"+String(v).trim());
    const list=snapFilings(run.res.rows).filter(r=>has("companyId",r.companyId) || has("institutionId",r.institutionId) || r.companies.some(c=>c&&(has("companyId",c.companyId)||has("institutionId",c.institutionId))))
      .map((r,j)=>({r, key:rowKey(r,"fc"+i+"-"+j), dk:docKeyOf(r), pub:parseDay(r.publishDate)})).sort(snapByDate);
    return {pk, i, run, list};
  });
}
const fcDigestOf = (fc, f) => f.dk ? fc.digests[f.dk] || (!blank(f.r.documentId) && fc.digests["d:"+f.r.documentId]) || (!blank(f.r.filingVersionId) && fc.digests["v:"+f.r.filingVersionId]) || null : null;
function fcTake(fc, d, f){
  if(!d || typeof d!=="object" || Array.isArray(d)) return;
  if(!blank(d.documentId) && (typeof d.documentId==="number"||typeof d.documentId==="string")) fc.digests["d:"+d.documentId]=d;
  if(!blank(d.filingVersionId) && (typeof d.filingVersionId==="number"||typeof d.filingVersionId==="string")) fc.digests["v:"+d.filingVersionId]=d;
  if(f && f.dk) fc.digests[f.dk]=d;
}
const fcRef = r => { const o={}; if(!blank(r.documentId)) o.documentId=r.documentId; if(!blank(r.filingVersionId)) o.filingVersionId=r.filingVersionId; return o; };
// the saved summary of every filing found, 50 a call; costs nothing
async function fcGetDigests(fc){
  if(fc.dErr && fc.dErr.err==="not_deployed") return;
  const want=[], seen=new Set();
  for(const c of fcCarriers(fc)) for(const f of c.list||[]) if(f.dk && !seen.has(f.dk) && !fc.asked[f.dk] && !fcDigestOf(fc,f)){ seen.add(f.dk); want.push(f); }
  if(!want.length) return;
  fc.getBusy=true; fc.getErr=null; render();
  for(let i=0;i<want.length;i+=FC_GET_BATCH){
    const part=want.slice(i, i+FC_GET_BATCH);
    const r=await callFn("snl-digest",{action:"get", filings:part.map(f=>fcRef(f.r))});
    if(!S.session || S.fc!==fc) return;
    if(!r.data){ fc.getBusy=false; if(r.err==="not_deployed") fc.dErr=r; else fc.getErr=r; render(); return; }
    for(const d of Array.isArray(r.data.digests)?r.data.digests:[]) fcTake(fc, d, null);
    for(const f of part) fc.asked[f.dk]=true;
  }
  fc.getBusy=false; render();
}
async function fcDigestStatus(){
  const fc=S.fc; fc.dstBusy=true;
  const r=await callFn("snl-digest",{action:"status"});
  if(!S.session || S.fc!==fc) return;
  fc.dstBusy=false;
  if(r.data){ fc.dst=r.data; fc.dErr=null; } else if(r.err!=="signin") fc.dErr=r;
  render();
}

/* ----- summarising: only when the reader chooses, one filing at a time, with Stop ----- */
const fcN = fc => { const n=Math.round(+fc.n); return n>=1 && n<=FC_MAKE_MAX ? n : FC_MAKE_DEFAULT; };
/* The latest N filings of each carrier that have no saved summary and have a document, taken in turn (a filing named by
   two carriers once), so Stop leaves the carriers evenly covered. */
function fcQueue(fc){
  const n=fcN(fc), lists=fcCarriers(fc).filter(c=>c.list).map(c=>c.list.slice(0,n).filter(f=>f.dk && !fcDigestOf(fc,f)).map(f=>({f, who:c.pk.name})));
  const out=[], seen=new Set();
  for(let k=0; k<n; k++) for(const l of lists){ const x=l[k]; if(x && !seen.has(x.f.dk)){ seen.add(x.f.dk); out.push(x); } }
  return out;
}
const fcPagesRead = f => isNum(f.r.pages)&&+f.r.pages>0 ? Math.min(+f.r.pages, FC_READ_PAGES) : FC_READ_PAGES;
const fcUsd = v => "$"+(+v).toLocaleString("en-US",{minimumFractionDigits:2, maximumFractionDigits:2});
function fcEstimate(q){ const pages=q.reduce((a,x)=>a+fcPagesRead(x.f),0); return {pages, lo:pages*FC_USD_150[0]/FC_READ_PAGES, hi:pages*FC_USD_150[1]/FC_READ_PAGES, unknown:q.filter(x=>!(isNum(x.f.r.pages)&&+x.f.r.pages>0)).length}; }
// the fields of the search row sent with a summary request (never a bare tracking number: filingNo is the labelled one)
function fcMakeFiling(r){
  const keep=["documentId","filingVersionId","serffFilingEntityEventId","sfcNumber","companyId","companyName","institutionId","naicGroupName","serffFilingStateId","serffFilingState","typeOfInsuranceId","typeOfInsurance","subTypeOfInsurance","serffFilingTypeId","serffFilingType","filingStatusId","filingStatus","dateSubmitted","publishDate","newBusReqEffDate","renewBusReqEffDate","overallRateImpact","filingDescription","pages"];
  const o={}; for(const k of keep) if(!blank(r[k]) && typeof r[k]!=="object") o[k]=r[k];
  o.companies=(Array.isArray(r.companies)?r.companies:[]).filter(c=>c&&typeof c==="object").map(c=>({companyId:c.companyId??null, companyName:c.companyName??null, institutionId:c.institutionId??null}));
  const no=filingNoText(r); if(no) o.filingNo=no;
  return o;
}
function fcWhy(r){
  if(r.err==="limit" || r.err==="daily_limit") return "today's limit on questions is reached (each summary counts as one). Try again after midnight UTC.";
  if(r.err==="busy") return "another summary or answer for your login was running. Try again in a minute.";
  if(r.err==="too_large") return "the document is too large to read.";
  if(r.err==="not_configured") return "summaries aren't set up yet. "+errText(r);
  if(r.err==="not_deployed") return "the summaries function isn't set up on this site.";
  return errText(r);
}
async function fcMake(){
  const fc=S.fc; if(fc.busy || (fc.mk&&fc.mk.busy) || !fcCanMake(fc)) return;
  const q=fcQueue(fc); if(!q.length){ toast("Every one of those filings already has a saved summary."); return; }
  const mk=fc.mk={busy:true, stop:false, halt:"", n:q.length, i:0, cur:null, items:q, made:0, usd:0, usdKnown:false, sp:0};
  for(const x of q) fc.results[x.f.dk]={state:"queued"};
  render();
  for(let i=0;i<q.length;i++){
    const x=q[i];
    if(mk.stop || mk.halt){ fc.results[x.f.dk]={state:"skipped", why:mk.halt||"you pressed Stop."}; continue; }
    mk.i=i+1; mk.cur=x; fc.results[x.f.dk]={state:"running"}; render();
    const r=await callFn("snl-digest",{action:"make", filing:fcMakeFiling(x.f.r)});
    if(!S.session || S.fc!==fc) return;   // the session ended: everything here was forgotten with it
    if(r.data && r.data.digest && typeof r.data.digest==="object"){
      fcTake(fc, r.data.digest, x.f); fc.results[x.f.dk]={state:"made", fromStore:!!r.data.fromStore}; mk.made++;
      const u=r.data.usage&&typeof r.data.usage==="object"?r.data.usage:{};
      if(isNum(u.costUsd)){ mk.usd+=+u.costUsd; mk.usdKnown=true; } if(isNum(u.spRequests)) mk.sp+=+u.spRequests;
    } else {
      const res=r.data ? {err:"bad_answer", msg:"The summaries function sent back something the page can't read."} : r;
      fc.results[x.f.dk]={state:"failed", code:res.err, why:fcWhy(res)};
      if(["limit","daily_limit"].includes(res.err)) mk.halt="today's limit on questions was reached.";
      if(["not_configured","not_deployed"].includes(res.err)) mk.halt="summaries aren't set up yet.";
      if(res.err==="not_deployed") fc.dErr=res;
    }
  }
  mk.busy=false; mk.cur=null; render();
  loadStatus(); loadChatUse().then(()=>{ if(S.session && S.view==="forms") render(); });
}
function fcCanMake(fc){ const d=fc.dst; return !(fc.dErr&&fc.dErr.err==="not_deployed") && !!d && !(d.claude&&d.claude.configured===false) && !(d.filings&&d.filings.configured===false); }

/* ----- the comparison, built only from saved summaries; every digest field is untrusted text ----- */
const fcStr = (v, max) => typeof v==="string" ? v.replace(/\s+/g," ").trim().slice(0, max||300) : (typeof v==="number"&&isFinite(v)) ? String(v) : "";
const fcPage = v => (typeof v==="number"||typeof v==="string") && /^\d{1,5}$/.test(String(v).trim()) && +v>0 ? +v : null;
const fcList = v => Array.isArray(v) ? v.filter(x=>x&&typeof x==="object"&&!Array.isArray(x)) : [];
const fcSeg = v => { const s=String(v??"").trim().toLowerCase(); return FC_SEGMENTS.includes(s) ? s : null; };
const fcAct = v => { const s=String(v??"").trim().toLowerCase(); return FC_ACTIONS.includes(s) ? s : null; };
const FC_NUM = ["no","one","two","three","four","five","six","seven","eight","nine","ten"];
const fcNum = (n, cap) => { const w=n<=10?FC_NUM[n]:count(n); return cap ? w[0].toUpperCase()+w.slice(1) : w; };
// the pages a summary rests on: "Rests on pages 1 to 150 of 624."
function fcReadText(d, f){
  const parts=fcList(d.read).map(x=>[fcPage(x.from), fcPage(x.to)]).filter(([a,b])=>a&&b&&b>=a).map(([a,b])=>a===b?`${count(a)}`:`${count(a)} to ${count(b)}`);
  const total=fcPage(d.pages)||(isNum(f.r.pages)&&+f.r.pages>0?Math.round(+f.r.pages):null);
  if(!parts.length) return `The pages it rests on aren't stated${total?` (the filing has ${plural(total,"page")})`:""}.`;
  return `Rests on ${parts.length===1&&!parts[0].includes(" ")?"page":"pages"} ${parts.join(", ")}${total?` of ${count(total)}`:""}.`;
}
/* UNCONFIRMED: form editions are written month and year, as "06 25", "06/25" or "06 2025". An edition that reads that
   way sorts by its date, newest first; any other edition sorts after them, by the date its filing was published. */
function fcEdition(e){
  const s=String(e??"").trim(); let m=s.match(/^(\d{1,2})\s*[\/ .-]?\s*(\d{4}|\d{2})$/);
  if(!m) return null; const mo=+m[1]; let y=+m[2]; if(y<100) y+=y>=70?1900:2000; return mo>=1&&mo<=12 ? y*100+mo : null;
}
const fcFormKey = n => String(n).toUpperCase().replace(/\s+/g," ").trim();
function fcCompare(fc){
  return fcCarriers(fc).filter(c=>c.list).map(c=>{
    const done=c.list.filter(f=>fcDigestOf(fc,f)).map(f=>({f, d:fcDigestOf(fc,f)}));
    const progs=new Map(), forms=new Map(), rates=[], elig=[], notes=[];
    for(const {f,d} of done){
      for(const p of fcList(d.programs)){
        const name=fcStr(p.name,120), seg=fcSeg(p.segment), k=name.toLowerCase()+"|"+(seg||"");
        if(!progs.has(k)) progs.set(k,{name, seg, src:[]});
        progs.get(k).src.push({f, basis:fcStr(p.basis), page:fcPage(p.page)});
      }
      for(const x of fcList(d.forms)){
        const num=fcStr(x.number,60); if(!num) continue;
        const k=fcFormKey(num); if(!forms.has(k)) forms.set(k,{num, list:[]});
        forms.get(k).list.push({f, num, edition:fcStr(x.edition,30), ed:fcEdition(x.edition), title:fcStr(x.title), action:fcAct(x.action), replaces:fcStr(x.replaces,80), program:fcStr(x.program,120), page:fcPage(x.page)});
      }
      const rt=d.rate&&typeof d.rate==="object"&&!Array.isArray(d.rate) ? d.rate : null;
      if(rt && ["overallPct","requestedPct","approvedPct","premium","policyholders","effectiveNew","effectiveRenewal"].some(k=>isNum(rt[k])||(typeof rt[k]==="string"&&rt[k].trim()))) rates.push({f, rt, page:fcPage(rt.page)});
      for(const e of fcList(d.eligibility)){ const t=fcStr(e.text); if(t) elig.push({f, text:t, page:fcPage(e.page)}); }
      for(const e of fcList(d.notable)){ const t=fcStr(e.text); if(t) notes.push({f, text:t, page:fcPage(e.page)}); }
    }
    const pl=[...progs.values()];
    const fl=[...forms.values()].map(g=>({num:g.num, list:g.list.sort((a,b)=>(b.ed??-1)-(a.ed??-1) || snapByDate(a.f,b.f))})).sort((a,b)=>a.num.localeCompare(b.num, "en", {numeric:true, sensitivity:"base"}));
    return {...c, done, progs:pl, forms:fl, rates, elig, notes};
  });
}
/* One plain sentence on what the summaries show about a carrier's programs. It speaks of the summaries, never of fact. */
function fcSays(cp){
  const nSum=cp.done.length, ps=cp.progs, n=ps.length;
  if(!cp.list.length) return "S&P returned nothing for this search, so there is nothing to summarise.";
  if(!nSum) return "None of its filings found has a saved summary yet, so nothing can be said about its programs.";
  if(!n) return nSum===1 ? "The summary names no program." : `The ${fcNum(nSum)} summaries name no program.`;
  const has=s=>ps.some(p=>p.seg===s), segName=s=>s||"segment not stated";
  const lead = n===1 ? `One program found (${segName(ps[0].seg)})`
    : `${fcNum(n,true)} programs found: ${[...FC_SEGMENTS, null].map(s=>[s, ps.filter(p=>p.seg===s).length]).filter(x=>x[1]).map(([s,k])=>`${fcNum(k)} ${segName(s)}`).join(", ")}`;
  const gap = !has("private client") ? "private client" : !has("middle market") ? "middle market" : "";
  return gap ? `${lead}; the summaries do not show a separate ${gap} program.` : `${lead}.`;
}
const fcSrcHTML = (f, page) => `<div class="fcsrc"><span class="t2">${esc(filingNoText(f.r)||"Filing")}, ${f.pub?fmtD(f.pub):"date n/d"}, ${page?`page ${count(page)}`:"page n/d"}</span>${docButtonHTML(f.dk, page?`Open at page ${count(page)}`:"Open document", page||"")}</div>`;
function fcProgramsHTML(cps){
  const segs=["private client","middle market", ...["standard","other",null].filter(s=>cps.some(c=>c.progs.some(p=>p.seg===s)))];
  const label=s=>s ? s[0].toUpperCase()+s.slice(1) : "Segment not stated";
  const cell=(c,s)=>{ const ps=c.progs.filter(p=>p.seg===s);
    if(!c.done.length) return `<span class="fcnone">No saved summaries</span>`;
    if(!ps.length) return `<span class="fcnone">None in the summaries</span>`;
    return `<ul>${ps.map(p=>`<li><b>${p.name?esc(p.name):"Program not named"}</b>${p.src.map(x=>`${x.basis?`<span class="fcq">“${esc(x.basis)}”</span>`:`<span class="fcq">The summary gives no words for this.</span>`}${fcSrcHTML(x.f, x.page)}`).join("")}</li>`).join("")}</ul>`; };
  return `<div class="tbl-wrap" id="fcProgWrap" data-keep><table class="fcprog" id="fcProgTable"><caption class="sr">Programs found in the saved summaries, by segment and carrier</caption>
    <thead><tr><th>Segment</th>${cps.map(c=>`<th>${esc(c.pk.name)}</th>`).join("")}</tr></thead>

    ${segs.map(s=>`<tr data-seg="${esc(s||"none")}"><td><b>${esc(label(s))}</b></td>${cps.map(c=>`<td>${cell(c,s)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
}

function fcFormsHTML(c){
  if(!c.done.length) return `<p class="fcnone">No saved summaries for ${esc(c.pk.name)} yet.</p>`;
  if(!c.forms.length) return `<p class="fcnone" data-none>The ${c.done.length===1?"summary lists":`${fcNum(c.done.length)} summaries list`} no forms.</p>`;
  const row=(x, old, extra)=>`<tr${old?` class="fcold" data-old`:""}><td class="c-n">${esc(x.num)}</td><td>${x.edition?esc(x.edition):"n/d"}</td><td class="c-t">${x.title?esc(x.title):"n/d"}</td><td>${esc(fcActText(x))}</td><td>${x.program?esc(x.program):`<span class="fcnone">Not linked</span>`}</td><td>${esc(filingNoText(x.f.r)||"n/d")}</td><td>${x.f.pub?fmtD(x.f.pub):"n/d"}</td><td>${x.page?count(x.page):"n/d"}</td><td>${docButtonHTML(x.f.dk, x.page?`Open at page ${count(x.page)}`:"Open document", x.page||"")}${extra||""}</td></tr>`;
  const body=c.forms.map(g=>{
    const k=c.i+"|"+fcFormKey(g.num), on=!!S.fc.open[k], first=g.list[0], rest=g.list.slice(1), older=rest.every(x=>x.edition!==first.edition);
    const tog=rest.length ? `<div><button type="button" class="lnk t2" data-act="fc-more" data-k="${esc(k)}" aria-expanded="${on}">${on?"Hide":"Show"} ${older?plural(rest.length,"earlier edition"):plural(rest.length,"more entry","more entries")}</button></div>` : "";
    return row(first, false, tog)+(on?rest.map(x=>row(x, true)).join(""):""); }).join("");
  return `<div class="tbl-wrap" id="fcFormsWrap${c.i}" data-keep><table class="fcforms" id="fcForms${c.i}"><caption class="sr">Forms in ${esc(c.pk.name)}'s summarised filings</caption><thead><tr><th>Form</th><th>Edition</th><th>Title</th><th>What the filing did</th><th>Program</th><th>Filing</th><th>Published</th><th class="num">Page</th><th>Document</th></tr></thead><tbody>${body}</tbody></table></div>`;
}
function fcRateText(rt){
  const bits=[];
  if(isNum(rt.overallPct)) bits.push(`overall rate change ${pct(rt.overallPct)}`);
  if(isNum(rt.requestedPct)) bits.push(`requested ${pct(rt.requestedPct)}`);
  if(isNum(rt.approvedPct)) bits.push(`approved ${pct(rt.approvedPct)}`);
  if(isNum(rt.premium)) bits.push(`premium affected ${usdM(rt.premium)}`);
  if(isNum(rt.policyholders)) bits.push(`${plural(rt.policyholders,"policyholder")} affected`);
  const day=v=>typeof v==="string"&&parseDay(v)?fmtDay(v):fcStr(v,30);
  if(!blank(rt.effectiveNew)&&day(rt.effectiveNew)) bits.push(`effective for new business ${day(rt.effectiveNew)}`);
  if(!blank(rt.effectiveRenewal)&&day(rt.effectiveRenewal)) bits.push(`for renewals ${day(rt.effectiveRenewal)}`);
  if(typeof dgRateMoreList==="function") for(const x of dgRateMoreList(rt)) bits.push(`${x.label.toLowerCase()} ${x.text}${x.page&&x.page!==rt.page?` (page ${x.page})`:""}`);
  const s=bits.join("; "); return s ? s[0].toUpperCase()+s.slice(1)+"." : "";
}
function fcNotesHTML(c){
  if(!c.done.length) return `<p class="fcnone">No saved summaries for ${esc(c.pk.name)} yet.</p>`;
  const li=(lead, text, f, page)=>`<li>${lead?`<b>${lead}</b> `:""}${esc(text)}${fcSrcHTML(f, page)}</li>`;
  const items=[...c.rates.map(x=>li("Rate:", fcRateText(x.rt), x.f, x.page)), ...c.elig.map(x=>li("Eligibility:", x.text, x.f, x.page)), ...c.notes.map(x=>li("Also:", x.text, x.f, x.page))];
  return items.length ? `<ul class="fcnotes" id="fcNotes${c.i}">${items.join("")}</ul>` : `<p class="fcnone" data-none>The summaries carry no rate or eligibility notes.</p>`;
}

VIEWS.push("compare");

const CMP_MAX_REQUESTS = 150;   // the most S&P requests one comparison may use: under a third of the trial account's 500 an hour
const CMP_RECENT = 6, CMP_LATEST = 12;

/* ----- choosing carriers ----- */
const cmpKey = c => c.kind==="group" ? "g:"+String(c.name).toLowerCase() : "c:"+c.ids[0].kind+":"+c.ids[0].id;
const cmpCos = c => c.kind==="group" ? plural(c.ids.length,"company","companies") : "1 company";
async function cmpLookup(){
  const cm=S.cmp, fd=cm.find, q=fd.q.trim();

/* Adds a carrier unless it is chosen already or the list is full; says why not in the chooser. */
function cmpAdd(c){
  const cm=S.cmp;
  if(cm.carriers.some(x=>cmpKey(x)===cmpKey(c))){ cm.pickErr=`${c.name} is already chosen.`; return false; }
  if(cm.carriers.length>=CMP_MAX){ cm.pickErr=`A comparison takes at most ${CMP_MAX} carriers. Remove one to add ${c.name}.`; return false; }
  cm.carriers.push(c); cm.pickErr=""; cm.formErr=""; cm.setNote=""; return true;
}
function cmpChooseCompany(i){
  const cm=S.cmp, m=cm.find.matches&&cm.find.matches[i], id=m&&snapIdOf(m); if(!id || cm.busy) return;
  cmpAdd({kind:"company", name:id.name||`S&P ${id.kind==="companyId"?"company":"institution"} id ${id.id}`, group:blank(m.naicGroupName)?"":String(m.naicGroupName), ids:[id], noId:0});
  cm.find.matches=null; cm.find.q=""; render(); document.getElementById("cm_find")?.focus();
}
/* A group's member companies with S&P ids, as the Snapshot finds them: the function's whole-group list when it gives
   one, otherwise every company the look-up of the group's name returns that is in the group. */
async function cmpGroupOf(name, seed){
  const key=String(name).trim().toLowerCase(), q=snapGroupQuery(name);
  let found=(seed||[]).slice(), cut=false;
  if(q.length>=2){
    const r=await callFn("snl-filings",{action:"resolve", q});
    if(!r.data) return {err:r};
    const whole=(Array.isArray(r.data.groups)?r.data.groups:[]).find(x=>x&&typeof x==="object"&&Array.isArray(x.members)&&String(x.name??"").trim().toLowerCase()===key);
    if(whole){
      const seen=new Set(), ids=[], n=v=>isNum(v)?Math.max(0, Math.round(+v)):0;
      for(const m of whole.members){ const id=m&&typeof m==="object"?snapIdOf(m):null, k=id&&id.kind+":"+id.id; if(id && !seen.has(k)){ seen.add(k); ids.push(id); } }
      return {carrier:{kind:"group", name:String(name), ids, noId:Math.max(0, n(whole.companies)-n(whole.searchable)), over:!!whole.tooBig || n(whole.searchable)>ids.length}};
    }
    const ms=Array.isArray(r.data.matches)?r.data.matches.filter(m=>m&&typeof m==="object"):[];
    cut=ms.length>=SNAP_LOOKUP_MAX; found=found.concat(ms);
  }
  const seen=new Set(), ids=[]; let noId=0;
  for(const m of found){
    if(blank(m.naicGroupName) || String(m.naicGroupName).trim().toLowerCase()!==key) continue;
    const id=snapIdOf(m), k=id ? id.kind+":"+id.id : "n:"+String(m.companyName??"").toLowerCase()+"|"+String(m.naicCompanyCode??"");
    if(seen.has(k)) continue; seen.add(k);
    if(id) ids.push(id); else noId++;
  }
  return {carrier:{kind:"group", name:String(name), ids, noId, cut}};
}
// why a group can't be one carrier, or ""
function cmpGroupProblem(c){
  if(!c.ids.length) return `None of the companies in ${c.name} has an S&P id in the company list, so its filings can't be searched or compared.`;
  if(c.over || c.ids.length>MAX_COMPANIES) return `${c.name} has more than ${MAX_COMPANIES} companies with S&P ids in the company list, more than the app can list for one group. Compare some of its companies instead.`;
  if(c.cut) return `${c.name} has more companies in the company list than one look-up returns (${SNAP_LOOKUP_MAX}), so a comparison can't be sure to cover all of it. Compare some of its companies instead.`;
  return "";
}
async function cmpChooseGroup(i){
  const cm=S.cmp, all=cm.find.matches||[], g=snapGroups(all)[i]; if(!g || cm.picking || cm.busy) return;
  cm.picking=g.name; cm.pickErr=""; render();
  const r=await cmpGroupOf(g.name, all);
  if(!S.session || S.cmp!==cm || cm.picking!==g.name) return;
  cm.picking="";
  if(r.err){ if(r.err.err!=="signin") cm.pickErr="Couldn't list the group's companies. "+errText(r.err); render(); return; }
  const bad=cmpGroupProblem(r.carrier);

  render(); document.getElementById("cm_find")?.focus();
}
/* A saved carrier set (Contract A, made by the sets feature) fills the list: single companies as single carriers, each
   group as one carrier. companies is the set expanded to companies with an S&P id; set describes the set. A company
   that says which of the set's groups it came from goes into that group; when the set has one group, the companies
   that aren't among its single companies are that group's; with several groups and nothing to say which company is
   whose, each group's members are looked up by its name. Called by the sets feature only when it exists. */
async function cmpFromSet(companies, set){
  const cm=S.cmp; if(cm.busy || cm.picking) return;
  const ok=c=>c && typeof c==="object" && ["companyId","institutionId"].includes(c.kind) && /^\d{1,12}$/.test(String(c.id??"").trim());
  const list=(Array.isArray(companies)?companies:[]).filter(ok).map(c=>({kind:c.kind, id:String(c.id).trim(), name:blank(c.name)?"":String(c.name),
    group:["group","groupName","naicGroupName"].map(k=>c[k]).find(v=>typeof v==="string"&&v.trim())||""}));
  const s=set&&typeof set==="object"?set:{}, setName=blank(s.name)?"the saved set":`"${String(s.name)}"`;
  const groups=(Array.isArray(s.groups)?s.groups:[]).filter(g=>typeof g==="string"&&g.trim()).map(g=>g.trim());
  const idKey=c=>c.kind+":"+c.id;
  const singles=new Set((Array.isArray(s.companies)?s.companies:[]).filter(c=>c&&typeof c==="object").flatMap(c=>[!blank(c.companyId)?"companyId:"+String(c.companyId).trim():"", !blank(c.institutionId)?"institutionId:"+String(c.institutionId).trim():""]).filter(Boolean));
  const out=[], byGroup=new Map(), waiting=[];
  const toGroup=(name, c)=>{ const k=name.toLowerCase(); let g=byGroup.get(k); if(!g){ g={kind:"group", name, ids:[], noId:0}; byGroup.set(k,g); out.push(g); } if(!g.ids.some(x=>idKey(x)===idKey(c))) g.ids.push({kind:c.kind, id:c.id, name:c.name}); };
  for(const c of list){
    const inSet=groups.find(g=>c.group && g.toLowerCase()===c.group.toLowerCase());
    if(!singles.has(idKey(c)) && inSet) toGroup(inSet, c);
    else if(!singles.has(idKey(c)) && !c.group && groups.length===1) toGroup(groups[0], c);
    else if(!singles.has(idKey(c)) && !c.group && groups.length>1) waiting.push(c);
    else out.push({kind:"company", name:c.name||`S&P ${c.kind==="companyId"?"company":"institution"} id ${c.id}`, group:c.group, ids:[{kind:c.kind, id:c.id, name:c.name}], noId:0});
  }
  if(waiting.length){
    cm.picking=s.name?String(s.name):"the saved set"; render();
    for(const name of groups){
      const r=await cmpGroupOf(name, []);
      if(!S.session || S.cmp!==cm) return;
      if(!r.carrier) continue;
      const mine=new Set(r.carrier.ids.map(idKey));
      for(const c of waiting.filter(c=>mine.has(idKey(c)))) toGroup(name, c);
    }
    cm.picking="";
    const placed=new Set(out.flatMap(c=>c.ids.map(idKey)));
    for(const c of waiting.filter(c=>!placed.has(idKey(c)))) out.push({kind:"company", name:c.name||`S&P ${c.kind==="companyId"?"company":"institution"} id ${c.id}`, group:"", ids:[{kind:c.kind, id:c.id, name:c.name}], noId:0});
  }
  const seen=new Set(), keep=out.filter(c=>{ const k=cmpKey(c); if(seen.has(k)) return false; seen.add(k); return true; });
  const left=Math.max(0, keep.length-CMP_MAX), gone=isNum(s.leftOut)?+s.leftOut:0;
  cm.carriers=keep.slice(0, CMP_MAX); cm.find.matches=null; cm.pickErr=""; cm.formErr="";
  cm.setNote=`Filled from ${setName}: ${plural(cm.carriers.length,"carrier")}.`+(left?` A comparison takes at most ${CMP_MAX} carriers, so the last ${left===1?"one was":left+" were"} left out.`:"")+(gone?` ${plural(gone,"company","companies")} in the set ${gone===1?"has":"have"} no S&P id and ${gone===1?"was":"were"} left out.`:"");
  render();
}

/* ----- what it costs, and how it is split into searches ----- */
// every chosen company once, in the order the carriers were chosen (a company in two carriers is searched once)
function cmpUnion(carriers){
  const seen=new Set(), out=[];
  for(const c of carriers) for(const id of c.ids){ const k=id.kind+":"+id.id; if(!seen.has(k)){ seen.add(k); out.push(id); } }
  return out;
}
/* The searches a comparison needs: S&P takes 10 companies of a kind and 365 days a request, so the companies go in
   batches of 10 and each search takes as many whole batches as fit both its limits (MAX_COMPANIES companies, and
   MAX_SEARCH_REQUESTS requests over these dates). That uses no more requests than one search of everything would. */
function cmpPlan(carriers, years, states){
  const {from, to}=snapRange(years), ids=cmpUnion(carriers), windows=snapCost([{kind:"companyId", id:"0"}], from, to);
  const per=Math.max(1, Math.min(Math.floor(MAX_COMPANIES/SNAP_IDS_PER_REQUEST), Math.floor(MAX_SEARCH_REQUESTS/Math.max(1, windows))));
  const batches=[];
  for(const k of ["companyId","institutionId"]){ const l=ids.filter(x=>x.kind===k); for(let i=0; i<l.length; i+=SNAP_IDS_PER_REQUEST) batches.push(l.slice(i, i+SNAP_IDS_PER_REQUEST)); }
  const parts=[];
  for(let i=0; i<batches.length; i+=per){ const b=batches.slice(i, i+per).flat();
    parts.push({action:"search", companyIds:b.filter(x=>x.kind==="companyId").map(x=>Number(x.id)), institutionIds:b.filter(x=>x.kind==="institutionId").map(x=>Number(x.id)), states:[...(states||[])], from, to}); }

const cmpPartIds = p => p.companyIds.map(id=>({kind:"companyId", id:String(id)})).concat(p.institutionIds.map(id=>({kind:"institutionId", id:String(id)})));
// S&P requests left this hour, when the strip knows
function cmpHourLeft(){ const f=S.status&&S.status.filings, u=f&&f.used, l=f&&f.limits; return u&&l&&isNum(u.hour)&&isNum(l.hour) ? Math.max(0, +l.hour - +u.hour) : null; }
/* Why this comparison can't run as chosen, in plain words with what to do instead; "" when it can. */
function cmpTooBig(carriers, years, maxReq=CMP_MAX_REQUESTS){
  if(carriers.length<CMP_MIN) return "";
  const plan=cmpPlan(carriers, years, []);
  if(plan.requests>maxReq){
    const fit=SNAP_YEARS.filter(y=>cmpPlan(carriers, y, []).requests<=maxReq);
    const big=carriers.map(c=>({c, n:snapCost(c.ids, plan.from, plan.to)})).sort((a,b)=>b.n-a.n)[0];
    return `This comparison needs about ${plan.requests} S&P requests in ${plural(plan.parts.length,"search","searches")}, more than the ${maxReq} one comparison may use. ${fit.length?`Choose the ${snapYearsText(Math.max(...fit))} instead, or remove carriers`:"Remove carriers"}, starting with the largest: ${big.c.name} (${cmpCos(big.c)}, about ${plural(big.n,"S&P request")} on its own over these dates).`;
  }
  const left=cmpHourLeft();
  if(left!==null && plan.requests>left) return `This comparison needs about ${plural(plan.requests,"S&P request")}, and ${left===0?"none are":left===1?"only 1 is":`only ${left} are`} left this hour. Wait for the next hour, or choose a shorter period or fewer carriers.`;
  return "";
}

/* ----- running it: the searches one after another, and comparisons run before in this browser ----- */
const cmpRecentKey = () => "snl.compares."+(S.session&&S.session.uid||"");
function cmpRecentList(){
  try{ const a=JSON.parse(localStorage.getItem(cmpRecentKey())||"[]");
    return Array.isArray(a) ? a.filter(x=>x&&Array.isArray(x.carriers)&&x.carriers.length>=CMP_MIN&&x.carriers.every(c=>c&&!blank(c.name)&&Array.isArray(c.ids)&&c.ids.length)&&Array.isArray(x.parts)&&x.parts.length&&x.parts.every(p=>p&&p.action==="search"&&Array.isArray(p.companyIds)&&Array.isArray(p.institutionIds)&&Array.isArray(p.states))).slice(0,CMP_RECENT) : []; }catch{ return []; }
}
// only a comparison whose every search came back complete and saved is listed: reopening it sends the same searches
function cmpRemember(run, parts){
  if(!parts.every(p=>p.state==="ok" && p.res && !p.res.capped && p.res.saved!==false)) return;
  const key=JSON.stringify(run.parts), list=[{carriers:run.carriers, years:run.years, ...(run.scope?{scope:run.scope}:{}), parts:run.parts, at:new Date().toISOString()}].concat(cmpRecentList().filter(x=>JSON.stringify(x.parts)!==key)).slice(0,CMP_RECENT);
  try{ localStorage.setItem(cmpRecentKey(), JSON.stringify(list)); }catch{}
}
async function cmpRun(given){
  const cm=S.cmp; if(cm.busy || cm.picking) return;
  let run=given;
  if(!run){
    if(cm.carriers.length<CMP_MIN){ cm.formErr=`Choose at least ${CMP_MIN} carriers to compare: find each by name above.`; render(); return; }
    const big=cmpTooBig(cm.carriers, cm.years); if(big){ cm.formErr=big; render(); return; }
    const scope=nwKeep("cmp"), toi=scope.tois.map(x=>Number(x.id)).filter(Number.isInteger);
    run={carriers:JSON.parse(JSON.stringify(cm.carriers)), years:cm.years, scope, parts:cmpPlan(cm.carriers, cm.years, scope.states||stateOptions().map(s=>s.id).sort()).parts.map(p=>toi.length?{...p, typeOfInsuranceIds:toi}:p)};
  }
  cm.ran=run; cm.parts=run.parts.map(payload=>({payload, state:"wait", res:null, err:null})); cm.who="all"; cm.shown=CMP_LATEST;
  await cmpGo(cm, cm.parts.map((_,i)=>i), false);
}
/* Runs the given searches of the comparison one after another. A search that fails leaves the others as they are,
   so what came back is shown and only the failed searches need trying again. */
async function cmpGo(cm, which, refresh){
  cm.formErr=""; cm.busy=true;
  for(const i of which){ cm.parts[i].state="wait"; if(!refresh) cm.parts[i].res=null; }
  const unlisted = typeof unlistedOn==="function" && unlistedOn();   // the Filings form's "keep out of Recent searches", when it is on
  for(let k=0; k<which.length; k++){
    const part=cm.parts[which[k]]; cm.step={at:k+1, of:which.length}; part.state="running"; render();
    const body={...part.payload, ...(refresh?{refresh:true}:{}), ...(unlisted?{unlisted:true}:{})};
    cm.prog=null;
    const r=await searchParts(body, {onPart:p=>{ if(S.cmp===cm){ cm.prog=p; render(); } }});   // a wide search comes in parts (big-searches)
    if(!S.session || S.cmp!==cm) return;   // signed out, or the session ended, while it ran
    cm.prog=null;
    if(r.data && Array.isArray(r.data.rows)){ part.state="ok"; part.res=r.data; part.err=null; takeUsage(r.data); }
    else { part.state="err"; part.res=null; part.err = r.data ? {err:"bad_answer", msg:"The filings function sent back something the page can't read. Try again."} : r; }
  }
  cm.busy=false; cm.step=null; loadStatus(); cmpRemember(cm.ran, cm.parts); render();
}
function cmpShowAll(){ const run=S.cmp.ran; if(run) nwShowAll("cmp", nwRunScope(run.scope)); }
function cmpRetry(){ const cm=S.cmp; if(cm.busy || !cm.parts) return; const bad=cm.parts.map((p,i)=>p.state==="err"?i:-1).filter(i=>i>=0); if(bad.length) cmpGo(cm, bad, false); }
function cmpRefresh(){ const cm=S.cmp; if(cm.busy || !cm.parts) return; cmpGo(cm, cm.parts.map((_,i)=>i), true); }
function cmpReopen(i){
  const cm=S.cmp, run=cmpRecentList()[i]; if(!run || cm.busy) return;
  cm.carriers=JSON.parse(JSON.stringify(run.carriers)); cm.years=SNAP_YEARS.includes(+run.years)?+run.years:3; cm.find.matches=null; cm.pickErr=""; cm.setNote=""; nwSetFrom("cmp", run.scope);
  cmpRun(run);
}

/* ----- working it out ----- */
/* UNCONFIRMED: that each company on a filing carries the S&P id it was searched by (companyId, or institutionId when
   the company list has no company id), so a filing can be put with every carrier whose companies it names. A filing
   that names none of the chosen companies' ids is left out of every figure and counted. */
function cmpOwners(f, index){
  const out=new Set(), seen=v=>!blank(v)&&typeof v!=="object" ? String(v).trim() : "";
  for(const c of [...(Array.isArray(f.companies)?f.companies:[]), {companyId:f.companyId, institutionId:f.institutionId}]){
    if(!c || typeof c!=="object") continue;
    for(const k of ["companyId","institutionId"]){ const v=seen(c[k]); if(v) for(const i of index.get(k+":"+v)||[]) out.add(i); }
  }
  return [...out].sort((a,b)=>a-b);
}
const cmpLatestRate = list => list.filter(f=>f.rate!==null).sort(snapByDate)[0]||null;
function cmpCompute(cm){
  const run=cm.ran, cars=run.carriers, parts=cm.parts, p0=run.parts[0]||{};
  const got=parts.filter(p=>p.res);   // a search being refreshed keeps its earlier result until the new one arrives
  // which search each company was in, and so how much of each carrier came back
  const partOf=new Map(); run.parts.forEach((p,i)=>cmpPartIds(p).forEach(x=>partOf.set(x.kind+":"+x.id, i)));
  const index=new Map(); cars.forEach((c,i)=>c.ids.forEach(x=>{ const k=x.kind+":"+x.id; if(!index.has(k)) index.set(k,[]); index.get(k).push(i); }));
  const cover=cars.map(c=>{ const ps=c.ids.map(x=>parts[partOf.get(x.kind+":"+x.id)]), have=ps.filter(p=>p&&p.res);
    return {got:have.length, of:ps.length, all:have.length===ps.length, none:!have.length, capped:have.some(p=>p.res.capped)}; });
  // narrowed on this page when the choice is inside what was searched (Narrow it down); every carrier alike
  const sc=nwRunScope(run.scope), sh=nwShown("cmp", sc), rows0=got.flatMap(p=>p.res.rows), fr=nwFilterRows(sh, rows0);
  const allN=sh.narrowed ? snapFilings(rows0).filter(r=>cmpOwners(r, index).length).length : null;
  const all=snapFilings(fr.rows).map(r=>({r, k:snapKinds(r.serffFilingType), st:snapState(r), toi:blank(r.typeOfInsurance)?"":String(r.typeOfInsurance), type:blank(r.serffFilingType)?"":String(r.serffFilingType),
    pub:parseDay(r.publishDate), sub:parseDay(r.dateSubmitted), rate:isNum(r.overallRateImpact)?+r.overallRateImpact:null, ok:snapApproved(r.filingStatus)}));
  for(const f of all) f.owners=cmpOwners(f.r, index);
  const fs=all.filter(f=>f.owners.length), stray=all.length-fs.length, shared=fs.filter(f=>f.owners.length>1).length;
  const of=i=>fs.filter(f=>f.owners.includes(i));
  const sum=cars.map((c,i)=>{ const l=of(i), v=l.filter(f=>f.rate!==null).map(f=>f.rate), dated=l.filter(f=>f.pub);
    return {n:l.length, rate:l.filter(f=>f.k.rate).length, rule:l.filter(f=>f.k.rule).length, form:l.filter(f=>f.k.form).length, states:new Set(l.map(f=>f.st).filter(Boolean)).size,
      withRate:v.length, lo:v.length?Math.min(...v):null, hi:v.length?Math.max(...v):null, latestRate:cmpLatestRate(l), latest:dated.length?dated.slice().sort(snapByDate)[0].pub:null}; });
  // carrier by state, and carrier by type of insurance: each cell the carrier's filings there and its latest rate impact
  const matrix=(keyOf, keys)=>{ const m=new Map(keys.map(k=>[k, []])); for(const f of fs){ const k=keyOf(f); if(k===null) continue; if(!m.has(k)) m.set(k,[]); m.get(k).push(f); }
    return [...m.entries()].map(([k, l])=>({k, all:l.length, cells:cars.map((c,i)=>{ const x=l.filter(f=>f.owners.includes(i)); return {n:x.length, latest:cmpLatestRate(x)}; })}))
      .map(r=>({...r, filers:r.cells.filter(x=>x.n).length})).sort((a,b)=>b.all-a.all || String(a.k).localeCompare(String(b.k))); };
  const searched=sh.states ? sh.states.slice() : [...new Set((Array.isArray(p0.states)?p0.states:[]).map(s=>String(s).toUpperCase()))];
  const stateRows=matrix(f=>f.st||null, searched);
  const toiRows=matrix(f=>f.toi, []);
  // filings by year published, per carrier
  const y0=parseDay(p0.from), y1=parseDay(p0.to), years=[];
  if(y0 && y1) for(let y=y0.getFullYear(); y<=y1.getFullYear() && years.length<20; y++) years.push(y);
  const yearRows=cars.map((c,i)=>{ const l=of(i); return {by:years.map(y=>l.filter(f=>f.pub&&f.pub.getFullYear()===y).length), undated:l.filter(f=>!f.pub).length}; });
  return {from:p0.from, to:p0.to, sc, sh, allN, noToi:fr.noToi, cars, cover, fs, stray, shared, sum, searched, stateRows, toiRows, years, yearRows, noState:fs.filter(f=>!f.st).length,
    ratePts:cars.map((c,i)=>of(i).filter(f=>f.rate!==null&&f.pub).sort((a,b)=>a.pub-b.pub)), rateNoDate:fs.filter(f=>f.rate!==null&&!f.pub).length,
    latest:fs.slice().sort(snapByDate), got, notes:[...new Set(got.flatMap(p=>Array.isArray(p.res.notes)?p.res.notes:[]))].filter(n=>!blank(n)&&!/^S&P returned no(thing| filings) for /.test(String(n))&&!/^The search stopped|^S&P was answering slowly/.test(String(n)))};
}

/* ----- hand-offs: a carrier's own Snapshot, and the searches on the Filings view ----- */
function cmpToSnapshot(i){
  const cm=S.cmp, car=cm.ran&&cm.ran.carriers[i], sn=S.snap; if(!car) return;
  if(sn.busy){ toast("The Snapshot view is still getting a snapshot. Try again when it has finished."); return; }
  const pick={kind:car.kind, name:car.name, group:car.kind==="group"?car.name:(car.group||""), ids:car.ids.map(x=>({kind:x.kind, id:String(x.id), name:x.name||""})), noId:car.noId||0, cut:false};
  const {from, to}=snapRange(cm.ran.years), nums=k=>pick.ids.filter(x=>x.kind===k).map(x=>Number(x.id)), scope=cm.ran.scope||null;
  const payload=snapPayload(nums("companyId"), nums("institutionId"), scope, from, to);
  sn.pick=pick; sn.years=cm.ran.years; sn.find.matches=null; sn.formErr=""; sn.pickErr=""; nwSetFrom("snap", scope);
  const saved=snapRecentList().find(x=>JSON.stringify(x.payload)===JSON.stringify(payload));
  location.hash="#snapshot";
  if(saved) snapRun(false, saved);   // run before in this browser: opens from the saved result
  else { sn.res=null; sn.err=null; sn.ran=null; toast(`${car.name} is chosen on the Snapshot view. Press Show snapshot to run it: about ${plural(snapCost(pick.ids, from, to),"S&P request")}.`); }
}
function cmpToFilings(k){
  const cm=S.cmp, run=cm.ran, part=cm.parts&&cm.parts[k], f=S.f; if(!run || !part) return;
  if(f.busy){ toast("The Filings view is still running a search. Try again when it has finished."); return; }
  const p=part.payload, names=new Map(); run.carriers.forEach(c=>c.ids.forEach(x=>{ if(!names.get(x.kind+":"+x.id)) names.set(x.kind+":"+x.id, x.name||""); }));
  f.chips=cmpPartIds(p).map(x=>({kind:x.kind, id:x.id, name:names.get(x.kind+":"+x.id)||""}));
  f.states=[...p.states]; f.from=p.from; f.to=p.to; f.toi=(Array.isArray(p.typeOfInsuranceIds)?p.typeOfInsuranceIds:[]).map(String); f.ftype=[]; f.fstatus=[]; f.toiFilter=""; f.tracking="";
  f.q=""; f.matches=null; f.resolveNote=""; f.resolveErr=""; f.formErr="";
  location.hash="#filings";
  if(part.state!=="ok" || !part.res || part.res.capped){ f.res=null; f.err=null; toast("The form is filled in. Press Search filings to run it: this search wasn't saved complete, so it asks S&P again."); }
  else runSearch(false, {...p});
}

    return out(st?"by-state":"by-type-of-insurance", st?"By state":"By type of insurance", [st?"State":"Type of insurance", ...(st?["State name"]:[]), "All carriers (each filing once)", ...c.cars.flatMap(car=>[`${car.name}: filings`,`${car.name}: latest rate impact (%)`,`${car.name}: latest, date published`,`${car.name}: latest, status`])],
