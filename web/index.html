/* ---------- Compare: two to eight carriers side by side over 1, 3 or 5 years ----------
   Page only. A carrier is a company or a whole group, chosen as on the Snapshot. All the carriers' companies are
   searched together with as few S&P requests as possible; one "search" takes at most MAX_COMPANIES companies and
   MAX_SEARCH_REQUESTS requests, so a comparison of many companies runs as several ordinary saved searches, one after
   another. Every figure is worked out here from the rows that come back, with the Snapshot's own readings of filing
   types, statuses and dates (snapKinds, snapApproved, snapFilings). */
VIEWS.push("compare");
const CMP_MIN = 2, CMP_MAX = 8;
const CMP_MAX_REQUESTS = 150;   // the most S&P requests one comparison may use: under a third of the trial account's 500 an hour
const CMP_RECENT = 6, CMP_LATEST = 12;
function freshCmp(){ return {find:{q:"", asked:"", matches:null, busy:false, err:""}, carriers:[], picking:"", pickErr:"", setNote:"", years:3, formErr:"", busy:false, step:null, ran:null, parts:null, by:"count", toiBy:"count", multi:false, toiMulti:false, who:"all", shown:CMP_LATEST}; }
S.cmp=freshCmp();
try{ window.matchMedia("(max-width:700px)").addEventListener("change", ()=>{ if(S.session && S.view==="compare" && S.cmp.parts) render(); }); }catch{}   // the charts are drawn for the width
function enterCompare(){ if(!S.refs && !S.refsLoading) loadRefs(false); }

/* ----- choosing carriers ----- */
const cmpKey = c => c.kind==="group" ? "g:"+String(c.name).toLowerCase() : "c:"+c.ids[0].kind+":"+c.ids[0].id;
const cmpCos = c => c.kind==="group" ? plural(c.ids.length,"company","companies") : "1 company";
async function cmpLookup(){
  const cm=S.cmp, fd=cm.find, q=fd.q.trim();
  if(!q){ fd.matches=null; fd.err="Type part of a company or group name."; render(); return; }
  fd.busy=true; fd.err=""; fd.matches=null; fd.asked=q; cm.pickErr=""; render();
  const r=await callFn("snl-filings",{action:"resolve", q});
  if(!S.session || S.cmp!==cm || fd.asked!==q) return;
  fd.busy=false;
  if(r.data) fd.matches=Array.isArray(r.data.matches)?r.data.matches.filter(m=>m&&typeof m==="object"):[];
  else if(r.err!=="signin") fd.err="Couldn't look that up. "+errText(r);
  render();
}
/* Adds a carrier unless it is chosen already or the list is full; says why not in the chooser. */
function cmpAdd(c){
  const cm=S.cmp;
  if(cm.carriers.some(x=>cmpKey(x)===cmpKey(c))){ cm.pickErr=`${c.name} is already chosen.`; return false; }
  if(cm.carriers.length>=CMP_MAX){ cm.pickErr=`A comparison takes at most ${CMP_MAX} carriers. Remove one to add ${c.name}.`; return false; }
  cm.carriers.push(c); cm.pickErr=""; cm.formErr=""; cm.setNote=""; return true;
}
function cmpChooseCompany(i){
  const cm=S.cmp, m=cm.find.matches&&cm.find.matches[i], id=m&&snapIdOf(m); if(!id || cm.busy) return;
  cmpAdd({kind:"company", name:id.name||`S&P ${id.kind==="companyId"?"company":"institution"} id ${id.id}`, group:blank(m.naicGroupName)?"":String(m.naicGroupName), ids:[id], noId:0});
  cm.find.matches=null; cm.find.q=""; render(); document.getElementById("cm_find")?.focus();
}
/* A group's member companies with S&P ids, as the Snapshot finds them: the function's whole-group list when it gives
   one, otherwise every company the look-up of the group's name returns that is in the group. */
async function cmpGroupOf(name, seed){
  const key=String(name).trim().toLowerCase(), q=snapGroupQuery(name);
  let found=(seed||[]).slice(), cut=false;
  if(q.length>=2){
    const r=await callFn("snl-filings",{action:"resolve", q});
    if(!r.data) return {err:r};
    const whole=(Array.isArray(r.data.groups)?r.data.groups:[]).find(x=>x&&typeof x==="object"&&Array.isArray(x.members)&&String(x.name??"").trim().toLowerCase()===key);
    if(whole){
      const seen=new Set(), ids=[], n=v=>isNum(v)?Math.max(0, Math.round(+v)):0;
      for(const m of whole.members){ const id=m&&typeof m==="object"?snapIdOf(m):null, k=id&&id.kind+":"+id.id; if(id && !seen.has(k)){ seen.add(k); ids.push(id); } }
      return {carrier:{kind:"group", name:String(name), ids, noId:Math.max(0, n(whole.companies)-n(whole.searchable)), over:!!whole.tooBig || n(whole.searchable)>ids.length}};
    }
    const ms=Array.isArray(r.data.matches)?r.data.matches.filter(m=>m&&typeof m==="object"):[];
    cut=ms.length>=SNAP_LOOKUP_MAX; found=found.concat(ms);
  }
  const seen=new Set(), ids=[]; let noId=0;
  for(const m of found){
    if(blank(m.naicGroupName) || String(m.naicGroupName).trim().toLowerCase()!==key) continue;
    const id=snapIdOf(m), k=id ? id.kind+":"+id.id : "n:"+String(m.companyName??"").toLowerCase()+"|"+String(m.naicCompanyCode??"");
    if(seen.has(k)) continue; seen.add(k);
    if(id) ids.push(id); else noId++;
  }
  return {carrier:{kind:"group", name:String(name), ids, noId, cut}};
}
// why a group can't be one carrier, or ""
function cmpGroupProblem(c){
  if(!c.ids.length) return `None of the companies in ${c.name} has an S&P id in the company list, so its filings can't be searched or compared.`;
  if(c.over || c.ids.length>MAX_COMPANIES) return `${c.name} has more than ${MAX_COMPANIES} companies with S&P ids in the company list, more than the app can list for one group. Compare some of its companies instead.`;
  if(c.cut) return `${c.name} has more companies in the company list than one look-up returns (${SNAP_LOOKUP_MAX}), so a comparison can't be sure to cover all of it. Compare some of its companies instead.`;
  return "";
}
async function cmpChooseGroup(i){
  const cm=S.cmp, all=cm.find.matches||[], g=snapGroups(all)[i]; if(!g || cm.picking || cm.busy) return;
  cm.picking=g.name; cm.pickErr=""; render();
  const r=await cmpGroupOf(g.name, all);
  if(!S.session || S.cmp!==cm || cm.picking!==g.name) return;
  cm.picking="";
  if(r.err){ if(r.err.err!=="signin") cm.pickErr="Couldn't list the group's companies. "+errText(r.err); render(); return; }
  const bad=cmpGroupProblem(r.carrier);
  if(bad) cm.pickErr=bad; else if(cmpAdd(r.carrier)){ cm.find.matches=null; cm.find.q=""; }
  render(); document.getElementById("cm_find")?.focus();
}
/* A saved carrier set (Contract A, made by the sets feature) fills the list: single companies as single carriers, each
   group as one carrier. companies is the set expanded to companies with an S&P id; set describes the set. A company
   that says which of the set's groups it came from goes into that group; when the set has one group, the companies
   that aren't among its single companies are that group's; with several groups and nothing to say which company is
   whose, each group's members are looked up by its name. Called by the sets feature only when it exists. */
async function cmpFromSet(companies, set){
  const cm=S.cmp; if(cm.busy || cm.picking) return;
  const ok=c=>c && typeof c==="object" && ["companyId","institutionId"].includes(c.kind) && /^\d{1,12}$/.test(String(c.id??"").trim());
  const list=(Array.isArray(companies)?companies:[]).filter(ok).map(c=>({kind:c.kind, id:String(c.id).trim(), name:blank(c.name)?"":String(c.name),
    group:["group","groupName","naicGroupName"].map(k=>c[k]).find(v=>typeof v==="string"&&v.trim())||""}));
  const s=set&&typeof set==="object"?set:{}, setName=blank(s.name)?"the saved set":`"${String(s.name)}"`;
  const groups=(Array.isArray(s.groups)?s.groups:[]).filter(g=>typeof g==="string"&&g.trim()).map(g=>g.trim());
  const idKey=c=>c.kind+":"+c.id;
  const singles=new Set((Array.isArray(s.companies)?s.companies:[]).filter(c=>c&&typeof c==="object").flatMap(c=>[!blank(c.companyId)?"companyId:"+String(c.companyId).trim():"", !blank(c.institutionId)?"institutionId:"+String(c.institutionId).trim():""]).filter(Boolean));
  const out=[], byGroup=new Map(), waiting=[];
  const toGroup=(name, c)=>{ const k=name.toLowerCase(); let g=byGroup.get(k); if(!g){ g={kind:"group", name, ids:[], noId:0}; byGroup.set(k,g); out.push(g); } if(!g.ids.some(x=>idKey(x)===idKey(c))) g.ids.push({kind:c.kind, id:c.id, name:c.name}); };
  for(const c of list){
    const inSet=groups.find(g=>c.group && g.toLowerCase()===c.group.toLowerCase());
    if(!singles.has(idKey(c)) && inSet) toGroup(inSet, c);
    else if(!singles.has(idKey(c)) && !c.group && groups.length===1) toGroup(groups[0], c);
    else if(!singles.has(idKey(c)) && !c.group && groups.length>1) waiting.push(c);
    else out.push({kind:"company", name:c.name||`S&P ${c.kind==="companyId"?"company":"institution"} id ${c.id}`, group:c.group, ids:[{kind:c.kind, id:c.id, name:c.name}], noId:0});
  }
  if(waiting.length){
    cm.picking=s.name?String(s.name):"the saved set"; render();
    for(const name of groups){
      const r=await cmpGroupOf(name, []);
      if(!S.session || S.cmp!==cm) return;
      if(!r.carrier) continue;
      const mine=new Set(r.carrier.ids.map(idKey));
      for(const c of waiting.filter(c=>mine.has(idKey(c)))) toGroup(name, c);
    }
    cm.picking="";
    const placed=new Set(out.flatMap(c=>c.ids.map(idKey)));
    for(const c of waiting.filter(c=>!placed.has(idKey(c)))) out.push({kind:"company", name:c.name||`S&P ${c.kind==="companyId"?"company":"institution"} id ${c.id}`, group:"", ids:[{kind:c.kind, id:c.id, name:c.name}], noId:0});
  }
  const seen=new Set(), keep=out.filter(c=>{ const k=cmpKey(c); if(seen.has(k)) return false; seen.add(k); return true; });
  const left=Math.max(0, keep.length-CMP_MAX), gone=isNum(s.leftOut)?+s.leftOut:0;
  cm.carriers=keep.slice(0, CMP_MAX); cm.find.matches=null; cm.pickErr=""; cm.formErr="";
  cm.setNote=`Filled from ${setName}: ${plural(cm.carriers.length,"carrier")}.`+(left?` A comparison takes at most ${CMP_MAX} carriers, so the last ${left===1?"one was":left+" were"} left out.`:"")+(gone?` ${plural(gone,"company","companies")} in the set ${gone===1?"has":"have"} no S&P id and ${gone===1?"was":"were"} left out.`:"");
  render();
}

/* ----- what it costs, and how it is split into searches ----- */
// every chosen company once, in the order the carriers were chosen (a company in two carriers is searched once)
function cmpUnion(carriers){
  const seen=new Set(), out=[];
  for(const c of carriers) for(const id of c.ids){ const k=id.kind+":"+id.id; if(!seen.has(k)){ seen.add(k); out.push(id); } }
  return out;
}
/* The searches a comparison needs: S&P takes 10 companies of a kind and 365 days a request, so the companies go in
   batches of 10 and each search takes as many whole batches as fit both its limits (MAX_COMPANIES companies, and
   MAX_SEARCH_REQUESTS requests over these dates). That uses no more requests than one search of everything would. */
function cmpPlan(carriers, years, states){
  const {from, to}=snapRange(years), ids=cmpUnion(carriers), windows=snapCost([{kind:"companyId", id:"0"}], from, to);
  const per=Math.max(1, Math.min(Math.floor(MAX_COMPANIES/SNAP_IDS_PER_REQUEST), Math.floor(MAX_SEARCH_REQUESTS/Math.max(1, windows))));
  const batches=[];
  for(const k of ["companyId","institutionId"]){ const l=ids.filter(x=>x.kind===k); for(let i=0; i<l.length; i+=SNAP_IDS_PER_REQUEST) batches.push(l.slice(i, i+SNAP_IDS_PER_REQUEST)); }
  const parts=[];
  for(let i=0; i<batches.length; i+=per){ const b=batches.slice(i, i+per).flat();
    parts.push({action:"search", companyIds:b.filter(x=>x.kind==="companyId").map(x=>Number(x.id)), institutionIds:b.filter(x=>x.kind==="institutionId").map(x=>Number(x.id)), states:[...(states||[])], from, to}); }
  return {from, to, ids, windows, parts, requests:batches.length*windows};
}
const cmpPartIds = p => p.companyIds.map(id=>({kind:"companyId", id:String(id)})).concat(p.institutionIds.map(id=>({kind:"institutionId", id:String(id)})));
// S&P requests left this hour, when the strip knows
function cmpHourLeft(){ const f=S.status&&S.status.filings, u=f&&f.used, l=f&&f.limits; return u&&l&&isNum(u.hour)&&isNum(l.hour) ? Math.max(0, +l.hour - +u.hour) : null; }
/* Why this comparison can't run as chosen, in plain words with what to do instead; "" when it can. */
function cmpTooBig(carriers, years, maxReq=CMP_MAX_REQUESTS){
  if(carriers.length<CMP_MIN) return "";
  const plan=cmpPlan(carriers, years, []);
  if(plan.requests>maxReq){
    const fit=SNAP_YEARS.filter(y=>cmpPlan(carriers, y, []).requests<=maxReq);
    const big=carriers.map(c=>({c, n:snapCost(c.ids, plan.from, plan.to)})).sort((a,b)=>b.n-a.n)[0];
    return `This comparison needs about ${plan.requests} S&P requests in ${plural(plan.parts.length,"search","searches")}, more than the ${maxReq} one comparison may use. ${fit.length?`Choose the ${snapYearsText(Math.max(...fit))} instead, or remove carriers`:"Remove carriers"}, starting with the largest: ${big.c.name} (${cmpCos(big.c)}, about ${plural(big.n,"S&P request")} on its own over these dates).`;
  }
  const left=cmpHourLeft();
  if(left!==null && plan.requests>left) return `This comparison needs about ${plural(plan.requests,"S&P request")}, and ${left===0?"none are":left===1?"only 1 is":`only ${left} are`} left this hour. Wait for the next hour, or choose a shorter period or fewer carriers.`;
  return "";
}

/* ----- running it: the searches one after another, and comparisons run before in this browser ----- */
const cmpRecentKey = () => "snl.compares."+(S.session&&S.session.uid||"");
function cmpRecentList(){
  try{ const a=JSON.parse(localStorage.getItem(cmpRecentKey())||"[]");
    return Array.isArray(a) ? a.filter(x=>x&&Array.isArray(x.carriers)&&x.carriers.length>=CMP_MIN&&x.carriers.every(c=>c&&!blank(c.name)&&Array.isArray(c.ids)&&c.ids.length)&&Array.isArray(x.parts)&&x.parts.length&&x.parts.every(p=>p&&p.action==="search"&&Array.isArray(p.companyIds)&&Array.isArray(p.institutionIds)&&Array.isArray(p.states))).slice(0,CMP_RECENT) : []; }catch{ return []; }
}
// only a comparison whose every search came back complete and saved is listed: reopening it sends the same searches
function cmpRemember(run, parts){
  if(!parts.every(p=>p.state==="ok" && p.res && !p.res.capped && p.res.saved!==false)) return;
  const key=JSON.stringify(run.parts), list=[{carriers:run.carriers, years:run.years, parts:run.parts, at:new Date().toISOString()}].concat(cmpRecentList().filter(x=>JSON.stringify(x.parts)!==key)).slice(0,CMP_RECENT);
  try{ localStorage.setItem(cmpRecentKey(), JSON.stringify(list)); }catch{}
}
async function cmpRun(given){
  const cm=S.cmp; if(cm.busy || cm.picking) return;
  let run=given;
  if(!run){
    if(cm.carriers.length<CMP_MIN){ cm.formErr=`Choose at least ${CMP_MIN} carriers to compare: find each by name above.`; render(); return; }
    const big=cmpTooBig(cm.carriers, cm.years); if(big){ cm.formErr=big; render(); return; }
    run={carriers:JSON.parse(JSON.stringify(cm.carriers)), years:cm.years, parts:cmpPlan(cm.carriers, cm.years, stateOptions().map(s=>s.id).sort()).parts};
  }
  cm.ran=run; cm.parts=run.parts.map(payload=>({payload, state:"wait", res:null, err:null})); cm.who="all"; cm.shown=CMP_LATEST;
  await cmpGo(cm, cm.parts.map((_,i)=>i), false);
}
/* Runs the given searches of the comparison one after another. A search that fails leaves the others as they are,
   so what came back is shown and only the failed searches need trying again. */
async function cmpGo(cm, which, refresh){
  cm.formErr=""; cm.busy=true;
  for(const i of which){ cm.parts[i].state="wait"; if(!refresh) cm.parts[i].res=null; }
  const unlisted = typeof unlistedOn==="function" && unlistedOn();   // the Filings form's "keep out of Recent searches", when it is on
  for(let k=0; k<which.length; k++){
    const part=cm.parts[which[k]]; cm.step={at:k+1, of:which.length}; part.state="running"; render();
    const body={...part.payload, ...(refresh?{refresh:true}:{}), ...(unlisted?{unlisted:true}:{})};
    const r=await callFn("snl-filings", body);
    if(!S.session || S.cmp!==cm) return;   // signed out, or the session ended, while it ran
    if(r.data && Array.isArray(r.data.rows)){ part.state="ok"; part.res=r.data; part.err=null; takeUsage(r.data); }
    else { part.state="err"; part.res=null; part.err = r.data ? {err:"bad_answer", msg:"The filings function sent back something the page can't read. Try again."} : r; }
  }
  cm.busy=false; cm.step=null; loadStatus(); cmpRemember(cm.ran, cm.parts); render();
}
function cmpRetry(){ const cm=S.cmp; if(cm.busy || !cm.parts) return; const bad=cm.parts.map((p,i)=>p.state==="err"?i:-1).filter(i=>i>=0); if(bad.length) cmpGo(cm, bad, false); }
function cmpRefresh(){ const cm=S.cmp; if(cm.busy || !cm.parts) return; cmpGo(cm, cm.parts.map((_,i)=>i), true); }
function cmpReopen(i){
  const cm=S.cmp, run=cmpRecentList()[i]; if(!run || cm.busy) return;
  cm.carriers=JSON.parse(JSON.stringify(run.carriers)); cm.years=SNAP_YEARS.includes(+run.years)?+run.years:3; cm.find.matches=null; cm.pickErr=""; cm.setNote="";
  cmpRun(run);
}

/* ----- working it out ----- */
/* UNCONFIRMED: that each company on a filing carries the S&P id it was searched by (companyId, or institutionId when
   the company list has no company id), so a filing can be put with every carrier whose companies it names. A filing
   that names none of the chosen companies' ids is left out of every figure and counted. */
function cmpOwners(f, index){
  const out=new Set(), seen=v=>!blank(v)&&typeof v!=="object" ? String(v).trim() : "";
  for(const c of [...(Array.isArray(f.companies)?f.companies:[]), {companyId:f.companyId, institutionId:f.institutionId}]){
    if(!c || typeof c!=="object") continue;
    for(const k of ["companyId","institutionId"]){ const v=seen(c[k]); if(v) for(const i of index.get(k+":"+v)||[]) out.add(i); }
  }
  return [...out].sort((a,b)=>a-b);
}
const cmpLatestRate = list => list.filter(f=>f.rate!==null).sort(snapByDate)[0]||null;
function cmpCompute(cm){
  const run=cm.ran, cars=run.carriers, parts=cm.parts, p0=run.parts[0]||{};
  const got=parts.filter(p=>p.res);   // a search being refreshed keeps its earlier result until the new one arrives
  // which search each company was in, and so how much of each carrier came back
  const partOf=new Map(); run.parts.forEach((p,i)=>cmpPartIds(p).forEach(x=>partOf.set(x.kind+":"+x.id, i)));
  const index=new Map(); cars.forEach((c,i)=>c.ids.forEach(x=>{ const k=x.kind+":"+x.id; if(!index.has(k)) index.set(k,[]); index.get(k).push(i); }));
  const cover=cars.map(c=>{ const ps=c.ids.map(x=>parts[partOf.get(x.kind+":"+x.id)]), have=ps.filter(p=>p&&p.res);
    return {got:have.length, of:ps.length, all:have.length===ps.length, none:!have.length, capped:have.some(p=>p.res.capped)}; });
  const all=snapFilings(got.flatMap(p=>p.res.rows)).map(r=>({r, k:snapKinds(r.serffFilingType), st:snapState(r), toi:blank(r.typeOfInsurance)?"":String(r.typeOfInsurance), type:blank(r.serffFilingType)?"":String(r.serffFilingType),
    pub:parseDay(r.publishDate), sub:parseDay(r.dateSubmitted), rate:isNum(r.overallRateImpact)?+r.overallRateImpact:null, ok:snapApproved(r.filingStatus)}));
  for(const f of all) f.owners=cmpOwners(f.r, index);
  const fs=all.filter(f=>f.owners.length), stray=all.length-fs.length, shared=fs.filter(f=>f.owners.length>1).length;
  const of=i=>fs.filter(f=>f.owners.includes(i));
  const sum=cars.map((c,i)=>{ const l=of(i), v=l.filter(f=>f.rate!==null).map(f=>f.rate), dated=l.filter(f=>f.pub);
    return {n:l.length, rate:l.filter(f=>f.k.rate).length, rule:l.filter(f=>f.k.rule).length, form:l.filter(f=>f.k.form).length, states:new Set(l.map(f=>f.st).filter(Boolean)).size,
      withRate:v.length, lo:v.length?Math.min(...v):null, hi:v.length?Math.max(...v):null, latestRate:cmpLatestRate(l), latest:dated.length?dated.slice().sort(snapByDate)[0].pub:null}; });
  // carrier by state, and carrier by type of insurance: each cell the carrier's filings there and its latest rate impact
  const matrix=(keyOf, keys)=>{ const m=new Map(keys.map(k=>[k, []])); for(const f of fs){ const k=keyOf(f); if(k===null) continue; if(!m.has(k)) m.set(k,[]); m.get(k).push(f); }
    return [...m.entries()].map(([k, l])=>({k, all:l.length, cells:cars.map((c,i)=>{ const x=l.filter(f=>f.owners.includes(i)); return {n:x.length, latest:cmpLatestRate(x)}; })}))
      .map(r=>({...r, filers:r.cells.filter(x=>x.n).length})).sort((a,b)=>b.all-a.all || String(a.k).localeCompare(String(b.k))); };
  const searched=[...new Set((Array.isArray(p0.states)?p0.states:[]).map(s=>String(s).toUpperCase()))];
  const stateRows=matrix(f=>f.st||null, searched);
  const toiRows=matrix(f=>f.toi, []);
  // filings by year published, per carrier
  const y0=parseDay(p0.from), y1=parseDay(p0.to), years=[];
  if(y0 && y1) for(let y=y0.getFullYear(); y<=y1.getFullYear() && years.length<20; y++) years.push(y);
  const yearRows=cars.map((c,i)=>{ const l=of(i); return {by:years.map(y=>l.filter(f=>f.pub&&f.pub.getFullYear()===y).length), undated:l.filter(f=>!f.pub).length}; });
  return {from:p0.from, to:p0.to, cars, cover, fs, stray, shared, sum, searched, stateRows, toiRows, years, yearRows, noState:fs.filter(f=>!f.st).length,
    ratePts:cars.map((c,i)=>of(i).filter(f=>f.rate!==null&&f.pub).sort((a,b)=>a.pub-b.pub)), rateNoDate:fs.filter(f=>f.rate!==null&&!f.pub).length,
    latest:fs.slice().sort(snapByDate), got, notes:[...new Set(got.flatMap(p=>Array.isArray(p.res.notes)?p.res.notes:[]))].filter(n=>!blank(n)&&!/^S&P returned no(thing| filings) for /.test(String(n))&&!/^The search stopped|^S&P was answering slowly/.test(String(n)))};
}

/* Rate changes over time: one lane per carrier on one time scale and one rate scale, each mark a filing with an
   overall rate impact (the Snapshot's marks: up and down differ, approved filled, any other status hollow). */
function cmpRateChart(c){
  const lanes=c.cars.map((car,i)=>({car, pts:c.ratePts[i]})).filter(x=>x.pts.length); if(!lanes.length) return "";
  const nar=snapNarrow(), W=nar?360:1240, L=nar?50:64, R=12, T=4, LB=18, PH=nar?54:62, GAP=12, B=24, LANE=LB+PH+GAP, H=T+lanes.length*LANE-GAP+B;
  const all=lanes.flatMap(x=>x.pts), t0=(parseDay(c.from)||all[0].pub).getTime(), t1=Math.max((parseDay(c.to)||all[all.length-1].pub).getTime(), t0+DAY);
  const m=Math.max(5, Math.ceil(Math.max(...all.map(f=>Math.abs(f.rate)))/5)*5);
  const x=t=>+(L+(t-t0)/(t1-t0)*(W-L-R)).toFixed(1), y=(v,li)=>+(T+li*LANE+LB+(m-v)/(2*m)*PH).toFixed(1);
  let g="";
  for(let yr=new Date(t0).getFullYear()+1; yr<=new Date(t1).getFullYear(); yr++){ const t=new Date(yr,0,1).getTime(); if(t<=t0||t>t1) continue;
    g+=`<line class="ax" x1="${x(t)}" x2="${x(t)}" y1="${T+LB}" y2="${H-B}"/><text x="${x(t)}" y="${H-8}" text-anchor="middle">${yr}</text>`; }
  lanes.forEach((ln,li)=>{
    g+=`<text class="ln" x="${L}" y="${T+li*LANE+13}">${esc(`${ln.car.name} · ${plural(ln.pts.length,"filing")}`)}</text>`;
    for(const v of [m, 0, -m]) g+=`<line class="${v===0?"ax0":"ax"}" x1="${L}" x2="${W-R}" y1="${y(v,li)}" y2="${y(v,li)}"/><text x="${L-6}" y="${y(v,li)+4}" text-anchor="end">${esc(pct(v))}</text>`;
    g+=ln.pts.map(f=>snapMark(f, x(f.pub.getTime()), y(f.rate,li), nar?5:6)).join("");
  });
  return `<svg class="snchart cmchart" id="cmRateChart" viewBox="0 0 ${W} ${H}" role="img" aria-labelledby="cmRateH cmRateDesc" focusable="false">
    <desc id="cmRateDesc">${esc(`One row per carrier: ${lanes.map(l=>`${l.car.name}, ${plural(l.pts.length,"filing")} with an overall rate impact`).join("; ")}. Each row runs from ${pct(-m)} to ${pct(m)}, ${fmtDay(c.from)} to ${fmtDay(c.to)}. The figures are in the list under the chart.`)}</desc>${g}</svg>`;
}

  const fill=(bins.find(b=>cell.n>=b.lo&&cell.n<=b.hi)||bins[bins.length-1]).fill;
  return `<td class="cmv${SNAP_DARK.has(fill)?" lt":""}" style="background:${fill}"><b>${count(cell.n)}</b></td>`;

/* The view (or the Ask Claude panel) is rebuilt from state each time: keep the cursor, the scroll position of boxes
   marked data-keep, and anything half-typed in boxes that aren't bound to state (the sign-in form). */
function keepUi(rootId){
  const root=document.getElementById(rootId||"view");
  const a=document.activeElement, id=a&&a.id&&root.contains(a) ? a.id : "", sel=id&&"selectionStart" in a ? (()=>{ try{ return [a.selectionStart, a.selectionEnd]; }catch{ return null; } })() : null;
  const scroll=[...root.querySelectorAll("[data-keep][id]")].map(e=>[e.id, e.scrollTop, e.scrollLeft]);
  const typed=["li_user","li_pw"].map(i=>[i, document.getElementById(i)?.value]).filter(x=>x[1]!==undefined);
  return ()=>{
    for(const [i,v] of typed){ const e=document.getElementById(i); if(e) e.value=v; }
    for(const [i,t,l] of scroll){ const e=document.getElementById(i); if(e){ e.scrollTop=t; e.scrollLeft=l; } }
    if(id && root.querySelector("#"+CSS.escape(id))){ const e=document.getElementById(id); e.focus({preventScroll:true}); if(sel && sel[0]!==null && e.setSelectionRange){ try{ e.setSelectionRange(sel[0], sel[1]); }catch{} } }
  };
}

async function savePassword(){
  const a=document.getElementById("p_new").value, b=document.getElementById("p_again").value, e=document.getElementById("pwErr");

const VIEW_KEY="snl.view";
function enterView(){
  if(!S.session) return;
  if(S.view==="filings" && !S.refs && !S.refsLoading) loadRefs(false);
  if(S.view==="filings" && !S.w.loaded && !S.w.loading) loadWatch();
  if(S.view==="statutory" && !S.st.status && !S.st.loading) loadStatStatus();
  if(S.view==="profile") enterProfile();

}
function route(){
  const h=location.hash.replace(/^#/,""); let v=VIEWS.includes(h)?h:null;
  if(!v){ try{ v=localStorage.getItem(VIEW_KEY); }catch{} }   // no view in the address: open the one used last
  if(h==="ask") S.ask.open=true;   // Ask used to be a view of its own: an old link to it opens the panel
  S.view=VIEWS.includes(v)?v:"filings";   // and an old saved "ask" view falls back to Filings
  try{ localStorage.setItem(VIEW_KEY, S.view); }catch{}
  render(); enterView();
}

  if(e.key==="Escape" && S.ask.open){ const at=document.activeElement; if(!at || at===document.body || at.closest("#askRoot") || !/^(INPUT|TEXTAREA|SELECT)$/.test(at.tagName)) closeAsk(); }
});

/* ---------- auth: Supabase email and password; usernames map to <username>@<usernameDomain> ---------- */
function toEmail(u){ u=u.trim().toLowerCase(); return u.includes("@") ? u : u+"@"+(CFG.usernameDomain||"snl-lookup.local"); }
function resetState(){
  try{ sessionStorage.removeItem(UNLISTED_KEY); }catch{}
  clearTimeout(S.ask.timer);
  for(const d of Object.values(S.docs)) if(d.url){ try{ URL.revokeObjectURL(d.url); }catch{} }
  S.session=null; S.drawer=null; S.status=null; S.statusErr=""; S.refs=null; S.refsLoading=false; S.refsMsg=""; S.refsErr=""; S.docs={};
  S.f=freshFilings(); S.ask=freshAsk(); S.st=freshStat();
  S.chatUse=null; S.chatUseAt=0;
  S.conn=null;
  S.live=null;
  S.past=freshPast();
  S.w=freshWatch();
  S.pf=freshProfile();   // the template's bytes and any built file go with it
  S.snap=freshSnap();
  S.cmp=freshCmp();
}
async function onSignedIn(session){
  const {data, error}=await S.sb.from("profiles").select("username,display_name,role").eq("id", session.user.id).maybeSingle();
  if(error || !data || !ROLES[data.role]){ S.leaving=true; try{ await S.sb.auth.signOut(); }catch{} S.leaving=false; resetState(); S.loginErr="This login has no role on this site yet. Ask the site owner to set it up."; render(); return; }
  S.session={username:data.username, name:data.display_name||data.username, role:data.role, uid:session.user.id};
  S.loginErr=""; route(); loadStatus(); loadPast(false);
}
async function doLogin(){
  if(S.loginBusy) return;
  const u=(document.getElementById("li_user")?.value||"").trim(), pw=document.getElementById("li_pw")?.value||"";
  if(!u||!pw){ S.loginErr="Enter your username and password."; render(); return; }
  S.loginBusy=true; S.loginErr=""; render();
  let data=null, error=null;
  try{ ({data, error}=await S.sb.auth.signInWithPassword({email:toEmail(u), password:pw})); }catch(e){ error=e; }
  S.loginBusy=false;
  if(error || !data || !data.session){
    const m=(error&&error.message)||"No session returned";
    S.loginErr = /rate|too many/i.test(m) ? "Too many attempts. Wait a few minutes and try again."
      : (error && (error.code==="invalid_credentials" || /invalid login credentials/i.test(m))) ? "That username and password don't match. Check them, or ask the site owner to reset your password."
      : (error && error.code==="email_provider_disabled") ? "Sign-in is switched off in Supabase (Authentication > Sign In / Providers > Email). Tell the site owner."
      : "Sign-in failed: "+m+". The site's Supabase settings may be wrong; tell the site owner.";
    render(); const f=document.getElementById("li_pw"); if(f){ f.value=""; f.focus(); } return;
  }
  await onSignedIn(data.session);
}
async function signOut(){
  S.leaving=true; try{ await S.sb.auth.signOut(); }catch{} S.leaving=false;
  resetState(); S.loginErr=""; history.replaceState(null,"",location.pathname); render();
}
/* A function said the login is no longer good: back to the sign-in form, with its message. */
async function sessionEnded(msg){
  if(!S.session) return;
  resetState(); S.loginErr=msg||"Sign in again."; render();
  S.leaving=true; try{ await S.sb.auth.signOut(); }catch{} S.leaving=false;
}
function loginHTML(){
  const wrap = inner => `<div class="login" role="region" aria-label="Sign in">${inner}</div>`;
  if(S.configMissing) return wrap(`<h2>Not connected yet</h2>
    <p>This site doesn't know which Supabase project to use.</p>
    <p><b>On GitHub Pages:</b> add the repository variables <code>SUPABASE_URL</code> and <code>SUPABASE_PUBLISHABLE_KEY</code>, then run the deploy again.</p>
    <p><b>On your own computer:</b> fill in <code>supabaseUrl</code> and <code>supabaseAnonKey</code> in <code>web/config.js</code>. Use the publishable key, never the secret key.</p>
    <p class="source">The README has the steps.</p>`);
  if(!S.authChecked) return wrap(`<h2>SNL lookup</h2><p>Loading…</p>`);
  return wrap(`<div class="kicker">Strategy and corporate development</div><h2>Sign in to SNL lookup</h2>
    <form id="loginForm" style="display:flex;flex-direction:column;gap:12px" novalidate>
      <label class="f">Username<input type="text" id="li_user" autocomplete="username" autocapitalize="none" spellcheck="false"></label>
      <label class="f">Password<input type="password" id="li_pw" autocomplete="current-password"></label>
      ${S.loginErr?`<p class="err" role="alert">${esc(S.loginErr)}</p>`:""}
      <div class="inline"><button class="btn primary" ${S.loginBusy?"disabled":""}>${S.loginBusy?"Signing in…":"Sign in"}</button></div>
    </form><p class="source">Forgot your password? Ask the site owner to reset it. Logins are created by the owner; there is no sign-up.</p>`);
}
async function boot(){
  S.f=freshFilings(); S.st=freshStat();
  if(!CFG.supabaseUrl || !CFG.supabaseAnonKey || !window.supabase){ S.configMissing=true; render(); return; }
  S.sb=window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey);
  render();
  let session=null;
  try{ ({data:{session}}=await S.sb.auth.getSession()); }catch{}
  S.authChecked=true;
  if(session) await onSignedIn(session); else render();
  S.sb.auth.onAuthStateChange((event)=>{ if(event==="SIGNED_OUT" && S.session && !S.leaving){ resetState(); S.loginErr="You were signed out. Sign in again."; render(); } });
}
boot();
</script>
</body>
</html>
