function setsRemoveCompany(id, k){ setsEditOne(id, s=>{ const n=s.companies.filter(c=>setCoKey(c)!==k); if(n.length===s.companies.length) return null; s.companies=n; return true; }, "Removed from the set."); }
function setsRemoveGroup(id, g){ setsEditOne(id, s=>{ const n=s.groups.filter(x=>x!==g); if(n.length===s.groups.length) return null; s.groups=n; return true; }, "Removed the group from the set."); }

/* ----- finding companies and groups to add, with the same look-up as the Filings company finder ----- */
function setFindReset(){ S.sets.find={q:"", asked:"", matches:null, groups:[], groupNote:"", note:"", busy:false, err:""}; }
async function setsFind(){
  const ss=S.sets, fd=ss.find, q=fd.q.trim();
  if(!q){ fd.matches=null; fd.groups=[]; fd.err="Type a company name, a group name, a NAIC code or an S&P id."; render(); return; }
  fd.busy=true; fd.err=""; fd.asked=q; fd.matches=null; fd.groups=[]; render();
  const r=await callFn("snl-filings",{action:"resolve", q});
  if(!S.session || S.sets!==ss || ss.find!==fd || fd.asked!==q) return;
  fd.busy=false;
  if(r.data){ fd.matches=Array.isArray(r.data.matches)?r.data.matches.filter(m=>m&&typeof m==="object"):[]; fd.groups=Array.isArray(r.data.groups)?r.data.groups.filter(g=>g&&typeof g==="object"&&Array.isArray(g.members)):[]; fd.groupNote=typeof r.data.groupNote==="string"?r.data.groupNote:""; fd.note=typeof r.data.note==="string"?r.data.note:""; }
  else if(r.err!=="signin"){ fd.matches=[]; fd.err="Couldn't look that up. "+errText(r); }
  render();
}

/* ----- a set's groups, expanded to their member companies (no S&P requests: the company list only) ----- */
// The look-up keeps only plain characters of what it is given, so "Calloway Group (SNL P&C Group)" is looked up by its
// first plain part (as the Snapshot does) and the group is then held to its full name.
function setGroupQuery(name){
  const s=String(name).trim(); if(/^\d{1,6}$/.test(s)) return s;
  return s.split(/[^\p{L}\p{N} .&'-]/u).map(p=>p.replace(/\s+/g," ").trim()).find(p=>p.replace(/[^\p{L}\p{N}]/gu,"").length>=3)||"";
}
function setMemberOf(m){
  if(!m || typeof m!=="object") return null;
  const name=setText(m.companyName,120), co=setIdNum(m.companyId), inst=setIdNum(m.institutionId);
  return co!==null ? {kind:"companyId", id:co, name} : inst!==null ? {kind:"institutionId", id:inst, name} : null;
}
function setGroupFetch(name){
  const ss=S.sets, key=name.toLowerCase(), have=ss.groups[key];
  if(have && have.status==="loading") return have.p;
  if(have && have.status!=="error") return Promise.resolve();
  const p=(async()=>{
    const q=setGroupQuery(name);
    if(!q){ ss.groups[key]={status:"missing"}; return; }
    const r=await callFn("snl-filings",{action:"resolve", q});
    if(S.sets!==ss) return;
    if(!r.data){ ss.groups[key]={status:"error", msg:errText(r)}; return; }
    const code=/^\d{1,6}$/.test(name.trim());
    const g=(Array.isArray(r.data.groups)?r.data.groups:[]).find(x=>x&&typeof x==="object"&&Array.isArray(x.members)&&(code ? String(x.code??"").trim()===name.trim() : setText(x.name,120).toLowerCase()===key));
    if(!g){ ss.groups[key] = !blank(r.data.groupNote) ? {status:"error", msg:"other groups in the company list have names like it, so it couldn't be picked out"} : {status:"missing"}; return; }
    const seen=new Set(), members=[];
    for(const m of g.members){ const x=setMemberOf(m), k=x&&x.kind+":"+x.id; if(x && !seen.has(k)){ seen.add(k); members.push(x); } }
    const n=v=>isNum(v)?Math.max(0, Math.round(+v)):0, searchable=Math.max(n(g.searchable), members.length);
    ss.groups[key]={status:"ok", members, noId:Math.max(0, n(g.companies)-searchable), cut:Math.max(0, searchable-members.length)};
  })();
  ss.groups[key]={status:"loading", p};
  return p;
}
async function setGroupsReady(names){ for(const n of names) await setGroupFetch(n); }
/* Counts what every set expands to today, for the panel. Runs when the panel opens and after each change. */
async function setsCount(){
  const ss=S.sets; if(!ss.open || !ss.loaded) return;
  const names=[...new Map(ss.sets.flatMap(s=>s.groups).map(g=>[g.toLowerCase(), g])).values()].filter(g=>!ss.groups[g.toLowerCase()] || ss.groups[g.toLowerCase()].status==="error");
  for(const g of names){ if(S.sets!==ss || !ss.open) return; await setGroupFetch(g); if(S.sets===ss && ss.open) renderSets(); }
}
/** What a set gives today: its companies with S&P ids (single companies and group members, each once), and what
    can't be used. pending: a group is still being looked up. */
function expandSet(s){
  const ss=S.sets, seen=new Set(), companies=[], missing=[], failed=[], cutGroups=[];
  let noId=0, cut=0, pending=false;
  const add=c=>{ const k=c.kind+":"+c.id; if(!seen.has(k)){ seen.add(k); companies.push(c); } };
  for(const c of s.companies){ if(c.companyId!==null) add({kind:"companyId", id:c.companyId, name:c.companyName, group:null}); else if(c.institutionId!==null) add({kind:"institutionId", id:c.institutionId, name:c.companyName, group:null}); else noId++; }
  for(const g of s.groups){
    const e=ss.groups[g.toLowerCase()];
    if(!e || e.status==="loading"){ pending=true; continue; }
    if(e.status==="missing"){ missing.push(g); continue; }
    if(e.status==="error"){ failed.push(g); continue; }
    e.members.forEach(m=>add({...m, group:g})); noId+=e.noId; if(e.cut){ cut+=e.cut; cutGroups.push(g); }
  }
  return {companies, noId, cut, missing, failed, cutGroups, pending, total:companies.length+noId+cut};
}
function setInfo(s, x){
  const info={id:s.id, name:s.name, note:s.note, groups:s.groups.slice(), total:x.total, withId:x.companies.length, noId:x.noId, leftOut:x.noId+x.cut, cut:x.cut,
    missingGroups:x.missing.slice(), failedGroups:x.failed.slice(), cutGroups:x.cutGroups.slice()};
  info.notes=setLeftNotes(info);
  return info;
}
/* What a set couldn't give, in plain sentences: never left out silently. */
function setLeftNotes(set){
  const out=[], list=a=>andList(a.map(setQ), 3);
  if(set.noId) out.push(`${plural(set.noId,"company in the set has","companies in the set have")} no S&P id, so ${set.noId===1?"its":"their"} filings can't be searched.`);
  if(set.missingGroups.length) out.push(`${list(set.missingGroups)} no longer ${set.missingGroups.length===1?"matches":"match"} the company list, so ${set.missingGroups.length===1?"it was":"they were"} left out. Corp Dev can remove ${set.missingGroups.length===1?"it":"them"} from the set.`);
  if(set.failedGroups.length) out.push(`${list(set.failedGroups)} couldn't be looked up just now and ${set.failedGroups.length===1?"was":"were"} left out. Try again.`);
  if(set.cut) out.push(`${list(set.cutGroups)} ${set.cutGroups.length===1?"has":"have"} more companies than one look-up lists, so ${plural(set.cut,"company was","companies were")} left out.`);
  return out;
}
const setSay = (lead, set, extra) => [lead, extra||"", ...set.notes].filter(Boolean).join(" ");

/* ----- using a set: the control, and what it does ----- */
var SET_TARGETS = window.SET_TARGETS || SET_TARGETS || {};
function setPickHTML(target, label){

    <div class="inline"><select id="setsel_${t}" data-bind="sets.pick.${t}">${ss.sets.map(s=>`<option value="${esc(s.id)}"${s.id===pick?" selected":""}>${esc(s.name)}</option>`).join("")}</select>
    <button type="button" class="btn sm" data-act="set-use" data-target="${t}" ${ss.using?"disabled":""}>${ss.using===t?"Getting the companies…":lab===SET_LABELS[t]?"Add":"Use"}</button></div>
    ${ss.said[t]?`<p class="t2 setsaid" id="setsaid_${t}" role="status">${esc(ss.said[t])}</p>`:""}</div>`;

/* The bar beside a company picker: the control, the button that opens the panel, and on the Filings view "Save these
   companies as a set" for Corp Dev. */
function setsBarHTML(target){
  const t=setTarget(target), ss=S.sets; if(!t || !ss) return "";

async function useSet(target, id){
  const ss=S.sets, t=setTarget(target); if(!t || ss.using) return;
  const s=ss.sets.find(x=>x.id===id) || ss.sets[0];
  if(!s){ ss.said[t]="There are no saved sets yet."; render(); return; }
  ss.pick[t]=s.id;
  const T=SET_TARGETS[t];
  if(typeof T!=="function"){ ss.said[t]="Saved sets can't be used here yet."; render(); return; }
  ss.using=t; ss.said[t]=""; render();
  await setGroupsReady(s.groups);
  if(!S.session || S.sets!==ss) return;
  const x=expandSet(s), info=setInfo(s, x);
  let msg="";
  try{ msg=await T(x.companies.map(c=>({...c})), info); }catch(e){ msg="Couldn't use the set here: "+((e&&e.message)||"unknown error")+"."; }
  if(S.sets!==ss) return;
  ss.using=""; ss.said[t]=typeof msg==="string"?msg:""; render();
}
// The Filings form: the set's companies join those chosen, up to the most one search takes.
SET_TARGETS.filings=(companies, set)=>{
  const f=S.f; let added=0, have=0, full=0;
  for(const c of companies){
    if(f.chips.some(x=>x.kind===c.kind && x.id===c.id)){ have++; continue; }
    if(f.chips.length>=MAX_COMPANIES){ full++; continue; }
    f.chips.push({kind:c.kind, id:c.id, name:c.name||""}); added++;
  }
  f.formErr="";
  const lead = added ? `Added ${plural(added,"company","companies")} from ${setQ(set.name)}.` : have ? `Every company in ${setQ(set.name)} with an S&P id is already chosen.` : `${setQ(set.name)} has no company with an S&P id to add.`;
  return setSay(lead, set, full ? `A search takes at most ${MAX_COMPANIES} companies, so ${plural(full,"company was","companies were")} left out: remove some to make room, or search the rest separately.` : "");
};
// The Snapshot: a set is taken like a group, all its companies, with the Snapshot's own cost line and size checks.
SET_TARGETS.snapshot=(companies, set)=>{
  const sn=S.snap; if(sn.busy || sn.picking) return "A snapshot is being made. Try again when it has finished.";
  sn.pick={kind:"group", name:`${set.name} (saved set)`, group:"", ids:companies.map(c=>({kind:c.kind, id:c.id, name:c.name||""})), noId:set.noId, cut:false, over:companies.length+set.cut>MAX_COMPANIES};
  sn.find.matches=null; sn.formErr=""; sn.pickErr="";
  return setSay(`Chosen: ${setQ(set.name)}, ${plural(companies.length,"company","companies")} with S&P ids.`, {...set, notes:set.notes.filter(n=>!/no S&P id/.test(n))}, "");
};
// The watchlist (Corp Dev, under Manage): the set's companies join what is watched.
SET_TARGETS.watch=(companies, set)=>{
  if(!isCorpDev()) return "Only Corp Dev logins can change the watchlist.";
  let added=0, full=0;
  return changeWatch(l=>{
    added=0; full=0;
    for(const c of companies){ if(l.companies.some(x=>x.kind===c.kind && x.id===c.id)) continue; if(l.companies.length>=SET_WATCH_MAX){ full++; continue; } l.companies.push({kind:c.kind, id:c.id, name:c.name||""}); added++; }
    return added ? l : null;
  }).then(()=> S.w.saveErr ? "" : setSay(added ? `Added ${plural(added,"company","companies")} from ${setQ(set.name)} to the watchlist.` : full ? "" : `Every company in ${setQ(set.name)} with an S&P id is already watched.`, set,
    full ? `The watchlist keeps at most ${count(SET_WATCH_MAX)} companies, so ${plural(full,"company was","companies were")} left out.` : ""));
};

/* The view (or the Ask Claude panel) is rebuilt from state each time: keep the cursor, the scroll position of boxes

function keepUi(rootId){
  const root=document.getElementById(rootId||"view");
  const a=document.activeElement, id=a&&a.id&&root.contains(a) ? a.id : "", sel=id&&"selectionStart" in a ? (()=>{ try{ return [a.selectionStart, a.selectionEnd]; }catch{ return null; } })() : null;
  const scroll=[...root.querySelectorAll("[data-keep][id]")].map(e=>[e.id, e.scrollTop, e.scrollLeft]);
  const typed=["li_user","li_pw"].map(i=>[i, document.getElementById(i)?.value]).filter(x=>x[1]!==undefined);
  return ()=>{
    for(const [i,v] of typed){ const e=document.getElementById(i); if(e) e.value=v; }
    for(const [i,t,l] of scroll){ const e=document.getElementById(i); if(e){ e.scrollTop=t; e.scrollLeft=l; } }
    if(id && root.querySelector("#"+CSS.escape(id))){ const e=document.getElementById(id); e.focus({preventScroll:true}); if(sel && sel[0]!==null && e.setSelectionRange){ try{ e.setSelectionRange(sel[0], sel[1]); }catch{} } }
  };
}

async function loadMarket(quiet){
  const mk=S.mk; if(!S.session) return;
  mk.loading=true; if(!quiet) render();
  const r=await callFn("snl-index",{action:"status"});
  if(!S.session || S.mk!==mk) return;
  mk.loading=false;
  if(r.data){
    mk.status=r.data; mk.statusErr=null; takeUsage({used:r.data.usage, limits:r.data.limits, account:r.data.account});
    const st=mkStates().map(s=>s.state);
    if(!st.includes(mk.state)) mk.state=st[0]||"";
    mkNarrowInit();
    if(mk.state && !mk.types[mk.state]) mkLoadTypes(mk.state);
    if(mk.state && !mk.held[mk.state]) mkLoadHeld(mk.state);
  } else if(r.err!=="signin") mk.statusErr=r;
  if(S.view==="market") render();
  mkDrive();
}
async function mkLoadTypes(state){
  const mk=S.mk; if(mk.typesBusy===state) return; mk.typesBusy=state;
  const r=await callFn("snl-index",{action:"query", state, group:"type", limit:100});
  if(S.mk!==mk) return; mk.typesBusy="";
  mk.types[state]=r.data&&Array.isArray(r.data.groups) ? r.data.groups.map(g=>String(g&&g.name||"")).filter(n=>n&&n!=="n/d") : [];
  if(S.view==="market") render();
}
/* Filing types and statuses on the Market: the names the index holds in a state (groups "ftype" and "status", which
   migration 0010 adds), so each can be chosen and is matched by its whole name. Before 0010 (or with an older
   snl-index) the index can't list them: heldOff says so, and the form keeps its one Filing type and Status words. */
async function mkLoadHeld(state){
  const mk=S.mk; if(mk.heldBusy===state || mk.heldOff) return; mk.heldBusy=state;
  const ask=g=>callFn("snl-index",{action:"query", state, group:g, limit:100});
  const [a, b]=await Promise.all([ask("ftype"), ask("status")]);
  if(S.mk!==mk) return; mk.heldBusy="";
  const names=r=>{ const seen=new Map(); for(const g of r.data.groups) { const n=String(g&&g.name||"").trim(); if(n && n!=="n/d" && !seen.has(n.toLowerCase())) seen.set(n.toLowerCase(), n); } return [...seen.values()]; };
  if(a.data && b.data && Array.isArray(a.data.groups) && Array.isArray(b.data.groups)) mk.held[state]={ft:names(a), fs:names(b)};
  else if(a.err!=="signin" && b.err!=="signin") mk.heldOff = [a, b].some(r=>r.err==="needs_update"||r.err==="bad"||r.err==="not_updated")
    ? "The index can't list its filing types and statuses until the database update 0010 is run and snl-index is deployed again (README, Market index). Use the Filing type and Status boxes below meanwhile."
    : "The index's filing types and statuses couldn't be listed just now. Use the Filing type and Status boxes below, or reload the page.";
  if(S.view==="market") render();
}
// the names the index holds in the states chosen (or every indexed state), each once whatever its letter case
function mkHeld(w){
  const mk=S.mk, sts=nwStates("mk").length ? nwStates("mk") : mkStates().map(s=>String(s.state)), seen=new Map();
  for(const s of sts) for(const n of (mk.held[s]&&mk.held[s][w])||[]) if(!seen.has(n.toLowerCase())) seen.set(n.toLowerCase(), {id:n, name:n});
  return [...seen.values()].sort((a,b)=>a.name.localeCompare(b.name));
}
// the lists are in use once the index has listed them for a state; until then the one-choice boxes are
const mkListsOn = () => !S.mk.heldOff && Object.keys(S.mk.held).length>0;
/* Narrow it down on the Market: the states (the index's own) and types of insurance (the index's names) chosen. The
   first indexed state is chosen to start with, as the one state always was. Nothing chosen means every indexed state,
   at most MK_MAX_STATES (the snl-index function's MAX_QUERY_STATES). One state and one type are asked exactly as
   before; several go as lists, which the index answers after migration 0009. */
const MK_MAX_STATES = 10;
function mkNarrowInit(){
  const mk=S.mk, nw=nwOf("mk"), have=new Set(mkStates().map(s=>String(s.state)));
  if(!nw.touched) nw.states=mk.state?[mk.state]:[];
  nw.states=nw.states.filter(s=>have.has(s));
}
const mkAskStates = () => { const c=nwStates("mk"); return c.length ? c : mkStates().map(s=>String(s.state)).sort(); };
const mkAskTypes = () => nwTois("mk").map(t=>t.name);
async function mkNarrowChanged(){
  const mk=S.mk, nw=nwOf("mk"), before=mk.state; nw.touched=true;
  const sts=mkAskStates(); mk.state=sts[0]||"";
  if(JSON.stringify(sts)!==JSON.stringify(mk.lastStates||[before])){ mk.res=null; mk.byCo=null; mk.err=null; }
  mk.lastStates=sts;
  for(const s of sts.slice(0, MK_MAX_STATES)) if(!mk.types[s] && S.mk===mk){ await mkLoadTypes(s); }
  for(const s of sts.slice(0, MK_MAX_STATES)) if(!mk.held[s] && !mk.heldOff && S.mk===mk){ await mkLoadHeld(s); }
}
// the scope of an answer, from the question it echoes: its states and types
function mkScopeOf(q){
  const sts=Array.isArray(q&&q.states)&&q.states.length ? q.states : q&&q.state ? [q.state] : [];
  const tys=Array.isArray(q&&q.types)&&q.types.length ? q.types : q&&q.typeOfInsurance ? [q.typeOfInsurance] : [];
  const named=a=>(Array.isArray(a)?a:[]).filter(x=>!blank(x)).map(t=>({id:String(t), name:String(t)}));
  return nwScope(sts, tys.map(t=>({id:String(t), name:String(t)})), named(q&&q.filingTypes), named(q&&q.statuses));
}
function mkQuery(extra){
  const mk=S.mk, f=mk.f, sts=mkAskStates(), tys=mkAskTypes();
  const on=mkListsOn(), fts=on?nwFtypes("mk").map(t=>t.name):[], fss=on?nwFstats("mk").map(t=>t.name):[];
  const q={action:"query", state:sts[0]||mk.state, typeOfInsurance:tys.length===1?tys[0]:null, filingType:on?null:(f.ftype||null), status:on?null:(f.fstatus.trim()||null), from:f.from||null, to:f.to||null, words:f.words.trim()||null, ...extra};
  if(sts.length>1 || tys.length>1){ q.states=sts; q.typesOfInsurance=tys; }
  // filing types and statuses from the index's lists, only when chosen (an unnarrowed question is asked as before)
  if(fts.length) q.filingTypes=fts;
  if(fss.length) q.statuses=fss;
  return q;
}
async function mkSearch(){
  const mk=S.mk; if(mk.busy || !mk.state) return;
  if(mkAskStates().length>MK_MAX_STATES){ mk.err={err:"bad", msg:`Choose at most ${MK_MAX_STATES} states: the index answers up to ${MK_MAX_STATES} at once.`}; render(); return; }
  if(mk.f.from && mk.f.to && mk.f.from>mk.f.to){ mk.err={err:"bad", msg:"The start date is after the end date."}; render(); return; }
  mk.busy=true; mk.err=null; pbStart("mk-search"); render();
  const q=mkQuery({});
  const [rows, byCo]=await Promise.all([callFn("snl-index",{...q, group:"rows", limit:MK_PAGE, offset:0}), callFn("snl-index",{...q, group:"company", limit:100})]);
  if(!S.session || S.mk!==mk) return;
  mk.busy=false;
  // several states or types asked of a function from before Narrow it down would be answered wider: shown as not done
  if(rows.data && (q.filingTypes||q.statuses) && !(rows.data.query&&(Array.isArray(rows.data.query.filingTypes)||Array.isArray(rows.data.query.statuses)))){ mk.err={err:"not_updated", msg:"The market index function on this site can't search by several filing types or statuses yet. Use the Filing type and Status boxes, or ask Corp Dev to deploy snl-index again (README, Market index)."}; mk.res=null; mk.byCo=null; }
  else if(rows.data && (q.states||q.typesOfInsurance) && !(rows.data.query&&Array.isArray(rows.data.query.states))){ mk.err={err:"not_updated", msg:"The market index function on this site can only search one state and one type of insurance at a time. Choose one of each, or ask Corp Dev to deploy snl-index again (README, Market index)."}; mk.res=null; mk.byCo=null; }
  else if(rows.data){ mk.res=rows.data; mk.asked=q; mk.more=!!rows.data.more; mk.byCo=byCo.data||null; }
  else if(rows.err!=="signin"){ mk.err=rows; mk.res=null; mk.byCo=null; }
  render();
}
async function mkMore(){
  const mk=S.mk, res=mk.res; if(!res || mk.moreBusy || !mk.asked) return;
  mk.moreBusy=true; render();
  const r=await callFn("snl-index",{...mk.asked, group:"rows", limit:MK_PAGE, offset:res.rows.length});
  if(S.mk!==mk || mk.res!==res) return;
  mk.moreBusy=false;
  if(r.data&&Array.isArray(r.data.rows)){ res.rows=res.rows.concat(r.data.rows); mk.more=!!r.data.more; }
  else if(r.err!=="signin") toast("Couldn't load more. "+errText(r));
  render();
}
/* The coverage line: what an answer rests on, always on screen while a state is chosen; one for each state. */

  if(!cov) return "";
  const missed=Array.isArray(cov.missed)?cov.missed.filter(x=>!blank(x)):[];
  const shown=missed.slice(0,5);
  return `<div class="info mkcov" id="mkCov${i?"_"+esc(String(cov.state||i)):""}" role="note"><span>${esc(cov.sentence||"")}${+cov.companiesMissed&&shown.length?` Not covered: ${esc(shown.join("; "))}${+cov.companiesMissed>shown.length?` and ${count(+cov.companiesMissed-shown.length)} more`:""}.`:""}</span></div>`;
}

/* ----- Corp Dev's actions, and carrying a sweep on while this page is open ----- */
async function mkAct(action, extra){
  const mk=S.mk, m=mk.mgr; if(m.busy) return;
  m.busy=action; m.err=""; m.note=""; render();
  const r=await callFn("snl-index",{action, ...(extra||{})});
  if(S.mk!==mk) return; m.busy="";
  if(r.data){ m.note=r.data.message||""; if(r.data.used) takeUsage(r.data); mk.stepErr=""; }
  else if(r.err!=="signin") m.err=errText(r);
  await loadMarket(true);
}
function mkStart(){
  const m=S.mk.mgr;
  if(!m.state){ m.err="Choose a state to sweep."; render(); document.getElementById("mk_mstate")?.focus(); return; }
  mkAct("start", {state:m.state, period:m.period});
}
/* One step at a time while this page shows the index: right away while the sweep is waiting to carry on, at the time
   it gave when it is leaving room for people, and a look every 15 seconds while someone else's step is running. */
function mkDrive(){
  const mk=S.mk; clearTimeout(mk.timer); mk.timer=null;
  const o=mk.status&&mk.status.open;
  if(!S.session || !isCorpDev() || S.view!=="market" || !o || mk.stepping || mk.stepErr || o.status==="held") return;
  if(o.status==="running"){ mk.timer=setTimeout(()=>{ if(S.mk===mk) loadMarket(true); }, 15000); return; }
  // A step that didn't run (someone else's step had just started, say) is tried again in 15 seconds, not at once.
  const wait=o.resume_after ? Date.parse(o.resume_after)-Date.now() : mk.idle ? 15000 : 0;
  mk.timer=setTimeout(()=>{ if(S.mk===mk) mkStep(); }, wait>0 ? Math.min(wait+2000, 3600000) : 0);
}
async function mkStep(){
  const mk=S.mk; if(mk.stepping) return;
  mk.stepping=true; mk.stepErr=""; if(S.view==="market") render();
  const r=await callFn("snl-index",{action:"continue"});
  if(S.mk!==mk) return;
  mk.stepping=false;
  mk.idle=!(r.data&&r.data.step&&r.data.step.ran);
  if(r.data){ if(r.data.used) takeUsage(r.data); }
  else if(r.err!=="signin") mk.stepErr="The sweep couldn't carry on: "+errText(r)+" It hasn't lost its place.";
  await loadMarket(true);
}

/* ---------- Earnings (#earnings): a quarter's results documents for the companies on the earnings watchlist ----------
   The snl-earnings function finds, for one company and one quarter, the 10-Q (10-K) and the earnings 8-K from SEC
   EDGAR, and the financial supplement and investor presentation from the company's investor pages (for London names
   with no SEC filings, the report and the results release or trading update). The page asks for one company at a
   time, with a progress bar, Stop, and one more try for a company that failed. What is found is saved by the function
   and opens again without asking anyone until Refresh. Documents download through the function, one at a time or as
   one zip laid out as the owner's desktop script lays out folders. The page never sends an address: it names a
   company on the watchlist and a document by the id the function gave it.
   The watchlist is the shared setting "earnings_watchlist" (snl_settings): every login reads it (through the
   function, which cleans it), Corp Dev edits it here, the function checking each change first ("check").
   What is new: documents not in this browser's record of the reader's last look at that quarter (localStorage). */
VIEWS.push("earnings");
FN["snl-earnings"]="the earnings function";
const EA_COLS = ["10q","8k","supplement","deck"];
const EA_WORDS = {found:"Found", in_8k:"In the 8-K", not_filed:"Not posted yet", not_found_sec:"Not found at the SEC", not_found:"Not found on the pages read", refused:"Site refused", none_listed:"No investor pages listed", no_cik:"No CIK", error:"Error"};
const EA_SEEN_KEY = q => "snl.earn.seen."+q;
const EA_RETRY_MS = 2000;
function freshEarnings(){
  return {loading:false, status:null, statusErr:null, list:null, problems:[], listErr:null, quarter:"", chosen:null, results:{}, errs:{}, savedQ:"", savedBusy:false,
    open:{}, run:null, zip:null, dl:{}, newIds:{}, firstLook:false,
    wl:{paste:"", checking:false, checked:null, saving:false, msg:"", err:"", edit:null, del:""}};
}
S.ea=freshEarnings();
function resetEarnings(){ if(S.ea&&S.ea.run) S.ea.run.stop=true; if(S.ea&&S.ea.zip) S.ea.zip.stop=true; S.ea=freshEarnings(); }
function enterEarnings(){ const ea=S.ea; if(!ea.status && !ea.loading && !ea.statusErr) loadEarnings(); }
/* The quarters to choose from: the eight latest that have ended, newest first ("3Q26"). */
function eaQuarters(){
  const d=new Date(), out=[]; let y=d.getFullYear(), q=Math.floor(d.getMonth()/3);
  if(q===0){ q=4; y--; }
  for(let i=0;i<8;i++){ out.push(`${q}Q${String(y%100).padStart(2,"0")}`); q--; if(q===0){ q=4; y--; } }
  return out;
}
const eaQ4 = qn => /^4Q/.test(qn);
const eaColName = (c, qn) => c==="10q" ? (eaQ4(qn)?"10-K":"10-Q") : c==="8k" ? "Earnings 8-K" : c==="supplement" ? "Supplement" : "Presentation";
const eaCompanies = () => Array.isArray(S.ea.list) ? S.ea.list : [];
const eaChosen = () => { const all=eaCompanies(), c=S.ea.chosen; return c ? all.filter(x=>c[x.id]) : all; };
async function loadEarnings(){
  const ea=S.ea; if(!S.session) return;
  ea.loading=true; render();
  const [st, li]=await Promise.all([callFn("snl-earnings",{action:"status"}), callFn("snl-earnings",{action:"list"})]);
  if(!S.session || S.ea!==ea) return;
  ea.loading=false;
  if(st.data){ ea.status=st.data; ea.statusErr=null; if(!ea.quarter) ea.quarter=eaQuarters().includes(st.data.quarter)?st.data.quarter:eaQuarters()[0]; }
  else if(st.err!=="signin") ea.statusErr=st;
  if(li.data){ ea.list=Array.isArray(li.data.companies)?li.data.companies:[]; ea.problems=Array.isArray(li.data.problems)?li.data.problems:[]; ea.listErr=null; }
  else if(li.err!=="signin" && st.data) ea.listErr=li;

  if(ea.status && ea.list) eaLoadSaved();

/* What was found before for the chosen quarter: one call, nobody asked. */
async function eaLoadSaved(){
  const ea=S.ea, q=ea.quarter; if(!q || ea.savedBusy) return;
  ea.savedBusy=true; render();
  const r=await callFn("snl-earnings",{action:"saved", quarter:q});
  if(S.ea!==ea || ea.quarter!==q) return;
  ea.savedBusy=false; ea.savedQ=q; ea.results={}; ea.errs={}; ea.newIds={};
  if(r.data){ for(const x of (Array.isArray(r.data.results)?r.data.results:[])) if(x&&x.company&&x.company.id) ea.results[x.company.id]=x; eaMarkNew(); }
  else if(r.err!=="signin") toast("Couldn't open what was found before. "+errText(r));
  render();
}
/* What is new since this reader's last look at the quarter: documents not in the record kept in this browser. The
   first look at a quarter marks nothing (there is no last look) and says so; the record then holds every document. */
function eaMarkNew(){
  const ea=S.ea, q=ea.quarter, all=Object.values(ea.results).flatMap(r=>Array.isArray(r.docs)?r.docs.map(d=>String(d.id)):[]);
  let seen=null; try{ const raw=localStorage.getItem(EA_SEEN_KEY(q)); seen=raw?new Set(JSON.parse(raw)):null; }catch{ seen=null; }
  if(!seen){ ea.firstLook = all.length>0; if(all.length) try{ localStorage.setItem(EA_SEEN_KEY(q), JSON.stringify(all)); }catch{} return; }
  for(const id of all) if(!seen.has(id)) ea.newIds[id]=true;
  ea.firstLook=false;
  try{ localStorage.setItem(EA_SEEN_KEY(q), JSON.stringify([...new Set([...seen, ...all])].slice(-5000))); }catch{}
}
/* Find: each chosen company in turn, one call each; a company that fails is asked once more at the end. refresh: ask
   the SEC and the sites again instead of opening what was saved. */
async function eaRun(refresh){
  const ea=S.ea; if(ea.run && !ea.run.done) return;
  const list=eaChosen(); if(!list.length){ toast("Choose at least one company."); return; }
  const q=ea.quarter, run={q, n:list.length, i:0, stop:false, done:false, failed:[], retrying:"", refresh:!!refresh, state:"run"};
  ea.run=run; pbStart("ea-run"); render();
  const one=async co=>{
    run.current=co.name; render();
    const r=await callFn("snl-earnings",{action:"find", company:co.id, quarter:q, ...(refresh?{refresh:true}:{})});
    if(S.ea!==ea || ea.quarter!==q) return "gone";
    if(r.data && r.data.result){ ea.results[co.id]=r.data.result; delete ea.errs[co.id]; return "ok"; }
    if(r.err==="signin") return "gone";
    ea.errs[co.id]=r; return r.err==="not_configured"||r.err==="unknown_company"||r.err==="bad" ? "final" : "failed";
  };
  for(const co of list){
    if(run.stop) break;
    const out=await one(co);
    if(out==="gone") return;
    if(out==="failed") run.failed.push(co);
    run.i++;
    if(out==="final" && ea.errs[co.id].err==="not_configured"){ run.stop=true; run.state="failed"; break; }
    render();
  }
  // one more try for each company that failed, after a short pause
  for(const co of run.failed.slice()){
    if(run.stop) break;
    run.retrying=co.name; render();
    await new Promise(res=>setTimeout(res, EA_RETRY_MS));
    if(run.stop) break;
    const out=await one(co);
    if(out==="gone") return;
    if(out==="ok") run.failed=run.failed.filter(x=>x!==co);
  }
  if(S.ea!==ea) return;
  run.retrying=""; run.current=""; run.done=true;
  if(run.stop && run.state!=="failed") run.state="stopped";
  else if(run.failed.length) run.state="failed";
  ea.newIds={}; eaMarkNew();
  render();
}
/* ----- downloads ----- */
function eaFileName(disposition){
  const m=/filename\*=UTF-8''([^;]+)/i.exec(disposition||"") || /filename="([^"]+)"/i.exec(disposition||"");
  let n=""; if(m){ try{ n=decodeURIComponent(m[1].trim()); }catch{ n=m[1]; } }
  return n.replace(/[\x00-\x1f<>:"\/\\|?*]+/g," ").replace(/\s+/g," ").trim().slice(0,160);
}
/* One document through the function: {blob, name} or {msg}. A file cut off on the way (too big, or the source
   stopped) is said plainly. */
async function eaFetchDoc(co, doc){
  const r=await callFn("snl-earnings",{action:"download", company:co, quarter:S.ea.quarter, doc:doc.id}, {raw:true});
  if(!r.res) return {msg:errText(r)};
  try{
    const blob=await r.res.blob();
    return {blob, name:eaFileName(r.res.headers.get("content-disposition")) || (doc.name+(doc.ext||""))};
  }catch{ return {msg:`The file was cut off on the way: it is larger than 60 MB, or the source stopped sending it. Open it from its link.`}; }
}
async function eaDownload(coId, docId){
  const ea=S.ea, r=ea.results[coId], doc=r&&r.docs.find(d=>d.id===docId); if(!doc || ea.dl[docId]==="busy") return;
  ea.dl[docId]="busy"; render();
  const got=await eaFetchDoc(coId, doc);
  if(S.ea!==ea) return;
  if(got.blob){ delete ea.dl[docId]; saveBlob(got.blob, got.name); }
  else ea.dl[docId]=got.msg;
  render();
}
/* The whole quarter as one zip: "<quarter> Financial Statements/<company folder>/<the script's file name>". Web pages
   on company sites can't be saved, and anything that couldn't be fetched is listed in a note inside the zip. */
async function eaZip(){
  const ea=S.ea; if(ea.zip && !ea.zip.done) return;
  const q=ea.quarter, items=[];
  for(const co of eaCompanies()){ const r=ea.results[co.id]; if(!r) continue; for(const d of r.docs||[]) items.push({co:co.id, folder:r.company&&r.company.folder||co.name, doc:d}); }
  const files=items.filter(x=>!x.doc.page);
  if(!files.length){ toast("There is nothing to download for this quarter yet. Find first."); return; }
  const z={n:files.length, i:0, stop:false, done:false, left:[], state:"run"}; ea.zip=z; pbStart("ea-zip"); render();
  try{ if(!window.JSZip){ await loadScript(JSZIP_SRC); } }catch{}
  if(!window.JSZip){ z.done=true; z.state="failed"; z.err="Couldn't load the zip maker. Check your connection and try again, or download the files one at a time."; render(); return; }
  const zip=new window.JSZip(), root=`${q} Financial Statements`, used=new Set();
  const place=(folder, name)=>{ const f=String(folder).replace(/[\x00-\x1f<>:"\/\\|?*]+/g," ").trim()||"Company"; let base=name.replace(/\.[a-z]{2,4}$/i,""), ext=(name.match(/\.[a-z]{2,4}$/i)||[""])[0], p=`${root}/${f}/${name}`, k=2;
    while(used.has(p.toLowerCase())){ p=`${root}/${f}/${base} (${k})${ext}`; k++; } used.add(p.toLowerCase()); return p; };
  let saved=0, sec=0;
  for(const x of files){
    if(z.stop || S.ea!==ea) break;
    const got=await eaFetchDoc(x.co, x.doc);
    if(S.ea!==ea) return;
    z.i++;
    if(got.blob){ zip.file(place(x.folder, got.name), got.blob); saved++; if(/\.htm$/i.test(got.name)) sec++; }
    else z.left.push(`${x.doc.name}: ${got.msg}`);
    render();
  }
  const pages=items.filter(x=>x.doc.page);
  const note=[`What was found for ${q}, saved by SNL lookup on ${TODAY()}.`, "",
    sec ? "SEC filings are saved as the SEC's own web pages (.htm), not PDFs. Open them in a browser; their images and links load from sec.gov when you are online." : "",
    pages.length ? "Web pages on company sites aren't saved here. Open them from these addresses:" : "", ...pages.map(x=>`  ${x.doc.name}: ${x.doc.url}`),
    z.left.length ? "Not saved:" : "", ...z.left.map(s=>"  "+s),
    z.stop ? `Stopped after ${z.i} of ${z.n} files.` : ""].filter((s,i,a)=>s!==""||(i>0&&a[i-1]!=="")).join("\r\n");
  if(saved){ zip.file(`${root}/About this download.txt`, note); saveBlob(await zip.generateAsync({type:"blob"}), `${q} Financial Statements.zip`); }
  z.done=true; z.state=z.stop?"stopped":z.left.length?"failed":"run"; z.saved=saved;
  render();
}
/* ----- the watchlist (Corp Dev edits; every change is checked by the function, then saved under row-level security) ----- */
async function eaSaveList(change, done){

  const cur=await callFn("snl-earnings",{action:"list"});   // every change starts from what is saved now
  if(S.ea!==ea) return false;
  if(!cur.data){ w.saving=false; w.err="Couldn't read the watchlist: "+errText(cur)+" Nothing was changed."; render(); return false; }
  const next=change(JSON.parse(JSON.stringify(cur.data.companies||[])));
  if(!next || typeof next==="string"){ w.saving=false; w.err=typeof next==="string"?next:""; render(); return false; }
  const chk=await callFn("snl-earnings",{action:"check", list:next});
  if(S.ea!==ea) return false;
  if(!chk.data){ w.saving=false; w.err="Couldn't check the change: "+errText(chk)+" Nothing was changed."; render(); return false; }
  const dropped=(chk.data.problems||[]).filter(p=>p.dropped);
  if(dropped.length){ w.saving=false; w.err="Not saved: "+dropped.map(p=>`${p.name||"entry "+p.at}: ${p.message}`).join(" "); render(); return false; }
  let error=null;
  try{ ({error}=await S.sb.from("snl_settings").upsert({id:"earnings_watchlist", doc:{companies:chk.data.companies}})); }catch(e){ error=e; }
  if(S.ea!==ea) return false;
  w.saving=false;
  if(error){ const t=`${error.code||""} ${error.message||""}`;
    w.err=/42501|row-level security|permission/i.test(t) ? "Only Corp Dev logins can change the earnings watchlist. Ask Corp Dev." : /23514|check constraint/i.test(t) ? "The watchlist is too big to save. Remove some companies. Nothing was changed." : "Couldn't save the watchlist: "+(error.message||"unknown error")+". Nothing was changed.";
    render(); return false; }
  ea.list=chk.data.companies; ea.problems=[];
  const warn=(chk.data.problems||[]).filter(p=>!p.dropped);
  w.msg=(typeof done==="function"?done(chk.data.companies):done)+(warn.length?` ${warn.length===1?"One note":plural(warn.length,"note")} on what was saved: `+warn.map(p=>`${p.name}: ${p.message}`).join(" "):"");
  render(); return true;
}

function eaEditTo(e){
  const fileUrls={};
  for(const line of String(e.files||"").split("\n").map(s=>s.trim()).filter(Boolean)){ const m=line.match(/^([a-z0-9_]+)\s*:\s*(\S+)$/i); const k=m?m[1].toLowerCase():"bad"; (fileUrls[k]=fileUrls[k]||[]).push(m?m[2]:line); }

function eaSaveEdit(){

   {kind, codes, label}); every login can read settings, Corp Dev logins change it here. The target is chosen on the
   page. Each side's figures come from its own ordinary statutory look-up (the statutory function's query action, saved
   per company or group as the Statutory view's are), and the two are added up here in the browser. Nothing that pairs
   the base with a target is ever saved or sent anywhere: no saved or recent combinations, nothing in browser storage,
   nothing to Claude (askScreen gives Claude nothing about this view). Dollars are added; ratios are worked out from the

  ["total_assets","Total assets","bal"],["cash_invested","Cash and invested assets","bal"],["bonds","Bonds","bal"],["stocks","Common stocks","bal"],["cash_short_term","Cash and short-term investments","bal"],["premiums_receivable","Premiums receivable","bal"],["total_liabilities","Total liabilities","bal"],["unearned_premiums","Unearned premiums","bal"],
  ["surplus","Policyholder surplus","cap"],["paid_in_capital","Paid-in capital","cap"],["surplus_notes","Surplus notes","cap"],["unassigned_funds","Unassigned funds","cap"],["dividends_paid","Dividends to stockholders","cap"],["capital_contributed","Capital and surplus paid in during the year","cap"],["rbc_tac","Total adjusted capital","cap"],["rbc_acl","Authorized control level risk-based capital","cap"],

/* ----- fetching: one ordinary statutory look-up for each side, at the same time, never one call for both ----- */
function cbProblem(){

  const tc=cbCodes(cb.target), same=cb.target.kind===d.kind ? tc.filter(c=>d.codes.includes(c)) : [];

function cbRun(){

  cb.formErr=""; cb.map=cbmFresh();   // the state map starts afresh for each pair

    target:{kind:tg.kind, codes:cbCodes(tg), label:cbPickLabel(tg), res:null, err:null, busy:false}, sl:{base:{}, target:{}}};

async function cbFetch(which, refresh, carryOn){
  const run=S.cb.run; if(!run) return; const sd=run[which]; if(sd.busy) return;
  if(carryOn && !sd.res) return;
  const payload={action:"query", kind:sd.kind, codes:sd.codes, fromYear:run.fromYear, toYear:run.toYear, fields:cbFields(sd.kind)};
  const ctl=bsControl();
  sd.busy=true; sd.err=null; sd.stopped=false; sd.ctl=ctl; sd.figs=carryOn?statFigs(sd.res):null; if(!carryOn && !refresh) sd.res=null; pbStart("cb-"+which); render();
  const r=await statCarry(first=>{ const b={...payload}; if(first && refresh) b.refresh=true; return callFn("snl-statutory", b); }, statFigs,
    {ctl, onPart:(f, data)=>{ if(S.cb.run!==run || sd.ctl!==ctl || !S.session) return; sd.figs=f; sd.res=data; takeUsage(data); render(); }});
  if(S.cb.run!==run || sd.ctl!==ctl) return;
  sd.busy=false; sd.ctl=null; sd.figs=null;
  if(!S.session) return;

  else if(sd.res && r.err!=="signin") sd.res={...sd.res, stalled:{why:r.err==="stopped"?"stopped":"failed", err:r, figs:statFigs(sd.res)}};   // what had arrived stays
  else if(r.err==="stopped") sd.stopped=true;
  else if(r.err!=="signin") sd.err=r;

/* ----- one side's figures, from its own answer ----- */
/* Whether a figure of one side can be used: {f} or {why} in a few words. */
function cbField(sd, id){
  if(!sd.res) return {why: sd.busy ? "still to come" : sd.err ? "couldn't be fetched" : "not fetched"};
  const f=(Array.isArray(sd.res.fields)?sd.res.fields:[]).find(x=>x&&x.id===id);
  if(!f) return {why: sd.busy ? "still to come" : "not returned"};
  if(f.mapped===false) return {why:"not mapped"};
  if(/^Not run:/.test(String(f.error||""))) return {why: sd.busy ? "still to come" : "not fetched yet"};
  if(!blank(f.error)) return {why:"couldn't be read"};
  return {f};
}
const cbRows = f => (Array.isArray(f.rows)?f.rows:[]).filter(r=>r && isNum(r.value) && Number.isInteger(+r.year));
/* Dollars of one code in one year, rows added up (a group's member companies, the lines of a by-line figure). */
function cbByCode(f){
  const m=new Map();
  for(const r of cbRows(f)){ const c=String(r.code??""), y=+r.year; if(!m.has(c)) m.set(c, new Map()); m.get(c).set(y, (m.get(c).get(y)||0)+(+r.value)); }
  return m;
}
/* Which figure gives direct premiums: by line, or by state when by line can't be used (as the profile does). */
function cbDpwSource(sd){
  const l=cbField(sd,"dpw_by_line"); if(l.f) return "dpw_by_line";
  const s=cbField(sd,"dpw_by_state"); return s.f && (l.why==="not mapped" || l.why==="couldn't be read") ? "dpw_by_state" : "dpw_by_line";
}
/* One code's dollars (the side's own codes only). */
function cbCodeVal(sd, id, code, y){
  const src=id==="dpw" ? cbDpwSource(sd) : id==="npw" ? "npw_by_line" : id, st=cbField(sd, src); if(st.why) return st;
  const v=cbByCode(st.f).get(code)?.get(y);
  return v===undefined ? {why:"none returned"} : {v};
}
/* A side's dollars in one year: its codes added up, n/d unless every code has the figure. */
function cbVal(sd, id, y){

function cbExport(tbl){

      const rows=m.rows.map(r=>[r.label, how(r)+chow(r), unit(r), cu(r), ...r.cells.flatMap(c=>[raw(c.b,r.unit), raw(c.t,r.unit), raw(c.p,r.unit), cbChgRaw(cbChange(c.b, c.p, r.unit))])]);

    return {name, sheet:"Pro forma by year", cols:["Figure","How","Unit", ...m.years.flatMap(y=>[`${y} ${B}`, `${y} target`, `${y} pro forma`])], rows:[...rows, pad(3), ...note.map(x=>[...x, ...pad(1)])]};
  }
  const mx=tbl==="lines"?m.lines:tbl==="states"?m.states:null; if(!mx || mx.why) return null;
  const n=v=>v===null?"":Math.round(v), s=v=>isNum(v)?Math.round(v*10)/10:"";
  if(cbChgOn()){   // "Change %" after the pro forma, and how it is worked out

    return {name, sheet:tbl==="lines"?"By line":"By state", cols:[tbl==="lines"?"Line of business":"State", "Written by", `${B} US dollars`, `${B} share %`, "Target US dollars", "Target share %", "Pro forma US dollars", "Pro forma share %", "Change %"],
      rows:[...mx.rows.map(x=>[x.name, who(x), n(x.b), x.b===null?"":s(x.bs), n(x.t), x.t===null?"":s(x.ts), n(x.p), s(x.ps), cbChgRaw(cbMixChg(x))]), p9(9), ["Year", String(mx.year), ...p9(7)],
        ["Change", `The pro forma against ${B} standalone: (pro forma less ${B}) over ${B}, in percent. New: only the target writes it.`, ...p9(7)], ...note.map(x=>[...x, ...p9(7)])]};
  }
  return {name, sheet:tbl==="lines"?"By line":"By state", cols:[tbl==="lines"?"Line of business":"State", "Written by", `${B} US dollars`, `${B} share %`, "Target US dollars", "Target share %", "Pro forma US dollars", "Pro forma share %"],

document.addEventListener("click", e=>{

    case "cb-add": cbAdd(w, t.dataset.code, t.dataset.name); break;
    case "cb-remove": { const pk=cbPickOf(w); if(!pk) break; pk.codes=cbCodes(pk).filter(c=>c!==t.dataset.code).join(", "); render(); document.getElementById(`cb_${w}_codes`)?.focus(); break; }

/* ---------- Combination: the state map (Corp Dev only) ----------
   The pro forma's direct premiums written on a map of the US states and DC (US_MAP, the outlines already on this page),
   with a choice of what is shown (the pro forma, either side, the target's share, who writes it), a line-of-business
   filter, the year, a panel for each state on hover or focus, a state pinned below the map, a sortable table of the
   same figures and its export. With all lines it uses premiums by state (dpw_by_state), fetched with each side's
   figures, so it costs nothing more. Narrowing by line needs premiums by state and line together (dpw_by_state_line,
   a figure the owner maps), asked for one year at a time, each side in its own ordinary statutory look-up and saved
   for that company or group alone. As with the rest of the view, nothing that pairs the two is saved or sent: the

const CBM_FIG="dpw_by_state_line", CBM_SMALL=["VT","NH","MA","RI","CT","NJ","DE","MD","DC"], CBM_SEARCH_FROM=8;

const CBM_COST="Cost: with all lines, nothing more, as the map uses the premiums by state already fetched. Choosing a line adds one statutory look-up a side for the year shown (about 0.02 Snowflake credit each the first time, nothing when reopened). No Claude, and nothing that pairs the two is saved or sent.";
let CBM_VM=null;   // the map as last drawn, for the hover panel and the export (this page's memory only)

function cbmState(){ if(!S.cb.map) S.cb.map=cbmFresh(); return S.cb.map; }

const cbmText = s => String(s??"").replace(/[\u0000-\u001f\u007f]+/g," ").replace(/\s+/g," ").trim();

/* One side's premiums by state and line for one year, as fetched: {rows: [{state, line, k, v}]} or {why}. */
function cbmSlRows(sd, e, y){
  if(!e) return {why:"not fetched yet"};
  if(!e.res) return {why: e.busy ? "still coming" : e.err ? "couldn't be fetched" : e.stopped ? "not fetched: stopped" : "not fetched yet"};
  if(e.res.truncated) return {why:"cut short at the row limit"};
  const f=(Array.isArray(e.res.fields)?e.res.fields:[]).find(x=>x&&x.id===CBM_FIG);
  if(!f) return {why: e.busy ? "still coming" : "not returned"};
  if(f.mapped===false) return {why: blank(f.error) ? "not mapped" : `not mapped for a ${sd.kind} look-up`};
  if(/^Not run:/.test(String(f.error||""))) return {why: e.busy ? "still coming" : "didn't come back in time"};
  if(!blank(f.error)) return {why:"couldn't be read"};

    const state=cbmStateOf(r.state), line=cbmText(r.line); if(!state || !line) continue;

/* One side's premiums in each state for the year and the lines in view: {m: Map(state -> {v, lines}), total, sl} or {why}.

function cbmSide(which, y, keys){
  const run=S.cb.run, sd=run[which], sl=cbmSlRows(sd, run.sl[which][y], y), m=new Map();
  const at=st=>{ if(!m.has(st)) m.set(st, {v:0, lines:new Map()}); return m.get(st); };
  const addLine=(o, r)=>{ const l=o.lines.get(r.k)||{name:r.line, v:0}; l.v+=r.v; o.lines.set(r.k, l); };
  if(!keys.length){
    const b=cbByName(sd, "dpw_by_state", "state", y); if(b.why) return {why:b.why, sl};
    for(const x of b.m.values()) at(cbmStateOf(x.name)).v+=x.v;
    if(sl.rows) for(const r of sl.rows) if(m.has(r.state)) addLine(m.get(r.state), r);

  }
  if(sl.why) return {why:sl.why, sl};

/* States where premiums by state and line don't add up to premiums by state (more than a dollar a row apart). */
function cbmGaps(which, y){
  const run=S.cb.run, sd=run[which], sl=cbmSlRows(sd, run.sl[which][y], y), b=cbByName(sd, "dpw_by_state", "state", y);
  if(sl.why || b.why) return [];
  const by=new Map(); for(const r of sl.rows){ const x=by.get(r.state)||{v:0, n:0}; x.v+=r.v; x.n++; by.set(r.state, x); }
  const out=[];
  for(const x of b.m.values()){ const st=cbmStateOf(x.name), s=by.get(st)||{v:0, n:0}; by.delete(st); if(Math.abs(s.v-x.v)>Math.max(1, s.n)) out.push({st, sl:s.v, all:x.v}); }
  for(const [st, s] of by) if(Math.abs(s.v)>Math.max(1, s.n)) out.push({st, sl:s.v, all:0});
  return out.sort((a,c)=>a.st.localeCompare(c.st));
}
/* The lines either side writes in the year: from premiums by line and, when in hand, premiums by state and line; largest
   first (by pro forma premiums by line where there are some); the lines chosen are always listed. */
function cbmLines(y){
  const run=S.cb.run, ms=cbmState(), all=new Map();
  const add=(k, name, v, src)=>{ const x=all.get(k)||{k, name, bl:0, sl:0, inBl:false, inSl:false}; x[src]+=v; x[src==="bl"?"inBl":"inSl"]=true; all.set(k, x); };
  for(const w of ["base","target"]){
    const sd=run[w], l=cbByName(sd, "dpw_by_line", "line", y); if(l.m) for(const [k,x] of l.m) add(k, x.name, x.v, "bl");

/* Dollar classes: up to five, each holding about as many states, labelled with the lowest and highest figure in it. */
function cbmBins(vals){

  const k=Math.min(5, n);

    const lo=part[0], hi=part[part.length-1], last=out[out.length-1];

}
/* Everything the map, its panel, its table and its export show, worked out once a render. */
function cbmModel(m){

/* How a state is painted: a fill, or a class (zero: no premium in either side's figures; miss: a side is n/d, hatched). */
function cbmPaint(vm, c){

const cbmMoney = x => x.why ? `n/d (${x.why})` : x.none ? "none in its figures" : usdM(x.v);

/* The lines in one state under the filter: {rows: [{name, b, t, p}]} or {why}. */
function cbmStateLines(vm, c){

document.addEventListener("keydown", e=>{
  if(!e.target.closest || !S.cb.map || S.view!=="combination") return;
  if(e.key==="Escape" && e.target.closest("#cbMap")){
    if(!S.cb.map.pin){ cbmTipHide(); return; }
    e.preventDefault(); const s=S.cb.map.pin; S.cb.map.pin=null; render(); document.getElementById("cbm_s_"+s)?.focus(); return;
  }
  const el=e.target.closest("#cbmSvg [data-cbs]"); if(!el) return;
  const order=Object.keys(US_MAP).map(c=>document.getElementById("cbm_s_"+c)).filter(Boolean), i=order.indexOf(el);
  let j=null;
  if(e.key==="ArrowRight" || e.key==="ArrowDown") j=(i+1)%order.length;
  else if(e.key==="ArrowLeft" || e.key==="ArrowUp") j=(i-1+order.length)%order.length;
  else if(e.key==="Home") j=0; else if(e.key==="End") j=order.length-1;
  if(j!==null){ e.preventDefault(); el.tabIndex=-1; order[j].tabIndex=0; order[j].focus(); return; }
  if(e.key==="Enter" || e.key===" "){ e.preventDefault(); const s=el.dataset.cbs, ms=S.cb.map; ms.pin=ms.pin===s?null:s; ms.focus=s; render(); if(ms.pin) cbmEnsure(true); }
});

/* ---------- Combination: line-of-business pies in the state map (Corp Dev only) ----------
   Two pies of direct premiums written by line, our company standalone and the pro forma, for the year and the lines
   in view on the map. With no state pinned: all states, from premiums by line, already fetched with each side's
   figures, so nothing more is asked. With a state pinned: that state, from premiums by state and line
   (dpw_by_state_line, a figure the owner maps), which pinning asks for, for the year shown, one side at a time and
   once a side a year (cbmEnsure). The same line has the same colour in both pies: the six largest by the pro forma
   (by our company when the pro forma is n/d) take CBP_FILL in order (the page's own chart colours, the teal a step
   stronger so colour-blind readers can tell it from magenta), every second one with a light texture for grey print;
   the rest are "Other", always one neutral. A line at zero or below is listed under its pie, as a pie can't show it.
   A side that is n/d, still coming or cut short is never drawn. All of it is worked out from the map's figures in
   this page's memory: nothing is saved or sent. */
const CBP_FILL=["#00539E","#C46A1B","#944599","#0081C3","#EB008C","#008A7E"], CBP_OTHER="#B8BCCB", CBP_MAX=6;
const CBP_COST="Cost: with no state pinned, nothing more, as the pies use the premiums by line already fetched. Pinning a state adds one statutory look-up a side for the year shown, the first time, when premiums by state and line are mapped (about 0.02 Snowflake credit each; nothing when reopened). No Claude, and nothing that pairs the two is saved or sent.";
let CBP_VM=null;   // the pies as last drawn, for the panel and the export (this page's memory only)
/* One side's lines, for one state (premiums by state and line) or all states (premiums by line), under the filter:
   {m: Map(key -> {name, v})} or {why}. */
function cbpLinesOf(vm, which, state){
  const on=vm.keys.length?new Set(vm.keys):null, m=new Map();
  if(state){
    const sl=(which==="base"?vm.B:vm.T).sl; if(!sl || sl.why) return {why:sl?sl.why:"not fetched yet"};
    for(const r of sl.rows) if(r.state===state && (!on || on.has(r.k))){ const x=m.get(r.k)||{name:r.line, v:0}; x.v+=r.v; m.set(r.k, x); }
    return {m};
  }
  const l=cbByName(S.cb.run[which], "dpw_by_line", "line", vm.y); if(l.why) return {why:l.why};
  for(const [k,x] of l.m) if(!on || on.has(k)) m.set(k, {name:x.name, v:x.v});
  return {m};
}
/* Both pies: which lines are named and their colours, each pie's slices, what is left out, and the legend's rows. */
function cbpModel(vm){
  const ms=cbmState(), c=ms.pin?vm.cells.get(ms.pin):null, state=c?c.code:null, B0=vm.B0;
  const out={state, name:c?c.name:null, y:vm.y, keys:vm.keys, B0, where:c?c.name:"all states"};
  if(state && !vm.on){ out.off=true; return out; }
  const b=cbpLinesOf(vm, "base", state), t=cbpLinesOf(vm, "target", state);
  let p;
  if(b.why || t.why) p={why:[b.why?`${B0}: ${b.why}`:"", t.why?`target: ${t.why}`:""].filter(Boolean).join("; ")};
  else { const m=new Map(); for(const X of [b, t]) for(const [k,x] of X.m){ const z=m.get(k)||{name:x.name, v:0}; z.v+=x.v; m.set(k, z); } p={m}; }
  const by=p.m||b.m||null, sort=(a,z)=>z.v-a.v || a.name.localeCompare(z.name);
  const named=by ? [...by.entries()].map(([k,x])=>({k, name:x.name, v:x.v})).filter(x=>x.v>0).sort(sort).slice(0, CBP_MAX).map(x=>x.k) : [];
  const pie=X=>{
    if(X.why) return {why:X.why};
    const all=[...X.m.entries()].map(([k,x])=>({k, name:x.name, v:x.v})).sort(sort), pos=all.filter(x=>x.v>0), low=all.filter(x=>!(x.v>0));
    const total=pos.reduce((a,x)=>a+x.v, 0), net=all.reduce((a,x)=>a+x.v, 0), slices=[];
    named.forEach((k,i)=>{ const x=pos.find(z=>z.k===k); if(x) slices.push({...x, i, fill:CBP_FILL[i], tex:i%2===1}); });
    const rest=pos.filter(x=>!named.includes(x.k));
    if(rest.length) slices.push({k:"", name:"Other", other:rest.length, rest:rest.map(x=>x.k), v:rest.reduce((a,x)=>a+x.v, 0), i:-1, fill:CBP_OTHER, tex:false});
    for(const s of slices) s.s=total>0 ? s.v/total*100 : null;
    return {all, pos, low, total, net, slices, rest, empty:!all.length};
  };
  const PB=pie(b), PP=pie(p), restKeys=new Set([...(PB.rest||[]), ...(PP.rest||[])].map(x=>x.k));
  // a line's (or Other's) figure and share in one pie: {v, s} | {why} | {none} (the pie has nothing) | {absent}
  const at=(P, k)=>{
    if(P.why) return {why:P.why};
    if(!(P.total>0)) return {none:true, v:k?(P.all.find(x=>x.k===k)||{}).v:undefined};
    const sl=P.slices.find(s=>s.k===k); if(sl) return {v:sl.v, s:sl.s};
    if(!k) return {absent:true};
    const x=P.all.find(z=>z.k===k); return x ? {v:x.v, left:x.v<=0, s:x.v>0?x.v/P.total*100:null} : {absent:true};
  };
  const rows=named.map((k,i)=>({k, name:(p.m||b.m).get(k).name, fill:CBP_FILL[i], tex:i%2===1, b:at(PB,k), p:at(PP,k)}));
  if(restKeys.size) rows.push({k:"", name:"Other", other:restKeys.size, fill:CBP_OTHER, tex:false, b:at(PB,""), p:at(PP,"")});
  return {...out, b:PB, p:PP, named, rows, gaps:state && !vm.keys.length ? ["base","target"].map(w=>({w, g:vm.gaps[w].find(x=>x.st===state)})).filter(x=>x.g) : []};
}
/* The change in share, in percentage points: the pro forma's share of its pie against ours. */
function cbpChg(r){
  const b=r.b, p=r.p;
  if(p.why) return {why:p.why};
  if(b.why) return {why:`base: ${b.why}`};
  if(b.none) return p.v>0 ? {isNew:true} : {why:"no premium on either side"};
  if(p.none) return {why:"no pro forma premium above zero"};
  if(b.left || p.left) return {why:"left out of a pie: zero or below"};
  return {v:(isNum(p.s)?p.s:0)-(isNum(b.s)?b.s:0), unit:"pts"};
}
const cbpMoney = x => x.why ? "n/d" : x.absent || x.v===undefined ? "None" : usdM(x.v);
const cbpShare = x => x.why || x.none ? "" : x.left ? "Left out" : x.absent ? "0.0%" : pct(x.s);
/* One pie, drawn: slices clockwise from the top, a 2px gap between them, shares beside slices of 4% or more. */
function cbpSvgHTML(side, P, title){
  const W=300, H=220, cx=150, cy=110, r=80, X=a=>(cx+r*Math.cos(a)).toFixed(2), Y=a=>(cy+r*Math.sin(a)).toFixed(2);
  const desc=`${P.slices.map(s=>`${s.name}${s.other?` (${plural(s.other, "line")})`:""} ${pct(s.s)}`).join(", ")}. Total ${usdM(P.total)}.`;
  let a=-Math.PI/2, paths="", tex="", labels="";
  for(const s of P.slices){
    const sw=s.v/P.total*2*Math.PI, a2=a+sw, mid=a+sw/2;
    const d = P.slices.length===1 ? `M${cx} ${cy-r}A${r} ${r} 0 1 1 ${cx} ${cy+r}A${r} ${r} 0 1 1 ${cx} ${cy-r}Z` : `M${cx} ${cy}L${X(a)} ${Y(a)}A${r} ${r} 0 ${sw>Math.PI?1:0} 1 ${X(a2)} ${Y(a2)}Z`;
    const say=`${s.name}${s.other?` (${plural(s.other, "line")})`:""}: ${usdM(s.v)}, ${pct(s.s)}`;
    paths+=`<path d="${d}" fill="${s.fill}" class="cbpsl" data-cbp="${side}" data-k="${esc(s.k)}" data-v="${s.v}" tabindex="0" role="graphics-symbol" aria-label="${esc(say)}"></path>`;
    if(s.tex) tex+=`<path d="${d}" fill="${side==="base"?"url(#cbpTex_base)":"url(#cbpTex_pf)"}" class="cbptex" aria-hidden="true"></path>`;
    if(s.s>=4){ const lx=cx+(r+12)*Math.cos(mid), ly=cy+(r+12)*Math.sin(mid)+4, c=Math.cos(mid);
      labels+=`<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="${c>0.2?"start":c<-0.2?"end":"middle"}" aria-hidden="true">${esc(pct(s.s))}</text>`; }
    a=a2;
  }
  return `<svg class="cbpsvg" id="cbpSvg_${side}" viewBox="0 0 ${W} ${H}" role="group" aria-labelledby="cbpT_${side}" aria-describedby="cbpD_${side}"><title id="cbpT_${side}">${esc(title)}</title><desc id="cbpD_${side}">${esc(desc)}</desc>
    <defs><pattern id="cbpTex_${side}" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#FFFFFF" stroke-width="1.6" stroke-opacity="0.55"></line></pattern></defs>${paths}${tex}${labels}</svg>`;
}
/* One side's pie, or what is said in its place. */
function cbpPieHTML(M, side){
  const P=side==="base"?M.b:M.p, who=side==="base"?M.B0:"Pro forma", title=`${who}, ${M.where}, ${M.y}`;
  const inView=M.keys.length?" in the lines in view":"";
  let body;
  if(P.why){
    const coming=/still coming/.test(P.why), cut=/cut short/.test(P.why);
    body=`<p class="cbpnone" id="cbpNone_${side}">n/d: ${esc(P.why)}.${coming?" The pie is drawn when the figures arrive.":""}${cut?" A part is never drawn as the whole.":""}</p>`;
  } else if(P.empty) body=`<p class="cbpnone" id="cbpNone_${side}">${esc(side==="base" ? `${M.B0} writes nothing ${M.state?"here":"at all"}${inView} in ${M.y}.` : `Neither side writes anything ${M.state?"here":"at all"}${inView} in ${M.y}.`)}</p>`;
  else if(!(P.total>0)) body=`<p class="cbpnone" id="cbpNone_${side}">No line ${M.state?"here ":""}is above zero${inView} in ${M.y}, so there is no pie.</p>`;
  else body=cbpSvgHTML(side, P, title);
  let low="";
  if(!P.why && P.low.length) low=`<p class="t2 cbplow" id="cbpLow_${side}">Left out of the pie, as a pie can't show zero or below: ${esc(P.low.map(x=>`${x.name} ${usdM(x.v)}`).join(", "))}.${P.total>0?` Shares are of the lines above zero, ${esc(usdM(P.total))}; with the rest the total is ${esc(usdM(P.net))}.`:""}</p>`;
  return `<figure class="cbppie" id="cbpPie_${side}"><figcaption id="cbpH_${side}">${esc(title)}</figcaption>${body}${low}</figure>`;
}
function cbpLegendHTML(M){
  if(!M.rows.length) return "";
  const chg=cbChgOn(), B=M.B0;
  const sw=r=>`<span class="sw${r.tex?" tex":""}" aria-hidden="true" style="background-color:${r.fill}"></span>`;
  const chgCell=r=>{ const x=cbpChg(r); return `<td class="num cbchgc">${cbChgHTML(x, "")}${x.why?`<span class="cbwhy">${esc(x.why)}</span>`:""}</td>`; };
  return `<div class="tbl-wrap" data-keep id="cbpLegendWrap"><table class="cbtbl cbplegend" id="cbpLegend"><caption class="sr">Premiums by line, ${esc(M.where)}, ${M.y}: each line's colour, ${esc(B)}'s and the pro forma's $M and share${chg?", and the change in share":""}</caption>
    <thead><tr><th>Line of business</th><th class="num cbfirst">${esc(B)} $M</th><th class="num">Share</th><th class="num cbfirst">Pro forma $M</th><th class="num">Share</th>${chg?`<th class="num cbchgh">Change in share<span class="cbhn">pts, on ${esc(B)}</span></th>`:""}</tr></thead>
    <tbody>${M.rows.map(r=>`<tr data-k="${esc(r.k)}"><td><span class="cbpname">${sw(r)}<span>${esc(r.name)}${r.other?` <span class="t2">(${esc(plural(r.other, "line"))})</span>`:""}</span></span></td><td class="num cbfirst">${esc(cbpMoney(r.b))}</td><td class="num">${esc(cbpShare(r.b))}</td><td class="num cbfirst cbpf">${esc(cbpMoney(r.p))}</td><td class="num cbpf">${esc(cbpShare(r.p))}</td>${chg?chgCell(r):""}</tr>`).join("")}</tbody></table></div>`;
}
function cbpHTML(vm){
  const M=CBP_VM=cbpModel(vm), lines=M.keys.length?`: ${andList(vm.shownLines, 6)} only`:"";
  const head=`Premiums by line, ${M.where}, ${M.y}${lines}`;
  const showing=M.state ? `Showing ${M.name} only. Unpin it to see all states.` : "Showing all states. Click a state on the map to see its lines.";
  if(M.off) return `<section class="cbpie" id="cbPie" aria-labelledby="cbPieH"><h4 id="cbPieH">${esc(head)}</h4><div class="info" id="cbpOff" role="status"><span><b>A state's lines need premiums by state and line,</b> a figure that isn't mapped yet. A Corp Dev login can map <code>${CBM_FIG}</code> in Field set-up on the <a href="#statutory">Statutory view</a>. Unpin ${esc(M.name)} to see the pies for all states.</span></div></section>`;
  const canExp=!M.b.why || !M.p.why;
  const exp=canExp?`<span class="inline"><button class="btn sm" data-act="export" data-what="cb" data-tbl="pie" data-fmt="csv">Export lines CSV</button><button class="btn sm" data-act="export" data-what="cb" data-tbl="pie" data-fmt="xlsx">Export lines XLSX</button></span>`:"";
  let h=`<section class="cbpie" id="cbPie" aria-labelledby="cbPieH"><div class="blk-h"><h4 id="cbPieH">${esc(head)}</h4>${exp}</div><p class="t2" id="cbpShowing">${esc(showing)}</p>`;
  h+=`<div class="cbpgrid" id="cbpGrid">${cbpPieHTML(M, "base")}${cbpPieHTML(M, "pf")}<div class="cbmtip cbptip" id="cbpTip" aria-hidden="true" hidden></div></div>`;
  h+=cbpLegendHTML(M);
  for(const x of M.gaps) h+=`<p class="t2 cbmgap" id="cbpGap_${x.w}">${esc(`${x.w==="base"?M.B0:"The target"}'s lines in ${M.name} add up to ${usdM(x.g.sl)}, against ${usdM(x.g.all)} in its premiums by state. The pies show the lines.`)}</p>`;
  h+=`<p class="t2">Each pie is ${M.state?`${esc(M.name)}'s`:"all states'"} direct premiums written by line in ${M.y}${M.keys.length?", the lines in view only":""}, from ${M.state?"premiums by state and line":"premiums by line"}; shares are of that pie's own total. The same line has the same colour in both pies: the six largest in the pro forma, then "Other".${cbChgOn()?` Change in share is the pro forma's share less ${esc(M.B0)}'s, in percentage points; "New" means only the target writes here.`:""}</p><p class="t2" id="cbpCost">${esc(CBP_COST)}</p></section>`;
  return h;
}
/* The lines in the pies for the export: every line, with how it is shown, each side's dollars and share, and the change. */
function cbpExport(){
  const M=CBP_VM, run=S.cb.run; if(!M || M.off || !run || (M.b.why && M.p.why)) return null;
  const B=M.B0, chg=cbChgOn(), keys=new Set([...(M.b.all||[]), ...(M.p.all||[])].map(x=>x.k));
  const nameOf=k=>((M.p.all||[]).find(x=>x.k===k)||(M.b.all||[]).find(x=>x.k===k)).name, pv=k=>((M.p.all||[]).find(x=>x.k===k)||{v:-Infinity}).v;
  const one=(P, k)=>{ if(P.why) return {why:P.why}; if(!(P.total>0)) return {none:true, v:(P.all.find(x=>x.k===k)||{}).v}; const x=P.all.find(z=>z.k===k); return x ? {v:x.v, left:x.v<=0, s:x.v>0?x.v/P.total*100:null} : {absent:true}; };
  const n=x=>x.why?`n/d (${x.why})`:x.absent||x.v===undefined?"":Math.round(x.v), s=x=>x.absent?0:x.why||x.none||x.left?"":Math.round(x.s*10)/10;
  const as=k=>M.named.includes(k) ? "Its own slice" : [M.b, M.p].some(P=>!P.why && P.rest.some(x=>x.k===k)) ? "Other" : "Left out: zero or below";
  const rows=[...keys].sort((a,z)=>pv(z)-pv(a) || nameOf(a).localeCompare(nameOf(z))).map(k=>{ const r={b:one(M.b,k), p:one(M.p,k)}; const row=[nameOf(k), as(k), n(r.b), s(r.b), n(r.p), s(r.p)]; if(chg) row.push(cbChgRaw(cbpChg(r))); return row; });
  const w=chg?7:6, pad=k=>Array(k).fill("");
  const total=P=>P.why?`n/d (${P.why})`:String(Math.round(P.net));
  const about=[["State", M.state?`${M.name} (${M.state})`:"All states"], ["Year", String(M.y)], ["Lines", M.keys.length?CBM_VM.shownLines.join("; "):"All lines"], ["From", M.state?"Premiums by state and line (dpw_by_state_line)":"Premiums by line (dpw_by_line)"],
    [`${B} total US dollars`, total(M.b)], ["Pro forma total US dollars", total(M.p)],
    ["Shares", "Of each side's lines above zero; a line at zero or below is left out of the pie"], ...(chg?[["Change", `The pro forma's share less ${B}'s, in percentage points. New: only the target writes here.`]]:[]),
    ["Note", CB_WHAT], ["Base", `${B}: ${run.base.label} (${run.base.kind==="group"?"NAIC group":"NAIC"} ${run.base.codes.join(", ")})`], ["Target", `${run.target.label} (${run.target.kind==="group"?"NAIC group":"NAIC"} ${run.target.codes.join(", ")})`]];
  return {name:`snl-combination-lines-${M.state?M.state.toLowerCase():"all-states"}-${M.y}-${TODAY()}`, sheet:"By line", cols:["Line of business", "In the pies as", `${B} US dollars`, `${B} share %`, "Pro forma US dollars", "Pro forma share %", ...(chg?["Change in share pts"]:[])],
    rows:[...rows, pad(w), ...about.map(x=>[...x, ...pad(w-2)])]};
}
/* The small panel for a slice, on hover, focus or a tap: the line, its $M and its share. */
function cbpTipShow(el, ev){
  const tip=document.getElementById("cbpTip"), grid=document.getElementById("cbpGrid"), M=CBP_VM; if(!tip || !grid || !M || M.off) return;
  const P=el.dataset.cbp==="base"?M.b:M.p, s=P.slices&&P.slices.find(x=>x.k===el.dataset.k); if(!s) return;
  tip.innerHTML=`<b>${esc(s.name)}${s.other?` (${esc(plural(s.other, "line"))})`:""}</b> <p>${esc(el.dataset.cbp==="base"?M.B0:"Pro forma")}, ${esc(M.where)}, ${M.y}</p> <p>${esc(usdM(s.v))}, ${esc(pct(s.s))} of ${esc(usdM(P.total))}</p>`; tip.hidden=false;
  const G=grid.getBoundingClientRect(), r=el.getBoundingClientRect(), tw=tip.offsetWidth, th=tip.offsetHeight, mouse=ev&&isNum(ev.clientX);
  const ax=mouse?ev.clientX:r.left+r.width/2, ay=mouse?ev.clientY:r.top+r.height/2;
  let x=ax-G.left+14, y=ay-G.top+14;
  if(x+tw>G.width) x=Math.max(0, ax-G.left-tw-14);
  if(x+tw>G.width) x=Math.max(0, G.width-tw);
  if(y+th>G.height) y=Math.max(0, ay-G.top-th-14);
  tip.style.left=x+"px"; tip.style.top=y+"px";
}
function cbpTipHide(){ const tip=document.getElementById("cbpTip"); if(tip) tip.hidden=true; }
const cbpOf = e => e.target.closest && e.target.closest("[data-cbp]");
document.addEventListener("mouseover", e=>{ const el=cbpOf(e); if(el) cbpTipShow(el, e); });
document.addEventListener("mousemove", e=>{ const el=cbpOf(e); if(el) cbpTipShow(el, e); });
document.addEventListener("mouseout", e=>{ const to=e.relatedTarget; if(cbpOf(e) && !cbmTouched() && !(to&&to.closest&&to.closest("[data-cbp]"))) cbpTipHide(); });   // by touch, a tap elsewhere hides it
document.addEventListener("focusin", e=>{ const el=cbpOf(e); if(el) cbpTipShow(el, null); });
document.addEventListener("focusout", e=>{ if(cbpOf(e)) cbpTipHide(); });
document.addEventListener("click", e=>{ const el=cbpOf(e); if(el) cbpTipShow(el, e); });   // a tap, where there is no hover
document.addEventListener("touchstart", e=>{ if(!cbpOf(e)) cbpTipHide(); }, {passive:true});
document.addEventListener("keydown", e=>{ if(e.key==="Escape" && cbpOf(e)) cbpTipHide(); });

/* ---------- Screener (Corp Dev only): every company that fits a description, across all statutory filers ----------
   A plain form, no Claude. The statutory function's "screen" action runs it as one Snowflake statement and returns the
   ranked list; its "screen-lines" action gives S&P's own line names for a year, kept in this page for the session.
   Nothing about a screen is kept: the last result stays in this page's memory only (never browser storage), the form
   starts afresh each visit, and Ask Claude is told nothing about this view (askScreen gives null). The request is small
   plain JSON, so a later stage can fill it in from a question. */
VIEWS.push("screener");
const SC_MAX_STATES = 10, SC_MAX_LINES = 10, SC_MAX_FILTERS = 8, SC_MAX_LIMIT = 500;
/* The figures a filter can use: [id, label, unit]. Premium in view and focus first, then the one-a-year figures. */
const SC_FIGS = [

    if(min!==null && max!==null && min>max) return {err:`${label}: the minimum is above the maximum.`};

function renderScreener(){

/* ----- export: the result with its read-back, year and notes ----- */
function scExport(){
  const run=S.sc.run, res=run&&run.res; if(!res || !res.rows.length) return null;
  const cols=res.columns||[], grp=!!res.groupMapped;
  const head=["NAIC company code","Company", ...(grp?["NAIC group code","NAIC group"]:[]), ...cols.map(c=>c.unit==="usd"?`${c.id==="premium"?"Premium in view":c.label} US dollars`:`${c.id==="focus"?"Focus":c.id==="growth"?"Growth":c.label} %`)];
  const out=v=>isNum(v)?Math.round(+v*10000)/10000:"n/d";
  const rows=scRows(res).map(r=>[r.code, r.name||"", ...(grp?[r.groupCode||"", r.groupName||""]:[]), ...cols.map(c=>c.unit==="usd"&&isNum(r[c.id])?Math.round(+r[c.id]):out(r[c.id]))]);
  const pad=n=>Array(Math.max(0,n)).fill(""), w=head.length-2;
  const notes=[...SC_NOTES.slice(0,3), ...(Array.isArray(res.notes)?res.notes.map(String):[]), SC_NOTES[3]];
  return {name:`snl-screen-${TODAY()}`, sheet:"Screen", cols:head, rows:[...rows, pad(head.length), ["Screen", scReadBack(run.req), ...pad(w)], ["Year", String(res.year), ...pad(w)], ["Shown", scShownText(res, run), ...pad(w)],
    ...notes.map(n=>["Note", n, ...pad(w)]), ["Source", "S&P Global Market Intelligence statutory data, as filed", ...pad(w)]]};
}

function route(){
  const h=location.hash.replace(/^#/,""); let v=VIEWS.includes(h)?h:null;

async function doLogin(){
  if(S.loginBusy) return;
  const u=(document.getElementById("li_user")?.value||"").trim(), pw=document.getElementById("li_pw")?.value||"";
  if(!u||!pw){ S.loginErr="Enter your username and password."; render(); return; }
  S.loginBusy=true; S.loginErr=""; render();
  let data=null, error=null;
  try{ ({data, error}=await S.sb.auth.signInWithPassword({email:toEmail(u), password:pw})); }catch(e){ error=e; }
  S.loginBusy=false;
  if(error || !data || !data.session){
    const m=(error&&error.message)||"No session returned";
    S.loginErr = /rate|too many/i.test(m) ? "Too many attempts. Wait a few minutes and try again."
      : (error && (error.code==="invalid_credentials" || /invalid login credentials/i.test(m))) ? "That username and password don't match. Check them, or ask the site owner to reset your password."
      : (error && error.code==="email_provider_disabled") ? "Sign-in is switched off in Supabase (Authentication > Sign In / Providers > Email). Tell the site owner."
      : "Sign-in failed: "+m+". The site's Supabase settings may be wrong; tell the site owner.";
    render(); const f=document.getElementById("li_pw"); if(f){ f.value=""; f.focus(); } return;
  }
  await onSignedIn(data.session);

/* ---------- Cloudflare sign-on ----------
   When config.js says signOn "cloudflare", the site is served by the Cloudflare Worker (worker/index.js) behind
   Cloudflare Access, and there is no username and password here: Cloudflare has already signed the person in. The
   Worker's /auth/session turns that sign-in into a short Supabase session (the access token only, never a refresh
   token). The Supabase client is given that token for every table read, storage call and function call; it is
   renewed quietly a few minutes before it ends, and once when Supabase answers 401. Sign out goes through Access's
   own logout. Without the marker, the username and password sign-in above is used as before. */
const CF_TIMING = {before:300000, retry:30000, soon:60000};   // renew this long before the end; retry a failed renewal; renew first when the token ends sooner than this
S.cf=null;        // {token, exp: when it ends on this computer's clock, timer, renewing}
S.cfState=null;   // why no one is signed in: {kind:"loading"|"notset"|"unreachable"|"ended"|"leaving", msg}
const CF_ENDED = "Cloudflare sign-ins last a set time, and the site owner may have changed who can use the site. Reload the page to sign in again through Cloudflare.";
/* Asks the Worker for a session. {ok:true, data} or {kind, msg}. A redirect means Access wants a fresh sign-in. */
async function cfAsk(){
  let res;
  try{ res=await fetch("/auth/session", {method:"POST", credentials:"same-origin", redirect:"manual", cache:"no-store", headers:{"Content-Type":"application/json"}, body:'{"action":"session"}'}); }
  catch{ return {kind:"unreachable", msg:"The sign-in service can't be reached. Check your connection and try again."}; }
  if(res.type==="opaqueredirect" || res.status===0) return {kind:"ended", msg:CF_ENDED};
  let body=null; try{ body=await res.json(); }catch{}
  if(res.ok && body && typeof body.accessToken==="string" && body.accessToken && body.profile && ROLES[body.profile.role]) return {ok:true, data:body};
  const msg=body && typeof body.message==="string" && body.message ? body.message : "";
  if(body && body.error==="not_configured") return {kind:"notset", msg:msg||"Cloudflare let you in, but the site isn't set up yet. Ask the site owner."};
  if(res.status===401 || res.status===403) return {kind:"ended", msg:msg||CF_ENDED};
  return {kind:"unreachable", msg:msg||"The sign-in service can't be reached. Try again in a minute."};
}
function cfTake(d){
  const now=Date.now(), life=Number(d.expiresIn)>0 ? Number(d.expiresIn)*1000 : Math.max(0, Number(d.expiresAt)*1000-now);
  if(S.cf) clearTimeout(S.cf.timer);
  S.cf={token:d.accessToken, exp:now+life, timer:null, renewing:null};
  const p=d.profile, name=String(p.displayName||p.username||p.email||"").trim()||"Signed in";
  const next={username:String(p.email||p.username||""), name, role:p.role, uid:String(p.id||"")};
  const changed=!S.session || S.session.role!==next.role || S.session.name!==next.name;
  S.session=S.session ? Object.assign(S.session, next) : next;
  cfSchedule();
  return changed;
}
function cfSchedule(delay){
  if(!S.cf) return;
  clearTimeout(S.cf.timer);
  const left=S.cf.exp-Date.now();
  if(delay===undefined) delay=Math.max(left/2, left-CF_TIMING.before);   // a few minutes before the end (halfway for a short token)
  S.cf.timer=setTimeout(()=>{ cfRenew(); }, Math.max(1000, delay));
}
/* Renews the token. One renewal at a time; everyone waiting gets the same answer. */
function cfRenew(){
  if(!S.cf) return Promise.resolve(false);
  if(S.cf.renewing) return S.cf.renewing;
  const mine=S.cf;
  mine.renewing=(async()=>{
    const r=await cfAsk();
    if(S.cf!==mine) return false;   // signed out meanwhile
    mine.renewing=null;
    if(r.ok){ if(cfTake(r.data) && S.session) render(); return true; }
    if(r.kind==="unreachable" && mine.exp-Date.now()>10000){ cfSchedule(CF_TIMING.retry); return false; }   // still good for now: try again shortly
    cfEnded(r.kind, r.kind==="unreachable" ? "The sign-in service can't be reached, so your session couldn't be renewed. Check your connection and try again." : r.msg);
    return false;
  })();
  return mine.renewing;
}
/* The token for the next request (supabase-js asks before each one), renewed first when it is about to end. */
async function cfToken(){
  if(S.cf && S.cf.exp-Date.now()<CF_TIMING.soon) await cfRenew();
  return S.cf ? S.cf.token : null;
}
async function cfSessionNow(){ const t=await cfToken(); return t ? {access_token:t} : null; }
/* fetch for everything sent to Supabase: on a 401, renew the token once and send the same request again. */
async function cfFetch(input, init){
  const res=await fetch(input, init);
  const url=typeof input==="string" ? input : input instanceof URL ? input.href : (input && input.url) || "";
  if(res.status!==401 || !S.cf || !CFG.supabaseUrl || !url.startsWith(CFG.supabaseUrl) || (init && init.body && typeof init.body.getReader==="function")) return res;
  const h=new Headers((init && init.headers) || (input && input.headers) || {}), was=(h.get("Authorization")||"").replace(/^Bearer\s+/i,"");
  if(S.cf.token===was && !(await cfRenew())) return res;
  if(!S.cf || S.cf.token===was) return res;
  h.set("Authorization", "Bearer "+S.cf.token);
  return fetch(input, {...(init||{}), headers:h});
}
function cfEnded(kind, msg){
  if(S.cf) clearTimeout(S.cf.timer);
  S.cf=null;
  if(S.session) resetState();
  S.cfState={kind, msg}; S.authChecked=true; render();
}
async function cfSignOut(){
  const t=S.cf && S.cf.token;
  cfEnded("leaving", "");
  // End this Supabase session too (best effort), then let Access sign the browser out.
  if(t && CFG.supabaseUrl){ try{ await Promise.race([fetch(CFG.supabaseUrl+"/auth/v1/logout?scope=local", {method:"POST", headers:{"Authorization":"Bearer "+t, "apikey":CFG.supabaseAnonKey}}), new Promise(r=>setTimeout(r, 3000))]); }catch{} }
  location.assign("/auth/signout");
}

function cfLoginHTML(){
  const st=S.cfState||{kind:"loading"};
  const box=(h, p, btn) => `<div class="kicker">Strategy and corporate development</div><h2>${esc(h)}</h2><p role="${st.kind==="loading"||st.kind==="leaving"?"status":"alert"}">${esc(p)}</p>${btn||""}`;
  if(st.kind==="notset") return box("Not set up yet", st.msg)+`<p class="source">The README has the steps (Cloudflare sign-on).</p>`;
  if(st.kind==="unreachable") return box("Can't reach the sign-in service", st.msg, `<div class="inline"><button class="btn primary" data-act="cf-retry">Try again</button></div>`);
  if(st.kind==="ended") return box("Your sign-in has ended", st.msg, `<div class="inline"><button class="btn primary" data-act="cf-reload">Reload</button></div>`);
  if(st.kind==="leaving") return box("Signing you out", "One moment…");
  return box("SNL lookup", "Signing you in…");
}

  S.cfState={kind:"loading"}; render();

  const r=await cfAsk();
  if(!r.ok){ S.cfState={kind:r.kind, msg:r.msg}; render(); return; }
  if(!S.sb) S.sb=window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey, {accessToken:cfToken, global:{fetch:cfFetch}});
  cfTake(r.data); S.cfState=null; S.authChecked=true; S.loginErr="";
  route(); loadStatus(); loadPast(false);
}

async function boot(){
  S.f=freshFilings(); S.st=freshStat();
  if(CF_SIGNON){ cfBoot(); return; }
  if(!CFG.supabaseUrl || !CFG.supabaseAnonKey || !window.supabase){ S.configMissing=true; render(); return; }
  S.sb=window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey);
  render();
  let session=null;
  try{ ({data:{session}}=await S.sb.auth.getSession()); }catch{}
  S.authChecked=true;
  if(session) await onSignedIn(session); else render();
  S.sb.auth.onAuthStateChange((event)=>{ if(event==="SIGNED_OUT" && S.session && !S.leaving){ resetState(); S.loginErr="You were signed out. Sign in again."; render(); } });
}
boot();
</script>
