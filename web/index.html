<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>SNL lookup</title>
<style>
/* Layout: house template chrome (spectrum stripe, magenta action title, navy text, footer) over two views:
   Filings (search and open S&P product filings) and Statutory (Snowflake). Ask Claude is a panel that opens beside
   either view from a button fixed at the bottom right, so a question never means leaving what is on screen. */
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --tile:#EEEEF5; --alt:#F5F5FA; --grid:#D9DCE6;
  --ink:#262166; --muted:#666666; --magenta:#EB008C; --blue:#00539E; --lblue:#0081C3;
  --teal:#00857C; --purple:#944599; --orange:#C46A1B; --head:#262166; --headInk:#FFFFFF;
  --overlay:rgba(38,33,102,.28); --shadow:0 12px 40px rgba(38,33,102,.18);
  --font:Arial,"Helvetica Neue",Helvetica,sans-serif;
}
:root,:root[data-theme]{color-scheme:light}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);margin:0}
body{color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue)}
:focus-visible{outline:2px solid var(--magenta);outline-offset:2px}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Template chrome */
.stripe{display:flex;height:6px}
.stripe i{flex:1}
.stripe i:nth-child(1){background:#262166}.stripe i:nth-child(2){background:#944599}
.stripe i:nth-child(3){background:#EB008C}.stripe i:nth-child(4){background:#0081C3}
.stripe i:nth-child(5){background:#00539E}.stripe i:nth-child(6){background:#00857C}
.wrap{max-width:1320px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{border-bottom:1px solid var(--grid);background:var(--surface)}
.top .wrap{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 24px;padding-block:14px 0}
.brand{flex:1 1 320px;min-width:0;padding-bottom:12px}
.kicker{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink);font-weight:bold}
.brand h1{margin:2px 0 0;font-size:24px;color:var(--magenta);font-weight:normal;text-wrap:balance}
.who{position:relative;display:flex;align-items:center;gap:10px;padding-bottom:12px;font-size:13px}
.dot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:12px;font-weight:bold;background:var(--blue);border:0;padding:0;cursor:pointer;font-family:inherit}
.whomenu{position:absolute;right:0;top:calc(100% - 4px);z-index:30;min-width:220px;background:var(--surface);border:1px solid var(--grid);box-shadow:var(--shadow);display:flex;flex-direction:column;padding:6px 0}
.whomenu .wm-n{padding:8px 14px 10px;border-bottom:1px solid var(--grid);margin-bottom:4px}
.whomenu .wm-n b{display:block}.whomenu .wm-n span{font-size:12px;color:var(--muted)}
.whomenu button{all:unset;cursor:pointer;padding:9px 14px;font-weight:bold;font-size:13px}
.whomenu button:hover,.whomenu button:focus-visible{background:var(--tile)}
nav.tabs{display:flex;gap:4px;flex-basis:100%;overflow-x:auto}
nav.tabs a{padding:10px 16px;text-decoration:none;color:var(--ink);border-bottom:3px solid transparent;font-weight:bold;white-space:nowrap}
nav.tabs a[aria-current="page"]{border-bottom-color:var(--magenta);color:var(--magenta)}
nav.tabs a:hover{background:var(--alt)}

/* Status strip: S&P requests used and when each source was last refreshed, on every view */
.strip{background:var(--alt);border-bottom:1px solid var(--grid);font-size:12px}
.strip .wrap{display:flex;flex-wrap:wrap;gap:4px 22px;padding-block:7px}
.strip .s-i{min-width:0;overflow-wrap:anywhere}
.strip .s-i.warn{color:var(--magenta);font-weight:bold}
/* S&P connection check: a small link in the strip, and its report just under the strip */
.strip .s-conn{margin-left:auto;min-width:0}
.strip .s-conn .lnk:disabled{color:var(--muted);text-decoration:none;cursor:default}
#connRoot .wrap{padding-block:10px}
.conn{font-size:13px}
.conn>div{flex:1 1 100%;min-width:0;display:flex;flex-direction:column;gap:6px}
.conn p{margin:0}
.conn ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.conn .mk{font-weight:bold}
.conn .mk.no{color:var(--magenta)}
.conn textarea{min-height:140px;font-size:12px}
/* Live check (Corp Dev): shapes and counts of real S&P answers, each finding marked in words and colour */
.strip .s-live{min-width:0}
.strip .s-live .lnk:disabled{color:var(--muted);text-decoration:none;cursor:default}
#liveRoot .wrap{padding-block:0 10px}
.live h3{font-size:13px;margin:6px 0 0}
.live ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px}
.live .mk.ok{color:var(--blue)}
.live .mk.unk,.live .mk.rec{color:var(--muted)}
.live .lv-v{display:block;margin-top:2px}
.live .lv-stop{color:var(--magenta);font-weight:bold}
.live details summary{cursor:pointer;font-weight:bold}
.live details ul{margin-top:6px}

main .wrap{padding-block:22px 28px;display:flex;flex-direction:column;gap:22px}
footer.foot{border-top:1px solid var(--grid)}
footer.foot .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 12px;padding-block:10px;font-size:11px;color:var(--muted)}

/* Type */
.action-title{font-size:22px;color:var(--magenta);margin:0;font-weight:bold;text-wrap:balance}
.sub{margin:4px 0 0;color:var(--ink);max-width:90ch}
.sec{display:flex;align-items:center;gap:12px;margin:0;font-size:14px;font-weight:bold;color:var(--ink)}
.sec::before,.sec::after{content:"";flex:1;height:1px;background:var(--ink);opacity:.6}
.source{font-size:11px;font-style:italic;color:var(--muted);margin:0;overflow-wrap:anywhere}
.t1{font-weight:bold}
.t2{font-size:12px;color:var(--muted)}
p.t2{margin:0}
h3{margin:0;font-size:15px}

/* Notices: .banner for problems, .info for calm states and things to read, .notes for S&P's caveats on a result */
.banner,.info,.notes{background:var(--tile);border-left:4px solid var(--magenta);padding:10px 14px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;min-width:0;overflow-wrap:anywhere}
.info{border-left-color:var(--blue)}
.banner>span,.info>span{min-width:0;flex:1 1 260px}
.notes{display:block}
.notes ul{margin:6px 0 0;padding-left:18px}
.notes li+li{margin-top:4px}
.err{color:var(--magenta);font-size:13px;margin:0;overflow-wrap:anywhere}
.empty{border:1px dashed var(--grid);padding:28px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.empty p{margin:0;max-width:60ch}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;z-index:60;font-size:13px;max-width:calc(100% - 32px)}

/* Controls */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;min-width:0}
.toolbar .grow{flex:1 1 220px;min-width:0}
.inline{display:flex;gap:8px;align-items:center;flex-wrap:wrap;min-width:0}
input[type=text],input[type=search],input[type=number],input[type=date],input[type=password],select,textarea{
  width:100%;min-width:0;padding:7px 9px;border:1px solid var(--grid);background:var(--surface);border-radius:0}
textarea{resize:vertical;min-height:64px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border:1px solid var(--ink);background:var(--surface);color:var(--ink);cursor:pointer;font-weight:bold;font-size:13px;white-space:nowrap;border-radius:0}
.btn:hover{background:var(--tile)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.primary:hover{opacity:.9}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:4px 9px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.seg{display:inline-flex}.seg .btn+.btn{margin-left:-1px}
.lnk{all:unset;cursor:pointer;color:var(--blue);text-decoration:underline;font-weight:bold}
.lnk:focus-visible{outline:2px solid var(--magenta);outline-offset:2px}
.pill{display:inline-block;padding:2px 8px;font-size:11px;font-weight:bold;border:1px solid currentColor;white-space:nowrap}
.fchip{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:5px 8px;border:1px solid var(--grid);background:var(--surface);color:var(--ink);cursor:pointer;font-size:12px;font-weight:bold;white-space:nowrap;border-radius:0}
.fchip:hover{border-color:var(--magenta)}
.fchip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
label.f,.f{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:bold;min-width:0;overflow-wrap:anywhere}
label.f em,.f em{font-weight:normal;font-style:normal;color:var(--muted)}
.f>p,.f input,.f select,.f textarea,.f td,.f .t2,.f .banner,.f .info,.blk-h select{font-weight:normal}
.tcard{border:1px solid var(--grid);padding:14px 16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.fgrid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.fgrid .full{grid-column:1/-1}
.checks{display:flex;flex-direction:column;gap:5px;max-height:168px;overflow:auto;border:1px solid var(--grid);padding:8px;font-weight:normal}
.checks label{display:flex;gap:6px;align-items:flex-start;font-size:13px;overflow-wrap:anywhere}
.checks input{margin-top:2px;flex:none}
/* The state picker: a map on the left, the list on the right; one under the other on a narrow screen */
.stpick{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:14px 24px;align-items:stretch}
.stmapbox,.stlist{min-width:0;display:flex;flex-direction:column;gap:8px}
/* the list is as tall as the map beside it and scrolls inside its own box, so the page doesn't grow by 51 rows */
.stlist{contain:size}
.sthead .t2{font-weight:normal}
.sthead{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 12px;min-width:0}
.stbox{flex:1 1 0;min-height:0;overflow-y:auto;overscroll-behavior:contain;position:relative;border:1px solid var(--grid);background:var(--surface);display:flex;flex-direction:column}
.strow{position:relative;display:flex;align-items:center;gap:10px;width:100%;min-width:0;flex:none;padding:7px 10px;border:0;border-bottom:1px solid var(--grid);background:var(--surface);color:var(--ink);font:inherit;font-size:13px;font-weight:normal;text-align:left;cursor:pointer;border-radius:0}
.strow:last-child{border-bottom:0}
.strow:hover{background:var(--alt)}
.strow:focus-visible{outline-offset:-2px}
.strow::before{content:"";flex:none;width:14px;height:14px;box-sizing:border-box;border:1px solid var(--muted);background:var(--surface)}
.strow[aria-pressed="true"]{background:var(--tile);font-weight:bold}
.strow[aria-pressed="true"]::before{border-color:var(--ink);background:var(--ink)}
.strow[aria-pressed="true"]::after{content:"";position:absolute;left:15px;top:50%;width:4px;height:8px;margin-top:-6px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.strow .stn{flex:1 1 auto;min-width:0;overflow-wrap:anywhere}
.strow .stc{flex:none;margin-left:auto;font-size:12px;font-weight:bold;color:var(--muted)}
.strow .stn+.stc{min-width:2.4em;text-align:right}
.stmap{display:block;width:100%;height:auto}
.stmap path{fill:var(--tile);stroke:var(--surface);stroke-width:1;stroke-linejoin:round;cursor:pointer}
.stmap path:hover{fill:var(--grid)}
.stmap path.on{fill:var(--ink)}
.stmap path.on:hover{fill:var(--blue)}
.stmap path.off{fill:var(--alt);cursor:default}
.stmap text{font:bold 15px var(--font);fill:var(--ink);text-anchor:middle;pointer-events:none}
.stmap text.on{fill:#fff}
.stmap text.off{fill:var(--grid)}
@media (max-width:820px){.stpick{grid-template-columns:1fr}.stmap text{display:none}.stlist{contain:none}.stbox{flex:none;height:300px}}
.chips{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.cchip{display:inline-flex;align-items:center;gap:8px;max-width:100%;padding:4px 4px 4px 10px;background:var(--tile);font-size:12px;font-weight:normal;min-width:0}
.cchip b{overflow-wrap:anywhere}
.cchip button{all:unset;cursor:pointer;padding:2px 7px;font-weight:bold}
.cchip button:hover,.cchip button:focus-visible{background:var(--ink);color:#fff}
.matches{list-style:none;margin:0;padding:0;border:1px solid var(--grid);font-weight:normal}
.matches li{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;justify-content:space-between;padding:8px 10px;min-width:0}
.matches li+li{border-top:1px solid var(--grid)}
.matches li>div{min-width:0;flex:1 1 220px;overflow-wrap:anywhere}
/* Searches in parts (big-searches): where a search has got to, under the "Searching" line */
.bsprog{display:block;margin-top:4px;font-weight:bold}
/* Recent searches: a compact bar above the form, opening to a list of saved searches that reopen in a click */
.recent{border:1px solid var(--grid);background:var(--alt);padding:8px 12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.recent-h{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;min-width:0}
.recent-h .t2{flex:1 1 240px;min-width:0}
.recent-t{all:unset;cursor:pointer;font-weight:bold;display:inline-flex;align-items:center;gap:6px}
.recent-t:hover{text-decoration:underline}
.recent-t:focus-visible{outline:2px solid var(--magenta);outline-offset:2px}
.recent-t .ar{font-size:10px}
.recent ul{list-style:none;margin:0;padding:0;border:1px solid var(--grid);background:var(--surface)}
.recent li+li{border-top:1px solid var(--grid)}
.recent-i{all:unset;box-sizing:border-box;display:block;width:100%;cursor:pointer;padding:7px 10px;min-width:0;overflow-wrap:anywhere}
.recent-i:hover{background:var(--tile)}
.recent-i:focus-visible{outline:2px solid var(--magenta);outline-offset:-2px}
.recent-i:disabled{cursor:not-allowed;opacity:.6}
.recent-i .t1{color:var(--blue)}
#st_named:empty{display:none}
.noadd{max-width:44ch}
/* Whole groups in the company finder, and the tick that keeps a search out of Recent searches */
.matches.groups{border-color:var(--blue)}
.matches.groups li{background:var(--alt)}
.unl{display:flex;gap:8px;align-items:flex-start;font-weight:normal;cursor:pointer;min-width:0;overflow-wrap:anywhere}
.unl input{margin:3px 0 0;flex:none}
.bigwarn{color:var(--magenta)}

/* Tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--grid);max-width:100%}
table{border-collapse:collapse;width:100%;font-size:13px}
th{background:var(--head);color:var(--headInk);font-weight:bold;text-align:left;padding:8px 10px;white-space:nowrap;font-size:12px}
th.num{text-align:right}
td{padding:8px 10px;border-top:1px solid var(--grid);vertical-align:top}
tbody tr:nth-child(even) td{background:var(--alt)}
th .sorth{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
th .sorth:hover{text-decoration:underline}
th .sorth:focus-visible{outline:2px solid #fff;outline-offset:2px}
th .sorth .ar{font-size:9px}
/* a table inside a scrolling box keeps whole words and scrolls, rather than breaking words to fit */
.tbl-wrap td,.tbl-wrap th,.tbl-wrap code{overflow-wrap:break-word}
.filings td{overflow-wrap:break-word}
.filings .c-co,.filings .c-desc{overflow-wrap:anywhere}
@media (min-width:701px){.filings .c-co{min-width:170px}.filings .c-desc{min-width:240px}.filings .c-dates,.filings .c-tn{white-space:nowrap}}
.filings .c-tn .tn-long{white-space:normal;overflow-wrap:anywhere}
.filings .c-tn .spno{display:block}
.filings .dl{display:grid;grid-template-columns:auto auto;gap:1px 8px;justify-content:start;font-size:12px}
.filings .dl span{color:var(--muted)}
.counts{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;min-width:0}
.counts b{font-weight:bold}
.counts span{overflow-wrap:anywhere}
.stat td:first-child,.stat th:first-child{min-width:160px}
.stat td:first-child{overflow-wrap:anywhere}

/* Ask Claude: the button, then the panel (a drawer beside the page; a full-screen sheet on a phone) */
.askfab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:34;display:inline-flex;align-items:center;gap:8px;
  padding:11px 16px;border:2px solid var(--ink);background:var(--ink);color:#fff;font-weight:bold;font-size:14px;cursor:pointer;box-shadow:var(--shadow);border-radius:0;max-width:calc(100% - 32px)}
.askfab:hover{opacity:.92}
.askfab .mark{width:10px;height:10px;border-radius:50%;background:#fff;flex:none}
.askfab.ready{background:var(--magenta);border-color:var(--magenta)}
.askfab.failed{background:var(--surface);color:var(--magenta);border-color:var(--magenta)}
.askfab.failed .mark{background:var(--magenta)}
.askpanel{position:fixed;top:0;right:0;bottom:0;width:min(480px,100%);z-index:35;background:var(--surface);border-left:1px solid var(--grid);box-shadow:var(--shadow);display:flex;flex-direction:column;min-width:0;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.askpanel.wide{width:min(100%,max(480px,86vw))}
.ask-h{display:flex;align-items:center;gap:6px;padding:12px 16px;border-bottom:1px solid var(--grid);min-width:0}
.ask-h h2{margin:0;font-size:19px;color:var(--magenta);font-weight:normal;flex:1;min-width:0;white-space:nowrap}
.ask-b{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;padding:14px 16px;display:flex;flex-direction:column;gap:12px;position:relative}
.ask-b>*{flex:none;min-width:0}
.ask-f{border-top:1px solid var(--grid);padding:12px 16px;display:grid;gap:6px;min-width:0}
.ccchips{display:flex;flex-direction:column;gap:6px;align-items:flex-start;margin-top:6px}
.chip{border:1px solid var(--grid);background:var(--surface);color:var(--ink);padding:7px 10px;font-size:13px;cursor:pointer;text-align:left;border-radius:0;max-width:100%;overflow-wrap:anywhere}
.chip:hover{border-color:var(--magenta)}
/* room at the foot of the page, so the button never sits on the last thing there */
body.signed footer.foot .wrap{padding-bottom:calc(68px + env(safe-area-inset-bottom,0px))}
/* on a wide window the page makes room for the panel instead of hiding behind it */
@media (min-width:1280px){body.ask-docked{padding-right:480px}}
.cclog,.turn{display:grid;gap:12px;min-width:0}
.ccmsg{padding:8px 12px;max-width:100%;min-width:0;overflow-wrap:anywhere}
.ccmsg.u{background:var(--tile);justify-self:end;max-width:85%;white-space:pre-wrap}
.ccmsg.a{border-left:3px solid var(--blue);display:grid;gap:12px}
.ccmsg.a p{margin:0 0 6px}.ccmsg.a ul{margin:0 0 6px;padding-left:18px}
.ccmsg.err{border-left:3px solid var(--magenta);color:var(--magenta)}
.ccmsg .look{font-size:12px;color:var(--muted);margin:0}
.turn .told{justify-self:end;text-align:right;max-width:85%;margin-top:-8px;overflow-wrap:anywhere}
.ccform{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:end}.ccform textarea{width:100%;min-height:44px}.ccform .btn{justify-content:center}
.steps{margin:0;padding-left:20px;font-size:13px}
.steps li+li{margin-top:2px}
.steps li span{color:var(--muted);font-size:11px;margin-left:8px;white-space:nowrap}
.partial{border-top:1px dashed var(--grid);padding-top:8px}
.cite{all:unset;cursor:pointer;color:var(--blue);font-weight:bold;font-size:12px;margin-left:2px}
.cite:hover{text-decoration:underline}
.cite:focus-visible{outline:2px solid var(--magenta);outline-offset:1px}
.cite.off{cursor:default;color:var(--muted)}
.srcs{margin:0;padding-left:26px;display:grid;gap:10px}
.srcs li{min-width:0;padding:2px 4px}
.srcs li.hit{background:var(--tile);outline:2px solid var(--magenta)}
.srcs .quote{margin:4px 0;padding-left:8px;border-left:2px solid var(--grid);font-size:12px;color:var(--muted)}
.blk{display:grid;gap:8px;min-width:0}
.blk-h{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;justify-content:space-between;min-width:0}
.blk-h>div{min-width:0}
/* Past answers: the login's own questions from the last 30 days, under the start of an empty conversation */
.past{display:grid;gap:8px;min-width:0;border-top:1px solid var(--grid);padding-top:12px}
.pastlist{list-style:none;margin:0;padding:0;border:1px solid var(--grid);min-width:0}
.pastlist li{min-width:0}
.pastlist li+li{border-top:1px solid var(--grid)}
.pastq{all:unset;box-sizing:border-box;cursor:pointer;display:grid;gap:2px;width:100%;padding:8px 10px;min-width:0;overflow-wrap:anywhere}
.pastq:hover{background:var(--alt)}

.setedit,.setrename{border-top:1px solid var(--grid);padding-top:10px;display:flex;flex-direction:column;gap:10px;min-width:0}
.setedit .wlist{display:flex;flex-direction:column;gap:6px;font-size:13px;min-width:0}
.cmpswitch{display:inline-flex;gap:0;align-self:flex-start}
.cmpswitch a{text-decoration:none}
.cmpswitch a[aria-current="page"]{background:var(--ink);border-color:var(--ink);color:#fff}
/* Market index (#market) */
.mkmgr{gap:12px}
.mkopen{border:1px solid var(--grid);padding:10px 12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.mkbar{height:8px;background:var(--tile);border:1px solid var(--grid)}
.mkbar span{display:block;height:100%;background:var(--magenta)}
.mklist{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:8px;min-width:0}
.mklist li{min-width:0;overflow-wrap:anywhere}
.mkli{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;justify-content:space-between;min-width:0}
.mkli>span{flex:1 1 240px;min-width:0}
.mkstart{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--grid);padding-top:12px;min-width:0}
.mkcost,.mkcov span{overflow-wrap:anywhere}
.mkmiss summary,.mkrecent summary{cursor:pointer;font-size:12px;font-weight:bold;color:var(--blue)}
/* "Narrow it down": states and types of insurance on Snapshot, Compare, Market and the filings profile */
.nwbox{border:1px solid var(--grid);background:var(--alt);padding:10px 12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.nwhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;min-width:0}
.nwhead b{font-size:13px}
.nwgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-flow:row dense;gap:10px 18px;min-width:0}
.nwgrid>.nwpanel{grid-column:1/-1}
.nwcol{display:flex;flex-direction:column;gap:6px;min-width:0}
.nwlab{font-size:12px;font-weight:bold}
.nwrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-width:0}
.nwall{display:inline-flex;align-items:center;padding:4px 10px;background:var(--surface);border:1px dashed var(--grid);font-size:12px;color:var(--muted)}
.nwrow .cchip{background:var(--surface);border:1px solid var(--grid)}
.nwpanel{border:1px solid var(--grid);background:var(--surface);padding:10px 12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.nwpanel .stpick{grid-template-columns:minmax(0,3fr) minmax(0,2fr)}
.nwpanel .stbox{max-height:300px}
.nwregions{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-width:0}
.nwpanel .checks{max-height:220px;background:var(--surface)}
.nwnote{margin:0;overflow-wrap:anywhere}
.nwshown,.nwwide{align-items:center}
.fgrid.three .mkwords{grid-column:span 2}
@media (max-width:900px){.fgrid.three .mkwords{grid-column:auto}}
.nwshown span,.nwwide span{flex:1 1 260px;min-width:0;overflow-wrap:anywhere}
@media (max-width:700px){.nwgrid{grid-template-columns:1fr}.nwpanel .stpick{grid-template-columns:1fr}}

const plural = (n, one, many) => `${count(n)} ${+n===1 ? one : (many || one+"s")}`;
/* US dollars shown in $M: commas, one decimal under 10, negatives in parentheses, "n/d" when missing. */
function usdM(v){
  if(!isNum(v)) return "n/d";
  const m=+v/1e6, a=Math.abs(m), s = a===0 ? "0" : a<9.95 ? a.toFixed(1) : Math.round(a).toLocaleString("en-US");
  return m<0 && s!=="0.0" ? `($${s}M)` : `$${s}M`;
}
function pct(v){ if(!isNum(v)) return "n/d"; const s=Math.abs(+v).toFixed(1); return +v<0 && s!=="0.0" ? `(${s}%)` : `${s}%`; }
/* A day as S&P sends it (2026-11-05, 2026-11-05T00:00:00 or 11/05/2026). Null when it can't be read. The Live check
   on 18 Nov 2026 saw every date start 2026-11-05 style (10 rows from one search); the other shapes are still read. */
function parseDay(s){
  if(blank(s)) return null;
  const t=String(s).trim(); let y, m, d;
  let x=t.match(/^(\d{4})-(\d{2})-(\d{2})(?:$|[T ])/);
  if(x){ y=+x[1]; m=+x[2]; d=+x[3]; }
  else if((x=t.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})(?:$|\s)/))){ y=+x[3]; m=+x[1]; d=+x[2]; }
  else return null;
  const out=new Date(y, m-1, d);
  return out.getFullYear()===y && out.getMonth()===m-1 && out.getDate()===d ? out : null;
}
// "5 Nov"; the year only when it isn't this year, so an old filing never reads as recent
function fmtD(d){ return d.toLocaleDateString("en-GB",{day:"numeric",month:"short", ...(d.getFullYear()!==new Date().getFullYear()?{year:"numeric"}:{})}); }
const fmtDay = s => { const d=parseDay(s); return d ? fmtD(d) : "n/d"; };
// a moment (2026-11-05T14:02:00Z) in the reader's own time zone; a bare day is shown as that day
const fmtAt = s => { if(blank(s)) return "n/d"; if(/^\d{4}-\d{2}-\d{2}$/.test(String(s).trim())) return fmtDay(s); const d=new Date(s); return isNaN(d) ? "n/d" : fmtD(d); };
const fmtTime = s => { if(blank(s)) return ""; const d=new Date(s); return isNaN(d) ? "" : d.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"}); };
const dayOut = s => { const d=parseDay(s); return d ? iso(d) : (blank(s) ? "" : String(s)); };
function toast(msg){ const r=document.getElementById("toastRoot"); r.innerHTML=`<div class="toast" role="status">${esc(msg)}</div>`; clearTimeout(toast.t); toast.t=setTimeout(()=>{ r.innerHTML=""; },4200); }
const isCorpDev = () => !!S.session && S.session.role==="corpdev";
function setPath(path, v){ const ks=path.split("."); let o=S; for(const k of ks.slice(0,-1)) o=o[k]; o[ks[ks.length-1]]=v; }
/* Markdown-lite for Claude's text: escaped first, then bold, code, bullets and headings only. Each part is a piece
   of text and, optionally, HTML to put at the end of its last line (the citation markers). Bullets in parts that
   follow one another join into one list. */
function mdParts(parts){
  let out="", inList=false;
  const inline=t=>t.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/`([^`]+)`/g,"<code>$1</code>");
  for(const part of parts){
    const lines=esc(part.text).split(/\n/).map(l=>l.trimEnd()); let last=lines.length-1; while(last>0 && !lines[last]) last--;
    lines.forEach((l,i)=>{ const tail=i===last&&part.tail ? " "+part.tail : "", m=l.match(/^\s*(?:[-*•]|\d+\.)\s+(.*)$/);
      if(m){ if(!inList){ out+="<ul>"; inList=true; } out+=`<li>${inline(m[1])}${tail}</li>`; return; }
      if(inList){ out+="</ul>"; inList=false; }
      if(/^#{1,4}\s+/.test(l)) out+=`<p><b>${inline(l.replace(/^#{1,4}\s+/,""))}</b>${tail}</p>`;
      else if(l || tail) out+=`<p>${inline(l)}${tail}</p>`; });
  }
  if(inList) out+="</ul>"; return out;
}
const md = s => mdParts([{text:s}]);
function sortRows(list, get, dir){
  return [...list].sort((a,b)=>{ const x=get(a), y=get(b); if(blank(x)&&blank(y)) return 0; if(blank(x)) return 1; if(blank(y)) return -1;   // blanks always last
    return (typeof x==="number"&&typeof y==="number" ? x-y : String(x).localeCompare(String(y)))*dir; });
}
const errText = r => (r.msg||"Something went wrong. Try again.") + (r.requestId ? ` S&P reference: ${r.requestId}.` : "");
/* A problem (red, with Try again) or a calm "not set up yet" state, depending on what the function said. */
function problemHTML(r, lead, retryAct){
  if(r.err==="not_configured") return `<div class="info" role="status"><span>${esc(errText(r))}</span></div>`;
  return `<div class="banner" role="alert"><span><b>${esc(lead)}</b> ${esc(errText(r))}</span>${retryAct?`<button class="btn sm" data-act="${retryAct}">Try again</button>`:""}</div>`;
}

/* ---------- calling the Supabase Edge Functions ---------- */
/* Returns {data} on success, {res} for a raw answer (documents), or {err, msg, status, requestId}. */
async function callFn(fn, payload, opts){
  let session=null;
  if(CF_SIGNON) session=await cfSessionNow(); else
  try{ ({data:{session}}=await S.sb.auth.getSession()); }catch{}
  if(!session){ sessionEnded("Your session ended. Sign in again."); return {err:"signin", msg:"Your session ended. Sign in again.", status:401}; }
  let res;
  try{
    res=await (CF_SIGNON?cfFetch:fetch)(CFG.supabaseUrl+"/functions/v1/"+fn, {method:"POST",
      headers:{"Content-Type":"application/json","Authorization":"Bearer "+session.access_token,"apikey":CFG.supabaseAnonKey}, body:JSON.stringify(payload)});
  }catch{ return {err:"network", msg:`Couldn't reach ${FN[fn]}. Check your connection and try again.`, status:0}; }
  if(res.ok && opts && opts.raw) return {res, status:res.status};
  let body=null; try{ body=await res.json(); }catch{}
  if(res.status===401){ const msg=(body&&body.message)||"Sign in again."; sessionEnded(msg); return {err:"signin", msg, status:401}; }
  if(bsStopped(res, body)) return bsStoppedAnswer(res, body);   // Supabase stopped the function (memory or CPU): searches in parts, below
  if(res.status===404 && !(body&&body.message)) return {err:"not_deployed", status:404,
    msg: isCorpDev() ? `${FN[fn][0].toUpperCase()+FN[fn].slice(1)} isn't deployed yet. Run: supabase functions deploy ${fn} --no-verify-jwt (see the README).` : "This part of the site isn't set up yet. Ask Corp Dev."};
  if(!res.ok) return {err:(body&&body.error)||("http_"+res.status), msg:(body&&body.message)||`${FN[fn][0].toUpperCase()+FN[fn].slice(1)} answered ${res.status}. Try again in a minute.`, status:res.status, requestId:body&&body.requestId};
  return {data:body||{}, status:res.status};
}

/* ---------- status strip ---------- */
async function loadStatus(){
  const r=await callFn("snl-filings",{action:"status"});
  if(!S.session) return;
  if(r.data){ S.status=r.data; S.statusErr=""; if(ROLES[r.data.role]) S.session.role=r.data.role; }
  else if(r.err!=="signin") S.statusErr=errText(r);
  render();
}
/* Search, reference and statutory answers carry the latest request counts: keep the strip in step with them. */
function takeUsage(b){
  if(!b || !b.used || !b.limits) return;
  S.status=S.status||{}; S.status.filings={...(S.status.filings||{}), used:b.used, limits:b.limits, ...(b.account?{account:b.account}:{})};
}
function stripHTML(){
  const st=S.status;
  if(!st) return S.statusErr ? `<span class="s-i">Couldn't check S&amp;P usage. ${esc(S.statusErr)} <button class="lnk" data-act="status-retry">Try again</button></span>` : `<span class="s-i">Checking S&amp;P usage…</span>`;
  const f=st.filings||{}, u=f.used||{}, l=f.limits||{}, rf=st.refreshed||{}, items=[];
  if(f.configured===false) items.push(`<span class="s-i" id="s_setup"><b>S&amp;P filings:</b> not set up yet</span>`);
  const over = (isNum(u.hour)&&isNum(l.hour)&&+u.hour>=+l.hour) ? "this hour's limit is reached; wait for the next hour" : (isNum(u.day)&&isNum(l.day)&&+u.day>=+l.day) ? "today's limit is reached; try again tomorrow" : "";
  items.push(`<span class="s-i${over?" warn":""}" id="s_usage"><b>S&amp;P requests:</b> ${count(u.hour)} of ${count(l.hour)} this hour, ${count(u.day)} of ${count(l.day)} today${f.account?` (${esc(f.account)} account)`:""}${over?`. ${over[0].toUpperCase()+over.slice(1)}.`:""}</span>`);
  items.push(`<span class="s-i" id="s_ref">${rf.reference?`Reference lists refreshed ${fmtAt(rf.reference)}`:"Reference lists: not loaded yet"}</span>`);
  items.push(`<span class="s-i" id="s_search">${rf.search?`Last search ${fmtAt(rf.search)}`:"No searches yet"}</span>`);
  items.push(`<span class="s-i" id="s_stat">${st.statutory&&st.statutory.configured ? (rf.statutory?`Statutory data refreshed ${fmtAt(rf.statutory)}`:"Statutory data: connected, nothing fetched yet") : "Statutory data: not set up yet"}</span>`);
  if(st.claude && st.claude.configured===false) items.push(`<span class="s-i" id="s_claude">Questions: not set up yet</span>`);
  items.push(connButtonHTML());
  if(isCorpDev()) items.push(liveButtonHTML());
  return items.join("");
}

/* ---------- S&P connection check: signs in, checks the entitlement and loads the four lists, then says what happened ---------- */
function connButtonHTML(){
  const busy=!!(S.conn&&S.conn.busy);
  return `<span class="s-conn" id="s_conn"><button type="button" class="lnk" id="connBtn" data-act="conn-check" ${busy?"disabled":""} title="Signs in to S&amp;P and loads the four lists, to show whether the S&amp;P connection works (at most five S&amp;P requests)">${busy?"Checking S&amp;P connection…":"Check S&amp;P connection"}</button></span>`;
}
async function runConnCheck(){
  if(S.conn&&S.conn.busy) return;
  S.conn={busy:true}; render();
  const r=await callFn("snl-filings",{action:"check"});
  if(!S.session) return;
  if(r.data){
    S.conn={report:r.data, focus:true}; takeUsage(r.data);
    if(r.data.configured){ loadStatus(); if((r.data.steps||[]).some(s=>s.ok&&(s.id==="states"||s.id==="lists"))){ S.refs=null; if(S.view==="filings") loadRefs(false); } }
  } else if(r.err!=="signin") S.conn={err:errText(r), focus:true};
  render();
}
// for the email to S&P: the full date and the time in UTC, since it is read somewhere else and later
const connAt = s => { const d=new Date(s); return isNaN(d) ? "n/d" : `${d.toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric",timeZone:"UTC"})}, ${d.toISOString().slice(11,16)} UTC`; };
const connRef = s => s.requestId && !String(s.detail||"").includes(s.requestId) ? ` S&P reference: ${s.requestId}.` : "";
/* A short plain-text version for an email to S&P support. */
function connText(r){
  const lines=["S&P API connection check (SNL lookup)", `Checked: ${connAt(r.checkedAt)}`,
    "Product: SNL Insurance Product Filings, Physical Documents API (docType INSPRODFILINGS_DOCUMENTS_API)",
    `Account: ${r.account||"n/d"} (${count(r.limits&&r.limits.hour)} requests an hour, ${count(r.limits&&r.limits.day)} a day)`,
    `Result: ${r.summary}`, ""];
  (r.steps||[]).forEach((s,i)=>lines.push(`${i+1}. ${s.ok?"Done":"Failed"}: ${s.title}. ${s.detail}${connRef(s)}`));
  return lines.join("\n");
}
function connHTML(){
  const c=S.conn; if(!c||c.busy) return "";

/* ---------- Live check (Corp Dev only): looks at real S&P answers and reports only their shapes and counts, so the
   report can be sent to whoever maintains the app without sending S&P's data ---------- */
const LIVE_GROUPS=[["signin","Signing in"],["lists","Reference lists"],["search","Search results"],["document","A filing document"],["directory","Company list"]];
const LIVE_MARK={holds:["ok","As the app assumes"], differs:["no","Differs"], unknown:["unk","Couldn't tell"], info:["rec","For the record"]};
function liveButtonHTML(){
  const busy=!!(S.live&&S.live.busy);

}
async function runLiveCheck(){

/* The verdict, shown when it adds to the mark ("Differs: ..." says what to change; "As the app assumes." doesn't). */
const liveVerdict = f => (!f.verdict || f.verdict==="As the app assumes." || f.verdict==="For the record." || f.verdict==="Couldn't tell." || f.verdict==="Differs.") ? "" : f.verdict;
/* The plain-text report for whoever maintains the app. It carries only what the function sent: no S&P data. */
function liveText(r){
  const lines=["Live check of S&P answers (SNL lookup)", `Ran: ${connAt(r.ranAt)}`,
    `Account: ${r.account||"n/d"} (${count(r.limits&&r.limits.hour)} requests an hour, ${count(r.limits&&r.limits.day)} a day). S&P requests used: ${count(r.requests)} of at most ${count(r.maxRequests)}. Took ${plural(r.seconds,"second")}.`,
    `Result: ${r.summary}`];
  if(r.stopped && r.stopped!==r.summary) lines.push(`Stopped: ${r.stopped}`);
  lines.push(r.basis||"", "This report holds no S&P data: only column names, value types, counts, shares and patterns.");
  for(const [g,label] of LIVE_GROUPS){
    const fs=(r.findings||[]).filter(f=>f.group===g); if(!fs.length) continue;
    lines.push("", label+":");
    for(const f of fs){ const v=liveVerdict(f); lines.push(`- ${(LIVE_MARK[f.outcome]||LIVE_MARK.unknown)[1]}: ${f.title}. ${f.found}${v?" "+v:""}`, `  Code: ${f.where}`); }
  }
  if((r.columns||[]).length){ lines.push("", "Value types of every result column:"); for(const c of r.columns) lines.push(`- ${c.name}: filled ${c.filled}. ${c.shapes}`); }
  if((r.notCovered||[]).length){ lines.push("", "Not checked, on purpose:"); for(const n of r.notCovered) lines.push(`- ${n}`); }
  return lines.join("\n");
}

    ${c.showText?`<label class="f">Select this and copy it for whoever maintains the app<textarea id="liveText" readonly>${esc(liveText(r))}</textarea></label>`:""}
    <div class="inline"><button type="button" class="btn sm" data-act="live-copy">Copy for developer</button><button type="button" class="btn sm ghost" data-act="live-check">Run again</button>${close}</div>
  </div></div></div>`;

  else if(r.err!=="signin"){ S.refs=S.refs||{}; S.refsErr=errText(r); }

const refOptions = field => { const l=S.refs&&S.refs[field]; return l&&Array.isArray(l.options) ? l.options.filter(o=>o&&!blank(o.id)) : []; };
/* States: S&P's own list when it is loaded and uses two-letter codes, otherwise the built-in list. */

/* The map beside the state list: a click on a state does what its button in the list does. The list is the control
   for keyboards and screen readers, so the map is hidden from them. A state S&P's list doesn't have is drawn pale

function trackingList(){ return [...new Set(S.f.tracking.split(/[,\n;]+/).map(s=>s.trim()).filter(Boolean))]; }
function searchProblem(){
  const f=S.f;

  if(f.chips.length>MAX_COMPANIES) return `Search at most ${MAX_COMPANIES} companies at a time.`;
  if(!f.states.length) return "Choose at least one state.";
  const a=/^\d{4}-\d{2}-\d{2}$/.test(f.from)?parseDay(f.from):null, b=/^\d{4}-\d{2}-\d{2}$/.test(f.to)?parseDay(f.to):null;
  if(!a || !b) return "Choose a start date and an end date.";
  if(a>b) return "The start date is after the end date.";
  if(b-a > MAX_YEARS*366*DAY) return `Search at most ${MAX_YEARS} years at a time.`;
  const tn=trackingList();
  if(tn.length>20 || tn.some(t=>!/^[A-Za-z0-9 ._\/-]{1,60}$/.test(t))) return "Tracking numbers can use letters, numbers, spaces, dots, dashes and slashes. Separate up to 20 with commas.";
  return "";
}
function searchPayload(){
  const f=S.f, ids=k=>f.chips.filter(c=>c.kind===k).map(c=>Number(c.id));
  const p={action:"search", companyIds:ids("companyId"), institutionIds:ids("institutionId"), states:[...f.states].sort(), from:f.from, to:f.to};
  // a filter is only sent when S&P's list for it is loaded and something in it is ticked
  const add=(key, ticked, field)=>{ const have=refOptions(field).map(o=>String(o.id)); const v=ticked.filter(id=>have.includes(id)).map(Number).filter(Number.isInteger); if(v.length) p[key]=v; };
  add("filingStatusIds", f.fstatus, "filingStatus"); add("typeOfInsuranceIds", f.toi, "typeOfInsurance"); add("filingTypeIds", f.ftype, "serffFilingType");
  const tn=trackingList(); if(tn.length) p.trackingNumbers=tn;

/* S&P takes 10 companies and 365 days a request, so a search costs one request for each batch and year. */
function estimateText(){

}

/* What the estimate says when a search is too wide for one search, with what would fit. */
function tooWideText(req, windows, perYear, n){

  return `About ${plural(req,"S&P request")}: more than the ${MAX_SEARCH_REQUESTS} one search may use, so S&P won't be asked. Choose fewer years or fewer companies: ${[dates, cos].filter(Boolean).join("; ")}.`;

async function runSearch(refresh, given, resumeIt){
  const f=S.f; if(f.busy) return;
  let payload;
  if(resumeIt){ if(!f.last || !f.resume) return; payload={...f.last}; delete payload.refresh; }   // carry on a search that stopped part-way
  else if(refresh){ if(!f.last) return; payload={...f.last, refresh:true}; }
  else if(given){ payload=given; f.last=payload; f.res=null; }   // a recent search, sent exactly as it was saved
  else{
    const problem=searchProblem();
    if(problem){ f.formErr=problem; render(); document.getElementById("formErr")?.scrollIntoView({block:"nearest"}); return; }
    payload=searchPayload(); f.last=payload; f.res=null;
  }
  if(unlistedOn()) payload.unlisted=true; else delete payload.unlisted;   // kept out of Recent searches, or not, as the tick says now
  f.formErr=""; f.busy=true; f.err=null;
  // a wide search comes in parts (searchParts): progress shows as they arrive, and Stop keeps what has arrived
  const ctl=bsControl(), resume=resumeIt?f.resume:null; f.ctl=ctl; f.prog=resume?bsProgress(resume):null; f.resume=null; f.carrying=!!resume; render();
  const r=await searchParts(payload, {ctl, resume, onPart:p=>{ if(f.ctl===ctl){ f.prog=p; render(); } }});
  if(f.ctl!==ctl) return;   // a newer search took over
  f.busy=false; f.ctl=null; f.prog=null; f.carrying=false;
  if(!S.session) return;
  if(r.err==="stopped"){ toast("Search stopped. Nothing had come back yet."); render(); return; }
  if(r.data){
    f.res=r.data; f.resume=r.resume||null; f.shown=PAGE; f.filter=""; f.openDesc={}; f.openCo={}; takeUsage(r.data);

/* ---------- Searches in parts (big-searches) ----------
   One call to the filings function holds at most 2,000 filings (STEP_ROWS in _shared/filings.ts), so a wider search
   comes in parts: the first answer says there is more and gives a cursor, and the page asks for each next part with
   the same search and that cursor, one at a time. The parts are put together here: each filing version once (a filing
   named again in a later part adds its companies), then newest first, as the function sorts a search done in one
   piece. Each part's answer carries the whole search's counts so far and the last one its notes, so the result reads
   as one search. A part that fails is asked for once more; Stop keeps what has arrived. A part that comes back empty
   is just a part. Every view that searches filings goes through searchParts. */
const BS_TOO_BIG = "This search was too big for the site to run in one go. Narrow the dates, states or companies, or try again.";
const BS_RETRY_MS = 1500;
/* Supabase's own answer when it stops a function for using too much memory or CPU: status 546, code WORKER_LIMIT or
   WORKER_RESOURCE_LIMIT (Supabase's documentation, "Status codes" and "Error codes", Nov 2026). */
function bsStopped(res, body){
  const code=String((body&&body.code)||res.headers.get("sb-error-code")||"");
  return res.status===546 || /^WORKER(_RESOURCE)?_LIMIT$/.test(code);

/* UNCONFIRMED: which request id the platform's answer carries that a browser may read. The sb-request-id header is read
   when it is there (and exposed), then a request id in the body; with none, the message goes without one. */
function bsStoppedAnswer(res, body){
  const id=String(res.headers.get("sb-request-id")||res.headers.get("x-request-id")||(body&&(body.request_id||body.requestId||body.id))||"").replace(/[^\w.:-]/g,"").slice(0,80);

}
const bsKey = r => r.filingVersionId!==null&&r.filingVersionId!==undefined ? "v:"+r.filingVersionId : r.serffFilingEntityEventId!==null&&r.serffFilingEntityEventId!==undefined ? "e:"+r.serffFilingEntityEventId : "j:"+JSON.stringify(r);

    const k=bsKey(r), kept=acc.by.get(k), cos=Array.isArray(r.companies)?r.companies:[];
    if(!kept){ const c={...r, companies:[...cos]}; acc.by.set(k,c); acc.rows.push(c); continue; }
    for(const c of cos) if(c && !kept.companies.some(x=>x && String(x.companyId)===String(c.companyId) && x.companyName===c.companyName)) kept.companies.push(c);
  }
}
const bsNewest = (a,b) => String(b.publishDate??"").localeCompare(String(a.publishDate??""));
// a failed part is asked for once more when it may go through the second time: no answer, or a fault on the far side
const bsRetryable = e => e.status===0 || (e.status>=500 && e.err!=="not_configured");
function bsControl(){ const c={stopped:false}; c.wait=new Promise(res=>{ c.stop=()=>{ c.stopped=true; res({err:"stopped"}); }; }); return c; }
/* Where a search in parts has got to: parts in, how many there are (exact once known), filings so far. */
function bsProgress(st){
  const d=st.last||{}, exact=isNum(d.parts), of=exact?+d.parts:isNum(d.partsAbout)?+d.partsAbout:null;
  return {done:isNum(d.part)?+d.part:0, of, exact, filings:st.acc.rows.length, fromStore:d.fromStore===true};
}
function bsProgText(p){
  if(!p || !p.done || !p.of || p.of<2) return "";

}
function bsProgHTML(p){ const t=bsProgText(p); return t?` <span class="bsprog" id="bsProg">${esc(t)}</span>`:""; }
// one part is the function's own answer, kept exactly as sent; several are put together
function bsResult(st){ return {...st.last, rows:st.n>1 ? st.acc.rows.slice().sort(bsNewest) : st.last.rows, more:false, cursor:null}; }
/* Runs a search, in as many parts as it comes in. Returns what callFn returns for one search ({data} or {err, msg,
   ...}), with data holding every part. When it can't finish (stopped, or a part failed twice) data is what arrived,
   marked capped and incomplete (incomplete.text says why, also first in its notes), and resume carries on from there.
   o.ctl: from bsControl, to stop; o.onPart(progress) after each part; o.resume: a resume from an earlier answer. */
async function searchParts(payload, o={}){
  const ctl=o.ctl||{}, base={...payload}; delete base.cursor;

  let tries=0;

    if(ctl.stopped) return bsIncomplete(st, {why:"stopped"});
    const body=st.cursor ? {...base, cursor:st.cursor} : base;
    if(st.cursor) delete body.refresh;   // only the first call asks S&P afresh; the rest carry on from the cursor
    const r=await Promise.race([callFn("snl-filings", body), ctl.wait||new Promise(()=>{})]);
    if(ctl.stopped) return bsIncomplete(st, {why:"stopped"});

    : `Part ${count(p.done+1)}${of?` of ${of}`:""} couldn't be fetched, so these results are incomplete. ${errText(inc.err)}`;

  return {data:{...d, capped:true, saved:false, incomplete:{why:inc.why, text}, notes:[text, ...(!st.last.more && Array.isArray(d.notes)?d.notes:[])]}, status:200,

/* What a saved search was, in plain words: who, then where, when, which filters, what came back and when. */

    const names=ids.map(id=>{ const o=refOptions(field).find(x=>String(x.id)===String(id)); return o&&!blank(o.name) ? String(o.name) : `id ${id}`; });
    return `${ids.length===1?one:many}: ${andList(names, 3)}`; };

/* ---------- Filings: the watchlist ----------

   The snl-watch function checks it every day and says what it found (status), or checks now (run). */
const WATCH_BUDGET = 30, WATCH_SHOWN = 5, WATCH_CHIPS = 12, WATCH_MAX_RECIPIENTS = 10;
function freshWatch(){ return {loaded:false, loading:false, doc:null, problems:[], readErr:"", status:null, statusErr:null, checking:false, saving:false, saveErr:"", recips:null, manage:false, showAll:false, allCos:false, runNote:null, onlyMarked:false}; }

function cleanWatch(raw){

  const name=v=>(typeof v==="string"||typeof v==="number"?String(v):"").replace(/[\u0000-\u001f\u007f-\u009f\u200b-\u200f\u2028-\u202e\u2060-\u206f\ufeff]+/g," ").replace(/\s+/g," ").trim().slice(0,120);
  const companies=[];
  for(const c of arr(d.companies)){
    const o=c&&typeof c==="object"?c:{}, id=typeof o.id==="number"&&Number.isInteger(o.id)&&o.id>=0?String(o.id):typeof o.id==="string"?o.id.trim():"";
    if(!["companyId","institutionId"].includes(o.kind) || !/^\d{1,12}$/.test(id)){ problems.push("company"); continue; }
    const nid=String(Number(id)); if(!companies.some(x=>x.kind===o.kind&&x.id===nid)) companies.push({kind:o.kind, id:nid, name:name(o.name)});
  }

  const recipients=[]; for(const r of arr(d.recipients)){ const v=typeof r==="string"?r.trim().toLowerCase():""; if(!isEmailAddr(v)){ problems.push("email"); continue; } if(!recipients.includes(v)) recipients.push(v); }

}

  w.saving=false;
  if(error){ w.saveErr = /42501|row-level security|permission/i.test(`${error.code||""} ${error.message||""}`) ? "Only Corp Dev logins can change the watchlist." : "Couldn't save the watchlist: "+(error.message||"unknown error")+". Nothing was changed."; render(); return; }

    h+=`<div class="wlist" id="wCos"><b>Companies (${count(list.companies.length)})</b><div class="chips">${cos.map(c=>`<span class="cchip"><b>${esc(label(c))}</b>${w.manage&&cd?`<button type="button" data-act="w-co-remove" data-k="${esc(c.kind+":"+c.id)}" aria-label="Stop watching ${esc(label(c))}" ${w.saving?"disabled":""}>×</button>`:""}</span>`).join("")}
      ${list.companies.length>WATCH_CHIPS?`<button type="button" class="lnk t2" data-act="w-more">${w.allCos?"Show fewer":`and ${count(list.companies.length-WATCH_CHIPS)} more`}</button>`:""}</div></div>
      <div class="wlist" id="wStates"><b>States (${count(list.states.length)})</b><div class="chips">${list.states.map(s=>`<span class="cchip"><b>${esc(s)}</b>${w.manage&&cd?`<button type="button" data-act="w-st-remove" data-s="${esc(s)}" aria-label="Stop watching ${esc(s)}" ${w.saving?"disabled":""}>×</button>`:""}</span>`).join("")}</div></div>
      ${list.typeOfInsuranceIds.length||list.filingTypeIds.length?`<p class="t2" id="wFilters">Only ${[list.typeOfInsuranceIds.length?plural(list.typeOfInsuranceIds.length,"type of insurance","types of insurance"):"", list.filingTypeIds.length?plural(list.filingTypeIds.length,"filing type"):""].filter(Boolean).join(" and ")} chosen in S&amp;P's lists.</p>`:""}`;
  }
  const problems=(st&&Array.isArray(st.problems)&&st.problems.length?st.problems:w.problems.length?["Some entries in the saved watchlist couldn't be used and are left out."]:[]);
  if(problems.length && !empty) h+=`<div class="notes" id="wProblems" role="status"><b>Part of the saved watchlist can't be used</b><ul>${problems.map(p=>`<li>${esc(p)}</li>`).join("")}</ul></div>`;
  if(w.statusErr){ const e=w.statusErr;
    h+= e.err==="not_deployed" ? `<div class="info" id="wNoFn" role="status"><span>${cd?`<b>The daily check isn't set up yet: the watchlist function isn't deployed.</b> Do steps 1 to 3 of the README's Watchlist section: run migration 0003, set WATCH_SECRET, then run: supabase functions deploy snl-watch --no-verify-jwt. After that, this card shows the last check and Check now works. You can choose what to watch already.`:"<b>The daily check isn't set up yet.</b> Corp Dev can set it up; what is watched still shows here."}</span></div>`
      : e.err==="no_tables" ? `<div class="info" id="wNoTables" role="status"><span>${cd?`<b>The daily check isn't set up yet.</b> ${esc(e.msg||"")}`:"<b>The daily check isn't set up yet.</b> Corp Dev can set it up; what is watched still shows here."}</span></div>`
      : problemHTML(e, "Couldn't get the last check.", "w-retry"); }
  else if(st){
    if(st.configured===false && !empty) h+=`<div class="info" id="wNotSetUp" role="status"><span><b>Checks start once S&amp;P API access is set up.</b> The watchlist is kept until then.</span></div>`;
    else if(!empty && list.enabled && st.scheduleReady===false) h+=`<div class="info" id="wNoSchedule" role="status"><span><b>Daily checks aren't set up yet, so the list is checked only when ${cd?"you click":"Corp Dev clicks"} Check now.</b>${cd?" Missing: WATCH_SECRET on Supabase (README, Watchlist, step 2), then the daily schedule (step 4, supabase/watch_schedule.sql). After both, a check runs by itself every day.":""}</span></div>`;
    else if(!empty && list.enabled && st.scheduleQuiet===true && cd) h+=`<div class="info" id="wQuiet" role="status"><span><b>No daily check has run ${st.lastScheduled?`since ${esc(whenAt(st.lastScheduled))}`:"yet"}.</b> If step 4 of the README's Watchlist section (supabase/watch_schedule.sql) is done, the next one runs at the time set there (06:23 UTC unless you changed it). If not, run that file in the Supabase SQL editor.</span></div>`;
    if(st.tooBig && !empty) h+=`<div class="banner" id="wTooBig" role="alert"><span>${esc(st.tooBig)}</span></div>`;
    else if(st.lastRun && st.lastRun.status==="failed" && !running) h+=`<div class="banner" id="wFailed" role="alert"><span><b>The last check, on ${esc(whenAt(st.lastRun.started_at))}, failed.</b> ${esc(st.lastRun.message||"No reason was recorded.")}</span></div>`;
    if(!empty && !list.enabled) h+=`<div class="info" id="wOff" role="status"><span><b>Switched off.</b> ${cd?"Switch it on under Manage to check every day.":"Corp Dev can switch it on."}</span></div>`;
    if(!empty || (st.found&&st.found.length)) h+=watchFoundHTML(st);
  }
  if(cd && !empty && !(w.statusErr&&["not_deployed","no_tables"].includes(w.statusErr.err))) h+=`<div class="toolbar"><button type="button" class="btn sm primary" data-act="w-check" id="wCheck" ${running||w.saving?"disabled":""}>${w.checking?"Checking…":"Check now"}</button><span class="t2 grow">Uses a few S&amp;P requests. The daily check runs by itself once it is set up.</span></div>`;
  if(w.saveErr) h+=`<p class="err" id="wErr" role="alert">${esc(w.saveErr)}</p>`;
  if(cd && w.manage) h+=watchManageHTML(list, st, empty);
  return h+`</section>`;
}

/* ---------- documents: fetched once with the login, then opened from memory ---------- */
function docName(disposition, key, type){
  const m=/filename\*=(?:UTF-8'')?([^;]+)/i.exec(disposition||"") || /filename="?([^";]+)"?/i.exec(disposition||"");
  let n=""; if(m){ try{ n=decodeURIComponent(m[1].trim().replace(/^"|"$/g,"")); }catch{ n=m[1]; } }
  n=n.replace(/[^\w .()-]+/g,"_").replace(/^[. ]+/,"").slice(0,120);
  const ext={"application/pdf":"pdf","application/zip":"zip","text/plain":"txt","text/html":"html","application/msword":"doc","application/vnd.openxmlformats-officedocument.wordprocessingml.document":"docx","application/vnd.ms-excel":"xls","application/vnd.openxmlformats-officedocument.spreadsheetml.sheet":"xlsx"}[type]||"bin";
  return n || `snl-document-${key.slice(2).replace(/[^\w-]+/g,"_")}.${ext}`;
}
function showDoc(d, page, w){
  if(d.type==="application/pdf"){
    const url=d.url+(page?`#page=${page}`:"");
    if(w && !w.closed){ w.location.href=url; return; }
    const nw=window.open(url,"_blank");
    if(!nw) toast("Your browser blocked the new tab. Allow pop-ups for this site, then click again.");
  } else {
    if(w){ try{ w.close(); }catch{} }
    download(d.url, d.name);
    toast(`This document isn't a PDF, so it was saved to your downloads as ${d.name}.`);
  }
}
async function openDoc(key, page){
  if(!key) return;
  page = /^\d{1,5}$/.test(String(page||"")) && +page>0 ? +page : 0;
  const d=S.docs[key]||(S.docs[key]={});
  if(d.busy) return;
  if(d.url){ showDoc(d, page, null); return; }   // already fetched this session: no second S&P request
  // Open the tab now, while the click still counts, so the pop-up blocker lets it through; point it at the document later.
  let w=null;
  try{ w=window.open("","_blank"); if(w){ try{ w.opener=null; }catch{} try{ w.document.title="Opening the document…"; w.document.body.textContent="Opening the document from S&P…"; }catch{} } }catch{}
  d.busy=true; d.err=""; render();
  const r=await callFn("snl-filings", key.startsWith("d:") ? {action:"document", documentId:Number(key.slice(2))} : {action:"document", filingVersionId:key.slice(2)}, {raw:true});
  let blob=null;
  if(r.res){ try{ blob=await r.res.blob(); }catch{} }
  d.busy=false;
  if(!blob){
    if(w){ try{ w.close(); }catch{} }
    if(r.err!=="signin") d.err = r.res ? "The document didn't download fully. Try again." : errText(r);
    if(S.session) render(); return;
  }
  d.type=(r.res.headers.get("Content-Type")||"application/octet-stream").split(";")[0].trim().toLowerCase();
  d.name=docName(r.res.headers.get("Content-Disposition"), key, d.type);
  d.url=URL.createObjectURL(d.type==="application/pdf" ? blob.slice(0, blob.size, "application/pdf") : blob);
  showDoc(d, page, w); render(); loadStatus();
}

/* ---------- filing summaries: a Summary control on each filings row, its drawer, and Search saved summaries ----------
   The snl-digest function keeps what Claude found when it read a filing (Contract B in the build notes), so the filing
   needn't be read again. "get" and "search" cost nothing; "make" reads the front of the document (1 S&P request and one
   request to Claude) and counts as one of the login's questions. Everything in a summary came from a filing or from
   Claude: it all goes through esc(). */
FN["snl-digest"]="the summaries function";
const DG_PAGES=150;                       // pages one summary rests on: the first 150 of a longer filing
const DG_TOKENS_PER_PAGE=4000;            // Anthropic counts about 3,100 to 4,600 tokens a page, text and image
const DG_USD_PER_MTOK_IN=4, DG_OUT_USD=0.12;   // Claude Opus 5.5 list price for reading, and about 6,000 tokens written
const DG_WHERE={"form number":"Form number","form title":"Form title","program":"Program","summary":"Summary","notable":"Notable point"};
function freshDigests(){ return {known:{}, asked:{}, off:"", dr:null, find:{open:false, q:"", state:"", busy:false, res:null, err:null, asked:null}, last:""}; }
const dgOf = () => S.dg || (S.dg=freshDigests());
const dgKeyOfDigest = d => d ? docKeyOf({documentId:d.documentId, filingVersionId:d.filingVersionId}) : "";
const dgName = d => !blank(d&&d.filingNo) ? String(d.filingNo) : d&&!blank(d.documentId) ? `document ${d.documentId}` : "this filing";
function dgReadText(read, of){
  const r=(Array.isArray(read)?read:[]).filter(x=>x&&isNum(x.from)&&isNum(x.to));
  if(!r.length) return "pages n/d";
  const parts=r.map(x=>+x.from===+x.to?count(x.from):`${count(x.from)} to ${count(x.to)}`);
  const list=parts.length===1?parts[0]:`${parts.slice(0,-1).join(", ")} and ${parts[parts.length-1]}`;
  return `${r.length===1&&+r[0].from===+r[0].to?"page":"pages"} ${list}${isNum(of)?` of ${count(of)}`:""}`;
}
const dgReadAll = d => { const r=Array.isArray(d.read)?d.read:[]; return isNum(d.pages) && r.length===1 && +r[0].from===1 && +r[0].to>=+d.pages; };
/* What making a summary of this row costs, from its page count: the pages Claude reads, at list price. */
function dgCost(r){
  const known=isNum(r&&r.pages) && +r.pages>0, pages=known ? Math.min(+r.pages, DG_PAGES) : DG_PAGES;
  const usd=pages*DG_TOKENS_PER_PAGE*DG_USD_PER_MTOK_IN/1e6 + DG_OUT_USD;
  const what = !known ? `up to its first ${DG_PAGES} pages (its page count is n/d)` : +r.pages>DG_PAGES ? `its first ${DG_PAGES} of ${count(r.pages)} pages` : `all ${plural(pages,"page")}`;
  return `Summarising reads ${what} with Claude. It uses 1 S&amp;P request and ${known?"":"up to "}${costText(usd)} of Claude's time (about ${count(pages*DG_TOKENS_PER_PAGE)} tokens at list price), and counts as one of your questions today. The summary is then saved for everyone, so nobody pays to read these pages again.`;
}
/* Saved summaries of the rows on screen, asked for once each: the button shows which have one. Free. */
async function dgPrefetch(){
  const g=dgOf(); if(g.off || !S.session || S.view!=="filings" || !S.f.res) return;
  const keys=visibleRows().slice(0,S.f.shown).map(x=>docKeyOf(x.r)).filter(k=>k && !(k in g.asked)).slice(0,50);
  if(!keys.length) return;
  for(const k of keys) g.asked[k]=true;
  const r=await callFn("snl-digest", {action:"get", filings:keys.map(k=>k.startsWith("d:")?{documentId:Number(k.slice(2))}:{filingVersionId:k.slice(2)})});
  if(!S.session) return;
  if(r.err){ if(r.err==="not_deployed"||r.err==="no_tables") g.off=r.err; return; }   // the Summary button still opens and says what is missing
  for(const k of keys) if(!(k in g.known)) g.known[k]=null;
  for(const d of Array.isArray(r.data.digests)?r.data.digests:[]){ const k=dgKeyOfDigest(d); if(k) g.known[k]=d; if(!blank(d.documentId)) g.known["d:"+d.documentId]=d; if(!blank(d.filingVersionId)) g.known["v:"+d.filingVersionId]=d; }
  render();
}
/* The Summary control under a row's document button. */
function dgRowHTML(r, key){

  return `<div class="dg-cell"><button type="button" class="btn sm" data-act="dg-open" data-doc="${esc(key)}" aria-haspopup="dialog">Summary</button>${d?`<span class="t2">Saved ${esc(fmtAt(d.madeAt))}</span>`:""}</div>`;
}
function dgRowOf(key){ return ((S.f.res&&Array.isArray(S.f.res.rows))?S.f.res.rows:[]).find(r=>docKeyOf(r)===key) || null; }
/* A search row from a saved summary, for making it again from the search results. */
function dgRowFromDigest(d){
  const no=String(d.filingNo||""), sp=no.startsWith(SP_NO+" ");

}

   tracking number. */
function dgMakeBody(r){
  const sp=filingNo(r);
  return {documentId:r.documentId??null, filingVersionId:r.filingVersionId??null, filingNo:filingNoText(r)||null, sfcNumber:sp&&sp.kind==="sp"?sp.value:(blank(r.sfcNumber)?null:r.sfcNumber),
    companies:companiesOf(r).map(c=>({companyId:c.companyId??null, companyName:c.companyName??null, institutionId:c.institutionId??null})),
    serffFilingStateId:r.serffFilingStateId??null, typeOfInsurance:r.typeOfInsurance??null, serffFilingType:r.serffFilingType??null, filingStatus:r.filingStatus??null, publishDate:r.publishDate??null, pages:r.pages??null};
}
async function dgOpen(key, opener, digest){
  const g=dgOf(), row=dgRowOf(key) || (digest?dgRowFromDigest(digest):null);
  g.dr={key, row, digest:digest||g.known[key]||null, loading:false, err:null, making:false, confirm:false, made:null, opener};

/* Closes the drawer and puts the cursor back on the Summary button that opened it (rebuilt meanwhile, so found again). */
function dgClose(){

async function dgMake(){
  const g=dgOf(), dr=g.dr; if(!dr || dr.making || !dr.row) return;
  dr.making=true; dr.err=null; dr.confirm=false; render();
  const r=await callFn("snl-digest", {action:"make", filing:dgMakeBody(dr.row), refresh:!!dr.digest});
  if(g.dr!==dr) return;
  dr.making=false;
  if(r.err){ if(r.err!=="signin") dr.err=r; }
  else if(r.data.digest){ dr.digest=r.data.digest; dr.made={usage:r.data.usage||null, fromStore:!!r.data.fromStore, note:r.data.note||""}; g.known[dr.key]=r.data.digest; S.chatUseAt=0; loadStatus(); }
  render(); document.getElementById("dgClose")?.focus({preventScroll:true});
}

function dgDigestHTML(d, key){

function dgDrawerHTML(){

/* ---------- export: CSV built here, XLSX with SheetJS loaded on the first click ---------- */
function download(url, name){ const a=document.createElement("a"); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove(); }
function saveBlob(blob, name){ const url=URL.createObjectURL(blob); download(url, name); setTimeout(()=>URL.revokeObjectURL(url), 4000); }
/* Every cell quoted; text that a spreadsheet would run as a formula gets a leading apostrophe. */
function csvCell(v){
  if(blank(v)) return '""';
  let s=String(v);
  if(typeof v!=="number" && /^[=+\-@\t\r]/.test(s) && !/^[+-]?[\d.,]+%?$/.test(s)) s="'"+s;
  return `"${s.replace(/"/g,'""')}"`;
}
function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement("script"); s.src=src; s.onload=()=>res(); s.onerror=()=>{ s.remove(); rej(new Error("The script didn't load")); }; document.head.appendChild(s); }); }
async function exportTable(t, fmt){
  if(!t || !t.rows.length){ toast("There is nothing to export yet."); return; }
  if(fmt==="csv"){
    const lines=[t.cols].concat(t.rows).map(r=>r.map(csvCell).join(","));
    saveBlob(new Blob(["﻿"+lines.join("\r\n")],{type:"text/csv;charset=utf-8"}), t.name+".csv"); return;
  }
  try{
    if(!window.XLSX){ toast("Getting the Excel export ready…"); await loadScript(XLSX_SRC); document.getElementById("toastRoot").innerHTML=""; }
    const X=window.XLSX, ws=X.utils.aoa_to_sheet([t.cols].concat(t.rows.map(r=>r.map(v=>blank(v)?"":v)))), wb=X.utils.book_new();
    X.utils.book_append_sheet(wb, ws, String(t.sheet||"Sheet1").replace(/[\[\]:*?\/\\]/g," ").slice(0,31));
    saveBlob(new Blob([X.write(wb,{bookType:"xlsx",type:"array"})],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}), t.name+".xlsx");
  }catch{ toast("Couldn't load the Excel export. Check your connection, or use Export CSV."); }
}

/* ---------- Ask Claude: Claude answers in the background; the page follows the job ---------- */
const activeTurn = () => S.ask.turns.find(t=>!["done","error"].includes(t.status));

/* What Claude is told about the result on screen in the view the reader is on: the search or question that
   produced it and the companies in it, never the rows themselves. Null when no result is on screen. */
function askScreen(){
  const ints=a=>(Array.isArray(a)?a:[]).map(Number).filter(Number.isInteger);
  const names=a=>[...new Set((Array.isArray(a)?a:[]).map(x=>x&&x.name).filter(n=>!blank(n)).map(String))].slice(0,20);
  if(S.view==="filings" && S.f.res){
    const r=S.f.res, p=r.params||S.f.last||{};   // what the function ran, not the form, which may have been edited since
    return {view:"filings",
      search:{companyIds:ints(p.companyIds), institutionIds:ints(p.institutionIds), states:(Array.isArray(p.states)?p.states:[]).map(String), from:String(p.from||""), to:String(p.to||""),
        typeOfInsuranceIds:ints(p.typeOfInsuranceIds), filingTypeIds:ints(p.filingTypeIds), filingStatusIds:p.allStatuses?[]:ints(p.filingStatusIds)},
      total:isNum(r.total)?+r.total:(Array.isArray(r.rows)?r.rows.length:0), companies:names(r.byCompany)};
  }
  if(S.view==="statutory" && S.st.res && S.st.status && S.st.status.configured && S.st.status.mapped){
    const r=S.st.res;
    return {view:"statutory", query:{kind:r.kind==="group"?"group":"company", codes:(Array.isArray(r.codes)?r.codes:[]).map(String), fromYear:+r.fromYear, toYear:+r.toYear}, companies:names(r.entities)};
  }

/* The same thing in one plain line, so what Claude is told is never a surprise. */
function askToldText(sc, past){
  if(!sc) return past ? "" : "Nothing is on screen yet, so Claude starts from your question alone.";
  const list=a=>a.length<2 ? a.join("") : a.slice(0,-1).join(", ")+" and "+a[a.length-1];
  if(sc.view==="filings" && sc.snapshot) return snapToldText(sc, past);
  const lead=past ? "Claude was told what was on screen: " : "Claude will be told what is on screen: ";
  if(sc.view==="filings"){
    const s=sc.search, who=[s.companyIds.length?plural(s.companyIds.length,"company","companies"):"", s.institutionIds.length?plural(s.institutionIds.length,"institution"):""].filter(Boolean);
    return `${lead}${plural(sc.total,"filing")} for ${list(who)||"no companies"} in ${s.states.length>6?plural(s.states.length,"state"):s.states.join(", ")}, ${fmtDay(s.from)} to ${fmtDay(s.to)}.`;
  }
  const q=sc.query;
  return `${lead}statutory figures for NAIC ${q.kind==="group"?(q.codes.length>1?"groups ":"group "):""}${list(q.codes)}, ${q.fromYear===q.toYear?q.fromYear:`${q.fromYear} to ${q.toYear}`}.`;

async function askQuestion(){
  const a=S.ask, q=a.draft.trim();
  if(activeTurn()) return;
  if(chatAtLimit(S.chatUse)) return;
  if(!q){ toast("Type a question first."); return; }
  if(q.length>MAX_QUESTION){ toast(`Keep the question under ${count(MAX_QUESTION)} characters.`); return; }
  // earlier finished answers go along as plain text, so a follow-up question makes sense
  const history=a.turns.filter(t=>t.status==="done"&&t.result).slice(-MAX_HISTORY).map(t=>({question:t.lib?libHistoryQuestion(t.question):t.question, answer:answerText(t.result).slice(0, MAX_HISTORY_ANSWER).trim()})).filter(h=>h.answer);
  const screen=askScreen();
  const t={question:q, told:askToldText(screen, true), status:"starting", progress:[], partial:"", result:null, error:"", calm:false, jobId:null, lastContinue:0, note:"", contNote:""};
  t.asked=new Date().toISOString();   // shown in the exported or copied answer
  a.turns.push(t); a.draft=""; a.scroll="bottom"; renderAsk();
  const r=await callFn("snl-chat",{action:"ask", question:q, ...(history.length?{history}:{}), ...(screen?{screen}:{})});
  if(!S.session || !S.ask.turns.includes(t)) return;
  if(r.data && r.data.jobId){ t.jobId=r.data.jobId; t.status="queued"; schedulePoll(); }
  else if(r.err!=="signin"){
    t.status="error"; t.calm=r.err==="not_configured"; t.error=r.data ? "The question was sent but no answer was started. Try again." : errText(r);
    if(t.calm||r.err==="bad"||r.err==="busy") a.draft=a.draft||q;   // nothing was started: keep the question to send again
    if(r.err==="daily_limit"){ t.calm=true; a.draft=a.draft||q; loadChatUse(); }   // not a fault: the limit is reached; keep the question for later
    if(!a.open) a.unseen="error";
  }
  if(t.jobId && S.chatUse && isNum(S.chatUse.askedToday)) S.chatUse.askedToday=+S.chatUse.askedToday+1;
  renderAsk();
}
function schedulePoll(){
  clearTimeout(S.ask.timer);
  S.ask.timer=setTimeout(async()=>{ S.ask.timer=null; await pollJob(); if(S.session && activeTurn()) schedulePoll(); }, TIMING.poll);
}
async function pollJob(){
  const t=activeTurn(); if(!t || !t.jobId) return;
  let data=null, error=null;
  try{ ({data, error}=await S.sb.from("snl_jobs").select(JOB_COLS).eq("id", t.jobId).maybeSingle()); }catch(e){ error=e; }
  if(!S.session || !S.ask.turns.includes(t)) return;   // signed out or a new conversation meanwhile
  const sig=()=>JSON.stringify([t.status, t.progress.length, t.partial.length, t.note, t.contNote]), before=sig();
  if(error) t.note="Couldn't check on the answer just now. Still trying.";
  else if(data){
    t.note="";
    t.status=["queued","running","paused","done","error"].includes(data.status)?data.status:"running";
    t.progress=Array.isArray(data.progress)?data.progress:[]; t.partial=typeof data.partial==="string"?data.partial:"";
    if(t.status==="done"){ t.result=data.result&&typeof data.result==="object"?data.result:{}; loadStatus(); }
    if(t.status==="error") t.error=data.error||"Claude couldn't finish this answer. Ask again.";
    if(t.status==="done"||t.status==="error") loadChatUse();   // the day's count and cost, now with this answer
    // ended while the panel was closed: mark the button; ended in view: show the answer from its top
    if(t.status==="done"||t.status==="error"){ if(S.ask.open){ S.ask.scroll=S.ask.turns.indexOf(t); markSeen(t.jobId); } else S.ask.unseen=t.status; }
    // The function works in time slices. When it has paused, or has gone quiet, ask it to pick the answer up again.
    const now=Date.now(), quiet=(t.status==="running"||t.status==="queued") && !blank(data.heartbeat_at) && now-Date.parse(data.heartbeat_at)>TIMING.stale;
    if(t.status!=="paused" && !quiet) t.contNote="";
    else if(now-t.lastContinue>=TIMING.again){ t.lastContinue=now; continueJob(t); }
  }
  if(before!==sig()) renderAsk();
}
async function continueJob(t){
  const r=await callFn("snl-chat",{action:"continue", jobId:t.jobId});
  if(r.err==="signin" || !S.ask.turns.includes(t) || ["done","error"].includes(t.status)) return;
  const was=t.contNote; t.contNote = r.err ? `Couldn't pick the answer up again: ${errText(r)} The page will try again shortly.` : "";
  if(was!==t.contNote) renderAsk();
}
function newConversation(){ clearTimeout(S.ask.timer); S.ask={...freshAsk(), open:S.ask.open, wide:S.ask.wide}; renderAsk(); document.getElementById("ask_input")?.focus(); }
function openAsk(){

  if(!S.chatUseAt || Date.now()-S.chatUseAt>60000) loadChatUse();   // where the login stands today, checked at most once a minute
  a.scroll = !a.turns.length ? null : activeTurn() ? "bottom" : a.turns.length-1;   // a running answer at its latest step; a finished one from its top

/* ---------- what answers cost, and the daily limit on questions ---------- */
/* A cost in US dollars, said plainly: "about $0.42", "less than $0.01", or "n/d" when it can't be priced. */
function costText(v){
  if(!isNum(v)) return "n/d";
  return +v<0.01 ? "less than $0.01" : "about $"+(+v).toLocaleString("en-US",{minimumFractionDigits:2, maximumFractionDigits:2});
}
/* "This answer cost about $0.42 (48,210 tokens read, 1,432 written) and used 9 S&P requests." */
function answerCostText(u){
  const tokens=isNum(u.inputTokens)||isNum(u.outputTokens), sp=isNum(u.spRequests);
  const parts=[tokens?`cost ${costText(u.costUsd)} (${count(u.inputTokens)} tokens read, ${count(u.outputTokens)} written)`:"", sp?`used ${plural(u.spRequests,"S&amp;P request")}`:""].filter(Boolean);
  return parts.length ? `This answer ${parts.join(" and ")}.` : "";
}
/* The login's questions today, against the daily limit, as the questions function counts them (midnight UTC to
   midnight UTC). Null until it has answered; left out when it can't say, for example before it is redeployed. */
async function loadChatUse(){
  S.chatUseAt=Date.now();

/* ---------- the whole answer to take away: a Word document (the docx library, loaded on the first click) or a copy

/* The parts, in order: question, when it was asked, answer lines, table, limits that were hit, sources. */
function answerDoc(t){
  const r=t.result||{}, segs=Array.isArray(r.answer)?r.answer.filter(s=>s&&!blank(s.text)):[], tb=answerTable(t);
  const lines=[];
  for(const s of segs){
    const ls=keepText(s.text).split(/\n/).map(l=>l.trimEnd()); let last=ls.length-1; while(last>0 && !ls[last]) last--;
    const cites=(Array.isArray(s.cites)?s.cites:[]).filter(n=>!blank(n)).map(n=>`[${oneLine(n)}]`).join("");
    ls.forEach((l,i)=>{ const tail=i===last?cites:"", m=l.match(/^\s*(?:[-*•]|\d+\.)\s+(.*)$/);

    table: tb ? {title:oneLine(tb.title), cols:tb.cols.map(oneLine), rows:tb.rows.map(row=>row.map(c=>c===""?"n/d":oneLine(c))), notes:tb.notes.map(oneLine)} : null,

function answerActsHTML(ti){

/* The document handed to the docx library. */
function answerDocx(m){
  const D=window.docx, R=(text,o)=>new D.TextRun({text, ...(o||{})}), P=(children,o)=>new D.Paragraph({children, ...(o||{})}), H=text=>new D.Paragraph({text, heading:D.HeadingLevel.HEADING_2});
  const muted={color:"666666", size:18}, kids=[H("Question"), ...m.question.split(/\n/).filter(l=>l.trim()).map(l=>P([R(l)]))];
  if(m.asked) kids.push(P([R(m.asked, muted)]));
  kids.push(H("Answer"));
  for(const l of m.lines) kids.push(P(l.runs.map(x=>R(x.text, x.bold?{bold:true}:undefined)).concat(l.cites?[R(" "+l.cites)]:[]), l.bullet?{bullet:{level:0}, spacing:{after:60}}:{spacing:{after:120}}));
  if(m.table){
    const n=Math.max(1, m.table.cols.length), w=Math.floor(9360/n);
    const cell=(text,head)=>new D.TableCell({children:[P([R(text, head?{bold:true}:undefined)])], ...(head?{shading:{type:D.ShadingType.CLEAR, color:"auto", fill:"EEEEEE"}}:{})});
    kids.push(H(m.table.title), new D.Table({width:{size:100, type:D.WidthType.PERCENTAGE}, columnWidths:m.table.cols.map(()=>w),
      rows:[new D.TableRow({tableHeader:true, children:m.table.cols.map(c=>cell(c,true))})].concat(m.table.rows.map(row=>new D.TableRow({children:row.map(c=>cell(c,false))})))}));
    for(const note of m.table.notes) kids.push(P([R(note, {italics:true, ...muted})], {spacing:{before:80}}));
  }
  if(m.caps.length) kids.push(H("Limits reached"), ...m.caps.map(c=>P([R(c)])));
  if(m.sources.length){
    kids.push(H("Sources"));
    for(const s of m.sources){
      kids.push(P([R(`[${s.n}] `, {bold:true}), R(s.title, {bold:true})], {spacing:{before:120}}));
      if(s.meta) kids.push(P([R(s.meta)], {indent:{left:360}}));
      if(s.quote) kids.push(P([R(`“${s.quote}”`, {italics:true})], {indent:{left:360}}));
    }
  }
  kids.push(P([R(ANSWER_FOOT, {italics:true, ...muted})], {spacing:{before:240}}));
  return new D.Document({creator:"SNL lookup", title:"Answer from Claude", styles:{default:{document:{run:{font:"Calibri", size:22}}}},
    sections:[{properties:{page:{size:{width:12240, height:15840}, margin:{top:1440, right:1440, bottom:1440, left:1440}}}, children:kids}]});
}
/* The same parts as HTML (every piece escaped) and as plain text, for the clipboard. */
function answerClipHTML(m){
  const td="border:1px solid #999999;padding:4px 6px;text-align:left;vertical-align:top", sm="color:#666666;font-size:12px";
  const line=l=>l.runs.map(x=>x.bold?`<b>${esc(x.text)}</b>`:esc(x.text)).join("")+(l.cites?" "+esc(l.cites):"");
  let h=`<h3>Question</h3>${m.question.split(/\n/).filter(l=>l.trim()).map(l=>`<p>${esc(l)}</p>`).join("")}${m.asked?`<p style="${sm}">${esc(m.asked)}</p>`:""}<h3>Answer</h3>`, inList=false;
  for(const l of m.lines){
    if(l.bullet && !inList){ h+="<ul>"; inList=true; } else if(!l.bullet && inList){ h+="</ul>"; inList=false; }
    h+=l.bullet ? `<li>${line(l)}</li>` : `<p>${line(l)}</p>`;
  }
  if(inList) h+="</ul>";
  if(m.table) h+=`<h3>${esc(m.table.title)}</h3><table style="border-collapse:collapse"><thead><tr>${m.table.cols.map(c=>`<th style="${td};background:#eeeeee">${esc(c)}</th>`).join("")}</tr></thead>`
    +`<tbody>${m.table.rows.map(row=>`<tr>${row.map(c=>`<td style="${td}">${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table>${m.table.notes.map(n=>`<p style="${sm}"><i>${esc(n)}</i></p>`).join("")}`;
  if(m.caps.length) h+=`<h3>Limits reached</h3>${m.caps.map(c=>`<p>${esc(c)}</p>`).join("")}`;
  if(m.sources.length) h+=`<h3>Sources</h3>${m.sources.map(s=>`<p><b>[${esc(s.n)}] ${esc(s.title)}</b>${s.meta?`<br>${esc(s.meta)}`:""}${s.quote?`<br><i>“${esc(s.quote)}”</i>`:""}</p>`).join("")}`;
  return `<div>${h}<p style="${sm}"><i>${esc(ANSWER_FOOT)}</i></p></div>`;
}
function answerClipText(m){
  const out=["Question", m.question]; if(m.asked) out.push(m.asked);
  out.push("", "Answer", ...m.lines.map(l=>(l.bullet?"- ":"")+l.runs.map(x=>x.text).join("")+(l.cites?" "+l.cites:"")));
  if(m.table) out.push("", m.table.title, ...[m.table.cols].concat(m.table.rows).map(r=>r.join("\t")), ...m.table.notes);
  if(m.caps.length) out.push("", "Limits reached", ...m.caps);
  if(m.sources.length){ out.push("", "Sources"); for(const s of m.sources) out.push(`[${s.n}] ${s.title}`, ...(s.meta?["    "+s.meta]:[]), ...(s.quote?[`    “${s.quote}”`]:[])); }
  out.push("", ANSWER_FOOT);
  return out.join("\n");
}

/* Draws the button and, when open, the panel. Left alone when nothing in them has changed, so the page under the

let askDrawn="";
function renderAsk(){
  const root=document.getElementById("askRoot"), a=S.ask, on=!!S.session;
  document.body.classList.toggle("ask-docked", on && a.open && !a.wide);
  const html = on ? askFabHTML()+(a.open?askPanelHTML():"") : "";
  if(html===askDrawn){ a.scroll=null; return; }
  const was=document.getElementById("askBody"), atFoot=!!was && was.scrollHeight-was.scrollTop-was.clientHeight<48, keep=keepUi("askRoot");
  root.innerHTML=html; askDrawn=html; keep();
