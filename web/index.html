  else body = `<ul class="pastlist" id="pastList">${p.rows.map(r=>{ const s=pastState(r), busy=p.opening===r.id;
      return `<li><button type="button" class="pastq" data-act="past-open" data-id="${esc(r.id)}"${p.opening?` aria-disabled="true"`:""}><span class="pq">${esc(shortText(r.question, 140))}</span>
        <span class="t2">${esc(askedText(r.created_at))} · <span class="${s.cls}">${esc(busy?"Opening…":s.text)}</span></span></button></li>`; }).join("")}</ul>`
      + problem + (p.more && !p.err ? `<div><button type="button" class="btn sm" id="pastMore" data-act="past-more" ${p.loading?"disabled":""}>${p.loading?"Loading…":"Show more"}</button></div>` : "");
  return `<section class="past" id="askPast" aria-labelledby="pastH"><h3 id="pastH">Past answers</h3>
    ${p.openErr?`<p class="err" id="pastOpenErr" role="alert">${esc(p.openErr)}</p>`:""}${body}</section>`;
}

/* ---------- Statutory ---------- */
async function loadStatStatus(){
  const st=S.st; if(st.loading) return;
  st.loading=true; st.statusErr=null; render();
  const r=await callFn("snl-statutory",{action:"status"});
  st.loading=false;
  if(!S.session) return;
  if(r.data) st.status=r.data; else if(r.err!=="signin") st.statusErr=r;
  render();
}
function statCodes(){ return [...new Set(S.st.codes.split(/[\s,;]+/).map(s=>s.trim()).filter(Boolean))]; }
function statProblem(){
  const st=S.st, codes=statCodes(), y=new Date().getFullYear();
  if(!codes.length) return `Type at least one NAIC ${st.kind==="group"?"group":"company"} code.`;
  if(codes.length>MAX_CODES) return `Compare at most ${MAX_CODES} codes at a time: one subject and ${MAX_CODES-1} peers.`;
  if(codes.some(c=>!/^[0-9]{1,6}$/.test(c))) return "NAIC codes are numbers of up to 6 digits, like 90001. Separate them with commas.";
  const a=/^\d{4}$/.test(st.fromYear)?+st.fromYear:0, b=/^\d{4}$/.test(st.toYear)?+st.toYear:0;
  if(!a || !b || a<1990 || b>y) return `Choose years between 1990 and ${y}.`;
  if(a>b) return "The first year is after the last year.";
  if(b-a>MAX_STAT_YEARS-1) return `Choose at most ${MAX_STAT_YEARS} years at a time.`;
  return "";
}
async function runStat(refresh){
  const st=S.st; if(st.busy) return;
  let payload;
  if(refresh){ if(!st.last) return; payload={...st.last, refresh:true}; }
  else{
    const problem=statProblem(); if(problem){ st.formErr=problem; render(); return; }
    payload={action:"query", kind:st.kind, codes:statCodes(), fromYear:+st.fromYear, toYear:+st.toYear}; st.last=payload; st.res=null; st.ent={}; st.resNames={...statFind().names[st.kind]};
  }
  st.formErr=""; st.busy=true; st.err=null; render();
  const r=await callFn("snl-statutory", payload);
  st.busy=false;
  if(!S.session) return;
  if(r.data){ st.res=r.data; takeUsage(r.data); loadStatus(); }
  else if(r.err!=="signin"){ st.err=r; if(r.err==="not_configured"||r.err==="not_mapped") loadStatStatus(); }
  render();
}
const statVal = (unit, v) => unit==="pct" ? pct(v) : usdM(v);
const statYears = res => { const a=+res.fromYear, b=+res.toYear, out=[]; if(isFinite(a)&&isFinite(b)) for(let y=a; y<=b && out.length<40; y++) out.push(y); return out; };
function statEntities(res, field){
  const list=(Array.isArray(res.entities)?res.entities:[]).map(e=>({code:String(e.code), name:e.name}));
  for(const c of (Array.isArray(res.codes)?res.codes:[])) if(!list.some(e=>e.code===String(c))) list.push({code:String(c), name:null});
  for(const r of (field&&Array.isArray(field.rows)?field.rows:[])) if(!blank(r.code) && !list.some(e=>e.code===String(r.code))) list.push({code:String(r.code), name:null});
  const known=S.st.resNames||{};   // the names found by name when the figures were asked for fill the gaps
  return list.map(e=>blank(e.name) && !blank(known[e.code]) ? {...e, name:known[e.code]} : e);
}
const entLabel = e => blank(e.name) ? `NAIC ${e.code}` : `${e.name} (NAIC ${e.code})`;
/* One block's table: for a "by year" field one row per company (the subject first, then peers); for a "by line"
   or "by state" field one row per line or state for the company chosen in the block. */
function statBlock(res, field){
  const years=statYears(res), ents=statEntities(res, field), rows=Array.isArray(field.rows)?field.rows:[], dim=field.by==="line"?"line":field.by==="state"?"state":null;
  const find=(code, y, d)=>{ const r=rows.find(x=>String(x.code)===code && +x.year===y && (!dim || String(x[dim]??"")===d)); return r ? r.value : null; };
  if(!dim) return {years, ents, dim, lines:ents.map((e,i)=>({label:entLabel(e), tag:ents.length>1?(i?"Peer":"Subject"):"", vals:years.map(y=>find(e.code,y))}))};
  const chosen=ents.some(e=>e.code===S.st.ent[field.id]) ? S.st.ent[field.id] : (ents[0]?ents[0].code:"");
  const keys=[...new Set(rows.filter(r=>String(r.code)===chosen && !blank(r[dim])).map(r=>String(r[dim])))];
  const last=years[years.length-1];
  const lines=sortRows(keys.map(k=>({label:k, tag:"", vals:years.map(y=>find(chosen,y,k))})), l=>{ const v=l.vals[l.vals.length-1]; return isNum(v)?+v:null; }, -1);   // largest in the latest year first
  return {years, ents, dim, chosen, lines, last};
}
function statExport(fieldId){
  const res=S.st.res, field=res&&(res.fields||[]).find(f=>f.id===fieldId); if(!field) return null;
  const years=statYears(res), ents=statEntities(res, field), rows=Array.isArray(field.rows)?field.rows:[], dim=field.by==="line"?"line":field.by==="state"?"state":null, unit=field.unit==="pct"?"%":"US dollars";
  const val=(code,y,d)=>{ const r=rows.find(x=>String(x.code)===code && +x.year===y && (!dim || String(x[dim]??"")===d)); return r&&isNum(r.value) ? +r.value : null; };
  const out=[];
  for(const e of ents){
    if(!dim){ out.push([e.code, e.name, unit, ...years.map(y=>val(e.code,y))]); continue; }
    for(const k of [...new Set(rows.filter(r=>String(r.code)===e.code && !blank(r[dim])).map(r=>String(r[dim])))]) out.push([e.code, e.name, k, unit, ...years.map(y=>val(e.code,y,k))]);
  }
  return {name:`snl-statutory-${String(field.id).replace(/[^\w-]+/g,"-")}-${TODAY()}`, sheet:field.label||field.id, cols:["NAIC code","Name", ...(dim?[dim==="line"?"Line of business":"State"]:[]), "Unit", ...years.map(String)], rows:out};
}
function statBlockHTML(res, field){
  const unit=field.unit==="pct"?"%":"$M";
  const head=(extra)=>`<div class="blk-h"><div><h3>${esc(field.label||field.id)} <span class="t2">${unit}</span></h3></div><span class="inline">${extra||""}</span></div>`;
  if(field.mapped===false) return `<section class="blk statblk" data-field="${esc(field.id)}">${head()}<p class="t2">This figure isn't mapped to a Snowflake column yet${isCorpDev()?". Add it in the field set-up below.":". Ask Corp Dev."}</p></section>`;
  if(!blank(field.error)) return `<section class="blk statblk" data-field="${esc(field.id)}">${head()}<p class="err" role="alert">${esc(field.error)}</p></section>`;
  const b=statBlock(res, field);
  const exp=`<button class="btn sm" data-act="export" data-what="stat" data-field="${esc(field.id)}" data-fmt="csv">Export CSV</button><button class="btn sm" data-act="export" data-what="stat" data-field="${esc(field.id)}" data-fmt="xlsx">Export XLSX</button>`;
  const pick=b.dim && b.ents.length>1 ? `<label class="inline t2" style="font-weight:bold">Company<select data-ent="${esc(field.id)}" style="width:auto;max-width:240px" aria-label="Company shown for ${esc(field.label||field.id)}">${b.ents.map(e=>`<option value="${esc(e.code)}" ${e.code===b.chosen?"selected":""}>${esc(entLabel(e))}</option>`).join("")}</select></label>` : "";
  if(!b.lines.length || !(field.rows||[]).length) return `<section class="blk statblk" data-field="${esc(field.id)}">${head(pick)}<p class="t2">S&amp;P returned nothing for this figure, so it shows as n/d. That doesn't prove the figure is zero.</p></section>`;
  return `<section class="blk statblk" data-field="${esc(field.id)}">${head(pick+exp)}
    <div class="tbl-wrap"><table class="stat"><thead><tr><th>${b.dim==="line"?"Line of business":b.dim==="state"?"State":"Company"}</th>${b.years.map(y=>`<th class="num">${y}</th>`).join("")}</tr></thead>
    <tbody>${b.lines.map(l=>`<tr><td>${esc(l.label)}${l.tag?` <span class="t2">${l.tag}</span>`:""}</td>${l.vals.map(v=>`<td class="num">${statVal(field.unit, v)}</td>`).join("")}</tr>`).join("")}</tbody></table></div></section>`;
}
function statResultsHTML(){
  const st=S.st, res=st.res;
  if(st.busy && !res) return `<div class="banner" role="status"><span>Fetching statutory data from Snowflake… This can take a minute. After that the figures are saved for everyone until someone clicks Refresh.</span></div>`;
  if(!res) return st.err ? problemHTML(st.err, "Couldn't fetch the statutory data.", "stat-retry") : `<div class="empty" id="statEmpty"><p>Type the NAIC code of the company you want, then any peers, and choose the years. The first code is the subject; the rest sit beside it for comparison. Don't know a code? Find the company or group by name above.</p></div>`;
  const fields=Array.isArray(res.fields)?res.fields:[], loaded=Array.isArray(res.loaded)?res.loaded:[];
  let h=`<h2 class="sec">Results</h2>`;
  if(st.busy) h+=`<div class="banner" role="status"><span>Asking Snowflake again… The figures below are from ${fmtAt(res.fetchedAt)} until the new ones arrive.</span></div>`;
  else if(st.err) h+=problemHTML(st.err, "Couldn't refresh the statutory data.", "stat-refresh");
  else if(res.fromStore) h+=`<div class="info" id="statFromStore" role="status"><span>From the last fetch on ${fmtAt(res.fetchedAt)}.</span><button class="btn sm" data-act="stat-refresh">Refresh</button></div>`;
  if(res.truncated) h+=`<div class="banner" id="statTruncated" role="alert"><span><b>These figures are incomplete.</b> Snowflake returned more rows than one request allows. Use fewer codes or fewer years.</span></div>`;
  h+=fields.length ? fields.map(f=>statBlockHTML(res, f)).join("") : `<div class="empty"><p>No figures came back for these codes and years. That doesn't prove there are none.</p></div>`;
  h+=`<p class="source" id="statSource">${loaded.map(l=>`S&amp;P last loaded ${esc(l.view)} on ${fmtAt(l.at)!=="n/d"?fmtAt(l.at):esc(blank(l.at)?"n/d":l.at)}.`).join(" ")} Source: ${esc(res.source||"S&P Global Market Intelligence statutory data")}, fetched ${fmtAt(res.fetchedAt)}. US dollars are shown in $M.</p>`;
  return h;
}
/* One-off set-up for Corp Dev: look at Snowflake's views and columns, then save which column holds each figure. */
async function openSetup(){
  const su=S.st.setup; su.open=true;
  if(su.text===null && !su.mapBusy){
    su.mapBusy=true; render();
    let data=null, error=null;
    try{ ({data, error}=await S.sb.from("snl_settings").select("doc").eq("id","statutory_mapping").maybeSingle()); }catch(e){ error=e; }
    su.mapBusy=false;
    if(error) su.mapErr="Couldn't read the saved mapping: "+((error&&error.message)||"unknown error")+".";
    su.text=JSON.stringify(data&&data.doc&&typeof data.doc==="object" ? data.doc : {fields:{}}, null, 2);
  }

async function discover(view, refresh){
  const su=S.st.setup;
  if(view){ su.view=view; su.cols=null; su.colsErr=null; su.colsBusy=true; } else { su.views=null; su.viewsErr=null; su.viewsBusy=true; }
  render();
  const like=su.like.trim();
  const r=await callFn("snl-statutory",{action:"discover", ...(view?{view}:like?{like}:{}), ...(refresh?{refresh:true}:{})});
  if(!S.session) return;
  if(view){ if(su.view!==view) return; su.colsBusy=false; if(r.data) su.cols=Array.isArray(r.data.columns)?r.data.columns:[]; else if(r.err!=="signin") su.colsErr=r; }
  else { su.viewsBusy=false; if(r.data) su.views=Array.isArray(r.data.views)?r.data.views:[]; else if(r.err!=="signin") su.viewsErr=r; }
  render();
}
function mappingProblem(text){
  let doc; try{ doc=JSON.parse(text); }catch(e){ return {problem:"This isn't valid JSON yet: "+String(e&&e.message||e).replace(/^JSON\.parse: /,"")+"."}; }
  const obj=v=>v!==null && typeof v==="object" && !Array.isArray(v);
  if(!obj(doc)) return {problem:'The mapping must be an object, like {"fields": {...}}.'};
  if(!obj(doc.fields)) return {problem:'The mapping needs a "fields" object, with one entry for each figure.'};
  const bad=Object.keys(doc.fields).find(k=>!obj(doc.fields[k]));
  if(bad!==undefined) return {problem:`The entry for "${bad}" must be an object with view, entity, year and value.`};
  if(text.length>200000) return {problem:"The mapping is too large to save."};
  return {doc};
}
async function saveMapping(){
  const su=S.st.setup, {doc, problem}=mappingProblem(su.text||"");
  if(problem){ su.mapErr=problem; render(); return; }
  su.saving=true; su.mapErr=""; render();
  let error=null;
  try{ ({error}=await S.sb.from("snl_settings").upsert({id:"statutory_mapping", doc})); }catch(e){ error=e; }
  su.saving=false;
  if(error){ su.mapErr = /42501|row-level security|permission/i.test(`${error.code||""} ${error.message||""}`) ? "Only Corp Dev logins can save the mapping." : "Couldn't save the mapping: "+(error.message||"unknown error")+"."; render(); return; }
  su.text=JSON.stringify(doc, null, 2); toast("Mapping saved"); S.st.status=null; S.st.res=null; render(); loadStatStatus();
}

    <div class="f"><label for="su_map">${su.view?"3":"2"}. The mapping <em>JSON: for each figure, the view, the columns for the company or group code, the year and the value, and the line or state column where there is one</em></label>
      ${su.mapBusy?`<p class="t2" role="status">Loading the saved mapping…</p>`:`<textarea class="code" id="su_map" data-bind="st.setup.text" spellcheck="false" autocapitalize="off">${esc(su.text||"")}</textarea>`}

/* ---------- Statutory: find companies and groups by name ---------- */
/* The same company list as the Filings view (the resolve action). Looking up by company, a match adds its NAIC
   company code; looking up by group, the matches are gathered into their groups and a group adds its NAIC group
   code. Codes typed by hand work as before; the names found here are shown beside the codes and in the results. */
function statFind(){ const st=S.st; if(!st.nf) st.nf={q:"", asked:"", matches:null, note:"", busy:false, err:"", names:{company:{}, group:{}}}; return st.nf; }
const naicOk = c => /^[0-9]{1,6}$/.test(String(c??"").trim());
async function statLookup(){
  const nf=statFind(), q=nf.q.trim();

  else if(r.err!=="signin") nf.err="Couldn't look that up. "+errText(r);
  render();
}
/* Adds one code to the end of the list: the first code is the subject, the rest are peers. */
function statAddCode(code, name){
  const st=S.st, codes=statCodes(); code=String(code??"").trim();
  if(!naicOk(code)) return "bad";
  if(codes.includes(code)) return "dup";
  if(codes.length>=MAX_CODES) return "full";
  st.codes=codes.concat(code).join(", "); st.formErr="";

const STAT_FULL = () => `The list is full: one subject and ${MAX_CODES-1} peers. Remove a code to add another.`;
function statAdd(code, name){
  const r=statAddCode(code, name);

  else if(r==="bad") toast("NAIC codes are numbers of up to 6 digits.");

}
/* Company matches with a NAIC company code, once each. */
const statAddable = matches => matches.filter((m,i)=>naicOk(m.naicCompanyCode) && matches.findIndex(x=>String(x.naicCompanyCode).trim()===String(m.naicCompanyCode).trim())===i);
function statAddAll(){
  const nf=statFind(); let added=0, left=0;
  for(const m of statAddable(nf.matches||[])){ const r=statAddCode(m.naicCompanyCode, m.companyName); if(r==="added") added++; else if(r==="full") left++; }
  render();
  toast(left && !added ? STAT_FULL() : left ? `Added ${added}. A comparison takes at most ${MAX_CODES} codes, so ${left} ${left===1?"was":"were"} left out.` : added ? `Added ${plural(added,"company","companies")}.` : "Those companies are already in the list.");
}
/* The distinct groups among the matches, with how many matching companies each has. */
function statGroups(matches){
  const out=[];
  for(const m of matches){
    const code=blank(m.naicGroupCode)?"":String(m.naicGroupCode).trim(), name=blank(m.naicGroupName)?"":String(m.naicGroupName);
    if(!code && !name) continue;
    const key=code||"name:"+name.toLowerCase(); let g=out.find(x=>x.key===key);
    if(!g){ g={key, code, name, n:0}; out.push(g); }
    if(!g.name && name) g.name=name;
    g.n++;
  }
  return out;
}
function statNameOf(kind, code){ const n=S.st.nf&&S.st.nf.names[kind]; return n&&!blank(n[code]) ? n[code] : ""; }
function statNamedHTML(){
  const st=S.st, codes=statCodes();

}
function statFinderHTML(){

  else if(nf.matches!==null && !nf.matches.length) found=calm(`No company in the app's company list matches "${esc(asked)}". Try a shorter part of the name, or type the NAIC ${group?"group":"company"} code in the box above.`);
  else if(nf.matches!==null && group){
    const groups=statGroups(nf.matches), loose=nf.matches.length-groups.reduce((a,g)=>a+g.n,0);
    const rows=groups.map(g=>{ const can=naicOk(g.code), inList=can&&codes.includes(g.code);
      const act=!can ? `<span class="t2 noadd">Can't be added: the company list has no NAIC group code for this group.</span>`
        : inList ? `<button type="button" class="btn sm" disabled>Added</button>` : `<button type="button" class="btn sm" data-act="st-add" data-code="${esc(g.code)}" data-name="${esc(g.name)}">Add</button>`;
      return `<li><div><div class="t1">${esc(g.name||`NAIC group ${g.code}`)}</div><div class="t2">${[can?`NAIC group ${esc(g.code)}`:"", `${plural(g.n,"matching company","matching companies")}`].filter(Boolean).join(" · ")}</div></div><span class="inline">${act}</span></li>`; }).join("");
    found = groups.length ? `<ul class="matches" id="st_matches" aria-label="Matching groups">${rows}</ul>${loose?`<p class="t2" id="st_loose">${plural(loose,"matching company has","matching companies have")} no group in the company list.</p>`:""}`
      : calm(`The companies that match "${esc(asked)}" have no group in the company list. Type the NAIC group code in the box above, or look up by NAIC company code.`);
  }
  else if(nf.matches!==null){
    const rows=nf.matches.map(m=>{ const code=String(m.naicCompanyCode??"").trim(), can=naicOk(code), inList=can&&codes.includes(code);
      const meta=[can?`NAIC ${code}`:"", !blank(m.naicGroupName)?`group ${m.naicGroupName}`:""].filter(Boolean).join(" · ");
      const act=!can ? `<span class="t2 noadd">Can't be added: the company list has no NAIC company code for it.</span>`

    const addable=statAddable(nf.matches), gs=[...new Set(nf.matches.map(m=>blank(m.naicGroupName)?"":String(m.naicGroupName)))];
    const all=addable.length>1 ? `<p class="t2" id="st_addAll"><button type="button" class="btn sm" data-act="st-add-all">Add all ${addable.length}</button> ${gs.length===1&&gs[0]?`to compare the whole of ${esc(gs[0])}.`:"to compare them all."} The first code in the list is the subject; at most ${MAX_CODES} codes.</p>` : "";

      <button type="button" class="btn" data-act="st-find" ${nf.busy?"disabled":""}>Find</button></div>
    ${nf.err?`<p class="err" id="st_findErr" role="alert">${esc(nf.err)}</p>`:""}${found}</div>`;
}

/* ---------- Profile: a company profile as a PowerPoint file on the team's own template ----------
   The profile function gives the figures (facts) and plain slide text, or Claude's draft of the text. The slides are
   built in this browser by deck.js and profile-slides.js, loaded on first use after the zip library. The template
   lives in private storage: it is downloaded once per session and kept in memory only (never in browser storage),
   and the built file is only handed to the browser to save. Both are dropped on sign-out. */
FN["snl-profile"]="the profile function";
const JSZIP_SRC = "https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js";   // the zip library the slide builder needs
const DECK_SRC = "deck.js", SLIDES_SRC = "profile-slides.js";                        // beside this page
const PPTX_TYPE = "application/vnd.openxmlformats-officedocument.presentationml.presentation";
const TPL_BUCKET = "snl-template", TPL_PATH = "template.pptx", TPL_MAX = 50*1024*1024;
function freshTemplate(){ return {checked:false, loading:false, info:null, err:"", errKind:"", bytes:null, uploading:"", upErr:"", upNote:""}; }
function freshProfile(){
  return {status:null, statusErr:null, loading:false, kind:"company", code:"", name:"", formErr:"", find:{q:"", asked:"", matches:null, busy:false, err:""},
    busy:"", asked:null, res:null, err:null, plan:null, libsErr:"", draft:null, drafted:null, draftErr:null, built:null, buildErr:"", tpl:freshTemplate()};
}
S.pf=freshProfile();
ASK_SUGGEST.profile=["What stands out in this company's results over these years?", "How has policyholder surplus moved against premiums written?", "Which lines of business and states drive this company's premiums?"];
const askSuggestKey = sc => S.view==="profile" && sc && sc.view==="statutory" ? "profile" : sc.view;
const pfLive = () => { const s=S.pf.status&&S.pf.status.statutory; return !!(s&&s.configured&&s.mapped); };
const pfClaude = () => !!(S.pf.status&&S.pf.status.claude&&S.pf.status.claude.configured);
const pfHasData = f => !!f && Array.isArray(f.years) && f.years.length>0;
const pfHasTemplate = () => !!(S.pf.tpl.bytes || S.pf.tpl.info);
// Claude drafts when it is set up, the reader hasn't switched it off, today's limit isn't reached, and it isn't the sample
const pfDraftWanted = () => pfClaude() && S.pf.draft!==false && !chatAtLimit(S.chatUse) && !!S.pf.res && !S.pf.res.facts.sample;
const pfEntLabel = (kind, code) => `NAIC ${kind==="group"?"group":"company"} ${code}`;
function pfName(f){ const e=f&&f.entity||{}; return !blank(e.name) ? String(e.name) : S.pf.asked&&!blank(S.pf.asked.name) ? S.pf.asked.name : pfEntLabel(e.kind, e.code); }
function pfYears(f){ const y=(f.years||[]).filter(isNum).map(Number); return !y.length ? "n/d" : y.length===1 ? String(y[0]) : `${Math.min(...y)} to ${Math.max(...y)}`; }

function enterProfile(){
  const pf=S.pf;
  if(!pf.status && !pf.statusErr && !pf.loading) loadProfileStatus();
  if(!pf.tpl.checked && !pf.tpl.loading) checkTemplate();
}
async function loadProfileStatus(){
  const pf=S.pf; if(pf.loading) return;

}
// today's questions and their cost, for the line under the draft choice and the Ask Claude panel alike
function pfChatUse(){ loadChatUse().then(()=>{ if(S.session && S.view==="profile") render(); }); }

/* The scripts that build the slides, loaded once, in order; a failed load can be tried again. */
function loadProfileLibs(){
  if(window.JSZip && window.SNLDeck && window.SNLProfile) return Promise.resolve();
  return loadProfileLibs.p || (loadProfileLibs.p=(async()=>{
    if(!window.JSZip) await loadScript(JSZIP_SRC);
    if(!window.SNLDeck) await loadScript(DECK_SRC);
    if(!window.SNLProfile) await loadScript(SLIDES_SRC);
    if(!window.JSZip || !window.SNLDeck || !window.SNLProfile) throw new Error("The slide builder didn't load");
  })().finally(()=>{ loadProfileLibs.p=null; }));
}
const PF_LIBS_ERR = "Couldn't load the slide builder. Check your connection and try again.";

/* ----- the template in storage ----- */
function tplErrKind(e){
  const m=`${e&&e.statusCode||""} ${e&&e.status||""} ${e&&e.error||""} ${e&&e.message||""}`;
  return /bucket not found/i.test(m) ? "nobucket" : /row-level security|unauthori[sz]ed|forbidden|permission|denied|\b403\b|policy/i.test(m) ? "refused"
    : /not found|\b404\b/i.test(m) ? "nofile" : /fetch|network|load failed|timed? ?out/i.test(m) ? "network" : "other";
}
function tplErrText(kind, e, upload){
  const what=upload?"upload":"get";
  if(kind==="nobucket") return isCorpDev() ? "The place the template is kept isn't set up yet. Run migration 0004_profile_template.sql in Supabase (see the README), then try again." : "The place the template is kept isn't set up yet. Ask Corp Dev to finish the set-up.";
  if(kind==="refused") return upload ? "Only Corp Dev logins can upload the template. If this is a Corp Dev login, check that migration 0004_profile_template.sql has been run (see the README)." : "This login isn't allowed to read the template. Ask Corp Dev.";
  if(kind==="network") return `Couldn't reach storage to ${what} the template. Check your connection and try again.`;
  if(kind==="nofile") return isCorpDev() ? "There is no template yet. Upload your PowerPoint template first." : "There is no template yet. Ask Corp Dev to upload the template.";
  return `Couldn't ${what} the template: ${(e&&e.message)||"unknown error"}. Try again.`;
}
async function checkTemplate(){
  const pf=S.pf, tp=pf.tpl; if(tp.loading) return;
  tp.loading=true; tp.err=""; tp.errKind=""; render();
  let data=null, error=null;
  try{ ({data, error}=await S.sb.storage.from(TPL_BUCKET).list("", {limit:100, search:TPL_PATH})); }catch(e){ error=e; }
  if(!S.session || S.pf!==pf) return;
  tp.loading=false; tp.checked=true;
  if(error){ tp.errKind=tplErrKind(error); if(tp.errKind==="nofile") tp.info=null; else tp.err=tplErrText(tp.errKind, error, false); }
  else { const o=(Array.isArray(data)?data:[]).find(x=>x && x.name===TPL_PATH), m=o&&o.metadata||{};
    tp.info = o ? {at:o.updated_at||o.created_at||m.lastModified||null, size:isNum(m.size)?+m.size:null} : null; }
  render();
}
/* The template's bytes: from memory after the first time. Throws an Error with a message for the page. */
async function templateBytes(pf){
  const tp=pf.tpl; if(tp.bytes) return tp.bytes;
  let data=null, error=null;
  try{ ({data, error}=await S.sb.storage.from(TPL_BUCKET).download(TPL_PATH)); }catch(e){ error=e; }
  if(error || !data){ const k=error?tplErrKind(error):"other"; if(k==="nofile"){ tp.info=null; tp.checked=true; } throw new Error(tplErrText(k, error, false)); }
  let buf; try{ buf=await data.arrayBuffer(); }catch{ throw new Error(tplErrText("network", null, false)); }
  if(S.pf===pf) tp.bytes=buf;
  return buf;
}
async function uploadTemplate(file){
  const pf=S.pf, tp=pf.tpl; if(!file || tp.uploading || !isCorpDev()) return;
  const stop=msg=>{ if(S.pf!==pf) return; tp.uploading=""; tp.upErr=msg; render(); };
  tp.upErr=""; tp.upNote="";
  if(!/\.pptx$/i.test(String(file.name||""))){ stop("Choose a PowerPoint file whose name ends in .pptx."); return; }
  if(+file.size>TPL_MAX){ stop(`That file is ${(+file.size/1048576).toFixed(1)} MB. The template can be at most 50 MB.`); return; }
  tp.uploading="checking"; render();
  let bytes; try{ bytes=await file.arrayBuffer(); }catch{ stop("Couldn't read that file. Choose it again."); return; }
  try{ await loadProfileLibs(); }catch{ stop("Couldn't load the template check. Check your connection and try again."); return; }
  let r; try{ r=await window.SNLDeck.inspect(bytes); }catch{ r=null; }
  if(!S.session || S.pf!==pf) return;
  if(!r || !r.ok){ stop(r&&!blank(r.message) ? String(r.message) : "That file can't be used as the template. Choose a PowerPoint file."); return; }
  tp.uploading="uploading"; render();
  const replaced=!!tp.info;
  let error=null;
  try{ ({error}=await S.sb.storage.from(TPL_BUCKET).upload(TPL_PATH, file, {upsert:true, contentType:PPTX_TYPE, cacheControl:"60"})); }catch(e){ error=e; }
  if(!S.session || S.pf!==pf) return;
  if(error){ stop(tplErrText(tplErrKind(error), error, true)); return; }
  tp.uploading=""; tp.bytes=bytes; tp.info={at:new Date().toISOString(), size:+file.size||null}; tp.checked=true; tp.err=""; tp.errKind="";
  tp.upNote=`Template ${replaced?"replaced":"uploaded"}: ${plural(r.slides,"slide")}, ${isNum(r.widthIn)?(+r.widthIn).toFixed(2).replace(/\.?0+$/,""):"n/d"} x ${isNum(r.heightIn)?(+r.heightIn).toFixed(2).replace(/\.?0+$/,""):"n/d"} in. Every profile from now on is built on it.`;
  render();
}
document.addEventListener("change", e=>{

  else if(fd.matches!==null && group){

    found = gs.length ? `<ul class="matches" id="pf_matches" aria-label="Matching groups">${gs.map(g=>`<li><div><div class="t1">${esc(g.name||`NAIC group ${g.code}`)}</div><div class="t2">NAIC group ${esc(g.code)} · ${plural(g.n,"matching company","matching companies")}</div></div><button type="button" class="btn sm" data-act="pf-choose" data-code="${esc(g.code)}" data-name="${esc(g.name)}">Choose</button></li>`).join("")}</ul>`
      : `<div class="info" id="pf_noMatch" role="status"><span>The companies that match "${esc(fd.asked)}" have no NAIC group code in the company list. Type the group code above, or profile a company instead.</span></div>`;
  }
  else if(fd.matches!==null){
    const ms=fd.matches.filter(m=>naicOk(m.naicCompanyCode));
    found = ms.length ? `<ul class="matches" id="pf_matches" aria-label="Matching companies">${ms.map(m=>`<li><div><div class="t1">${esc(m.companyName||"n/d")}</div><div class="t2">${esc([`NAIC ${String(m.naicCompanyCode).trim()}`, blank(m.naicGroupName)?"":`group ${m.naicGroupName}`].filter(Boolean).join(" · "))}</div></div><button type="button" class="btn sm" data-act="pf-choose" data-code="${esc(String(m.naicCompanyCode).trim())}" data-name="${esc(m.companyName)}">Choose</button></li>`).join("")}</ul>`
      : `<div class="info" id="pf_noMatch" role="status"><span>The companies that match "${esc(fd.asked)}" have no NAIC company code in the company list. Type the code above.</span></div>`;
  }
  return `<div class="f"><label for="pf_find">Find by name <em>part of a company or group name</em></label>
    <div class="toolbar"><div class="grow"><input type="text" id="pf_find" data-bind="pf.find.q" value="${esc(fd.q)}" autocomplete="off" spellcheck="false" placeholder="For example Calloway"></div>
      <button type="button" class="btn" data-act="pf-find" ${fd.busy?"disabled":""}>Find</button></div>
    ${fd.err?`<p class="err" id="pf_findErr" role="alert">${esc(fd.err)}</p>`:""}${found}</div>`;
}

/* ----- the figures, Claude's draft, and the file ----- */
function pfReset(pf){ pf.res=null; pf.err=null; pf.plan=null; pf.libsErr=""; pf.drafted=null; pf.draftErr=null; pf.built=null; pf.buildErr=""; }
async function pfFacts(){
  const pf=S.pf; if(pf.busy) return;
  const code=pf.code.trim(), kind=pf.kind;
  if(!naicOk(code)){ pf.formErr = code ? "NAIC codes are numbers of up to 6 digits, like 90001." : `Choose a ${kind}: find it by name, or type its NAIC ${kind} code.`; render(); return; }
  pf.formErr=""; pfReset(pf); pf.busy="facts"; pf.asked={kind, code, name:pf.name}; render();
  const r=await callFn("snl-profile",{action:"facts", kind, code});
  if(!S.session || S.pf!==pf) return;
  pf.busy="";
  if(r.data && r.data.facts && typeof r.data.facts==="object" && r.data.text){ pfTake(pf, r.data); loadStatus(); }
  else if(r.err!=="signin"){ pf.err = r.data ? {err:"bad_answer", msg:"The profile function sent back something the page can't read. Try again."} : r; if(r.err==="not_configured"||r.err==="not_mapped"){ pf.status=null; loadProfileStatus(); } }
  render();
}
function pfTake(pf, data){ pf.res={facts:data.facts, text:data.text}; pf.plan=null; pf.libsErr=""; if(pfHasData(data.facts)) pfPlan(pf); }
async function pfPlan(pf){
  try{ await loadProfileLibs(); }catch{ if(S.pf===pf){ pf.libsErr=PF_LIBS_ERR; render(); } return; }
  if(S.pf!==pf || !pf.res) return;
  let plan=null; try{ plan=window.SNLProfile.plan(pf.res.facts); }catch{}
  if(!Array.isArray(plan)){ pf.libsErr="Couldn't work out which slides these figures fill. Try again."; render(); return; }
  pf.plan=plan.filter(s=>s&&typeof s==="object"); pf.libsErr=""; render();
}
async function pfSample(){
  const pf=S.pf; if(pf.busy) return;
  pfReset(pf); pf.busy="sample"; pf.asked=null; render();
  const r=await callFn("snl-profile",{action:"sample"});
  if(!S.session || S.pf!==pf) return;
  pf.busy="";
  if(r.data && r.data.facts && typeof r.data.facts==="object" && r.data.text){ pfTake(pf, r.data); if(pfHasTemplate()){ await pfMake(pf); return; } }
  else if(r.err!=="signin") pf.err = r.data ? {err:"bad_answer", msg:"The profile function sent back something the page can't read. Try again."} : r;
  render();
}
/* Build: Claude drafts the text first when that is chosen (once per set of figures), then the file is made. plain:
   build with the plain text, after a draft couldn't be had. */
async function pfBuild(plain){
  const pf=S.pf; if(pf.busy || !pf.res || !pfHasData(pf.res.facts)) return;
  if(!pfHasTemplate()){ pf.buildErr=tplErrText("nofile"); render(); return; }
  if(plain){ pf.draft=false; pf.draftErr=null; }
  if(!plain && pfDraftWanted() && !pf.drafted){
    pf.busy="draft"; pf.draftErr=null; pf.built=null; pf.buildErr=""; render();
    const e=pf.res.facts.entity||{};
    const r=await callFn("snl-profile",{action:"draft", kind:e.kind==="group"?"group":"company", code:String(e.code??"")});
    if(!S.session || S.pf!==pf) return;
    pfChatUse();   // the day's count and cost, now with this draft
    if(r.data && r.data.facts && typeof r.data.facts==="object" && r.data.text){
      pf.drafted={facts:r.data.facts, text:r.data.text, usage:r.data.usage||null};
      markSeen(r.data.jobId);   // the draft is saved as a past answer; it is already in front of the reader, so no "Answer ready"
    } else if(r.err!=="signin"){ pf.busy=""; pf.draftErr = r.data ? {err:"bad_answer", msg:"Claude's draft came back in a form the page can't read."} : r; render(); return; }
    else return;
  }
  await pfMake(pf);
}
function pfFileName(spec){
  const n=String(spec&&spec.fileName||"").replace(/[\\/:*?"<>|\u0000-\u001f]+/g,"-").trim();
  return n ? (/\.pptx$/i.test(n) ? n : n+".pptx") : `profile-${TODAY()}.pptx`;
}
async function pfMake(pf){
  pf.busy="build"; pf.buildErr=""; pf.built=null; render();
  const use = pf.drafted && pfDraftWanted() ? pf.drafted : pf.res;
  const fail=msg=>{ if(!S.session || S.pf!==pf) return; pf.busy=""; pf.buildErr=msg; render(); };
  let bytes; try{ bytes=await templateBytes(pf); }catch(e){ fail(e.message); return; }
  if(!S.session || S.pf!==pf) return;
  try{ await loadProfileLibs(); }catch{ fail(PF_LIBS_ERR); return; }
  if(!S.session || S.pf!==pf) return;
  let spec; try{ spec=window.SNLProfile.spec(use.facts, use.text); }catch(e){ fail("Couldn't lay out the slides from these figures. "+((e&&e.message)||"")); return; }
  let out; try{ out=await window.SNLDeck.build(bytes.slice(0), spec); }catch(e){ fail("Couldn't build the PowerPoint file. "+((e&&e.message)||"Try again.")); return; }
  if(!S.session || S.pf!==pf) return;
  pf.busy=""; pf.built={blob:new Blob([out],{type:PPTX_TYPE}), name:pfFileName(spec), by:use.text&&use.text.by==="claude"?"claude":"plain"};
  render(); saveBlob(pf.built.blob, pf.built.name);
}
function pfDownloadAgain(){ const b=S.pf.built; if(b) saveBlob(b.blob, b.name); }

/* What Claude is told when asked from this view: the figures behind the profile, as the Statutory view describes its
   own (the questions function knows that shape). Nothing for the sample, whose figures are made up. */
function pfScreen(){
  const pf=S.pf, f=pf.drafted ? pf.drafted.facts : pf.res&&pf.res.facts;
  if(!f || f.sample || !pfHasData(f) || !pfLive()) return null;
  const e=f.entity||{}, ys=f.years.filter(isNum).map(Number);
  if(!naicOk(e.code) || !ys.length) return null;
  return {view:"statutory", query:{kind:e.kind==="group"?"group":"company", codes:[String(e.code)], fromYear:Math.min(...ys), toYear:Math.max(...ys)}, companies:blank(e.name)?[]:[String(e.name)]};
}

/* ----- drawing the view ----- */
function pfLatest(f, key){
  const ys=f.years||[], a=f.series&&f.series[key]; if(!Array.isArray(a)) return null;
  for(let i=Math.min(a.length, ys.length)-1; i>=0; i--) if(isNum(a[i])) return {year:ys[i], v:+a[i]};
  return null;
}
function pfHeadlineHTML(f){
  const tile=(label, key, fmt)=>{ const l=pfLatest(f, key);
    return `<div class="pftile" data-k="${key}"><span class="t2">${label}${l?` ${esc(l.year)}`:""}</span><b>${l?fmt(l.v):"n/d"}</b></div>`; };
  return `<div class="pftiles" id="pfHead">${tile("Direct premiums written","dpw",usdM)}${tile("Combined ratio","combined_ratio",pct)}${tile("Policyholder surplus","surplus",usdM)}</div>`;
}
function pfPlanHTML(pf){
  if(pf.libsErr) return `<div class="banner" id="pfLibsErr" role="alert"><span>${esc(pf.libsErr)}</span><button type="button" class="btn sm" data-act="pf-libs-retry">Try again</button></div>`;
  if(!pf.plan) return `<p class="t2" role="status">Working out which slides these figures fill…</p>`;
  const n=pf.plan.filter(s=>s.included).length;
  return `<div class="f"><span>The slides <em>${plural(n,"slide")} of ${count(pf.plan.length)} can be filled from these figures</em></span>
    <ol class="pfplan" id="pfPlan">${pf.plan.map(s=>`<li class="${s.included?"in":"out"}"><span class="t1">${esc(s.label||s.id)}</span>${s.included?`<span class="pill in">Included</span>`:`<span class="pfwhy">Left out: ${esc(blank(s.reason)?"its figures aren't available":s.reason)}</span>`}</li>`).join("")}</ol></div>`;
}
function pfMissingHTML(f){
  const miss=(Array.isArray(f.missing)?f.missing:[]).filter(m=>m&&typeof m==="object");
  if(!miss.length) return "";
  const items=miss.map(m=>`<li>${esc(m.label||m.field)}${blank(m.reason)?"":` <span class="t2">(${esc(m.reason)})</span>`}</li>`).join("");
  return `<div class="notes" id="pfMissing" role="status"><b>Some figures aren't available, so the slides that need them are left out.</b><ul>${items}</ul>
    <p class="t2" style="margin:6px 0 0">${isCorpDev()?`Map them in the field set-up on the <a href="#statutory">Statutory view</a>, then get the figures again.`:"Ask Corp Dev to map them in the statutory field set-up."}</p></div>`;
}
function pfDraftHTML(pf){
  const f=pf.res.facts;
  if(f.sample) return `<p class="t2" id="pfDraftNote">The sample uses plain text written from its figures.</p>`;
  if(!pfClaude()) return `<p class="t2" id="pfDraftNote">Claude isn't set up, so the slides use plain titles and points written from the figures.</p>`;
  const c=S.chatUse;
  if(chatAtLimit(c)) return `<div class="info" id="pfDraftNote" role="status"><span>You've reached today's limit of ${plural(c.dailyLimit,"question")}, so the slides use plain titles and points written from the figures. Questions come back at midnight UTC.</span></div>`;
  const on=S.pf.draft!==false;
  const today = c && isNum(c.askedToday) ? ` You've asked ${isNum(c.dailyLimit)?`${count(c.askedToday)} of ${plural(c.dailyLimit,"question")}`:plural(c.askedToday,"question")} today${isNum(c.costToday)?`, ${costText(c.costToday)} in all`:""}.` : "";
  const avg = c && isNum(c.costToday) && isNum(c.askedToday) && +c.askedToday>0 ? ` Today's answers have cost ${costText(+c.costToday/+c.askedToday)} each on average.` : " It costs about as much as a question.";
  const done = pf.drafted ? (pf.drafted.text.by==="claude" ? `<p class="t2" id="pfDrafted">Claude has drafted the text for these figures${pfCostLine(pf.drafted.usage)}</p>` : "") : "";
  return `<div class="pfdraft"><label class="pfcheck"><input type="checkbox" id="pf_draft" data-act="pf-draft" ${on?"checked":""} ${pf.busy?"disabled":""}>
      <span><b>Ask Claude to draft the slide titles, takeaways and diligence questions</b> <span class="t2">from this company's figures only. Without it, the slides get plain titles and points written from the figures.</span></span></label>
    <p class="t2" id="pfDraftCost">Counts as one of today's questions to Claude.${today}${avg}</p>${done}</div>`;
}
function pfCostLine(u){ u=u||{}; const tok=isNum(u.inputTokens)||isNum(u.outputTokens); return tok||isNum(u.costUsd) ? `. It cost ${costText(u.costUsd)}${tok?` (${count(u.inputTokens)} tokens read, ${count(u.outputTokens)} written)`:""}.` : "."; }
function pfDraftErrText(r){
  if(r.err==="limit"||r.err==="daily_limit") return "You've reached today's limit of questions to Claude, so it can't draft the text now. Build with plain text instead, or try again tomorrow.";
  if(r.err==="busy") return "You already have an answer in progress in Ask Claude, and Claude takes one at a time for each login. Build with plain text, or try the draft again when that answer has finished.";
  if(r.err==="not_configured") return "Claude isn't set up, so it can't draft the text. Build with plain text instead.";
  return `Claude couldn't draft the text. ${errText(r)} You can build with plain text instead.`;
}
function pfOutHTML(){

  h+=`<div id="pfOut" class="pfout" aria-live="polite">${pfOutHTML()}</div>`;
  return h+pfTemplateHTML();
}

/* ---------- Snapshot: one company or group over 1, 3 or 5 years, on one page ----------
   Page only. It looks companies up with the snl-filings "resolve" action, runs ONE "search" (every state in S&P's
   list, every filing type and status, by publish date: the same search the Filings view runs from that form, saved
   the same way) and works out every figure here from the rows that come back. */
VIEWS.push("snapshot");
const SNAP_YEARS = [1,3,5];
const SNAP_MAX_REQUESTS = 60;      // S&P requests one search may use: MAX_SEARCH_REQUESTS in supabase/functions/_shared/filings.ts
const SNAP_IDS_PER_REQUEST = 10;   // S&P takes 10 company ids a request (MAX_IDS_PER_REQUEST there)
const SNAP_WINDOW_DAYS = 365;      // and 365 days of dates a request, so a period of N years is exactly N windows
const SNAP_LOOKUP_MAX = 50;        // the most companies one look-up returns (resolveEntity there)
const SNAP_RECENT = 6, SNAP_LATEST = 10;
// The companies one snapshot can cover is MAX_COMPANIES, the same limit as one search on the Filings view.
function freshSnap(){ return {find:{q:"", asked:"", matches:null, busy:false, err:""}, pick:null, picking:"", pickErr:"", years:3, formErr:"", busy:false, res:null, err:null, ran:null, mapBy:"count"}; }
S.snap=freshSnap();
const snapNarrow = () => { try{ return window.matchMedia("(max-width:700px)").matches; }catch{ return false; } };
try{ window.matchMedia("(max-width:700px)").addEventListener("change", ()=>{ if(S.session && S.view==="snapshot" && S.snap.res) render(); }); }catch{}   // the charts are drawn for the width
function enterSnapshot(){ if(!S.refs && !S.refsLoading) loadRefs(false); }

/* ----- choosing: a company, or a group (every member company in the company list) ----- */
// the S&P id a search takes for a directory row: the company id when there is one, otherwise the institution id
function snapIdOf(m){
  const ok=v=>!blank(v) && /^\d{1,12}$/.test(String(v).trim()), name=blank(m.companyName)?"":String(m.companyName);
  return ok(m.companyId) ? {kind:"companyId", id:String(m.companyId).trim(), name} : ok(m.institutionId) ? {kind:"institutionId", id:String(m.institutionId).trim(), name} : null;
}
// groups among the matches, by group name (the company list has group names, not group codes)
function snapGroups(matches){
  const out=[];
  for(const m of matches){ const name=blank(m.naicGroupName)?"":String(m.naicGroupName).trim(); if(!name) continue;
    const key=name.toLowerCase(); let g=out.find(x=>x.key===key); if(!g){ g={key, name, n:0}; out.push(g); } g.n++; }
  return out;
}
/* The look-up keeps only letters, digits, spaces and . & ' - of what it is given, so a group name like
   "Calloway Group (SNL P&C Group)" is looked up by its first plain part, and members are then matched on the full name. */
const snapGroupQuery = name => String(name).split(/[^\p{L}\p{N} .&'-]/u)[0].replace(/\s+/g," ").trim().slice(0,100);
async function snapLookup(){
  const sn=S.snap, fd=sn.find, q=fd.q.trim();
  if(!q){ fd.matches=null; fd.err="Type part of a company or group name."; render(); return; }
  fd.busy=true; fd.err=""; fd.matches=null; fd.asked=q; sn.pickErr=""; render();
  const r=await callFn("snl-filings",{action:"resolve", q});
  if(!S.session || S.snap!==sn || fd.asked!==q) return;
  fd.busy=false;
  if(r.data) fd.matches=Array.isArray(r.data.matches)?r.data.matches.filter(m=>m&&typeof m==="object"):[];
  else if(r.err!=="signin") fd.err="Couldn't look that up. "+errText(r);
  render();
}
function snapChooseCompany(i){
  const sn=S.snap, m=sn.find.matches&&sn.find.matches[i], id=m&&snapIdOf(m); if(!id || sn.busy) return;
  sn.pick={kind:"company", name:id.name||`S&P ${id.kind==="companyId"?"company":"institution"} id ${id.id}`, group:blank(m.naicGroupName)?"":String(m.naicGroupName), ids:[id], noId:0, cut:false};
  sn.find.matches=null; sn.formErr=""; sn.pickErr=""; render(); document.getElementById("sn_run")?.focus();
}
async function snapChooseGroup(i){
  const sn=S.snap, all=sn.find.matches||[], g=snapGroups(all)[i]; if(!g || sn.picking || sn.busy) return;
  sn.picking=g.name; sn.pickErr=""; sn.pick=null; sn.formErr=""; render();
  let found=all.slice(), cut=false;
  const q=snapGroupQuery(g.name);
  if(q.length>=2){
    const r=await callFn("snl-filings",{action:"resolve", q});
    if(!S.session || S.snap!==sn || sn.picking!==g.name) return;
    if(!r.data){ sn.picking=""; sn.pickErr="Couldn't list the group's companies. "+errText(r); render(); return; }
    // The function names whole groups with every member (up to the most one search takes): use that when it is there.
    const whole=(Array.isArray(r.data.groups)?r.data.groups:[]).find(x=>x&&typeof x==="object"&&Array.isArray(x.members)&&String(x.name??"").trim().toLowerCase()===g.key);
    if(whole){
      const seen=new Set(), ids=[];
      for(const m of whole.members){ const id=m&&typeof m==="object"?snapIdOf(m):null, k=id&&id.kind+":"+id.id; if(id && !seen.has(k)){ seen.add(k); ids.push(id); } }
      const n=v=>isNum(v)?Math.max(0, Math.round(+v)):0;
      sn.picking=""; sn.pick={kind:"group", name:g.name, group:g.name, ids, noId:Math.max(0, n(whole.companies)-n(whole.searchable)), cut:false, over:!!whole.tooBig || n(whole.searchable)>ids.length};
      sn.find.matches=null; render(); document.getElementById("sn_run")?.focus(); return;
    }
    // An older filings function gives only the matching companies, at most SNAP_LOOKUP_MAX of them.
    const ms=Array.isArray(r.data.matches)?r.data.matches.filter(m=>m&&typeof m==="object"):[];
    cut=ms.length>=SNAP_LOOKUP_MAX; found=found.concat(ms);
  }
  const seen=new Set(), ids=[]; let noId=0;
  for(const m of found){
    if(blank(m.naicGroupName) || String(m.naicGroupName).trim().toLowerCase()!==g.key) continue;
    const id=snapIdOf(m), k=id ? id.kind+":"+id.id : "n:"+String(m.companyName??"").toLowerCase()+"|"+String(m.naicCompanyCode??"");
    if(seen.has(k)) continue; seen.add(k);
    if(id) ids.push(id); else noId++;
  }
  sn.picking=""; sn.pick={kind:"group", name:g.name, group:g.name, ids, noId, cut}; sn.find.matches=null; render();
  document.getElementById("sn_run")?.focus();
}

/* ----- the period and what it costs ----- */
function snapRange(years){ const to=TODAY(); return {from:daysBefore(to, SNAP_WINDOW_DAYS*years-1), to}; }
// one S&P request for each 10 companies of a kind for each 365 days of dates, before any extra pages
function snapCost(ids, from, to){
  const a=parseDay(from), b=parseDay(to); if(!a || !b || a>b) return 0;
  const windows=Math.ceil((Math.round((b-a)/DAY)+1)/SNAP_WINDOW_DAYS), n=k=>Math.ceil(ids.filter(c=>c.kind===k).length/SNAP_IDS_PER_REQUEST);
  return windows*(n("companyId")+n("institutionId"));
}
const snapYearsText = y => y===1 ? "last year" : `last ${y} years`;
/* Why one search can't take this snapshot, in plain words with what to choose instead; "" when it can. */
function snapTooBig(pick, years, maxIds=MAX_COMPANIES, maxReq=SNAP_MAX_REQUESTS){
  if(!pick) return "";
  if(!pick.ids.length) return pick.kind==="group" ? `None of the companies in ${pick.name} has an S&P id in the company list, so the group's filings can't be searched. Its companies can be added on the Filings view by S&P id.` : "This company has no S&P id in the company list, so its filings can't be searched.";
  if(pick.ids.length>maxIds) return `${pick.name} has ${pick.cut?"at least ":""}${plural(pick.ids.length,"company","companies")} with S&P ids in the company list, and one snapshot covers at most ${maxIds}. Choose one of its companies instead, or search the group in parts on the Filings view.`;
  if(pick.over) return `${pick.name} has more than ${maxIds} companies with S&P ids in the company list, and one snapshot covers at most ${maxIds}. Choose one of its companies instead, or search the group in parts on the Filings view.`;
  if(pick.cut) return `${pick.name} has more companies in the company list than one look-up returns (${SNAP_LOOKUP_MAX}), so a snapshot can't be sure to cover all of it. Choose one of its companies instead, or search the group in parts on the Filings view.`;
  const r=snapRange(years), need=snapCost(pick.ids, r.from, r.to);
  if(need>maxReq){
    const fit=SNAP_YEARS.filter(y=>{ const x=snapRange(y); return snapCost(pick.ids, x.from, x.to)<=maxReq; });
    return `This snapshot needs at least ${need} S&P requests, more than the ${maxReq} one search may use. ${fit.length?`Choose the ${snapYearsText(Math.max(...fit))} instead.`:"Choose one of its companies instead."}`;
  }
  return "";
}

/* ----- running it, and snapshots run before in this browser ----- */
const snapRecentKey = () => "snl.snapshots."+(S.session&&S.session.uid||"");
function snapRecentList(){
  try{ const a=JSON.parse(localStorage.getItem(snapRecentKey())||"[]"); return Array.isArray(a) ? a.filter(x=>x&&x.pick&&Array.isArray(x.pick.ids)&&x.payload&&x.payload.action==="search").slice(0,SNAP_RECENT) : []; }catch{ return []; }
}
// only a complete, saved result is listed: reopening it sends the same search, which opens from the saved result
function snapRemember(run, res){
  if(res.capped || res.saved===false) return;
  const key=JSON.stringify(run.payload), list=[{pick:run.pick, years:run.years, payload:run.payload, at:new Date().toISOString()}].concat(snapRecentList().filter(x=>JSON.stringify(x.payload)!==key)).slice(0,SNAP_RECENT);
  try{ localStorage.setItem(snapRecentKey(), JSON.stringify(list)); }catch{}
}
async function snapRun(refresh, given){
  const sn=S.snap; if(sn.busy) return;
  let run;
  if(given) run=given;
  else if(refresh){ if(!sn.ran) return; run=sn.ran; }
  else{
    if(!sn.pick){ sn.formErr="Choose a company or a group first: find it by name above."; render(); return; }
    const big=snapTooBig(sn.pick, sn.years); if(big){ sn.formErr=big; render(); return; }
    const {from, to}=snapRange(sn.years), nums=k=>sn.pick.ids.filter(c=>c.kind===k).map(c=>Number(c.id));
    run={pick:JSON.parse(JSON.stringify(sn.pick)), years:sn.years, payload:{action:"search", companyIds:nums("companyId"), institutionIds:nums("institutionId"), states:stateOptions().map(s=>s.id).sort(), from, to}};
  }
  sn.formErr=""; sn.busy=true; sn.err=null; if(!refresh) sn.res=null; sn.ran=run; render();
  const r=await callFn("snl-filings", refresh ? {...run.payload, refresh:true} : run.payload);
  if(!S.session || S.snap!==sn) return;   // signed out, or the session ended, while it ran
  sn.busy=false;
  if(r.data && Array.isArray(r.data.rows)){ sn.res=r.data; sn.err=null; takeUsage(r.data); loadStatus(); snapRemember(run, r.data); }
  else if(r.err!=="signin") sn.err = r.data ? {err:"bad_answer", msg:"The filings function sent back something the page can't read. Try again."} : r;
  render();
}
function snapReopen(i){
  const sn=S.snap, run=snapRecentList()[i]; if(!run || sn.busy) return;
  sn.pick=run.pick; sn.years=SNAP_YEARS.includes(+run.years)?+run.years:3; sn.find.matches=null;
  snapRun(false, run);
}
/* The same search on the Filings view, form filled in, so every row can be read there. A complete result opens from
   the saved one; a partial one isn't saved, so the form is filled and the reader decides whether to ask S&P again. */
function snapToFilings(){
  const sn=S.snap, run=sn.ran, r=sn.res, f=S.f; if(!run || !r) return;
  if(f.busy){ toast("The Filings view is still running a search. Try again when it has finished."); return; }
  const p=run.payload;
  f.chips=run.pick.ids.slice(0, MAX_COMPANIES).map(c=>({kind:c.kind, id:String(c.id), name:c.name||""}));
  f.states=[...p.states]; f.from=p.from; f.to=p.to; f.toi=[]; f.ftype=[]; f.fstatus=[]; f.toiFilter=""; f.tracking="";
  f.q=""; f.matches=null; f.resolveNote=""; f.resolveErr=""; f.formErr="";
  location.hash="#filings";
  if(r.capped){ f.res=null; f.err=null; toast("The form is filled in. Press Search filings to run it: a partial result isn't saved, so it asks S&P again."); }
  else runSearch(false, {...p});
}

/* ----- working it out: every figure comes from the rows of the one search ----- */
/* UNCONFIRMED: S&P's filing types are SERFF's names, like "Rate", "Rule" and "Form", and combinations such as
   "Rate/Rule" or "Rate and rule". A filing counts as a rate, rule or form filing when its type names that word, so a
   combined filing counts in each kind it names. Change this one function if S&P names them some other way. */
function snapKinds(type){ const t=String(type??"").toLowerCase(); return {rate:/\brates?\b/.test(t), rule:/\brules?\b/.test(t), form:/\bforms?\b/.test(t)}; }
/* UNCONFIRMED: which of S&P's statuses mean the filing is approved. Only a status that says "approved" is drawn as
   approved; every other status (pending, withdrawn, disapproved, or one this page doesn't know) is drawn as not approved. */
const snapApproved = s => /approv/i.test(String(s??"")) && !/disapprov|not approv/i.test(String(s??""));
const snapState = r => { const s=String(r.serffFilingStateId??"").trim().toUpperCase(); return /^[A-Z]{2}$/.test(s) ? s : ""; };
const snapStateName = s => { const o=stateOptions().find(x=>x.id===s); return o&&o.name!==s ? o.name : US_MAP[s] ? US_MAP[s][1] : s; };
/* One entry per filing version, as the Filings view keys its rows (rowKey): rows S&P sent more than once for the
   same version, one for each company on it, become one filing that lists every company. */
function snapFilings(rows){
  const by=new Map(), out=[];
  (Array.isArray(rows)?rows:[]).forEach((r,i)=>{ if(!r || typeof r!=="object") return;
    const k=rowKey(r,i), cos=companiesOf(r), kept=by.get(k);
    if(!kept){ const f={...r, companies:cos.slice()}; by.set(k,f); out.push(f); return; }
    for(const c of cos) if(!kept.companies.some(x=>String(x.companyId??"")===String(c.companyId??"") && String(x.institutionId??"")===String(c.institutionId??"") && x.companyName===c.companyName)) kept.companies.push(c); });
  return out;
}
const snapMedian = a => { const s=[...a].sort((x,y)=>x-y), n=s.length; return !n ? null : n%2 ? s[(n-1)/2] : (s[n/2-1]+s[n/2])/2; };
// newest publish date first; a filing with no publish date after every dated one
const snapByDate = (a,b) => (b.pub?b.pub.getTime():-Infinity)-(a.pub?a.pub.getTime():-Infinity);
/* UNCONFIRMED: publishDate is when S&P published the filing (the date the Filings view searches by), which is close
   to, but not always the same as, the date the regulator decided it. The days from dateSubmitted to publishDate are
   shown as an approximate time with the regulator. */
const snapDays = f => f.sub && f.pub ? Math.round((f.pub-f.sub)/DAY) : null;
function snapCompute(res, run){
  const p=res.params||run&&run.payload||{};
  const fs=snapFilings(res.rows).map(r=>({r, k:snapKinds(r.serffFilingType), st:snapState(r), toi:blank(r.typeOfInsurance)?"":String(r.typeOfInsurance), type:blank(r.serffFilingType)?"":String(r.serffFilingType),
    pub:parseDay(r.publishDate), sub:parseDay(r.dateSubmitted), rate:isNum(r.overallRateImpact)?+r.overallRateImpact:null, ok:snapApproved(r.filingStatus)}));
  const searched=[...new Set((Array.isArray(p.states)?p.states:[]).map(s=>String(s).toUpperCase()))];
  const states=new Map(searched.map(s=>[s,[]])); for(const f of fs) if(f.st){ if(!states.has(f.st)) states.set(f.st,[]); states.get(f.st).push(f); }
  const latestRate=list=>list.filter(f=>f.rate!==null).sort(snapByDate)[0]||null;
  const byState=[...states.entries()].map(([st, list])=>({st, name:snapStateName(st), n:list.length, rates:list.filter(f=>f.k.rate||f.rate!==null).length, latest:latestRate(list)}));
  const dated=fs.filter(f=>f.pub);
  // rate filings: those S&P types as rate filings, and any other filing that carries an overall rate impact
  const rateFs=fs.filter(f=>f.k.rate||f.rate!==null), rateGroups=new Map();
  for(const f of rateFs){ const k=`${f.st}|${f.toi}`; if(!rateGroups.has(k)) rateGroups.set(k,{st:f.st, toi:f.toi, list:[]}); rateGroups.get(k).list.push(f); }
  const rateRows=[...rateGroups.values()].map(g=>{ const v=g.list.filter(f=>f.rate!==null).map(f=>f.rate);
    return {st:g.st, toi:g.toi, n:g.list.length, withRate:v.length, lo:v.length?Math.min(...v):null, hi:v.length?Math.max(...v):null, latest:latestRate(g.list)}; })
    .sort((a,b)=>(a.st||"~").localeCompare(b.st||"~") || (a.toi||"~").localeCompare(b.toi||"~"));
  // filings by year published and filing type: S&P's own type names, rate, rule and form first
  const y0=parseDay(p.from), y1=parseDay(p.to), years=[];
  const yLo=Math.min(y0?y0.getFullYear():Infinity, ...dated.map(f=>f.pub.getFullYear())), yHi=Math.max(y1?y1.getFullYear():-Infinity, ...dated.map(f=>f.pub.getFullYear()));
  if(isFinite(yLo) && isFinite(yHi)) for(let y=yLo; y<=yHi && years.length<20; y++) years.push(y);
  const order=t=>{ const i=["rate","rule","form"].indexOf(t.toLowerCase()); return i<0 ? (t ? 3 : 4) : i; };
  const types=[...new Set(fs.map(f=>f.type))].sort((a,b)=>order(a)-order(b) || a.localeCompare(b));
  const yearRows=years.map(y=>{ const list=dated.filter(f=>f.pub.getFullYear()===y); return {year:y, total:list.length, by:types.map(t=>list.filter(f=>f.type===t).length)}; });
  // time with the regulator, by state
  const withDays=fs.map(f=>({f, d:snapDays(f)})).filter(x=>x.d!==null && x.d>=0), dayGroups=new Map();
  for(const x of withDays){ if(!dayGroups.has(x.f.st)) dayGroups.set(x.f.st,[]); dayGroups.get(x.f.st).push(x.d); }
  const dayRow=(st, a)=>({st, n:a.length, median:snapMedian(a), lo:a.length?Math.min(...a):null, hi:a.length?Math.max(...a):null});
  const dayRows=[...dayGroups.entries()].sort((a,b)=>(a[0]||"~").localeCompare(b[0]||"~")).map(([st,a])=>dayRow(st,a));
  return {p, fs, searched, byState, from:p.from, to:p.to,
    tiles:{n:fs.length, rate:fs.filter(f=>f.k.rate).length, rule:fs.filter(f=>f.k.rule).length, form:fs.filter(f=>f.k.form).length, other:fs.filter(f=>!f.k.rate&&!f.k.rule&&!f.k.form).length,
      states:byState.filter(s=>s.n).length, latest:dated.length?dated.slice().sort(snapByDate)[0].pub:null},
    rateFs, rateRows, ratePts:rateFs.filter(f=>f.rate!==null&&f.pub).sort((a,b)=>a.pub-b.pub), rateNoDate:rateFs.filter(f=>f.rate!==null&&!f.pub).length,
    years:yearRows, types, undated:fs.length-dated.length,
    latestFR:fs.filter(f=>f.k.form||f.k.rule).sort(snapByDate), dayRows, dayAll:dayRow("", withDays.map(x=>x.d)), dayLeft:fs.length-withDays.length};
}

/* ----- drawing: charts by hand as inline SVG, every one with its numbers as text beside or under it ----- */
const snapPct = v => v===null||v===undefined ? "n/d" : pct(v);
const snapRange2 = (lo, hi, fmt) => lo===null ? "n/d" : lo===hi ? fmt(lo) : `${fmt(lo)} to ${fmt(hi)}`;
const snapStatus = f => blank(f.r.filingStatus) ? "n/d" : String(f.r.filingStatus);
const snapStLabel = st => st ? `${snapStateName(st)} (${st})` : "State n/d";
function snapMark(f, cx, cy, s){
  const cls=`mk ${f.rate>0?"up":f.rate<0?"dn":"z"}${f.ok?"":" open"}`;
  const title=`<title>${esc(`${fmtD(f.pub)}, ${f.st||"state n/d"}${f.toi?` ${f.toi}`:""}: ${pct(f.rate)}, ${snapStatus(f)}`)}</title>`;
  if(f.rate>0) return `<path class="${cls}" d="M${cx} ${cy-s}L${cx+s} ${cy+s*.75}L${cx-s} ${cy+s*.75}Z">${title}</path>`;
  if(f.rate<0) return `<path class="${cls}" d="M${cx} ${cy+s}L${cx+s} ${cy-s*.75}L${cx-s} ${cy-s*.75}Z">${title}</path>`;
  return `<circle class="${cls}" cx="${cx}" cy="${cy}" r="${s*.7}">${title}</circle>`;
}
function snapRateChart(c){
  const pts=c.ratePts; if(!pts.length) return "";
  const nar=snapNarrow(), W=nar?360:1240, H=nar?230:300, L=nar?50:64, R=12, T=12, B=26;
  const t0=(parseDay(c.from)||pts[0].pub).getTime(), t1=Math.max((parseDay(c.to)||pts[pts.length-1].pub).getTime(), t0+DAY);
  const m=Math.max(5, Math.ceil(Math.max(...pts.map(f=>Math.abs(f.rate)))/5)*5);
  const x=t=>+(L+(t-t0)/(t1-t0)*(W-L-R)).toFixed(1), y=v=>+(T+(m-v)/(2*m)*(H-T-B)).toFixed(1);
  let g="";
  for(const v of [m, m/2, 0, -m/2, -m]) g+=`<line class="${v===0?"ax0":"ax"}" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${esc(pct(v))}</text>`;
  for(let yr=new Date(t0).getFullYear()+1; yr<=new Date(t1).getFullYear(); yr++){ const t=new Date(yr,0,1).getTime(); if(t<=t0||t>t1) continue;
    g+=`<line class="ax" x1="${x(t)}" x2="${x(t)}" y1="${T}" y2="${H-B}"/><text x="${x(t)}" y="${H-8}" text-anchor="middle">${yr}</text>`; }
  const marks=pts.map(f=>snapMark(f, x(f.pub.getTime()), y(f.rate), nar?6:7)).join("");
  return `<svg class="snchart" id="snRateChart" viewBox="0 0 ${W} ${H}" role="img" aria-labelledby="snRateH snRateDesc" focusable="false">
    <desc id="snRateDesc">${esc(`${plural(pts.length,"filing")} with an overall rate impact, from ${fmtDay(c.from)} to ${fmtDay(c.to)}. The figures are in the table under the chart.`)}</desc>${g}${marks}</svg>`;
}
function snapRateBlockHTML(c){
  const exp=snapExpHTML("rates");
  let h=`<section class="snblk" id="snRates" aria-labelledby="snRateH"><div class="blk-h"><h3 id="snRateH">Rate changes over time</h3>${exp}</div>`;
